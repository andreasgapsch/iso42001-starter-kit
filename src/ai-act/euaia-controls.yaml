# Zusatz-Controls für das AI-Act-Modul (EUAIA-nn)
#
# Struktur sprachneutral; Texte (Kurzbezeichnung, Umsetzungshinweis, Nachweis) in
# src/i18n/de/euaia.yaml und src/i18n/en/euaia.yaml.
# Rechtsgrundlage: Verordnung (EU) 2024/1689, konsolidierte Fassung 27.07.2026 (siehe stand.yaml).
# Artikelangaben: «26(7)» = Art. 26 Abs. 7; «16(e)» = Art. 16 Bst. e; «3 Nr. 3 bis 8» = Art. 3 Nummern 3 bis 8.
#
# Felder
#   artikel           Liste der Fundstellen im AI Act
#   rollen            Rollen nach Art. 3 (Werte wie AiActRolle in src/model/typen.ts)
#   risikoklassen     verboten | hochrisiko-anhang-iii | hochrisiko-anhang-i | transparenz | minimal | alle
#   verwandt_42001    verwandte Controls (A.x.y) und Normabschnitte (K-x.y) aus ISO/IEC 42001
#   verwandt_27001    verwandte Controls aus ISO/IEC 27001:2022 Anhang A (27001-x.y), fachliche Einschätzung
#   abdeckung_42001   teilweise | nicht (ganz abgedeckte Pflichten brauchen kein Zusatz-Control)
#   vorschlag_wenn    Bedingung für den automatischen Vorschlag je KI-System. Alle Schlüssel
#                     eines Objekts müssen zutreffen (UND); any_of enthält Alternativen (ODER).
#     immer: true                      für jedes KI-System im Inventar
#     rollen_any: [...]                mindestens eine Rolle des Systems (kiSysteme[].aiAct.rollen)
#     risikoklasse_any: [...]          Risikoklasse des Systems (kiSysteme[].aiAct.risikoklasse)
#     transparenz_any: [...]           mindestens ein Transparenzfall ('50-1' bis '50-4')
#     anhang_iii_bereich_any: [...]    Bereich nach Anhang III (kiSysteme[].aiAct.anhangIiiBereich, z. B. '5b')
#     ausnahme_art_6_3: true           Anhang-III-System als nicht hochriskant eingestuft (Art. 6(3))
#     gpai: true                       die Organisation bringt ein KI-Modell mit allgemeinem
#                                      Verwendungszweck selbst in Verkehr (nicht: blosse Nutzung)
#     org_niederlassung_eu: false      Organisation ohne Niederlassung in der EU (organisation.euBezug)
#     org_oeffentliche_dienste: true   Einrichtung des öffentlichen Rechts oder private Einrichtung,
#                                      die öffentliche Dienste erbringt (Angabe in E-06)
#     any_of: [ {...}, {...} ]         Alternativen

