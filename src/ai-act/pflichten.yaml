# Pflichten aus dem AI Act je Rolle und Risikoklasse (Grundlage für E-03)
#
# Struktur sprachneutral; Kurzbeschreibung und typischer Nachweis in
# src/i18n/de/pflichten.yaml und src/i18n/en/pflichten.yaml.
# Rechtsgrundlage: Verordnung (EU) 2024/1689, konsolidierte Fassung 27.07.2026 (siehe stand.yaml).
# Artikelangaben: «26(7)» = Art. 26 Abs. 7; «16(e)» = Art. 16 Bst. e; «50(4) UAbs. 2» = Unterabsatz 2.
#
# Felder je Pflicht
#   id                 P-ALLE-nn, P-ANB-nn, P-ANB6-3-nn, P-BETR-nn, P-EINF-nn, P-HAEN-nn, P-BEV-nn,
#                      P-PROD-nn, P-TRANSP-ANB-nn, P-TRANSP-BETR-nn, P-GPAI-nn
#   artikel            Fundstelle(n)
#   rollen             Rollen nach Art. 3 (Werte wie AiActRolle in src/model/typen.ts)
#   risikoklassen      verboten | hochrisiko-anhang-iii | hochrisiko-anhang-i | transparenz | minimal | alle
#   bedingung          zusätzliche Bedingung (gleiche Schlüssel wie vorschlag_wenn in euaia-controls.yaml;
#                      dazu fria_anwendbar: Ergebnis der Anwendbarkeitsprüfung in E-06) oder null
#                      gpai: true heisst: Die Organisation bringt das KI-Modell mit allgemeinem Verwendungszweck
#                      selbst in Verkehr (kiSysteme[].aiAct.gpai, src/model/typen.ts) oder vertritt als Bevollmächtigte
#                      dessen Anbieter. Wer ein GPAI-Modell nur nutzt oder ein KI-System auf einem fremden
#                      GPAI-Modell aufbaut (z. B. Copilot, Chatbot über eine Cloud-Schnittstelle), erfüllt sie nicht.
#   gilt_ab            Geltungsbeginn nach Art. 113 bzw. 111 in der geänderten Fassung
#   gilt_ab_je_klasse  abweichender Geltungsbeginn je Risikoklasse (Art. 113(3)(c)), sonst fehlt das Feld
#   gilt_praktisch_ab  nur bei Pflichten, die formell ab 02.08.2026 gelten, aber erst mit den
#                      Hochrisiko-Pflichten greifen (gekennzeichnete Auslegung, siehe stand.yaml)
#   gilt_praktisch_je_klasse  wie gilt_ab_je_klasse
#   kmu_erleichterung  Artikelverweis oder leer
#   abdeckung_42001    grad ganz | teilweise | nicht; controls (A.x.y); klauseln (K-x.y)
#   zusatz_control     EUAIA-nn; Pflicht bei grad teilweise oder nicht
#   vorlage            Vorlagen des Kits (E-01 bis E-09, D-xx)
#   kmu_relevanz       hoch | mittel | gering (Einschätzung für die Filterung in E-03)

schema: 1
stand: konsolidiert-2026-07-27

regeln:
  # Für Produkte nach Anhang I Abschnitt B (z. B. Maschinen, Nr. 21) gelten aus dem AI Act nur
  # die folgenden Artikel. Pflichten mit hochrisiko-anhang-i betreffen daher nur Anhang I Abschnitt A.
  anhang_i_abschnitt_b:
    artikel: "2(2)"
    gelten_nur: ["6(1)", "60a", "102 bis 112"]
    bedingt: ["57", "58", "59"]
  # Wer als Anbieter gilt, übernimmt die Pflichten mit Rolle anbieter.
  gilt_als_anbieter:
    - {artikel: "25(1)", rollen: [haendler, einfuehrer, betreiber], risikoklassen: [hochrisiko-anhang-iii, hochrisiko-anhang-i]}
    - {artikel: "25(3)", rollen: [produkthersteller], risikoklassen: [hochrisiko-anhang-i]}
  # Hochrisiko-Altsysteme (vor dem Geltungsbeginn von Kapitel III in Verkehr gebracht oder in
  # Betrieb genommen) fallen nur bei erheblicher Veränderung der Konzeption unter die Verordnung.
  altsysteme_hochrisiko:
    artikel: "111(2)"

pflichten:
