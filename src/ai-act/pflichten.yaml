    abdeckung_42001: {grad: teilweise, controls: [A.4.6], klauseln: [K-7.2, K-7.3]}
    zusatz_control: EUAIA-02
    vorlage: [E-04, D-17]
    kmu_relevanz: hoch

  - id: P-ALLE-02
