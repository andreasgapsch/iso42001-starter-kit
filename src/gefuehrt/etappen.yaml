    - { id: soa, wochen: { mit_isms: 8, ohne_isms: 14 } }
    - { id: schulung, wochen: { mit_isms: 9, ohne_isms: 18 } }
    - { id: dokumente, wochen: { mit_isms: 10, ohne_isms: 18 } }
    - { id: audit, wochen: { mit_isms: 11, ohne_isms: 20 } }
