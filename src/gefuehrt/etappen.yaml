    - { nr: 4, wochen: { mit_isms: [2, 4], ohne_isms: [3, 7] }, pt: { mit_isms: [3, 4.5], ohne_isms: [4, 6] } }
    - { nr: 5, wochen: { mit_isms: [4, 5], ohne_isms: [7, 8] }, pt: { mit_isms: [1, 1.5], ohne_isms: [1, 1.5] } }
    - { nr: 6, wochen: { mit_isms: [5, 7], ohne_isms: [8, 12] }, pt: { mit_isms: [4.5, 6.5], ohne_isms: [8, 11.5] } }
    - { nr: 7, wochen: { mit_isms: [7, 8], ohne_isms: [12, 14] }, pt: { mit_isms: [2.5, 3.5], ohne_isms: [3.5, 5] } }
    - { nr: 8, wochen: { mit_isms: [8, 10], ohne_isms: [13, 18] }, pt: { mit_isms: [5.5, 7], ohne_isms: [12, 16] } }
