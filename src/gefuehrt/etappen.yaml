# Fahrplan (Seitentyp fahrplan, E0-fahrplan): rechnet vom Ziel Stage-1-Bereitschaft (organisation.zielterminStage1) rückwärts.
# schritte: Wochen und Personentage je Schritt wie in src/leitfaden/schritte.yaml (tests/unit/gefuehrt.test.ts prüft die Gleichheit).
# wochen: Länge des Plans je Pfad (Kapitel 4); erweitert: Pfad mit ISMS bei erweitertem Umfang (Kapitel 4 und 5, rund 6 Monate),
# die Wochen des Plans werden gestreckt. anteilAims: Anteil der Personentage, den die AIMS-Verantwortliche trägt (Kapitel 4).
# meilensteine und freigaben (Freigabekalender der Geschäftsleitung): Woche je Pfad; fehlt ein Pfad, gilt der Eintrag dort nicht.
# Texte: src/i18n/<sprache>/app.yaml unter fahrplan.meilensteine.<id> und fahrplan.freigaben.<id>.
fahrplan:
  wochen: { mit_isms: 13, ohne_isms: 22 }
  erweitert: { wochen: 26, pt: [45, 55] }
  anteilAims: 0.6
  # Zuschlag je eingeschaltetem Modul (Richtwert in Personentagen, in der Summe enthalten); Modul NIST AI RMF: Profil,
  # Zusatz-Controls RMF-xx, Mess- und Prüfkonzept, GenAI-Bewertung (Anteil der Anwenderfirma)
  module:
    nistRmf: { pt: [3, 5] }
  schritte:
    - { nr: 1, wochen: { mit_isms: [1, 1], ohne_isms: [1, 2] }, pt: { mit_isms: [1.5, 2], ohne_isms: [2.5, 3.5] } }
    - { nr: 2, wochen: { mit_isms: [2, 3], ohne_isms: [3, 5] }, pt: { mit_isms: [1.5, 2], ohne_isms: [3, 4.5] } }
