    typ: auswahl-systeme
    norm: "A.6.2.6, 7.5.3"
    vorlage: D-12
    leitfaden: 8
    filterEines: { lebenszyklus: [ausserbetrieb], status: [abgeloest] }
    beispiel: kiSysteme[7]
    felder:
      - { pfad: ausserbetrieb.ausloeser, typ: textarea }
      - { pfad: ausserbetrieb.schritteErledigt, typ: janein }
      - { pfad: ausserbetrieb.am, typ: datum }
      - { pfad: aufbewahrenBis, typ: datum, pflicht: true }
  - id: E9-messkonzept
    typ: auswahl-systeme
    norm: "9.1, A.6.2.4"
    nist: [merkmale, messen]
    vorlage: N-03
    leitfaden: 8
    wenn: { modulNistRmf: true }
    filter: { typ: [eingekauft, saas, eigenbau] }
    beispiel: kiSysteme[0]
    felder:
      - pfad: messkonzept.pruefungen
        typ: tabelle
        spalten:
          - { pfad: merkmal, typ: auswahl, optionen: vertrauensmerkmal, pflicht: true }
          - { pfad: prueffaelle, typ: text }
          - { pfad: messgroesse, typ: text }
          - { pfad: schwelle, typ: text }
          - { pfad: haeufigkeit, typ: text }
          - { pfad: nichtMessbar, typ: text }
          - { pfad: ergebnis, typ: text }
      - { pfad: messkonzept.unabhaengig.wer, typ: text }
      - { pfad: messkonzept.unabhaengig.wann, typ: datum }
      - { pfad: messkonzept.unabhaengig.ergebnis, typ: textarea }
