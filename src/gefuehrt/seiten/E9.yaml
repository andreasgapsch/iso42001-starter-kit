      - { pfad: organisation.protokollierung.inhalt, typ: mehrfach, optionen: protokollInhalt, pflicht: true }
      - { pfad: organisation.protokollierung.aufbewahrungMonate, typ: zahl, pflicht: true }
      - { pfad: organisation.protokollierung.auswertung, typ: auswahl, optionen: rhythmus }
