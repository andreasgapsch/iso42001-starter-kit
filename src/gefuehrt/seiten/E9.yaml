    controls: [A.6.2.4, A.6.2.5, A.6.2.6]
    norm: "8.1, A.6.2.4 bis A.6.2.6"
    vorlage: D-12
    leitfaden: 8
    beispiel: controls[18]
    felder:
      - { pfad: umsetzung, typ: textarea, pflicht: true }
      - { pfad: status, typ: auswahl, optionen: controlStatus, pflicht: true }
