  - id: E9-missbrauch
    typ: auswahl-systeme
    norm: "A.6.2.4"
    vorlage: D-12
    leitfaden: 8
    filterEines: { fremdeInhalte: [true], oeffentlich: [true] }
    beispiel: kiSysteme[5]
    felder:
      - { pfad: missbrauchsfaelle, typ: textarea }
  - id: E9-rueckfall
