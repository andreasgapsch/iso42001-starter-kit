  schriften_titel: Schriften
  schriften: "Der AIMS-Manager setzt die Schrift Inter (The Inter Project Authors) unter der SIL Open Font License 1.1 ein, eingebettet in die Datei (Teilmengen latin und latin-ext, Gewichte 400 bis 700) und nicht nachgeladen. Die Symbole sind eigene Zeichnungen des Kits."
