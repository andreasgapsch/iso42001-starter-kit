ueber:
  titel: Über den AIMS-Manager
  version: "Version {version}, erstellt am {gebaut}"
  text: Der AIMS-Manager ist Teil des Starter-Kits und läuft vollständig offline in Ihrem Browser.
  lizenz_titel: Lizenzen
