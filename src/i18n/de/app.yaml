  haftung: Das Kit unterstützt Sie bei der Einführung, ersetzt aber weder die Norm noch eine Rechtsberatung. Prüfen Sie Einstufungen nach AI Act im Zweifel juristisch. Eine Zertifizierung entscheidet allein die Zertifizierungsstelle.
  norm: Anforderungstexte der ISO/IEC 42001 sind nicht enthalten. Die Norm ist bei SNV, DIN oder ISO zu beziehen. Haben Sie eine eigene Normausgabe, laden Sie sie unter «Einstellungen, Normtexte aus Ihrer Normausgabe» und sehen die Originaltexte im Werkzeug; sie bleiben auf diesem Rechner.

