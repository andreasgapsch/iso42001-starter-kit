hinweis: |
  Dieses Ergänzungsblatt ist für Organisationen mit bestehendem ISMS gedacht. Übernehmen Sie die Abschnitte in Ihr vorhandenes Dokument, statt ein neues zu erstellen, und passen Sie Begriffe und Nummerierung an Ihr Dokument an. Anforderungstext siehe ISO/IEC 42001, Abschnitte gemäss Normbezug. Die Norm ist bei SNV, DIN oder ISO zu beziehen.
