# Guide: Etappen, Beteiligte, Checklisten, Optionen, Kalender und allgemeine Texte.
# Seitentexte: src/i18n/de/gefuehrt/<etappe>.yaml. Format: src/gefuehrt/FORMAT.md
etappen:
  E0:
    titel: Startinterview
    kurz: Interview
    ziel: In wenigen Minuten erfassen wir die wichtigsten Eckdaten Ihres Unternehmens. Daraus ergeben sich Ihr Weg durch das Kit und ein erster Fahrplan.
    warum: Ein Unternehmen mit zertifiziertem ISMS braucht weniger neue Dokumente als eines ohne. Wer in die EU liefert oder KI verkauft, braucht zusätzlich das Modul zum AI Act. Diese Weichen stellen wir zuerst.
    ergebnis: Pfad (mit oder ohne ISMS), Entscheid zum Modul AI Act, Fahrplan mit Stunden je Etappe.
  E1:
    titel: Auftrag und Ausgangslage
    kurz: Auftrag
    ziel: Sie wissen, wo Ihr Unternehmen heute steht, wer im Projekt mitarbeitet, und die Geschäftsleitung hat den Auftrag freigegeben.
    warum: Ohne klaren Auftrag und Mittel der Geschäftsleitung bleibt ein Managementsystem Papier. Die Norm erwartet, dass die Leitung es sichtbar trägt und Ressourcen bereitstellt.
    ergebnis: Gap-Schnellcheck und Projektauftrag mit Freigabe (D-00).
  E2:
    titel: Kontext, Parteien und Geltungsbereich
    kurz: Kontext
    ziel: Sie halten fest, was auf Ihren KI-Einsatz wirkt, wer Erwartungen hat und welche Teile des Unternehmens das Managementsystem umfasst.
    warum: Alles Weitere baut darauf auf. Risiken, Ziele und Controls lassen sich nur sinnvoll bestimmen, wenn klar ist, worum es geht und wo die Grenzen liegen.
    ergebnis: Kontext und Parteienregister (D-01), freigegebener Geltungsbereich mit AIMS-Überblick (D-02).
  E3:
    titel: Leitlinie, Rollen und Meldewege
    kurz: Leitlinie
    ziel: Die Geschäftsleitung gibt eine KI-Leitlinie frei, die Zuständigkeiten sind verteilt und Mitarbeitende wissen, wo sie Bedenken melden.
    warum: Die Leitlinie ist der verbindliche Rahmen für alle anderen Regeln. Klare Rollen verhindern, dass wichtige Aufgaben liegen bleiben, weil sich niemand zuständig fühlt.
    ergebnis: KI-Leitlinie (D-03), Rollen, RACI und Meldeweg (D-04).
  E4:
    titel: KI-Inventar
    kurz: Inventar
    ziel: Sie kennen alle KI-Systeme im Unternehmen, auch KI in eingekaufter Software und Schatten-KI, mit Zweck, Verantwortlichen und Ressourcen.
    warum: Was nicht im Inventar steht, wird weder beurteilt noch gesteuert. Ein lückenhaftes Inventar ist die häufigste Feststellung in Zertifizierungsaudits.
    ergebnis: KI-Inventar mit Erhebungsfragebogen (D-10).
  E5:
    titel: Rolle zuerst
    kurz: Rolle
    ziel: Sie bestimmen je KI-System, ob Sie es anbieten oder nur nutzen. Mit dem Modul AI Act ordnen Sie jedes System zusätzlich einer Risikoklasse zu.
    warum: Die Rolle entscheidet, welche Pflichten Sie haben. Wer ein System unter eigenem Namen anbietet, trägt deutlich mehr Verantwortung als wer es einkauft und einsetzt.
    ergebnis: Rollenbestimmung (D-24), mit Modul Rollen und Risikoklassen nach AI Act (E-01, E-02).
  E6:
    titel: Risiken und Chancen
    kurz: Risiken
    ziel: Sie legen fest, wie Sie Risiken bewerten, und erfassen für jedes KI-System die wichtigsten Risiken und Chancen.
    warum: Das Herz jedes Managementsystems ist eine Risikobeurteilung, die bei Wiederholung zu vergleichbaren Ergebnissen führt. Daraus folgen später die Controls.
    ergebnis: Verfahren KI-Risikomanagement (D-06), Risikoregister mit Chancen (D-07).
  E7:
    titel: Folgenabschätzungen
    kurz: Folgen
    ziel: Sie prüfen je KI-System kurz, ob es Menschen spürbar betreffen kann, und machen bei Bedarf eine vollständige Folgenabschätzung.
    warum: Ein Risiko für das Unternehmen ist nicht dasselbe wie eine Folge für Menschen. Die Norm verlangt beide Sichten; die Ergebnisse fliessen in die Risikobeurteilung.
    ergebnis: Verfahren (D-08), Kurzprüfung und Folgenabschätzung je System (D-09), mit Modul Grundrechte-Prüfung (E-06).
  E8:
    titel: Controls und Erklärung zur Anwendbarkeit
    kurz: Controls
    ziel: Sie entscheiden je Risiko über die Behandlung, wählen die Controls und begründen für alle 38 Controls, ob sie gelten.
    warum: Die Erklärung zur Anwendbarkeit ist das zentrale Prüfdokument für Auditoren. Sie zeigt, dass Sie jedes Control bewusst gewählt oder begründet ausgeschlossen haben.
    ergebnis: Erklärung zur Anwendbarkeit (D-11), Behandlungsplan mit Restrisiko-Annahme (D-07), mit Modul Pflichtenmatrix (E-03).
  E9:
    titel: Umsetzen im Betrieb
    kurz: Betrieb
    ziel: Sie beschreiben, wie KI-Systeme eingeführt, überwacht, mit Daten versorgt, transparent gemacht und bei Lieferanten gesteuert werden.
    warum: Auditoren prüfen nicht nur Papier, sondern ob die Regeln im Alltag gelebt werden. Hier entstehen die Nachweise dafür.
    ergebnis: Lebenszyklus (D-12), Daten (D-13), Information und Meldungen (D-14), Nutzungsrichtlinie (D-15), Lieferanten (D-16), mit Modul E-05, E-07, E-08.
  E10:
    titel: Kompetenz und Kommunikation
    kurz: Kompetenz
    ziel: Sie bestimmen, wer welches Wissen braucht, wie alle Mitarbeitenden informiert werden und was Sie wann mit wem kommunizieren.
    warum: Menschen machen ein Managementsystem wirksam. Wer KI beaufsichtigt, muss sie verstehen; wer sie nutzt, muss die Regeln kennen.
    ergebnis: Kompetenz, Bewusstsein und Kommunikationsplan (D-17), mit Modul KI-Kompetenz (E-04).
  E11:
    titel: Ziele, Messung und Dokumentenlenkung
    kurz: Ziele
    ziel: Sie setzen messbare KI-Ziele, legen fest, was Sie messen, und halten Ihre Dokumente in einem Register.
    warum: Ohne Ziele und Messung lässt sich nicht zeigen, ob das Managementsystem wirkt. Ohne Lenkung weiss niemand, welche Fassung eines Dokuments gilt.
    ergebnis: Ziele, Kennzahlen und Messplan (D-05), Lenkung und Dokumentenregister (D-26).
  E12:
    titel: Internes Audit und Managementbewertung
    kurz: Audit
    ziel: Sie prüfen Ihr Managementsystem einmal vollständig, die Geschäftsleitung bewertet es, und Abweichungen werden behoben.
    warum: Vor dem Zertifizierungsaudit erwartet jede Stelle ein internes Audit und eine Managementbewertung. Beides zeigt, dass sich das System selbst kontrolliert und verbessert.
    ergebnis: Auditprogramm und Bericht (D-20), Protokoll der Managementbewertung (D-21), Register der Nichtkonformitäten (D-22).
  E13:
    titel: Zertifizierung vorbereiten
    kurz: Zertifikat
    ziel: Sie wählen eine Zertifizierungsstelle, planen die Audittermine und prüfen mit dem Werkzeug, ob alles für Stage 1 bereit ist.
    warum: Eine gute Vorbereitung erspart Nachaudits. Das Werkzeug zeigt in einer Ampel, was noch fehlt, und erzeugt alle Dokumente.
    ergebnis: Zertifizierungsfahrplan (D-25), Stage-1-Bericht mit Ampel, erzeugte Dokumente.
  J:
    titel: Jahreskalender
    kurz: Kalender
    ziel: Nach der Zertifizierung zeigt der Kalender, welche wiederkehrenden Aufgaben wann fällig sind.
    warum: Ein Managementsystem lebt von der Wiederholung. Das Überwachungsaudit prüft jedes Jahr, ob Überprüfungen, Messungen, Audit und Managementbewertung stattgefunden haben.
    ergebnis: Aktualisierte Register, erledigte Jahresaufgaben mit Nachweis.

beteiligte:
  gl: Geschäftsleitung
  aims: AIMS-Verantwortliche/r
  it: IT-Leitung
  recht: Recht oder Compliance
  hr: Personalabteilung
  fachbereiche: Fachbereiche
  einkauf: Einkauf
  ism: Informationssicherheit
  dsb: Datenschutz
  kommunikation: Kommunikation
  auditor: Interne Auditorin oder interner Auditor

checklisten:
  E1-c1: Der Projektauftrag ist von der Geschäftsleitung freigegeben.
  E1-c2: Der Gap-Schnellcheck ist mit dem Kernteam besprochen.
  E1-c3: Zeit und Budget für das Projekt sind zugesagt.
  E1-c4: Gemeinsame Prozesse mit dem ISMS sind nach D-23 entschieden.
  E1-c5: Die Kurzfassung der Dokumentenlenkung gilt (D-26 mit Ablage, Kennzeichnung und Freigabeweg).
  E1-c6: Die Termine für die Offerten der Zertifizierungsstellen und für die Wahl der Stelle stehen im Projektplan.
  E2-c1: Der Geltungsbereich ist von der Geschäftsleitung freigegeben.
  E2-c2: Parteien und Anforderungen sind mit den Fachbereichen abgestimmt.
  E2-c3: Jeder Ausschluss im Geltungsbereich ist begründet.
  E3-c1: Die KI-Leitlinie ist von der Geschäftsleitung unterzeichnet.
  E3-c2: Die Leitlinie ist allen Mitarbeitenden bekannt gemacht.
  E3-c3: Alle Rollen und Stellvertretungen sind den Personen mitgeteilt.
  E3-c4: Der Meldeweg für Bedenken ist veröffentlicht.
  E4-c1: Das Inventar ist von allen Fachbereichen bestätigt.
  E4-c2: KI in eingekaufter Software (z. B. ERP, CRM, Büroprogramme) ist geprüft.
  E4-c3: Zu jeder Schatten-KI ist entschieden, ob sie freigegeben, ersetzt oder untersagt wird.
  E4-c4: Jedes KI-System hat eine Eigner/in, die das bestätigt hat.
  E5-c1: Die Rolle ist je KI-System bestimmt.
  E5-c2: Alle KI-Systeme sind gegen die verbotenen Praktiken nach Art. 5 geprüft.
  E5-c3: Grenzfälle der Einstufung sind juristisch geprüft.
  E6-c1: Die Risikokriterien sind von der Geschäftsleitung bestätigt.
  E6-c2: Jedes KI-System hat mindestens eine Risikobeurteilung.
  E6-c3: Die Risiken sind mit den Eignern der Systeme besprochen.
  E7-c1: Für jedes KI-System liegt eine Kurzprüfung vor.
  E7-c2: Vollständige Folgenabschätzungen sind von der zuständigen Person freigegeben.
  E7-c3: Die Ergebnisse der Folgenabschätzungen sind ins Risikoregister übernommen.
  E8-c1: Die Erklärung zur Anwendbarkeit ist für alle Controls begründet.
  E8-c2: Behandlungsplan und Restrisiken sind von der Geschäftsleitung freigegeben.
  E8-c3: Jedes anwendbare Control hat eine verantwortliche Person.
  E9-c1: Die Nutzungsrichtlinie ist veröffentlicht und von den Mitarbeitenden bestätigt.
  E9-c2: Jeder KI-Lieferant hat einen Prüfstatus.
  E9-c3: Der Meldekanal für Externe ist auf der Website auffindbar.
  E9-c4: KI-Vorfälle sind im Vorfallverfahren ergänzt.
  E9-c5: Für jede Eigenentwicklung liegen Anforderungen, Entwurf und Testbericht vor.
  E9-c6: Die Pflichten nach AI Act sind für jedes betroffene System abgehakt.
  E10-c1: Für alle Aufsichtsrollen liegen Schulungsnachweise vor.
  E10-c2: Der Kommunikationsplan mit interner und externer Kommunikation ist freigegeben.
  E10-c3: Die Wirksamkeit der Schulungen ist geprüft.
  E11-c1: Jedes Ziel hat Kennzahl, Verantwortliche und Termin.
  E11-c2: Das Dokumentenregister ist vollständig und aktuell.
  E11-c3: Zu jedem Ziel ist eine erste Messung erfasst.
  E12-c1: Das interne Audit hat alle Abschnitte und Controls geprüft.
  E12-c2: Die Managementbewertung ist mit allen Pflichteingaben protokolliert.
  E12-c3: Jede Nichtkonformität hat Ursache und Massnahme.
  E12-c4: Der Auditbericht ist der Geschäftsleitung vorgelegt.
  E13-c1: Alle Fehler aus der Prüfung sind behoben.
  E13-c2: Die Unterlagen für Stage 1 sind der Zertifizierungsstelle übermittelt.
  E13-c3: Die Zertifizierungsstelle ist für ISO/IEC 42001 akkreditiert.
  J-c1: Die jährliche Überprüfung der KI-Leitlinie ist dokumentiert.
  J-c2: Das Überwachungsaudit ist vorbereitet und terminiert.
  J-c3: Der Stand des AI Act ist geprüft und die Einstufungen sind aktuell.

kalender:
  inventar: KI-Inventar durchsehen, neue Systeme erfassen, Überprüfungsdaten nachführen.
  schatten-ki: Offene Schatten-KI entscheiden (freigeben, ersetzen oder untersagen).
  ziele: Messwerte zu den KI-Zielen erfassen.
  risiken: Risiken neu beurteilen und Stand der Massnahmen prüfen.
  aiact-stand: Stand des AI Act und der Einstufungen prüfen.
  nist-stand: Stand des NIST AI RMF prüfen und das Profil nachführen.
  folgen: Folgenabschätzungen auf Aktualität prüfen.
  lieferanten: KI-Lieferanten erneut prüfen.
  schulung: Schulungen durchführen und Wirksamkeit prüfen.
  kommunikation: Kommunikationsplan durchsehen und Mitteilungen versenden.
  leitlinie: KI-Leitlinie überprüfen und Überprüfung vermerken.
  dokumente: Dokumentenregister durchsehen, fällige Dokumente überarbeiten.
  internes-audit: Internes Audit durchführen und Bericht ablegen.
  managementbewertung: Managementbewertung durchführen und protokollieren.
  ueberwachungsaudit: Überwachungsaudit der Zertifizierungsstelle vorbereiten.

