hinweis: "Fachliche Einschätzung von KMU-CIO, was bei gemeinsamer Führung von ISMS und AIMS zu beachten ist. Anforderungstext siehe ISO/IEC 42001 und ISO/IEC 27001, Abschnitte 4 bis 10. Die Normen sind bei SNV, DIN oder ISO zu beziehen."
gemeinsam:
  ja: "Gemeinsam: ein Prozess und ein Nachweis für beide Systeme."
  teilweise: "Teilweise gemeinsam: gemeinsamer Rahmen, KI-Inhalte sind zu ergänzen."
