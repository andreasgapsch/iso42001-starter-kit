hinweis: "Die Zuordnung ist eine fachliche Einschätzung von KMU-CIO. Sie zeigt, wo Nachweise aus dem ISMS wiederverwendet werden können, und ersetzt keine Prüfung im Einzelfall."
staerke:
  hoch: "Hoch: Der ISMS-Nachweis deckt das KI-Control weitgehend ab, KI-Inhalte werden nur ergänzt."
  mittel: "Mittel: Ablauf und Form lassen sich übernehmen, wesentliche KI-Inhalte fehlen."
  tief: "Tief: Nur ein Anknüpfungspunkt, das KI-Control braucht eigene Umsetzung."
begruendung:
  leitlinie-rahmen: "Die Informationssicherheitsleitlinie liefert Aufbau, Freigabe durch die Geschäftsleitung und Bekanntmachung, die auch für die KI-Leitlinie gelten. Inhaltlich braucht die KI-Leitlinie eigene Grundsätze zu Verantwortung, Transparenz und Folgen für Betroffene."
  leitlinie-fuehrung: "Die Pflicht der Führung, Regeln durchzusetzen, gilt gleichermassen für die KI-Leitlinie. Vorgesetzte sorgen dafür, dass ihre Teams die KI-Regeln kennen und anwenden."
  leitlinie-abgleich: "Wo bereits eine Sicherheitsleitlinie besteht, muss die KI-Leitlinie darauf abgestimmt sein. Am einfachsten sind gegenseitige Verweise und eine gemeinsame Überprüfung."
  leitlinie-recht: "Das Verzeichnis rechtlicher und vertraglicher Anforderungen zeigt, welche weiteren Regelwerke die KI-Leitlinie berücksichtigen muss, etwa Datenschutz oder Branchenvorgaben."
  leitlinie-einhaltung: "Die Prüfung der Regeleinhaltung deckt Widersprüche zwischen Leitlinien nur indirekt auf. Sie ersetzt den bewussten Abgleich beim Erstellen nicht."
  leitlinie-zyklus: "Der Überprüfungszyklus der Sicherheitsleitlinie kann direkt übernommen werden. Zusätzliche Auslöser sind neue KI-Systeme und Änderungen im KI-Recht."
  leitlinie-unabhaengig: "Eine unabhängige Überprüfung kann die KI-Leitlinie im selben Durchgang einschliessen. So wird auch deren Angemessenheit von aussen beurteilt."
  rollen-zuweisung: "Das bestehende Rollenmodell wird um KI-Rollen erweitert, etwa eine Eignerin oder ein Eigner je KI-System und eine AIMS-Verantwortung. Form und Freigabe bleiben gleich."
  rollen-trennung: "Aufgabentrennung hilft auch bei KI, etwa zwischen Entwicklung und Freigabe eines Modells. In kleinen Teams genügt oft das Vier-Augen-Prinzip bei kritischen Schritten."
  rollen-fuehrung: "Die Verantwortung der Führung für die Umsetzung von Regeln umfasst auch die KI-Rollen. Vorgesetzte stellen sicher, dass die benannten Personen Zeit und Befugnisse haben."
  meldeweg-ereignisse: "Der Kanal für Sicherheitsereignisse lässt sich für KI-Bedenken mitnutzen. Er muss aber auch Themen ohne Sicherheitsbezug annehmen, etwa unfaire Ergebnisse, und vertrauliche Meldungen ermöglichen; ein bestehendes Hinweisgebersystem eignet sich oft besser."
  meldeweg-vorfallorganisation: "Die Vorfallorganisation kann Meldungen entgegennehmen und triagieren. Bedenken sind jedoch oft keine Vorfälle und brauchen eine eigene Bearbeitung durch die AIMS-Verantwortung."
  inventar-ressourcen: "Das Asset-Inventar ist die natürliche Basis für die Ressourcen je KI-System. Es braucht zusätzlich ein Kennzeichen für KI und die Verknüpfung jedes Systems mit seinen Ressourcen."
  inventar-cloud: "Viele KI-Systeme sind Cloud-Dienste. Die Übersicht der genutzten Cloud-Dienste liefert dafür bereits Anbieter, Datenstandort und Verantwortliche."
  inventar-daten: "Datenbestände sind oft schon als Informationswerte erfasst. Für KI fehlen meist Angaben zu Zweck, Herkunft und Eignung für Training oder Betrieb."
  daten-klassifizierung: "Die Einstufung nach Schutzbedarf zeigt, welche Daten überhaupt in ein KI-System dürfen. Sie ist eine wichtige Angabe in der Beschreibung der Datenressourcen."
  daten-aufzeichnungen: "Der Schutz von Aufzeichnungen sichert die Beschreibung der Daten gegen Verlust. Zum Inhalt der Beschreibung trägt er wenig bei."
  inventar-werkzeuge: "Software und Lizenzen im Inventar decken einen Teil der KI-Werkzeuge ab. Modelle, Modellversionen und Bibliotheken für maschinelles Lernen kommen hinzu."
  werkzeuge-cloud: "Modelle werden häufig als Cloud-Dienst bezogen. Angaben aus der Cloud-Übersicht wie Vertrag und Region gehören in die Werkzeugbeschreibung."
  werkzeuge-konfiguration: "Konfigurationsmanagement hält Versionen und Einstellungen fest. Für Modelle sind zusätzlich Parameter und Systemanweisungen (System-Prompts) zu dokumentieren."
  inventar-infrastruktur: "Server, Cloud-Konten und Netzkomponenten stehen meist schon im Inventar. Es genügt, sie den KI-Systemen zuzuordnen, die sie nutzen."
  kapazitaet: "Die Kapazitätsplanung deckt Rechenleistung und Speicher auch für KI ab. Bei KI kommen Kosten und Kontingente externer Modelldienste als Grösse hinzu."
  infrastruktur-cloud: "Gemietete Rechenleistung und KI-Plattformen in der Cloud werden über die Cloud-Regeln erfasst. Dazu gehört, wer für welche Schicht verantwortlich ist."
  redundanz: "Redundanz ist nur relevant, wenn ein KI-System geschäftskritisch ist. Dann gehört sie in die Beschreibung der Systemressourcen."
  kompetenz-schulung: "Das Schulungsprogramm zeigt, welche Kompetenzen schon vorhanden sind. Für KI müssen fachliche Fähigkeiten wie Datenanalyse oder Modellbewertung zusätzlich erfasst werden."
  kompetenz-rollen: "Die Rollenbeschreibungen zeigen, wer welche Aufgabe hat, aber nicht, welche Kompetenz dafür nötig ist. Diese Lücke schliesst die Beschreibung der personellen Ressourcen."
  folgen-dsfa: "Ein bestehendes Verfahren für Datenschutz-Folgenabschätzungen liefert Auslöser, Ablauf und Freigabe als Vorbild. Die KI-Folgenabschätzung geht weiter und betrachtet auch Folgen ohne Personendaten."
  folgen-projekte: "Die Sicherheitsprüfung in Projekten zeigt, wo eine Folgenabschätzung im Projektablauf verankert werden kann. Inhaltlich gibt es kaum Überschneidungen."
  folgen-aufbewahrung: "Die Regeln zum Schutz und zur Aufbewahrung von Aufzeichnungen gelten auch für Folgenabschätzungen. Festzulegen ist die Aufbewahrungsdauer."
  folgen-dsfa-ablage: "Wo bereits Datenschutz-Folgenabschätzungen abgelegt werden, kann dieselbe Ablage dienen. Beide Ergebnisse sollten aufeinander verweisen."
  folgen-personen: "Der Datenschutz deckt Folgen für Personen ab, soweit Personendaten bearbeitet werden. Benachteiligung, Fehlentscheide und eingeschränkte Wahlfreiheit gehen darüber hinaus und brauchen eigene Kriterien."
  folgen-gesellschaft: "Gesellschaftliche Folgen wie Umweltbelastung oder Einfluss auf die öffentliche Meinung haben in der Informationssicherheit kein Gegenstück. Der Datenschutz liefert höchstens methodische Anregungen."
  entwicklung-ziele: "Die Regeln für sichere Entwicklung enthalten Sicherheitsziele. Ziele zu Fairness, Erklärbarkeit oder Robustheit müssen ergänzt werden."
  entwicklung-projektziele: "Wo Sicherheit schon Teil der Projektziele ist, lassen sich Ziele für verantwortungsvolle Entwicklung im gleichen Raster ergänzen. Mehr als ein Anknüpfungspunkt ist das nicht."
  entwicklung-prozess: "Ein festgelegter sicherer Entwicklungszyklus ist das Gerüst für den KI-Entwicklungsprozess. Es braucht zusätzliche Phasen für Daten, Training, Bewertung und Überwachung nach dem Einsatz."
  entwicklung-projekt: "Die Projektmethode mit Sicherheitsprüfungen legt Meilensteine und Freigaben fest. KI-spezifische Prüfpunkte lassen sich dort einhängen."
  entwicklung-architektur: "Grundsätze für sichere Architektur gelten auch für KI-Systeme. Ergänzt werden Grundsätze wie menschliche Aufsicht und Nachvollziehbarkeit von Entscheiden."
  anforderungen-anwendung: "Die bestehenden Sicherheitsanforderungen an Anwendungen lassen sich erweitern. Hinzu kommen Anforderungen an Zweck, Leistung, Datenqualität und menschliche Aufsicht."
  anforderungen-projekt: "Anforderungen werden in Projekten ohnehin erhoben. Die KI-Anforderungen gehören in dasselbe Dokument und dieselbe Freigabe."
  entwurf-architektur: "Eine Architekturdokumentation nach Sicherheitsgrundsätzen deckt einen Teil des Entwurfs ab. Für KI kommen Modellwahl, Trainingsansatz und getroffene Annahmen hinzu."
  entwurf-code: "Regeln für sicheren Code gelten auch für KI-Software. Zur Dokumentation des Entwurfs tragen sie wenig bei."
  entwurf-auslagerung: "Wird ein KI-System extern entwickelt, legen die Vorgaben für ausgelagerte Entwicklung fest, welche Dokumentation der Partner liefert. Diese Liste wird um KI-Angaben erweitert."
  entwurf-quellcode: "Der Schutz von Quellcode lässt sich auf Modelle, Gewichte und Trainingsskripte übertragen. Er sichert die Entwicklungsergebnisse, dokumentiert sie aber nicht."
  pruefung-tests: "Sicherheitstests vor der Abnahme bilden den Rahmen. KI braucht zusätzlich Tests zu Genauigkeit, Robustheit, Verzerrungen und Verhalten bei unerwarteten Eingaben."
  pruefung-testdaten: "Die Regeln für Testdaten schützen vertrauliche Daten in Tests. Bei KI müssen Testdaten zudem repräsentativ und vom Trainingsbestand getrennt sein."
  pruefung-umgebungen: "Getrennte Umgebungen verhindern, dass ungeprüfte Modelle in den Betrieb gelangen. Zur Validierung selbst tragen sie nur indirekt bei."
  einfuehrung-aenderung: "Der Änderungsprozess mit Genehmigung und Rückfallplan passt direkt für die Einführung von KI-Systemen und neuen Modellversionen. Ergänzt wird die Prüfung, ob die Folgenabschätzung noch gilt."
  einfuehrung-umgebungen: "Die Trennung von Test und Betrieb sorgt für einen geordneten Übergang. Sie ist Voraussetzung für eine nachvollziehbare Freigabe."
  einfuehrung-installation: "Regeln für Installationen auf Produktivsystemen gelten auch für KI-Komponenten. Bei Cloud-Diensten greifen sie kaum."
  betrieb-ueberwachung: "Die bestehende Überwachung erkennt technische Störungen und Angriffe. Für KI muss sie auch fachliche Leistung, Drift und auffällige Ausgaben beobachten."
  betrieb-ablaeufe: "Dokumentierte Betriebsabläufe lassen sich um KI-Aufgaben ergänzen, etwa Modellwechsel oder Reaktion auf Leistungsabfall. Form und Ablage bleiben gleich."
  betrieb-schwachstellen: "Das Schwachstellenmanagement deckt auch Bibliotheken und Plattformen von KI-Systemen ab. KI-typische Schwächen wie Prompt-Injection müssen in die Prüfungen aufgenommen werden."
  betrieb-aenderungen: "Änderungen im Betrieb wie neue Modellversionen beim Anbieter laufen über den Änderungsprozess. Wichtig ist, auch Änderungen zu erfassen, die der Anbieter ohne Ankündigung vornimmt."
  betrieb-kapazitaet: "Die Kapazitätsüberwachung zeigt Engpässe, die die Leistung eines KI-Systems beeinträchtigen. Sie ergänzt die fachliche Überwachung."
  doku-betrieb: "Betriebsdokumentation ist eine von mehreren Dokumentationen je Zielgruppe. Für Nutzende, Betroffene und Behörden braucht es eigene, verständliche Fassungen."
  logs-protokollierung: "Die bestehende Protokollierung liefert Technik, Aufbewahrung und Schutz der Logs. Festzulegen ist, welche KI-Ereignisse wie Eingaben, Ausgaben und Modellversion erfasst werden."
  logs-zeit: "Eine einheitliche Systemzeit macht KI-Logs mit anderen Protokollen vergleichbar. Das ist bei der Untersuchung von Vorfällen entscheidend."
  logs-auswertung: "Die Überwachung wertet Logs aus. KI-Ereignisse können in dieselbe Auswertung einfliessen, wenn die Formate passen."
  daten-einstufung: "Die Klassifizierung legt fest, wie Daten zu schützen sind, auch in der KI-Entwicklung. Regeln zu Eignung, Menge und Repräsentativität fehlen darin."
  daten-datenschutz: "Datenschutzregeln bestimmen, ob Personendaten für Training genutzt werden dürfen. Sie sind ein Pflichtbestandteil des Datenmanagements für KI."
  daten-loeschung: "Löschregeln gelten auch für Trainings- und Testdaten. Zu klären ist, was mit Modellen geschieht, die mit inzwischen gelöschten Daten trainiert wurden."
  daten-aufbewahrung: "Aufzeichnungen zum Datenmanagement sind wie andere Aufzeichnungen zu schützen. Inhaltliche Vorgaben ergeben sich daraus nicht."
  beschaffung-recht: "Das Verzeichnis rechtlicher und vertraglicher Anforderungen hilft zu prüfen, ob Daten genutzt werden dürfen. Lizenzbedingungen von Datensätzen gehören dazu."
  beschaffung-ip: "Geistiges Eigentum ist bei zugekauften oder gesammelten Daten ein zentrales Thema. Die bestehenden Regeln zu Lizenzen lassen sich auf Datensätze ausdehnen."
  beschaffung-datenschutz: "Bei Personendaten muss die Rechtsgrundlage der Beschaffung feststehen. Das bestehende Verzeichnis der Bearbeitungstätigkeiten liefert diese Angaben oft schon."
  beschaffung-uebertragung: "Regeln zur sicheren Übertragung schützen Daten beim Bezug von Dritten. Zur Dokumentation der Beschaffung tragen sie wenig bei."
  qualitaet-testdaten: "Für Datenqualität gibt es in der Informationssicherheit kein direktes Gegenstück. Die Regeln zu Testdaten berühren nur den Teilaspekt, dass Daten für ihren Zweck geeignet sein müssen."
  herkunft-aufzeichnungen: "Herkunftsnachweise sind Aufzeichnungen und müssen unverändert und auffindbar bleiben. Die bestehenden Regeln zum Schutz von Aufzeichnungen lassen sich übernehmen."
  herkunft-inventar: "Das Inventar kann die Quelle eines Datenbestands nennen. Die Verarbeitungsschritte bis zum Training bildet es nicht ab."
  herkunft-logs: "Protokolle von Datenpipelines können Herkunft und Verarbeitung belegen. Dafür müssen sie gezielt ausgelegt sein."
  aufbereitung-maskierung: "Maskierung und Pseudonymisierung sind übliche Schritte der Datenaufbereitung. Die bestehenden Vorgaben dazu können direkt übernommen werden."
  aufbereitung-datenschutz: "Der Datenschutz verlangt Datensparsamkeit, was die Aufbereitung prägt. Kriterien zu Bereinigung, Annotation und Ausgleich von Verzerrungen kommen hinzu."
  info-pflichten: "Das Verzeichnis der Rechtspflichten zeigt, welche Informationen Nutzende erhalten müssen, etwa nach AI Act oder Konsumentenrecht. Was darüber hinaus sinnvoll ist, legt die Organisation selbst fest."
  info-datenschutz: "Datenschutzerklärungen sind ein Vorbild für verständliche Information. Angaben zu Fähigkeiten und Grenzen eines KI-Systems decken sie aber nicht ab."
  extern-meldung: "Der Meldeweg für Sicherheitsereignisse lässt sich nach aussen öffnen, etwa über ein Formular oder eine eigene Adresse. Externe Meldungen zu KI betreffen oft Fehler oder Benachteiligung und brauchen eine fachliche Bearbeitung."
  extern-vorfallorganisation: "Die Vorfallorganisation legt fest, wer Meldungen annimmt und bewertet. Externe KI-Meldungen werden dort eingeordnet und bei Bedarf weitergeleitet."
  vorfall-planung: "Die Planung der Vorfallbehandlung mit Rollen, Kontaktlisten und Eskalation ist direkt nutzbar. Zu ergänzen sind KI-Vorfälle ohne Sicherheitsbezug und die Kommunikation an Nutzende und Betroffene."
  vorfall-bewertung: "Die Einstufung von Ereignissen braucht für KI zusätzliche Kriterien, etwa Schaden für Personen oder Ausmass falscher Ausgaben. Der Ablauf selbst bleibt gleich."
  vorfall-reaktion: "Die Reaktion auf Vorfälle umfasst bereits Kommunikation nach innen und aussen. Für KI kommen Massnahmen wie das Abschalten einer Funktion oder die Rückkehr zur manuellen Bearbeitung hinzu."
  vorfall-lernen: "Erkenntnisse aus KI-Vorfällen fliessen in Risikoregister und Folgenabschätzung. Die bestehende Nachbesprechung von Vorfällen kann dafür genutzt werden."
  vorfall-beweise: "Die Beweissicherung ist bei KI-Vorfällen selten Kern der Kommunikation. Sie wird wichtig, wenn Haftungsfragen oder Behördenverfahren drohen."
  vorfall-behoerden: "Bestehende Kontakte zu Behörden verkürzen den Weg, wenn ein KI-Vorfall gemeldet werden muss. Die Kontaktliste wird um die für KI zuständigen Stellen ergänzt."
  pflichten-recht: "Das Verzeichnis rechtlicher und vertraglicher Anforderungen ist der richtige Ort für Melde- und Informationspflichten zu KI. Dazu gehören Pflichten aus dem AI Act und aus Kundenverträgen."
  pflichten-behoerden: "Kontakte zu Behörden und deren Meldewege sind bereits erfasst. Für KI kommen die Marktüberwachung und allenfalls Branchenaufsichten hinzu."
  pflichten-datenschutz: "Meldepflichten bei Datenschutzverletzungen sind ein bekanntes Muster für Fristen und Zuständigkeiten. Sie betreffen KI nur, wenn Personendaten im Spiel sind."
  nutzung-regeln: "Die Regeln zur akzeptablen Nutzung sind der natürliche Ort für die KI-Nutzung. Sie werden um freigegebene Werkzeuge, erlaubte Daten und die Prüfung von Ausgaben ergänzt."
  nutzung-schulung: "Bewusstsein und Schulung vermitteln die Nutzungsregeln. Eine kurze Lerneinheit zu KI im bestehenden Programm genügt oft."
  nutzung-datenabfluss: "Massnahmen gegen Datenabfluss verhindern, dass vertrauliche Daten in öffentliche KI-Dienste gelangen. Sie setzen die Nutzungsregeln technisch durch."
  nutzung-webfilter: "Webfilter können nicht freigegebene KI-Dienste sperren oder sichtbar machen. Das hilft gegen Schatten-KI, ersetzt aber keine Regeln."
  nutzung-ziele: "Nutzungsregeln setzen Grenzen, aber keine Ziele. Ziele wie der Anteil geprüfter Ausgaben oder die Schulungsquote werden im Zielkatalog ergänzt."
  zweck-nutzung: "Die Nutzungsregeln können festhalten, wofür ein KI-System eingesetzt werden darf und wofür nicht. Die Zweckbestimmung je System stammt aus dem Inventar."
  zweck-ablaeufe: "Betriebsanleitungen beschreiben den vorgesehenen Gebrauch eines Systems. Für KI enthalten sie auch die Hinweise des Anbieters zur bestimmungsgemässen Verwendung."
  zweck-schulung: "Schulung macht die Grenzen eines Systems bekannt. Ob die Nutzung tatsächlich im Zweck bleibt, zeigt sie nicht."
  dritte-vertraege: "Sicherheitsklauseln in Lieferantenverträgen sind die Vorlage für die Aufteilung der KI-Verantwortung. Ergänzt werden Pflichten zu Modelländerungen, Dokumentation und Nutzung von Kundendaten."
  dritte-anforderungen: "Die Sicherheitsvorgaben für Lieferanten zeigen, was von Dritten erwartet wird. Die Verantwortungsteilung bei KI reicht weiter, weil auch Partner und Kunden beteiligt sein können."
  dritte-cloud: "Das Modell der geteilten Verantwortung bei Cloud-Diensten lässt sich auf KI-Dienste übertragen. Es klärt, wer Modell, Daten und Konfiguration verantwortet."
  lieferant-auswahl: "Der bestehende Prozess für Auswahl und Risikobeurteilung von Lieferanten wird für KI-Anbieter weiterverwendet. Hinzu kommen Fragen zu Training mit Kundendaten, Modellherkunft und Rolle nach AI Act."
  lieferant-vertrag: "Vertragsklauseln zur Sicherheit werden um KI-Klauseln ergänzt. Wichtig sind die Ankündigung von Modelländerungen, Unterstützung bei Pflichten und Ausstiegsregeln."
  lieferant-kette: "KI-Dienste bauen oft auf Modellen weiterer Anbieter auf. Die Steuerung der IT-Lieferkette macht diese Abhängigkeiten sichtbar."
  lieferant-ueberwachung: "Die regelmässige Überprüfung von Lieferantenleistungen deckt KI-Anbieter mit ab. Zusätzlich zu beobachten sind Modellwechsel und Änderungen der Nutzungsbedingungen."
  lieferant-cloud: "Die meisten KI-Lieferanten sind Cloud-Anbieter. Die Cloud-Regeln zu Auswahl, Nutzung und Ausstieg gelten deshalb direkt."
  lieferant-entwicklung: "Wer ein KI-System entwickeln lässt, steuert den Partner über die Regeln für ausgelagerte Entwicklung. Abnahmekriterien zu Leistung und Datenqualität kommen hinzu."
  kunden-anforderungen: "Vertragliche Anforderungen von Kunden stehen bereits im Verzeichnis der Rechtspflichten. Erwartungen an KI, etwa Transparenz oder der Verzicht auf bestimmte Nutzungen, werden dort ergänzt."
  kunden-datenschutz: "Kunden erwarten oft Zusicherungen zum Umgang mit ihren Daten in KI-Systemen. Die bestehenden Datenschutzzusagen bilden dafür eine Grundlage."
