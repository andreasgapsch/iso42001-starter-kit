stand:
  modul: NIST AI RMF
  kurz: Das NIST AI RMF ist ein freiwilliges Rahmenwerk der US-Behörde NIST mit Ergebnissen für den Umgang mit KI-Risiken. Es ist weder Recht noch Norm; NIST zertifiziert nicht.
  botschaft: ISO/IEC 42001 ist das zertifizierbare Managementsystem, das AI RMF ein freiwilliger Katalog von Ergebnissen. NIST zertifiziert nicht.
  fassungen:
    ai-100-1: NIST AI 100-1, Artificial Intelligence Risk Management Framework (AI RMF 1.0), 26.01.2023
    ai-600-1: NIST AI 600-1, Generative Artificial Intelligence Profile, Juli 2024
    playbook: NIST AI RMF Playbook (PDF vom 02.08.2024, ohne Versionsangabe)
  revision: NIST hat eine Überarbeitung des AI RMF 1.0 angekündigt (US-«AI Action Plan», Juli 2025). Am 21.10.2026 gab es weder einen Entwurf noch eine Versionsnummer oder einen Termin. Massgebend bleibt AI RMF 1.0. Betroffen sein dürften vor allem GOVERN 3 und MEASURE 2.12; das Kit führt diese Punkte aus eigener Begründung weiter.
  veraltet: Der Stand des NIST AI RMF wurde zuletzt am {datum} geprüft. Prüfen Sie auf nist.gov, ob eine neue Fassung erschienen ist.
  weitere:
    ir-8596: 'NIST IR 8596, Cyber AI Profile: nur Vorentwurf vom 16.12.2025 (Kommentarfrist bis 30.01.2026). Nicht Teil des Moduls; für Firmen mit ISMS vormerken, sobald die Endfassung erscheint.'
    profil-kritische-infrastruktur: 'Profil «Trustworthy AI in Critical Infrastructure»: nur Konzeptpapier vom 07.04.2026. Nicht Teil des Moduls.'
  abgleich:
    crosswalk-42001: Die Zuordnung zu ISO/IEC 42001 ist eine eigene Einschätzung des Kits. Abgeglichen wurde sie mit dem Crosswalk «NIST AI RMF to ISO/IEC FDIS 42001» (Anbieter Microsoft, auf airc.nist.gov gelistet, kein NIST-Werk). Dessen Tabellen sind nicht übernommen; 7 Fehler darin sind in der eigenen Zuordnung korrigiert.
  lizenz: Die NIST-Dokumente sind Werke der US-Regierung und nach 17 U.S.C. § 105 in den USA gemeinfrei. Ausserhalb der USA behält sich NIST Rechte vor, gewährt aber weltweit ein unentgeltliches Recht zum Nachdruck und zur Bearbeitung (nist.gov/oism/copyrights). Das Kit zitiert die Funktionen, Kategorien und Subkategorien, die Vertrauensmerkmale, die zwölf GenAI-Risiken und die referenzierten Massnahmen aus NIST AI 600-1 wörtlich (Englisch) mit Seitenangabe, ergänzt um eine eigene, nicht amtliche Übersetzung, führt eigene Kurztitel und Texte und liefert die PDFs unverändert mit, mit dem Vermerk «Republished courtesy of the National Institute of Standards and Technology». Die Nennung bedeutet keine Billigung durch NIST.
  quellenangabe: 'Quelle: National Institute of Standards and Technology (NIST), NIST AI 100-1, AI RMF 1.0, Januar 2023, https://doi.org/10.6028/NIST.AI.100-1'
  pdf_pruefung: Die mitgelieferten PDFs sind bitgleich mit den Dateien auf nvlpubs.nist.gov und airc.nist.gov (SHA-256 geprüft am 21.10.2026).
