      PS-11.03: Geräte schützen, auch mobile
      PS-11.04: Aufgeräumte Arbeitsplätze und gesperrte Bildschirme durchsetzen
      PS-11.05: Datenträger und Geräte sicher entsorgen
      PS-11.90: Physischer Schutz überprüft
    ausgaben:
      - Überprüfung der Zutrittsrechte
      - Nachweise der Entsorgung
    kennzahl: "Anteil der Entsorgungen mit Nachweis"
