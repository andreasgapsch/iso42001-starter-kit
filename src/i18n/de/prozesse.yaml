# Texte zum Prozesskatalog (src/prozesse/katalog.yaml) und zur Reifeskala (src/prozesse/reifeskala.yaml).
# Eigene Formulierungen von KMU-CIO. Bezug zur Norm nur über Nummern im Katalog, kein Normtext.
titel: Prozesse
hilfe: "Ein Prozess beschreibt, wer was in welcher Reihenfolge tut und welcher Nachweis dabei entsteht. Der Katalog schlägt schlanke Abläufe mit fünf bis acht Schritten vor. Passen Sie Rollen und Schritte an Ihre Firma an; wichtig ist, dass jeder Prozess einen Eigner hat und wirklich so gelebt wird."
gruppen:
  fuehrung: Führung
  kern: Kernprozesse KI
  unterstuetzung: Unterstützung
  bewertung: Bewertung und Verbesserung
arten:
  gemeinsam: Gemeinsam mit dem ISMS
  gemeinsam-ki: Gemeinsamer Rahmen, KI ergänzt
  nur-aims: Nur AIMS
  nur-isms: ISMS-Basisprozess
arten_hilfe:
  gemeinsam: "Ein Prozess für Informationssicherheit und KI. Mit ISMS führen Sie den bestehenden Prozess weiter und nehmen KI-Themen auf."
  gemeinsam-ki: "Der Ablauf ist derselbe wie im ISMS, die Inhalte zur KI kommen dazu, z. B. eigene Kriterien oder zusätzliche Beteiligte."
  nur-aims: "Diesen Prozess gibt es nur im KI-Managementsystem."
  nur-isms: "Prozess aus der Informationssicherheit, auf den KI-Controls bauen. Mit ISMS genügt ein Verweis auf das ISMS. Ohne ISMS führen Sie nur die als Mindestumfang markierten Prozesse in schlanker Form."
pflichtarten:
  pflicht: Pflicht
  control: Control, abwählbar
  bedingt: Bedingt
  eigen: Eigener Prozess
pflichtarten_hilfe:
  pflicht: "Folgt aus den Kapiteln 4 bis 10 und lässt sich nicht abwählen."
  control: "Folgt aus einem Control des Anhangs A. Nicht anwendbar nur mit Begründung in der Erklärung zur Anwendbarkeit (D-11)."
  bedingt: "Gilt nur, wenn die genannte Bedingung zutrifft, z. B. eigene Entwicklung von KI."
  eigen: "Prozess Ihrer Firma ausserhalb des Katalogs. Sie legen Titel, Zweck, Gruppe, Art und Ablauf selbst fest; die Prüfung behandelt ihn wie einen abwählbaren Prozess."
schrittarten:
  start: Start
