  PS-08:
    titel: Schwachstellen und Schadsoftware
    zweck: "Hinweise auf Schwachstellen verfolgen, innert Frist beheben und vor Schadsoftware schützen."
    ausloeser:
      - Hinweis des Herstellers oder einer Behörde
      - monatlicher Patchtermin
    eingaben:
      - Liste der Systeme und Versionen
      - Hinweise von Herstellern und Behörden
    schritte:
      PS-08.00: Hinweis oder Termin
      PS-08.01: Hinweise beobachten
      PS-08.02: Bewerten und Frist bestimmen
      PS-08.03: Ist die Schwachstelle kritisch?
      PS-08.04: Sofort beheben oder abschirmen
      PS-08.05: Im regulären Rhythmus beheben
      PS-08.06: Schutz vor Schadsoftware überwachen
      PS-08.07: Stand der Behebung berichten
      PS-08.90: Systeme auf aktuellem Stand
    zweige:
      PS-08.03: { PS-08.04: ja, PS-08.05: nein }
    ausgaben:
      - Patchstand je System
      - Berichte des Virenschutzes
    kennzahl: "Anteil der kritischen Schwachstellen, die innert Frist behoben wurden"
    kennzahl_methode: "Schwachstellenliste und Update-Protokolle; Zähler: kritische Schwachstellen innert Frist behoben, Nenner: alle kritischen Schwachstellen."
    hilfe: "Auch Erweiterungen im Browser und lokale KI-Werkzeuge brauchen Updates."
    ohne_isms: "Nicht im Mindestumfang. Bei Cloud-Diensten trägt der Anbieter diese Pflicht, geprüft in PR-20; Änderungen an selbst betriebenen KI-Systemen laufen über PR-13."

  PS-09:
    titel: Protokollierung und Überwachung
    zweck: "Festlegen, was protokolliert wird, die Protokolle schützen, auswerten und die Zeit synchron halten."
    ausloeser:
      - neues System
      - monatliche Auswertung
      - Warnung aus der Überwachung
    eingaben:
      - Vorgaben zur Protokollierung
      - Anforderungen des Datenschutzes
    schritte:
      PS-09.00: Termin oder Warnung
      PS-09.01: Festlegen, was protokolliert wird
      PS-09.02: Zeit der Systeme synchronisieren
      PS-09.03: Protokolle schützen und aufbewahren
      PS-09.04: Protokolle auswerten
      PS-09.05: Gibt es eine Auffälligkeit?
      PS-09.06: Auffälligkeit als Ereignis melden
      PS-09.07: Regeln jährlich überprüfen
      PS-09.90: Protokolle ausgewertet
    zweige:
      PS-09.05: { PS-09.06: ja, PS-09.07: nein }
    ausgaben:
      - Vorgaben zur Protokollierung
      - Nachweise der Auswertung
    kennzahl: "Anteil der Auswertungen im geplanten Rhythmus"
    kennzahl_methode: "Protokolle der Auswertungen; Zähler: im Rhythmus erfolgte Auswertungen, Nenner: fällige Auswertungen."
    hilfe: "Für KI-Systeme regelt der Lebenszyklus (D-12), welche Ereignisse protokolliert werden; dieser Prozess sorgt für Schutz und Auswertung."
    ohne_isms: "Nicht im Mindestumfang. Die Protokolle der KI-Systeme legt PR-12 mit dem Lebenszyklus (D-12) fest; das genügt ohne ISMS."

