  A: verantwortet
  C: wirkt mit
  I: wird informiert
raci_hilfe: "Je Aufgabe genau eine Rolle mit A. R erledigt die Arbeit, C wird vorher angehört, I erfährt das Ergebnis. Die Rollen entsprechen den Bereichen in D-04."
