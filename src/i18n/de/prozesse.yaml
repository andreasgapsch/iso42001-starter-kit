      - neue Version
    eingaben:
      - Sicherheitsvorgaben
      - Ergebnisse der Tests
    schritte:
      PS-10.00: Entwicklung beginnt
      PS-10.01: Sicherheitsvorgaben festlegen
      PS-10.02: Umgebungen für Entwicklung, Test und Betrieb trennen
      PS-10.03: Code prüfen
      PS-10.04: Sicherheit testen
