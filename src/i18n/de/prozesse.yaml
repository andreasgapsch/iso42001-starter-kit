  ki-eigner: Eigner/in des Systems
  berichterstattung: Berichterstattung an die Geschäftsleitung
  konformitaet: Normkonformität des AIMS
  mitarbeitende: Mitarbeitende
felder:
  zweck: Zweck
  ausloeser: Auslöser
  eingaben: Eingaben
  schritte: Ablauf
  ausgaben: Ausgaben und Nachweise
  kennzahl: Kennzahl (Vorschlag)
  normbezug: Normbezug
  dokumente: Dokumente
  verbunden: Verbundene Prozesse
  eigner: Eigner (Vorschlag)
