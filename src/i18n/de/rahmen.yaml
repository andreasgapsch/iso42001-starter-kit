  zum_aiact: EU AI Act im Bereich Wissen

hilfe:
  kurzanleitung: Kurzanleitung
  tasten: Tastenkürzel
  starten:
    titel: Starten
    text: Öffnen Sie den AIMS-Manager per Doppelklick. Wählen Sie unter Start ein neues Projekt, eine Projektdatei oder ein Beispiel. Alles läuft offline im Browser.
  navigation:
    titel: Navigation
    text: Links wählen Sie den Bereich, daneben im Untermenü die Seite. Das Untermenü lässt sich einklappen; auf schmalen Bildschirmen öffnen Sie es mit dem Menüknopf vor dem Seitentitel. Auf dem Telefon liegen die Bereiche unten, die übrigen unter «Mehr».
  arbeiten:
    titel: Guide und Register
    text: Der Guide führt Etappe für Etappe durch das AIMS, eine Frage je Seite, mit Hilfe rechts. Das Register zeigt alle Angaben als Listen und Formulare, von der Organisation bis zu den Meldungen.
  speichern:
    titel: Speichern
    text: Speichern Sie mit Ctrl+S (Mac Cmd+S), über die Anzeige des Speicherstands neben der Suche oder im Projektmenü unten in der Symbolleiste. Edge und Chrome schreiben direkt in die geöffnete Datei; Firefox und Safari laden eine neue Datei herunter. Der Zwischenspeicher ersetzt die Projektdatei nicht.
  pruefen:
    titel: Prüfen und Dokumente
    text: Die Prüfung zeigt die Ampel «Bereit für Stage 1» mit Sprung zu jeder Stelle. Dokumente erzeugen Sie in der Bibliothek unter «Erzeugen» als Word- und Excel-Dateien.
  bibliothek:
    titel: Bibliothek
    text: Die Bibliothek verwaltet Dokumente mit Status, Version und Prüftermin. In Edge und Chrome arbeitet sie mit einem Ordner Ihrer Wahl.
  wissen:
    titel: Wissen
    text: Leitfaden, Regelwerke mit eigenen Kurztiteln und Originaltexten, Glossar und Hinweise zum KI-Assistenten, ohne Internet.
  assistent:
    titel: KI-Assistent
    text: «Mit KI vertiefen» erstellt eine Anfrage zum Kopieren. Die Projektdatei des Assistenten übernehmen Sie unter Start, Projekte und Beispiele.

