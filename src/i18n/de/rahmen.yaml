  assistent_text: Der KI-Assistent des Kits (Ordner KI-Assistent) hilft beim Schnellcheck, beim Inventar, bei Risiken und beim Schreiben der Dokumente. Er gibt eine Projektdatei aus, die Sie hier übernehmen.
  assistent_daten: Geben Sie nur Angaben in einen KI-Dienst ein, die Ihre Regeln für den KI-Einsatz erlauben. Vertrauliche Angaben wählen Sie vorher ab.
  fehlt: Die Inhalte des Leitfadens fehlen in dieser Datei.
