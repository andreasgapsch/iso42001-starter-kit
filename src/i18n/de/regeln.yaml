# Texte der Prüfregeln: titel ({name} = betroffenes Objekt), erklaerung (was zu tun ist)
F01: { titel: "KI-System «{name}» hat keine Eigner/in", erklaerung: "Jedes KI-System braucht eine Eignerin oder einen Eigner, die oder der über Einsatz und Änderungen entscheidet." }
F02: { titel: "KI-System «{name}» hat keine Risikobeurteilung", erklaerung: "Beurteilen Sie mindestens ein Risiko je KI-System oder begründen Sie im Register, warum kein relevantes Risiko besteht." }
F03: { titel: "KI-System «{name}» erreicht eine Schwelle, aber die vollständige Folgenabschätzung ist nicht komplett. Es fehlt: {fehlt}", erklaerung: "Die Kurzprüfung zeigt eine sensible Nutzung. Füllen Sie in der Folgenabschätzung (D-09) die genannten Teile aus; der Sprung führt zur ersten Lücke." }
F04: { titel: "Folgenabschätzung {name} ist nicht freigegeben", erklaerung: "Lassen Sie die Folgenabschätzung von der zuständigen Person freigeben und tragen Sie Name und Datum ein." }
F05: { titel: "Control {name}: Entscheid «anwendbar» fehlt", erklaerung: "Entscheiden Sie für jedes Control, ob es anwendbar ist." }
F06: { titel: "Control {name}: Begründung fehlt", erklaerung: "Die Erklärung zur Anwendbarkeit braucht für Aufnahme und Ausschluss eine Begründung." }
F07: { titel: "Control {name} ist anwendbar. Es fehlt: {fehlt}", erklaerung: "Halten Sie den Umsetzungsstand und mindestens einen Nachweis fest. Der Stand steht auf der Seite «Umsetzung und Nachweis»." }
F08: { titel: "Risiko {name} liegt über dem Akzeptanzkriterium und ist nicht behandelt", erklaerung: "Wählen Sie eine Behandlung und verknüpfen Sie Controls oder Massnahmen." }
F09: { titel: "Restrisiko von {name} ist nicht angenommen", erklaerung: "Die zuständige Person muss das Restrisiko mit Datum annehmen." }
F10: { titel: "Der Behandlungsplan ist nicht freigegeben", erklaerung: "Lassen Sie den Behandlungsplan (D-07, mit ISMS D-07-EB) von der zuständigen Leitung freigeben." }
F11: { titel: "Der Geltungsbereich fehlt oder ist nicht freigegeben", erklaerung: "Beschreiben Sie die Grenzen des Managementsystems mit Bezug auf Umfeld und Anforderungen und lassen Sie ihn freigeben." }
F12: { titel: "Die KI-Leitlinie ist unvollständig oder nicht freigegeben", erklaerung: "Die Leitlinie braucht Grundsätze, einen Rahmen für Ziele, die Verpflichtungen und die Freigabe der Geschäftsleitung." }
F13: { titel: "Ziel {name} ist nicht vollständig geplant", erklaerung: "Jedes Ziel braucht Kennzahl oder Sollwert, Verantwortliche, Termin und Erfolgsmessung." }
F14: { titel: "Die Pflichtrollen nach 5.3 sind nicht zugewiesen", erklaerung: "Bestimmen Sie, wer für die Normkonformität sorgt und wer der Geschäftsleitung über die Leistung berichtet." }
F15: { titel: "Es ist kein internes Audit durchgeführt", erklaerung: "Vor Stage 1 sollte ein vollständiges internes Audit stattgefunden haben. Als durchgeführt gilt ein Audit mit Datum der Durchführung und Ergebnis oder Checkliste. Ein geplantes Audit zählt bis zu seinem Termin als offen, nicht als Fehler; bereit für Stage 1 ist das Projekt erst nach dem Audit." }
F16: { titel: "Es ist keine Managementbewertung durchgeführt", erklaerung: "Vor Stage 1 sollte die Geschäftsleitung das Managementsystem einmal bewertet haben." }
F17: { titel: "Nichtkonformität {name} ohne Ursache oder Wirksamkeitsprüfung", erklaerung: "Halten Sie die Ursache fest und prüfen Sie nach der Korrektur, ob sie wirkt." }
F18: { titel: "Massnahme {name} ohne Verantwortliche oder Termin", erklaerung: "Jede Massnahme braucht eine verantwortliche Person und einen Termin." }
F19: { titel: "Die Risikokriterien sind unvollständig", erklaerung: "Legen Sie Skalen für Wahrscheinlichkeit und Auswirkung mit Bezugszeitraum sowie Akzeptanzschwellen fest." }
F20: { titel: "Partei {name}: Entscheid zu einer Anforderung fehlt", erklaerung: "Halten Sie je Anforderung fest, ob das Managementsystem sie aufnimmt." }
F21: { titel: "Risiko {name} wird vermindert, ist aber mit keinem Control verknüpft", erklaerung: "Verknüpfen Sie das Risiko mit mindestens einem Control aus der Erklärung zur Anwendbarkeit." }
F22: { titel: "KI-System «{name}» hat keine Rolle nach AI Act", erklaerung: "Bestimmen Sie Ihre Rolle (z. B. Anbieter oder Betreiber) für dieses System (E-01)." }
F23: { titel: "KI-System «{name}» hat keine Risikoklasse nach AI Act", erklaerung: "Ordnen Sie das System einer Risikoklasse zu (E-02)." }
F24: { titel: "KI-System «{name}» ist als verbotene Praxis eingestuft", erklaerung: "Verbotene Praktiken dürfen nicht eingesetzt werden. Stellen Sie die Nutzung ein und lassen Sie die Einstufung juristisch prüfen." }
F25: { titel: "AI-Act-Pflicht {name} ohne Entscheid zum Zusatz-Control", erklaerung: "Für Pflichten, die das AIMS nicht ganz abdeckt, übernehmen Sie das vorgeschlagene Zusatz-Control in die SoA oder begründen die Ablehnung." }
H01: { titel: "Überprüfungsdatum überschritten: {name}", erklaerung: "Überprüfen Sie den Eintrag und setzen Sie ein neues Datum." }
H02: { titel: "Schatten-KI «{name}» ist seit über 30 Tagen in Prüfung", erklaerung: "Entscheiden Sie, ob das Werkzeug freigegeben, ersetzt oder untersagt wird." }
H03: { titel: "Risikoskalen weichen vom ISMS ab", erklaerung: "Mit ISMS empfiehlt sich eine gemeinsame Methode mit denselben Skalen." }
H04: { titel: "Control {name} ist ausgeschlossen, obwohl ein hohes Risiko darauf verweist", erklaerung: "Prüfen Sie den Ausschluss." }
H05: { titel: "Kompetenznachweis fehlt für {name}", erklaerung: "Halten Sie fest, wie die Kompetenz nachgewiesen ist." }
H06: { titel: "Der Kommunikationsplan enthält keine externe Kommunikation", erklaerung: "Prüfen Sie, ob Kunden, Behörden oder Betroffene informiert werden müssen." }
H07: { titel: "KI-System «{name}» wurde nach der letzten Folgenabschätzung geändert", erklaerung: "Prüfen Sie, ob die Folgenabschätzung aktualisiert werden muss." }
H08: { titel: "Eigenentwicklung «{name}» ohne Nachweise zum Lebenszyklus", erklaerung: "Für selbst entwickelte KI gelten die Controls zu Anforderungen, Entwurf und Tests (A.6.2)." }
H09: { titel: "Die Ereignisprotokollierung ist nicht festgelegt", erklaerung: "Legen Sie fest, was protokolliert und wie lange aufbewahrt wird." }
H10: { titel: "Es gibt keinen Meldekanal für Externe", erklaerung: "Betroffene und Kunden sollen nachteilige Wirkungen melden können." }
H11: { titel: "Audit {name}: Unabhängigkeit nicht belegt", erklaerung: "Auditoren dürfen nicht ihre eigene Arbeit prüfen. Halten Sie fest, wie die Unabhängigkeit gesichert ist." }
H12: { titel: "Control {name} ausgeschlossen mit «bereits vorhanden»", erklaerung: "Wenn eine bestehende Massnahme das Control erfüllt, ist es anwendbar und umgesetzt, nicht ausgeschlossen." }
H13: { titel: "Die KI-Leitlinie nennt Produktnamen", erklaerung: "Die Leitlinie regelt Grundsätze. Werkzeuge gehören ins KI-Inventar und in die Nutzungsrichtlinie." }
H14: { titel: "KI-System «{name}» am Arbeitsplatz: Information der Mitarbeitenden fehlt", erklaerung: "Betreiber von Hochrisiko-KI informieren Mitarbeitende und ihre Vertretung vor dem Einsatz." }
H15: { titel: "Der Stand der AI-Act-Angaben ist älter als 6 Monate", erklaerung: "Prüfen Sie, ob eine neuere Kit-Version oder Fassung vorliegt." }
H16: { titel: "Anbieter ausserhalb der EU ohne Bevollmächtigten", erklaerung: "Anbieter von Hochrisiko-KI ohne EU-Sitz brauchen einen Bevollmächtigten in der EU." }
F26: { titel: "Kurzprüfung erreicht die Schwelle, aber keine vollständige Folgenabschätzung", erklaerung: "Nach dem Verfahren D-08 braucht das System eine vollständige Folgenabschätzung: Frage 1 oder 2 ist mit «ja» beantwortet, oder mindestens zwei der Fragen 3 bis 6." }
H17: { titel: "Grenzfall der Kurzprüfung ohne Begründung", erklaerung: "Genau eine der Fragen 3 bis 6 ist mit «ja» beantwortet. Halten Sie fest, warum die Kurzprüfung genügt oder eine vollständige Abschätzung folgt." }
H18: { titel: "Folgenabschätzung von derselben Person durchgeführt und freigegeben", erklaerung: "Wer die Abschätzung durchführt, sollte sie nicht selbst freigeben. Vollständige Abschätzungen gibt laut D-08 die Geschäftsleitung frei." }
H19: { titel: "KI-System «{name}» freigegeben, bevor seine Folgenabschätzung freigegeben war", erklaerung: "Nach D-08 geht ein System erst nach der freigegebenen Folgenabschätzung in Betrieb. Im Stage 1 fällt eine frühere Systemfreigabe auf. Halten Sie die Reihenfolge ein oder dokumentieren Sie die Freigabe nach der Abschätzung neu." }
H20: { titel: "Behandlungsplan älter als sein jüngster Eintrag: {name}", erklaerung: "In Klammern steht der jüngste Eintrag. Der Plan enthält eine Restrisiko-Annahme oder eine Massnahme aus Audit oder Managementbewertung, die nach seiner Freigabe entstanden ist. Geben Sie den Plan mit neuer Version und neuem Datum erneut frei." }
H21: { titel: "Erklärung zur Anwendbarkeit älter als der Behandlungsplan: {name}", erklaerung: "In Klammern steht die jüngste Änderung. Risiken, Massnahmen oder die Freigabe des Behandlungsplans sind jünger als die Freigabe der SoA. Prüfen Sie die SoA, führen Sie sie nach und geben Sie sie erneut frei." }
H22: { titel: "Folgenabschätzung {name} freigegeben vor dem Verfahren D-08", erklaerung: "Eine Abschätzung, die vor ihrem Verfahren freigegeben wurde, folgt keinem gelenkten Verfahren. Prüfen Sie sie nach D-08 und geben Sie sie erneut frei, oder halten Sie fest, dass sie dem Verfahren entspricht." }
H23: { titel: "Rolle und Einstufung erst nach der Risikobeurteilung festgehalten", erklaerung: "Risiken und Folgenabschätzungen hängen von der Rolle je KI-System ab (4.1). Halten Sie Rolle und Einstufung vor der Risikobeurteilung fest oder prüfen Sie die Beurteilung danach noch einmal." }
H24: { titel: "Control {name} als umgesetzt geführt, Massnahme noch offen", erklaerung: "Die Umsetzung nennt eine Massnahme, die noch nicht erledigt ist. Die Erklärung zur Anwendbarkeit (D-11) zeigt deshalb «teilweise». Passen Sie den Status an oder schliessen Sie die Massnahme ab." }
H25: { titel: "Dokument {name} ohne Eintrag in der Änderungshistorie", erklaerung: "Für jede Version über 1.0 hält die Änderungshistorie fest, was geändert wurde und wer die Version freigegeben hat (7.5.3). Sonst ist nicht nachvollziehbar, welcher Stand wann freigegeben war." }
H26: { titel: "Interne Auditperson {name} im Projektteam", erklaerung: "Wer am Aufbau des AIMS mitarbeitet, prüft nicht die eigene Arbeit (9.2). Nehmen Sie die Person aus dem Projektteam oder legen Sie fest, welche Teile eine andere Person auditiert." }
H27: { titel: "Dokument {name} von der eigenen Eignerschaft freigegeben", erklaerung: "Die Regel der Dokumentenlenkung sieht keine Freigabe durch die Eignerschaft vor (D-26). Lassen Sie das Dokument von der zuständigen Stelle freigeben oder passen Sie die Regel an." }
H28: { titel: "Handelnde KI «{name}» ohne Stoppmöglichkeit, Protokolle oder Aufsicht", erklaerung: "Das System führt Aktionen selbst aus. Halten Sie im Inventar fest, wie und von wem es gestoppt wird, was protokolliert wird und wer es beaufsichtigt (D-10, D-12)." }
H29: { titel: "Kritisches KI-System «{name}» ohne Rückfallweg", erklaerung: "Ein Ausfall stört wichtige Abläufe. Legen Sie fest, wie die Arbeit ohne das System weitergeht, und halten Sie den Rückfallweg im Inventar fest (D-10, D-12)." }
H30: { titel: "KI-System «{name}» ausser Betrieb ohne Aufbewahrungsdatum oder abgeschlossene Ausserbetriebnahme", erklaerung: "Halten Sie fest, bis wann Unterlagen, Ergebnisse und Einstellungen aufbewahrt werden, und schliessen Sie die Schritte der Ausserbetriebnahme ab (D-12)." }
H31: { titel: "Freigegebenes KI-System «{name}» ohne Einsatzentscheid", erklaerung: "Halten Sie den erwarteten Nutzen fest und warum eine Lösung ohne KI nicht genügt, mit Datum der Wiedervorlage (D-09, D-15)." }
H32: { titel: "Generatives KI-System «{name}» ohne Missbrauchsfälle in der Prüfung", erklaerung: "Das System liest fremde Inhalte oder ist öffentlich erreichbar. Prüfen Sie vor dem Einsatz und nach jedem Modellwechsel Missbrauchsfälle wie versteckte Anweisungen oder Fragen nach vertraulichen Daten (D-12)." }
H33: { titel: "Eingekauftes KI-System «{name}» ohne Modell oder Version", erklaerung: "Ohne Modell und Version fällt ein Modellwechsel des Anbieters nicht auf. Halten Sie die Angabe des Anbieters mit Datum im Inventar fest (D-10, D-16)." }
H34: { titel: "KI-System «{name}» mit sensibler Nutzung ohne eigene Kennzahl", erklaerung: "Messen Sie im Betrieb, ob das System wie geprüft arbeitet, z. B. mit einer Stichprobe oder der Korrekturquote, und ordnen Sie die Kennzahl dem System zu (D-05, D-12)." }
H35: { titel: "{name} umgesetzte Controls ohne Wirksamkeitsprüfung", erklaerung: "Halten Sie in der Erklärung zur Anwendbarkeit fest, wie, wann und von wem die Wirksamkeit geprüft wurde oder wird (D-11). Das genügt für die wichtigsten Controls zuerst." }
# Weitere Einträge
H42: { titel: "Ausnahme zu {name} länger gültig als die KI-Leitlinie erlaubt", erklaerung: "Die KI-Leitlinie begrenzt die Gültigkeit von Ausnahmen (D-03). Verkürzen Sie die Ausnahme oder erneuern Sie sie vor Ablauf mit neuem Entscheid der zuständigen Stelle (D-04)." }
H43: { titel: "Restrisiko von {name} über der Akzeptanzgrenze ohne Begründung", erklaerung: "Ein Restrisiko über der Akzeptanzgrenze braucht eine schriftliche Begründung der annehmenden Stelle (D-06, D-07); ab der Grenze «unannehmbar» zusätzlich eine befristete Ausnahme." }
H44: { titel: "{name}: Entscheid durch eine Stelle unterhalb der Entscheidungsrechte", erklaerung: "Freigabe, Annahme des Restrisikos oder Ausnahme hat eine Person getroffen, die nach den Entscheidungsrechten (D-04) für diese Risikostufe nicht zuständig ist. Nach einer vollständigen Folgenabschätzung gilt die Freigabe als Entscheid bei hohem Risiko. Holen Sie den Entscheid der zuständigen Stelle nach oder halten Sie die Abweichung fest." }
H45: { titel: "Lieferant «{name}» als geprüft geführt, aber mit offenen Punkten", erklaerung: "Prüffragen oder Vertragsklauseln sind offen oder nicht erfüllt. Setzen Sie den Prüfstatus auf «mit Auflagen» und halten Sie Auflagen oder Massnahmen fest, oder klären Sie die Punkte (D-16)." }
H46: { titel: "Dokument {name} nach der Freigabe geprüft", erklaerung: "Die Prüfung durch eine zweite Person liegt vor der Freigabe (D-26). Korrigieren Sie das Datum der Prüfung oder geben Sie das Dokument nach der Prüfung erneut frei." }
H47: { titel: "{name} Controls mit gleichem Text zur Wirksamkeit", erklaerung: "Viele Controls nennen dieselbe Prüfung mit demselben Ergebnis. Halten Sie je Control fest, was geprüft wurde (Stichprobe, Nachweis) und was sich ergab (D-11); Auditoren prüfen den Text gegen die Checkliste des Audits." }
H48: { titel: "Wirksamkeit von {name} mit einem Audit belegt, das das Control nicht geprüft hat", erklaerung: "Die Checkliste des genannten Audits führt das Control nicht oder als «nicht prüfbar» bzw. «nicht geprüft» (D-20). Nennen Sie eine andere Prüfung oder halten Sie die Wirksamkeit als noch offen fest." }
H49: { titel: "Risiko {name} nach einer Änderung des KI-Systems nicht neu beurteilt", erklaerung: "Das KI-System wurde nach der letzten Beurteilung dieses Risikos geändert, z. B. nachtrainiert, mit neuem Modell oder neuer Version. Beurteilen Sie das Risiko neu und tragen Sie das Datum ein (D-06, D-07), auch wenn die Bewertung gleich bleibt." }
# Weitere Einträge
F30: { titel: "KI-System «{name}»: vertrauliche Daten in einem Gratis- oder Privattarif", erklaerung: "Gratis- und Privatkonten haben keinen Vertrag zur Auftragsbearbeitung und keine verlässlichen Zusagen zu Training und Aufbewahrung. Senken Sie die höchste erlaubte Datenklasse auf «intern» oder tiefer, oder wechseln Sie auf einen Business- oder Unternehmensvertrag (D-10, D-16)." }
H50: { titel: "KI-System «{name}»: gefährliche Kombination bei handelnder KI", erklaerung: "Das System liest Inhalte Dritter, darf vertrauliche Daten verarbeiten und handelt ohne Bestätigung. Versteckte Anweisungen in einer E-Mail oder einem Dokument können dann Daten nach aussen tragen oder Aktionen auslösen. Trennen Sie eine der drei Eigenschaften, z. B. Bestätigung für Aktionen mit Aussenwirkung oder keine vertraulichen Daten, und prüfen Sie Missbrauchsfälle (D-12, D-15)." }
H51: { titel: "Handelnde KI «{name}»: Auswirkung aller Risiken auf der tiefsten Stufe", erklaerung: "Das System führt Aktionen ohne Bestätigung aus. Bewerten Sie die Auswirkung so, als ob eine Fehlaktion unbemerkt bleibt; das hebt sie in der Regel um eine Stufe (D-06). Beurteilen Sie die Risiken neu oder begründen Sie die tiefe Bewertung." }
H52: { titel: "Veraltete oder unvollständige Kennung «{name}» in einem Freitext", erklaerung: "OWASP-Kennungen gehören mit Jahr zitiert, z. B. «LLM01:2026»; die Nummern der Listen 2023, 2025 und 2026 bezeichnen verschiedene Risiken. Artikel des AI Act aus der Entwurfsfassung (Art. 29 für Betreiberpflichten, Art. 52 für Transparenz) heissen in der Verordnung (EU) 2024/1689 Art. 26 und Art. 50. Berichtigen Sie den Text." }
H53: { titel: "KI-System «{name}»: Abkündigung durch den Anbieter überschritten oder innert 90 Tagen", erklaerung: "Planen Sie die Ablösung oder den Wechsel des Modells: Nachfolger prüfen, Tests wiederholen, Risiken neu beurteilen (D-12). Ist der Termin verschoben, tragen Sie das neue Datum mit Quelle ins Inventar ein." }
H54: { titel: "Risiko {name} ohne Behandlungsentscheid", erklaerung: "Auch ein tiefes Risiko braucht einen Entscheid: bewusst tragen, vermindern, vermeiden oder teilen. Halten Sie den Entscheid fest, bei «bewusst tragen» mit Person und Datum (D-07)." }
# Prozesse (ab Prozesse)
F31: { titel: "Pflichtprozess {name} hat keine Eigner/in", erklaerung: "Jeder anwendbare Pflichtprozess braucht eine verantwortliche Person, die ihn steuert und verbessert. Benennen Sie den Eigner im Bereich Prozesse oder die Person für die vorgeschlagene Rolle in D-04." }
F32: { titel: "Prozess {name}: «nicht anwendbar» ohne tragfähige Begründung", erklaerung: "Pflichtprozesse aus den Kapiteln 4 bis 10 lassen sich nicht abwählen. Andere Prozesse brauchen für «nicht anwendbar» eine Begründung, die zur Erklärung zur Anwendbarkeit (D-11) passt." }
H55: { titel: "Prozess {name}: Durchführung überfällig", erklaerung: "Nach Rhythmus oder Termin hätte der Prozess bereits wieder laufen sollen. Führen Sie ihn durch oder passen Sie Rhythmus und Termin begründet an." }
H56: { titel: "Prozess {name}: Reife «eingeführt» ohne Durchführung oder Nachweis", erklaerung: "Eingeführt heisst, dass der Prozess mindestens einmal wie beschrieben gelaufen ist und eine Aufzeichnung davon vorliegt. Tragen Sie Durchführung und Nachweis ein oder stufen Sie die Reife tiefer ein." }
H57: { titel: "Prozess {name}: Reife «wirksam» ohne aktuellen Messwert", erklaerung: "Wirksamkeit zeigt sich an der Kennzahl. Wählen Sie eine Kennzahl (Ziel oder Messplan D-05) und erfassen Sie einen Messwert der letzten zwölf Monate." }
H58: { titel: "Prozess {name}: Reife «überprüft» ohne Audit und Managementbewertung", erklaerung: "Überprüft heisst: im internen Audit der letzten zwölf Monate geprüft und in der Managementbewertung behandelt. Planen Sie die Prüfung im Auditprogramm (D-20) oder stufen Sie die Reife tiefer ein." }
H59: { titel: "Prozess {name}: offene Massnahmen überfällig", erklaerung: "Massnahmen zum Prozess haben ihren Termin überschritten. Setzen Sie sie um oder legen Sie mit der verantwortlichen Person einen neuen Termin fest (D-22)." }
H60: { titel: "Prozess {name}: Durchführung von Hand, aber nicht in den Projektdaten", erklaerung: "Die Projektdaten zeigen keine Durchführung, obwohl ein Datum von Hand eingetragen ist und die Reife mindestens «eingeführt» lautet. Erfassen Sie die Aufzeichnung dort, wo sie hingehört (z. B. Audit, Risikobeurteilung, Freigabe), damit Nachweis und Reife zusammenpassen." }
H61: { titel: "Prozess {name}: Bahnen ohne Rolle oder Formen ohne Zuordnung nach draw.io", erklaerung: "Beim Übernehmen aus draw.io liessen sich nicht alle Bahnen einer Rolle oder alle Formen einem Schritt zuordnen. Ordnen Sie im Ablauf die Rollen zu oder passen Sie die Datei an und übernehmen Sie sie erneut." }
H62: { titel: "Prozess {name}: Verweis auf das ISMS fehlt", erklaerung: "Im Pfad mit ISMS führen Sie diesen Prozess gemeinsam mit dem ISMS. Halten Sie fest, wo er im ISMS beschrieben ist, z. B. Handbuch und Kapitel." }
H63: { titel: "Pflichtprozess {name} in keinem internen Audit des Zyklus", erklaerung: "Die internen Audits der letzten drei Jahre und die geplanten Audits grenzen ihren Umfang auf Prozesse ein, dieser Pflichtprozess kommt aber in keinem vor. Nehmen Sie ihn in den Umfang eines geplanten Audits auf (Feld «Prozesse im Umfang», D-20), damit das Auditprogramm im Zyklus alles abdeckt." }
H64: { titel: "Logo für dunklen Grund", erklaerung: "Das Logo ({name}) ist überwiegend hell und auf den weissen Seiten der Dokumente kaum zu sehen. Laden Sie unter Einstellungen › Dokumentgestaltung die Fassung für hellen Grund." }
H65: { titel: "Primärfarbe angepasst: {name}", erklaerung: "Die Primärfarbe hat auf Weiss zu wenig Kontrast für Text oder Grafik. Die Dokumente verwenden darum die korrigierte Farbe in Klammern. Prüfen Sie unter Einstellungen › Dokumentgestaltung, ob das zum Erscheinungsbild passt, oder wählen Sie eine dunklere Farbe aus dem CI-Handbuch." }
# Weitere Prüfregeln
H66: { titel: "Dokument {name} ohne Prüfung freigegeben", erklaerung: "Vor jeder Freigabe prüft eine zweite Person das Dokument (D-26). Tragen Sie im Dokumentenregister ein, wer es wann geprüft hat; Kopf und Register nennen die Prüfung dann." }
H67: { titel: "Prozess {name}: überfällig ohne Massnahme", erklaerung: "Die Durchführung ist überfällig, aber keine offene Massnahme legt fest, wer sie bis wann nachholt. Erfassen Sie eine Massnahme zum Prozess (Herkunft «Prozess», Bezug auf die Prozess-ID) oder führen Sie den Prozess durch." }
H68: { titel: "Prozess {name}: Eigner widerspricht den Zuständigkeiten", erklaerung: "Der Rollenbereich des Prozesses ist in D-04 einer anderen Person zugewiesen, oder Eigner ist eine externe Person. Bestimmen Sie die zuständige Person als Eigner oder passen Sie die Zuständigkeiten in D-04 an; externe Stellen führen aus, die Firma bleibt Eignerin." }
H69: { titel: "KI-System «{name}»: volle Folgenabschätzung nötig", erklaerung: "Ein Risiko des Systems hat die höchste Auswirkung für Menschen oder die Gesellschaft. Nach dem Verfahren (D-06) löst das eine vollständige Folgenabschätzung aus; es liegt aber nur eine Kurzprüfung vor. Führen Sie die volle Abschätzung durch (D-09) oder begründen Sie die Bewertung des Risikos neu." }
H70: { titel: "Einführung der Prozesse nicht als Änderung geplant", erklaerung: "Neue Prozesse und die Prozessbeschreibungen (D-27) ändern das Managementsystem. Planen Sie die Einführung als Änderung (Massnahme mit Herkunft «Änderung» und Bezug auf D-27 oder die Prozesse): Zweck, Folgen, Mittel, Verantwortung und Termin." }
H71: { titel: "Prozess {name}: externe Ausführung ohne Steuerung", erklaerung: "Eine externe Stelle führt den Prozess aus, ist aber nicht als geprüfter Lieferant erfasst oder die Steuerung fehlt. Erfassen Sie den Dienstleister im Lieferantenregister (D-16) und halten Sie fest, wie die Firma ihn steuert, z. B. Vertrag, Auftrag, Bericht und Kontrolle." }
H72: { titel: "Eigener Prozess {name} unvollständig", erklaerung: "Ein eigener Prozess braucht wie die Katalogprozesse Auslöser, Eingaben, Ausgaben und Nachweise, Dokumente, eine Kennzahl mit Sollwert, einen Eigner und einen Ablauf. Ergänzen Sie die fehlenden Angaben in der Beschreibung des Prozesses." }
H73: { titel: "Prozess {name}: Freigabe widerspricht den Entscheidungsrechten", erklaerung: "Ein Freigabeschritt im Ablauf liegt bei einer tieferen Stelle, als die Entscheidungsrechte (D-04) für die Risiken im Projekt verlangen, volle Folgenabschätzungen gibt nicht die Geschäftsleitung frei, oder die Person, die eine Abschätzung durchführt, gibt sie selbst frei (D-08). Passen Sie den Ablauf oder die Zuständigkeiten an." }
H74: { titel: "Prozess {name}: Kennzahl passt nicht zum Prozess", erklaerung: "Die gewählte Kennzahl misst eine andere Grösse als die Kennzahl des Prozesses, z. B. eine Anzahl statt eines Anteils oder Tage statt Stunden. Wählen Sie eine passende Kennzahl im Messplan (D-05) oder erfassen Sie eine neue." }
H75: { titel: "Prozess {name}: nie durchgeführt und kein Termin", erklaerung: "Der Prozess hat einen Rhythmus, ist aber noch nie gelaufen und hat keinen nächsten Termin. Führen Sie ihn durch und erfassen Sie Durchführung und Nachweis, oder legen Sie den ersten Termin fest." }
H76: { titel: "Bibliothek: Prüfung von {name} überfällig", erklaerung: "Das Datum der nächsten Prüfung ist überschritten. Prüfen Sie, ob das Dokument noch gilt: bestätigen Sie es mit einem neuen Prüfdatum, checken Sie eine neue Version ein oder archivieren Sie es (D-26)." }
H77: { titel: "Bibliothek: {name} freigegeben ohne Angaben zur Freigabe", erklaerung: "Eine freigegebene Version nennt nicht, wer sie wann freigegeben hat. Halten Sie Prüfung und Freigabe fest; Register und Dokumentkopf zeigen sie dann (D-26, 7.5.2)." }
H78: { titel: "Bibliothek: Datei von {name} ausserhalb geändert", erklaerung: "Der Abgleich hat eine Datei gefunden, die nach dem Einchecken verändert wurde. Übernehmen Sie die Änderung als neue Version oder stellen Sie die Datei wieder her; ein freigegebenes Dokument ändert sich nur über eine neue Version (D-26)." }
H79: { titel: "Bibliothek: Datei von {name} fehlt", erklaerung: "Der Abgleich findet die Datei einer Version nicht mehr im Bibliotheksordner. Legen Sie die Datei wieder ab (zum Beispiel aus der Datensicherung) oder checken Sie die Version neu ein; gelenkte Dokumente müssen verfügbar bleiben (7.5.3)." }
H80: { titel: "Bibliothek im Browserspeicher seit über 30 Tagen nicht gesichert", erklaerung: "Die Dateien liegen nur in diesem Browser und gehen beim Aufräumen verloren. Sichern Sie die Bibliothek als ZIP und legen Sie die Sicherung an einem gesicherten Ort ab, oder verbinden Sie in Edge oder Chrome einen Ordner." }
H81: { titel: "Nutzung von «{name}» betrifft Rechte, ist aber nicht als sensibel markiert", erklaerung: "Die Kurzprüfung sagt, das System beeinflusse Rechte oder Chancen von Menschen. Prüfen Sie im Ergebnis der Folgenabschätzung, ob die Nutzung sensibel ist, und begründen Sie die Einstufung." }
H83: { titel: "Erledigte Massnahme «{name}» ohne tragfähigen Nachweis", erklaerung: "Die Kette von Risiko über Control und Massnahme zum Nachweis bricht hier ab: Es fehlt ein Nachweis, oder alle Nachweise sind älter als die Massnahme. Tragen Sie ein, welcher Nachweis Umsetzung und Wirksamkeit belegt." }
H84: { titel: "Prozess {name} ist eingeführt, hat aber keinen belastbaren Messwert", erklaerung: "Ein Prozess ab Stufe «eingeführt» wird gemessen. Erfassen Sie den Wert der Kennzahl im Messplan (D-05) mit Sollvergleich. Ist keine Messung möglich, halten Sie «kein Anlass» oder «erste Messung offen» mit dem Grund fest, oder setzen Sie die Reife tiefer." }
H85: { titel: "Risiko gilt als behandelt oder akzeptiert, obwohl Massnahmen offen sind", erklaerung: "Das Risiko {name} hat noch offene Massnahmen. Setzen Sie den Status auf «in Behandlung», bis sie erledigt sind, oder begründen Sie die Annahme ohne diese Massnahmen." }
H86: { titel: "Wirksamkeit von {name} vor dem Abschluss der Massnahme geprüft", erklaerung: "Die Prüfung liegt vor dem Abschluss einer zugehörigen Massnahme oder die Massnahme ist noch offen. Wiederholen Sie die Prüfung danach." }
H87: { titel: "Bibliothek: {name} passt nicht zur Erklärung zur Anwendbarkeit", erklaerung: "Der Eintrag ist mit einem Control verknüpft, das ihn in D-11 nicht als Nachweis führt. Gleichen Sie Verknüpfung und Erklärung zur Anwendbarkeit ab." }
H88: { titel: "Freigabe nicht durch die Leitung: {name}", erklaerung: "Leitlinie, Geltungsbereich und Projektauftrag gibt die Geschäftsleitung frei, und eine zweite Person als die Eignerschaft. Wählen Sie die freigebende Person neu." }
H89: { titel: "Datum in der Zukunft gilt noch nicht als erledigt: {name}", erklaerung: "Das Datum einer Freigabe, eines Audits oder einer Managementbewertung liegt nach dem heutigen Tag. Tragen Sie es erst ein, wenn es stattgefunden hat, oder führen Sie es als Termin." }
H91: { titel: "Weniger Einträge als empfohlen", erklaerung: "Die Hilfe empfiehlt je drei externe und interne Themen und mindestens drei Quellen für die Inventarsuche. Wenige Einträge übersehen oft Wichtiges; ergänzen Sie sie oder lassen Sie den Hinweis bewusst stehen." }
H82: { titel: "Risikoschwelle kann nie erreicht werden", erklaerung: "Die Schwelle «Nicht tragbar ab» liegt über dem höchsten Risikowert Ihrer Skala. Kein Risiko würde je als nicht tragbar gelten. Passen Sie Skala oder Schwelle an." }
# Modul NIST AI RMF
F27: { titel: "NIST AI RMF: Lücke {name} ohne Entscheid", erklaerung: "Für Subkategorien, die das AIMS nur teilweise abdeckt, nehmen Sie das Zusatz-Control in die Erklärung zur Anwendbarkeit auf oder begründen den Verzicht (D-11). Bei einer Präzisierung halten Sie im Profil fest, wo sie umgesetzt ist (N-01, N-02)." }
F28: { titel: "Generatives KI-System «{name}» ohne vollständige Bewertung der GenAI-Risiken", erklaerung: "Entscheiden Sie für alle zwölf Risiken nach NIST AI 600-1, ob sie für das System relevant sind, und begründen Sie kurz (N-04)." }
F29: { titel: "Freigegebenes KI-System «{name}» ohne Prüfung im Mess- und Prüfkonzept", erklaerung: "Halten Sie mindestens eine Prüfung mit Messgrösse und Schwelle fest oder begründen Sie, warum sich das wichtigste Merkmal nicht messen lässt (N-03, RMF-09). Den Einsatzentscheid prüft H31." }
H36: { titel: "Der Stand des NIST AI RMF ist älter als 6 Monate", erklaerung: "Prüfen Sie auf nist.gov, ob eine neue Fassung des AI RMF oder des GenAI-Profils erschienen ist, und aktualisieren Sie das Profil (N-01)." }
H37: { titel: "{name} Subkategorien mit Ziel über dem Ist ohne Massnahme", erklaerung: "Legen Sie für jede Lücke im Profil eine Massnahme im Behandlungsplan fest (M-xxx, D-07) oder senken Sie das Ziel begründet (N-01)." }
H38: { titel: "Kein Ziel im Profil NIST AI RMF festgelegt", erklaerung: "Ohne Ziel zeigt das Profil keine Lücken. Legen Sie fest, welche Subkategorien welche Stufe erreichen sollen (N-01)." }
H39: { titel: "KI-System «{name}»: relevantes GenAI-Risiko ohne Massnahme", erklaerung: "Nennen Sie für jedes relevante Risiko eine Massnahme, z. B. einen Eintrag im Risikoregister, eine Regel der Nutzungsrichtlinie oder ein Zusatz-Control RMF-Gxx (N-04, D-07, D-15)." }
H40: { titel: "KI-System «{name}» ohne unabhängige Überprüfung der Messungen", erklaerung: "Bei Eigenentwicklung, Produkt-KI oder Bezug zu Gesundheit und Sicherheit prüft jemand ausserhalb des Teams mindestens jährlich, ob Messgrössen und Tests Fehler aufdecken (N-03, RMF-10). Das interne Audit kann das übernehmen." }
H41: { titel: "Generative Eigenentwicklung «{name}» ohne Grundmodell oder Version", erklaerung: "Halten Sie das zugrunde liegende Modell mit Version im Inventar fest, damit ein Wechsel eine Kurzprüfung auslöst (D-10, RMF-16). Eingekaufte Systeme meldet H33." }
# Verweisregister: Kennung ohne Eintrag
F33: { titel: "Verweis ohne Ziel: {name} (gesucht: {fehlt})", erklaerung: "Die angegebene Kennung gehört zu keinem Eintrag mehr, zum Beispiel weil der Eintrag gelöscht wurde. Wählen Sie den richtigen Eintrag aus oder entfernen Sie den Verweis. Der Sprung führt zum Eintrag, der den Verweis enthält." }
# Status, zeitliche Gültigkeit, Stimmigkeit (F35 ersetzt H90)
F34: { titel: "Control {name} gilt als wirksam, obwohl eine Nichtkonformität dazu offen ist", erklaerung: "Solange eine Nichtkonformität zu diesem Control offen ist, belegen die Aufzeichnungen keine Wirksamkeit. Setzen Sie den Stand auf «umgesetzt» und verweisen Sie auf die Feststellung; «wirksam» erst nach der Wirksamkeitsprüfung der Korrektur." }
F35: { titel: "Prozess {name} ist eingeführt, aber ohne Durchführung", erklaerung: "Die Stufe «eingeführt» verlangt mindestens eine Durchführung mit Aufzeichnung bis zum Tag der Einstufung. Tragen Sie die letzte Durchführung ein oder setzen Sie die Reife tiefer." }
F36: { titel: "Dokument {name}: Angaben mit offenem Platzhalter", erklaerung: "Die Angaben, aus denen das Dokument entsteht, enthalten noch Platzhalter wie «noch nicht zugewiesen», «Text ergänzen» oder TODO. Ein freigegebenes Dokument darf keine offenen Stellen haben: Ergänzen Sie die genannten Einträge oder setzen Sie das Dokument zurück auf Entwurf." }
F37: { titel: "Rollen in Prozessabläufen ohne Besetzung: {name}", erklaerung: "Diese Rollen arbeiten in den Bahnen von Prozessen mit, sind aber weder ein Bereich der Zuständigkeiten noch einer Person zugeordnet. D-04 nennt sie dann «noch nicht zugewiesen». Erfassen Sie die Rolle als Zeile der Zuständigkeiten (Rollen und Personen, «Rolle erfassen»: Bereich und verantwortliche Person) oder wählen Sie bei einer Person unter «Rolle im Projekt» die gleichnamige Rolle. Sonst ändern Sie die Bahn im Ablauf." }
F38: { titel: "KI-System «{name}»: «juristisch geprüft» ohne Beleg oder neben offener Auslegung", erklaerung: "Die Angabe «juristisch geprüft» braucht einen Beleg (wer, wann) und eine abgeschlossene Auslegung. Betrifft das System eine Auslegung, die im Stand des Rechts als offen oder zu prüfen gekennzeichnet ist (E-09), entfernen Sie «juristisch geprüft», solange die Auslegung offen ist. Sonst erfassen Sie den Beleg der juristischen Prüfung." }
F39: { titel: "Beleg jünger als die Aussage: {name}", erklaerung: "Die Aussage nennt einen Eintrag, der erst nach ihrem Datum entstanden ist, oder ein Audit, das bis dahin nicht durchgeführt war. Ein Beleg kann nur stützen, was vor ihm lag: Korrigieren Sie Datum oder Beleg, oder halten Sie die Aussage neu mit dem späteren Datum fest." }
F40: { titel: "Verweis auf eine noch nicht freigegebene Fassung: {name}", erklaerung: "Der Beleg verweist auf ein Dokument oder eine Version, die zum Datum des Belegs noch nicht freigegeben war, oder ein Ereignis soll nach einem Dokument abgelaufen sein, das es damals noch nicht gab. Nennen Sie die damals gültige Fassung oder korrigieren Sie den Beleg." }
F41: { titel: "Stand vom {datum} jünger als die Fassung: {name}", erklaerung: "Das Kit hat den Rechtsstand am {datum} neu geprüft, nach der Freigabe dieser Fassung; das Dokument druckt dieses Datum ab. Erzeugen Sie das Dokument neu, prüfen Sie die Änderungen und geben Sie es als neue Version frei; ändert sich nichts, genügt eine Bestätigung der Fassung ab diesem Tag. Nennt ein anderer Eintrag diesen Stand im Text, korrigieren Sie das Datum oder erfassen Sie die Aussage mit dem späteren Datum." }
F42: { titel: "Prozess {name}: Stichprobe deckt nicht alle gezählten Systeme", erklaerung: "Die Kennzahl zählt Systeme als gemessen, die die Stichprobe der Ziele zu diesem Zeitpunkt nicht umfasst (etwa wegen «ab 2027» in der Messmethode) oder die kein Ziel führt. Korrigieren Sie Zähler und Sollvergleich oder nehmen Sie die Systeme in die Messung auf." }
F43: { titel: "Prozess {name}: Kennzahl ohne Datenquelle", erklaerung: "Die Aufzeichnungen liefern die Angaben nicht, aus denen die Kennzahl gerechnet wird, zum Beispiel Datum und Uhrzeit in «Entdeckt» und «Eingedämmt» bei jedem Vorfall (D-22) oder «Antrag am» und «Entscheid am» in der Freigabeliste (D-10). Halten Sie die Angaben fest, wählen Sie eine messbare Kennzahl oder erfassen Sie «erste Messung offen» mit Grund." }
F44: { titel: "Folgenabschätzung {name}: gleicher Text für mehrere Ziele", erklaerung: "Mindestens zwei Zellen wiederholen wortgleich den Nutzen oder Schaden eines anderen Ziels. Eine Abschätzung, die die Ziele gleich beantwortet, zeigt nicht, dass die Folgen je Ziel geprüft wurden. Beschreiben Sie je Ziel, was das System für die Betroffenen tatsächlich bewirkt. Höchstens eine Wiederholung je Abschätzung ist zulässig, nämlich wenn die Wirkung wirklich gleich ist; halten Sie das dann kurz im Text fest." }
F45: { titel: "Folgenabschätzung {name}: Ausmass anders als im Risikoregister", erklaerung: "Ein Ziel nennt ein Risiko aus dem Register (D-07), stuft das Ausmass aber anders ein als dessen Auswirkung vor der Behandlung. Beide bewerten den Schaden vor Massnahmen mit derselben Skala aus D-06. Gleichen Sie das Ausmass an oder begründen und ändern Sie die Bewertung im Register." }
F46: { titel: "Folgenabschätzung {name}: Entscheid folgt nicht der Schwelle aus D-08", erklaerung: "Nach dem Verfahren D-08 verlangt eine erreichte Schwelle der Kurzprüfung eine vollständige Abschätzung und die Einstufung als sensible Nutzung; ein Schaden mit hohem Ausmass vor Massnahmen erlaubt das System nur eingeschränkt, mit Auflagen in der Freigabeliste (D-10), oder gar nicht. Passen Sie den Entscheid, die Auflagen oder den Status des Systems an." }
F47: { titel: "KI-System «{name}»: sensible Nutzung im Inventar anders als in der Folgenabschätzung", erklaerung: "Das KI-Inventar (D-10) führt die sensible Nutzung anders als die jüngste Folgenabschätzung (D-09). Massgebend ist das Ergebnis der Abschätzung: Übernehmen Sie es im Guide auf der Seite «Ergebnis» der Folgenabschätzung mit «Ins Inventar übernehmen» oder beurteilen Sie das System neu." }
