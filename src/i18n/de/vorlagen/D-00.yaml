# D-00 Gap-Analyse und Projektauftrag
blaetter:
  auftrag: Projektauftrag
  abschnitte: Normabschnitte
  controls: Controls Anhang A
  reifegrade: Reifegrade
  schnellcheck: Schnellcheck
titel_auftrag: "Projektauftrag KI-Managementsystem"
titel_abschnitte: "Gap-Analyse Normabschnitte 4 bis 10"
titel_controls: "Gap-Analyse Controls Anhang A"
titel_reifegrade: "Reifegrade 0 bis 5"
titel_schnellcheck: "Schnellcheck in 15 Fragen"
hinweise_auftrag:
  - "Füllen Sie den Projektauftrag zuerst aus und lassen Sie ihn von der Geschäftsleitung freigeben. Ohne Freigabe fehlen Zeit und Mittel, und im Audit fehlt der Beleg, dass die Leitung das Vorhaben trägt."
  - "Eine Seite genügt. Halten Sie die Angaben knapp und konkret."
hinweise_abschnitte:
  - "Eine Zeile je Normabschnitt. Beschreiben Sie in Spalte D kurz, was heute schon vorhanden ist (Dokumente, gelebte Abläufe, Nachweise)."
  - "Wählen Sie die Ist-Reife und die Soll-Reife (Stufen im Blatt «Reifegrade»). Die Lücke wird berechnet. Die Soll-Reife legen Sie selbst fest; typisch ist Stufe 3 (festgelegt und angewendet). Wählen Sie mehr oder weniger, wo es Ihrem Ziel entspricht."
  - "Mit ISMS: Viele Abschnitte (z. B. 7.5, 9.2, 9.3, 10) sind im ISMS schon umgesetzt. Tragen Sie das bestehende Dokument als Ist ein; oft genügt eine Erweiterung."
hinweise_controls:
  - "Eine Zeile je Control aus Anhang A. Ob ein Control anwendbar ist, entscheiden Sie später in der Erklärung zur Anwendbarkeit (D-11). Hier geht es nur um den heutigen Stand."
  - "Wer KI nur einkauft und nutzt, erfüllt viele Controls der Gruppen A.6 und A.7 in schlanker Form oder über Angaben des Lieferanten."
hinweise_reifegrade:
  - "**Reife ist kein Zertifizierungskriterium.** Die Zertifizierungsstelle prüft Konformität: ob jede Anforderung erfüllt ist und ob das Unternehmen das belegen kann. Die Reifegrade dienen nur dazu, Lücken und Aufwand einzuschätzen."
  - "Für die Zertifizierung braucht es in der Regel Stufe 3: festgelegt, angewendet und nachweisbar. Stufe 4 und 5 sind kein Muss."
hinweise_schnellcheck:
  - "Beantworten Sie jede Frage mit Ja, Teilweise oder Nein. Die Ampel je Kapitel erscheint, sobald alle Fragen des Kapitels beantwortet sind: grün heisst alles erfüllt, gelb im Mittel höchstens teilweise, rot im Mittel schlechter als teilweise (Wert über 1, mit Ja = 0, Teilweise = 1, Nein = 2)."
  - "Der Schnellcheck dauert etwa 15 Minuten und eignet sich für ein erstes Gespräch mit der Geschäftsleitung. Die genaue Analyse folgt in den Blättern «Normabschnitte» und «Controls Anhang A»."
hinweise_schnellcheck_firma:
  - "Stand am {datum}, aus der Einschätzung je Kapitel. Ampel: grün heisst alles erfüllt, gelb im Mittel höchstens teilweise, rot im Mittel schlechter als teilweise (Wert über 1, mit Ja = 0, Teilweise = 1, Nein = 2)."
hinweise_reifegrade_firma:
  - "Soll für die Zertifizierung ist Stufe 3: festgelegt, angewendet und nachweisbar. Die Reifegrade dienen der Einschätzung von Lücken und Aufwand; geprüft wird die Konformität."
aufwand_mit_pensum: "{pt} Personentage, Pensum AIMS-Verantwortung {pensum} %"
spalten_auftrag: [Angabe, Inhalt, Hinweis]
auftrag:
  - id: ziel
    label: Ziel
    hinweis: "Was soll bis wann erreicht sein? Zum Beispiel ein zertifizierungsfähiges KI-Managementsystem bis zu einem Termin."
  - id: geltungsbereich
    label: Geltungsbereich (grob)
    hinweis: "Welche Bereiche, Standorte und KI-Systeme sollen dazugehören? Die genaue Abgrenzung folgt in D-02."
  - id: nutzen
    label: Nutzen
    hinweis: "Warum lohnt sich das? Zum Beispiel Anforderungen von Kunden, weniger Risiko bei KI-Werkzeugen, Vorbereitung auf den EU AI Act."
  - id: zieltermin
    label: Zieltermin Zertifizierung
    hinweis: "Rechnen Sie mit drei bis sechs Monaten bis zur Bereitschaft für Stage 1, ohne ISMS eher mehr."
  - id: ziel_stage1
    label: Ziel Stage-1-Bereitschaft
    hinweis: "Termin, bis zu dem internes Audit und Managementbewertung abgeschlossen sind; Ausgangspunkt für die Planung der zehn Schritte."
  - id: aufwand_intern
    label: Aufwand intern (Personentage)
    hinweis: "{richtwert} Planen Sie auch die Zeit der Fachbereiche ein."
  - id: aufwand_extern
    label: Externe Kosten (CHF)
    hinweis: "Beratung, Schulung, Werkzeuge und Zertifizierungsstelle (Stage 1, Stage 2, Überwachungsaudits)."
  - id: projektleitung
    label: Projektleitung
    hinweis: "In der Regel die Person, die später für das KI-Managementsystem zuständig ist."
  - id: sponsor
    label: Sponsor (Geschäftsleitung)
    hinweis: "Ein Mitglied der Geschäftsleitung, das Entscheide herbeiführt und Hindernisse beseitigt."
  - id: team
    label: Projektteam
    hinweis: "Zum Beispiel IT, Informationssicherheit, Datenschutz, Recht, Personal und die Fachbereiche mit den meisten KI-Systemen."
  - id: meilensteine
    label: Meilensteine
    hinweis: "Zum Beispiel Gap-Analyse, KI-Inventar, Risiken und Folgenabschätzungen, Erklärung zur Anwendbarkeit, internes Audit, Managementbewertung, Stage 1, Stage 2."
  - id: risiken
    label: Projektrisiken
    hinweis: "Zum Beispiel zu wenig Zeit in den Fachbereichen, unbekannte Schatten-KI, Lieferanten ohne Auskünfte."
  - id: freigabe_von
    label: Freigabe durch die Geschäftsleitung
    hinweis: "Name und Funktion der Person, die den Auftrag freigibt."
  - id: freigabe_am
    label: Freigabe am
    hinweis: "Datum der Freigabe. Bewahren Sie den freigegebenen Auftrag auf."
ziel_vorschlag: "[[Zertifizierungsfähiges KI-Managementsystem nach ISO/IEC 42001 bis TT.MM.JJJJ]]"
ziel_firma: "Zertifizierungsfähiges KI-Managementsystem nach ISO/IEC 42001 bis {datum}"
richtwert_mit_isms: "Richtwert mit bestehendem ISMS 25 bis 35 Personentage."
richtwert_ohne_isms: "Richtwert ohne ISMS 45 bis 65 Personentage."
richtwert_beide: "Richtwerte 25 bis 35 Personentage mit bestehendem ISMS, 45 bis 65 ohne ISMS."
