spalten_reifegrade: [Stufe, Bezeichnung, Bedeutung, Typischer Nachweis]
reifegrade:
  - [0, "nicht vorhanden", "Das Thema ist unbekannt oder wird nicht behandelt.", "keiner"]
  - [1, "ansatzweise", "Einzelne Personen handeln nach eigenem Ermessen. Nichts ist festgehalten.", "mündliche Auskunft, einzelne E-Mails"]
  - [2, "wiederholbar", "Es gibt eine übliche Vorgehensweise. Sie hängt aber an Personen und ist nicht oder nur lückenhaft beschrieben.", "Entwurf, Notizen, Dokument ohne Freigabe"]
  - [3, "festgelegt und angewendet", "Das Vorgehen ist beschrieben, freigegeben und bekannt. Es wird nachweisbar so gearbeitet.", "freigegebenes Dokument und Aufzeichnungen aus der Anwendung"]
  - [4, "gemessen und gesteuert", "Die Wirkung wird mit Kennzahlen überwacht. Abweichungen führen zu Massnahmen.", "Kennzahlen, Auswertungen, Massnahmenliste"]
  - [5, "laufend verbessert", "Ergebnisse aus Messung, Audit und Rückmeldungen fliessen regelmässig in Verbesserungen ein.", "Verbesserungsregister, Vergleich über mehrere Jahre"]
spalten_schnellcheck: [Nr., Kapitel, Frage, Antwort, Punkte, Kapitelwert, Ampel Kapitel, Bemerkung]
antworten: [Ja, Teilweise, Nein]
ampel: [grün, gelb, rot]
schnellcheck:
  - { kapitel: K-4, frage: "Gibt es eine vollständige Liste der KI-Systeme, auch der KI in eingekaufter Software und der Werkzeuge, die Mitarbeitende selbst nutzen?" }
  - { kapitel: K-4, frage: "Ist festgehalten, welche Rolle das Unternehmen je KI-System einnimmt, z. B. Anbieter oder Nutzer?" }
  - { kapitel: K-4, frage: "Ist schriftlich festgelegt, welche Bereiche, Standorte und KI-Systeme das Managementsystem umfasst?" }
  - { kapitel: K-5, frage: "Hat die Geschäftsleitung verbindliche Grundsätze für den Einsatz von KI freigegeben?" }
  - { kapitel: K-5, frage: "Ist eine Person benannt, die für das KI-Managementsystem sorgt und der Geschäftsleitung darüber berichtet?" }
  - { kapitel: K-6, frage: "Werden die Risiken der KI-Systeme nach einer festen Methode beurteilt und die Ergebnisse festgehalten?" }
  - { kapitel: K-6, frage: "Wird vor der Einführung abgeschätzt, wie ein KI-System auf Menschen wirkt, die davon betroffen sind?" }
  - { kapitel: K-6, frage: "Gibt es messbare Ziele für den Umgang mit KI, mit Verantwortlichen und Terminen?" }
  - { kapitel: K-7, frage: "Wissen die Mitarbeitenden, welche KI-Werkzeuge sie wofür nutzen dürfen und welche Daten sie nie eingeben dürfen?" }
  - { kapitel: K-7, frage: "Haben Dokumente zu KI eine Version, eine Freigabe und einen festen Ablageort?" }
  - { kapitel: K-8, frage: "Braucht ein neues KI-Werkzeug eine Freigabe, bevor es genutzt wird?" }
  - { kapitel: K-8, frage: "Werden Anbieter von KI-Systemen vor dem Vertragsabschluss geprüft?" }
  - { kapitel: K-9, frage: "Wird regelmässig intern geprüft, ob die Regeln zu KI eingehalten werden (internes Audit)?" }
  - { kapitel: K-9, frage: "Bespricht die Geschäftsleitung mindestens einmal im Jahr den Stand des KI-Managementsystems?" }
  - { kapitel: K-10, frage: "Werden Probleme mit KI-Systemen erfasst, nach ihrer Ursache untersucht und dauerhaft behoben?" }
ausbau_wiederholung: "Wiederholen Sie die Gap-Analyse etwa vier Wochen vor Stage 1 als Bereitschaftsprüfung. Dann zählt nicht mehr die Reife, sondern ob für jede Zeile ein Nachweis vorliegt."
