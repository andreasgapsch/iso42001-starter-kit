hinweis_rollen: "Kreuzen Sie an, welche Rollen Ihr Unternehmen bei KI einnimmt. Mehrere Rollen sind üblich. Diese Rollen beschreiben Ihre Stellung im KI-Ökosystem; die Rollen nach EU AI Act (z. B. Betreiber) bestimmen Sie je System in D-24 oder E-01."
