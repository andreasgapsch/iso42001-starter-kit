hinweis_themen: "Fragen Sie sich je Thema: Was wirkt von aussen oder innen auf unseren KI-Einsatz, und was folgt daraus für das Managementsystem? Die Vorschläge zeigen typische Themen für KMU. Streichen Sie, was nicht zutrifft."
