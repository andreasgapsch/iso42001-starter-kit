# D-01 Kontext, interessierte Parteien und Rollen
einleitung: "Dieses Dokument hält fest, in welchem Umfeld [[Firmenname]] KI einsetzt, welche Rolle das Unternehmen dabei einnimmt und welche Erwartungen interessierter Parteien das KI-Managementsystem aufnimmt. Es ist die Grundlage für den Geltungsbereich (D-02) und die Risikobeurteilung (D-06, D-07)."
einleitung_firma: "Dieses Dokument hält fest, in welchem Umfeld {firma} KI einsetzt, welche Rolle das Unternehmen dabei einnimmt und welche Erwartungen interessierter Parteien das KI-Managementsystem aufnimmt. Es ist die Grundlage für den Geltungsbereich (D-02) und die Risikobeurteilung (D-06, D-07)."
hinweis_umfang: "Zwei bis drei Seiten genügen. Halten Sie nur Themen fest, die das KI-Managementsystem tatsächlich beeinflussen. Überprüfen Sie das Dokument jährlich vor der Managementbewertung (D-21)."
isms_hinweis: "Mit ISMS: Führen Sie Kontext und interessierte Parteien gemeinsam mit dem ISMS. Ergänzen Sie das bestehende Dokument um die KI-Themen oder verweisen Sie hier darauf. Kreuzen Sie unten an, ob dieses Dokument für beide Managementsysteme gilt."
gilt_fuer_isms: Gilt für ISMS und AIMS
