  kunde: "Kunde und Nutzer: kauft KI-Systeme ein und setzt sie ein"
  partner: "Partner: liefert Daten, Infrastruktur oder Integrationsleistungen"
  betroffene: "Betroffene: ist selbst von KI-Systemen anderer betroffen"
  behoerde: "Behörde: beaufsichtigt oder regelt den Einsatz von KI"
zwecke_text: "Die beabsichtigten Zwecke unserer KI-Systeme stehen im KI-Inventar (D-10). Zurzeit sind dies:"
zwecke_leer: "Die beabsichtigten Zwecke unserer KI-Systeme stehen im KI-Inventar (D-10)."
hinweis_parteien: "Halten Sie je Partei die Anforderungen fest, die den KI-Einsatz betreffen, und woher sie stammen. Entscheiden Sie je Anforderung, ob das Managementsystem sie aufnimmt. Auch «nein» ist zulässig, braucht aber eine Begründung. Offene Entscheide klären Sie vor Stage 1."
