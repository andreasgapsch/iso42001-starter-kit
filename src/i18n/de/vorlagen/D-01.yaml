ueberpruefung_text: "Dieses Dokument wird mindestens jährlich und bei wesentlichen Änderungen überprüft, z. B. bei neuen KI-Systemen, neuen Märkten oder neuen Gesetzen; zuständig ist {verantwortlich}. Änderungen bei Themen und Parteien sind eine Eingabe der Managementbewertung (D-21)."
ausbau_umfeld: "Für eine gründlichere Umfeldanalyse gehen Sie die Bereiche Politik, Wirtschaft, Gesellschaft, Technik, Umwelt und Recht einzeln durch. Bei vielen betroffenen Personen lohnt es sich, wichtige Parteien direkt zu befragen, z. B. mit einer kurzen Umfrage bei Kunden oder Mitarbeitenden."
