hinweis_klima: "Entscheiden Sie ausdrücklich, ob der Klimawandel für Ihr KI-Managementsystem ein relevantes Thema ist, und begründen Sie den Entscheid in ein bis zwei Sätzen. Relevant kann er sein, wenn KI-Systeme viel Energie brauchen, Rechenzentren oder Lieferketten Klimarisiken ausgesetzt sind oder Kunden Angaben zum Fussabdruck verlangen."
