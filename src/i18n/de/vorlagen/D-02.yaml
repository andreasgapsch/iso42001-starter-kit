hinweis_aussage: |
  Fassen Sie den Geltungsbereich in zwei bis vier Sätzen zusammen. Diese Aussage erscheint später auf dem Zertifikat. Prüfen Sie, ob sie
  • das Unternehmen, die Standorte und Ihre Rolle nennt,
  • sagt, welche Tätigkeiten mit KI dazugehören,
  • ohne Produktnamen auskommt und nicht veraltet, wenn ein Werkzeug wechselt,
  • zu den Themen und Parteien in D-01 passt und nichts weglässt, was Kunden erwarten.
aussage_beispiel: "[[Das KI-Managementsystem gilt für Einkauf, Einführung und Nutzung von KI-Systemen durch alle Bereiche der Firmenname am Standort Ort. Es umfasst KI in eingekaufter Software, KI-Dienste aus der Cloud und die Nutzung durch Mitarbeitende.]]"
aussage_fehlt: "Im Projekt ist noch keine Geltungsbereichsaussage erfasst. Ergänzen Sie sie vor der Freigabe."
hinweis_grenzen: "Nennen Sie, was nicht dazugehört, damit die Grenze für Auditoren eindeutig ist."
