# D-03 KI-Leitlinie
einleitung: "Diese Leitlinie legt fest, wie [[Firmenname]] künstliche Intelligenz (KI) entwickelt, einkauft und nutzt. Sie gilt für alle Mitarbeitenden und für alle, die in unserem Auftrag mit KI-Systemen arbeiten."
einleitung_firma: "Diese Leitlinie legt fest, wie {firma} künstliche Intelligenz (KI) entwickelt, einkauft und nutzt. Sie gilt für alle Mitarbeitenden und für alle, die in unserem Auftrag mit KI-Systemen arbeiten."
einleitung_firma_ohne_entwicklung: "Diese Leitlinie legt fest, wie {firma} künstliche Intelligenz (KI) einkauft und nutzt. Sie gilt für alle Mitarbeitenden und für alle, die in unserem Auftrag mit KI-Systemen arbeiten."
hinweis_umfang: "Halten Sie die Leitlinie kurz (zwei bis drei Seiten). Sie regelt das Warum und das Was, nicht das Wie. Nennen Sie keine Produktnamen; Werkzeuge stehen im KI-Inventar (D-10) und in der Nutzungsrichtlinie (D-15)."
