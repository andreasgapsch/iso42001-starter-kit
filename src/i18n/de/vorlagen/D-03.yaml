  angepasst: angepasst
  verweis: Verweis auf diese Leitlinie ergänzt
  keine: keine Anpassung nötig
  nicht-vorhanden: nicht vorhanden
abgleich_offen: "noch nicht abgeglichen"
abgleich_ohne_isms: "nicht vorhanden; den Schutz der Daten in KI-Systemen regeln diese Leitlinie und die Richtlinie zur verantwortungsvollen KI-Nutzung (D-15)"
bezug_weitere: "Einsatz von KI im jeweiligen Bereich"
# Bezug zu KI je weitere Leitlinie (Schlüssel der Optionsgruppe leitlinienBezug)
bezug_weitere_je:
  beschaffung: "KI-Funktionen in eingekaufter Software und Diensten, Prüfung der Lieferanten vor dem Kauf"
  verhaltenskodex: "Geheimhaltung, Umgang mit Kundendaten und faires Verhalten bei der Nutzung von KI"
  nachhaltigkeit: "Energie- und Ressourcenbedarf von KI-Systemen"
hinweis_bezug: "Prüfen Sie Widersprüche, z. B. ob eine KI-gestützte Auswertung von Mitarbeitendendaten mit dem Personalreglement und dem Datenschutz vereinbar ist."
ausnahmen_text: "Abweichungen von dieser Leitlinie sind nur mit vorheriger, schriftlicher Zustimmung zulässig. Zustimmen können die Geschäftsleitung und {verantwortlich}. Jede Ausnahme wird mit Begründung, Dauer und Massnahmen festgehalten. Verstösse werden gemeldet (D-04) und wie andere Verstösse gegen interne Regeln behandelt."
ausnahmen_text_firma: "Abweichungen von dieser Leitlinie sind nur als vorher genehmigte Ausnahme zulässig. {regel} Jede Ausnahme wird mit Begründung, Dauer und Massnahmen festgehalten. Verstösse werden gemeldet (D-04) und wie andere Verstösse gegen interne Regeln behandelt."
bekanntmachung_text: "Die Leitlinie wird allen Mitarbeitenden bei Eintritt und nach jeder Änderung bekannt gemacht. Interessierte Parteien erhalten sie auf Anfrage."
hinweis_bekanntmachung: "Halten Sie fest, wie Sie die Bekanntmachung belegen, z. B. Intranet-Mitteilung mit Datum oder Teilnahmeliste der Schulung."
ueberpruefung_text: "Die Leitlinie wird mindestens jährlich sowie bei wesentlichen Änderungen von Technik, Recht oder Geschäft überprüft, zuständig ist {verantwortlich}. Die Ergebnisse der Managementbewertung (D-21) fliessen ein. Nächste Überprüfung: {naechste}."
freigabe_text: "Die Geschäftsleitung hat diese Leitlinie am {datum} freigegeben."
ausbau_themen: "Für Unternehmen, die KI entwickeln oder mit Wirkung auf Kunden einsetzen, können ergänzende Themenleitlinien sinnvoll sein, z. B. zur Entwicklung von KI-Systemen, zu Folgenabschätzungen oder zu KI-Ressourcen. Verweisen Sie hier darauf."
