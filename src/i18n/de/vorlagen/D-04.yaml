# D-04 Rollen, Verantwortlichkeiten und Meldewege
einleitung: "Dieses Dokument legt fest, wer bei [[Firmenname]] für welche Aufgaben im KI-Managementsystem zuständig ist und wie Mitarbeitende Bedenken zu KI-Systemen melden."
einleitung_firma: "Dieses Dokument legt fest, wer bei {firma} für welche Aufgaben im KI-Managementsystem zuständig ist und wie Mitarbeitende Bedenken zu KI-Systemen melden."
eb_einleitung_firma: "Diese Abschnitte ergänzen das Rollen- und Organisationsdokument aus dem ISMS der {firma} um die Aufgaben des KI-Managementsystems. Bestehende Rollen und Gremien bleiben bestehen; neue Rollen kommen nur hinzu, wo das ISMS keine passende kennt."
eb_einleitung: "Diese Abschnitte in Ihr bestehendes Dokument aufnehmen. Sie ergänzen Ihr Rollen- oder Organisationsdokument aus dem ISMS um die Aufgaben des KI-Managementsystems. Übernehmen Sie bestehende Rollen und Gremien, statt neue zu schaffen."
