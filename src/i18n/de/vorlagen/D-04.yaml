grundsaetze:
  - "Die Geschäftsleitung trägt die Gesamtverantwortung für das KI-Managementsystem und weist die Rollen zu."
  - "Wenige Personen tragen mehrere Rollen. Das ist zulässig, solange niemand die eigene Arbeit prüft, besonders im internen Audit."
  - "Jede Rolle hat eine Stellvertretung. Rollen und Stellvertretungen sind den Betroffenen bekannt."
  - "Änderungen der Rollen werden in diesem Dokument nachgeführt und den Mitarbeitenden mitgeteilt."
hinweis_pflichtrollen: "Zwei Aufgaben müssen ausdrücklich vergeben sein: dafür sorgen, dass das Managementsystem die Norm erfüllt, und der Geschäftsleitung über seine Leistung berichten. Im KMU übernimmt oft dieselbe Person beides."
pflichtrollen_fehlen: "Mindestens eine der beiden Pflichtrollen ist noch nicht vergeben; die Zuweisung erfolgt vor der Freigabe."
pflichtrollen:
  aims: Zuständig für das KI-Managementsystem
  konformitaet: "Sorgt dafür, dass das Managementsystem ISO/IEC 42001 erfüllt (5.3 a)"
  berichterstattung: "Berichtet der Geschäftsleitung über die Leistung des Managementsystems (5.3 b)"
  stellvertretung: Stellvertretung
hinweis_raci: |
  Tragen Sie je Bereich Personen oder Funktionen ein:
  • R (responsible): erledigt die Aufgabe,
  • A (accountable): entscheidet und trägt die Verantwortung, genau eine Person,
  • C (consulted): wird vorher angehört,
  • I (informed): wird nachher informiert.
  Die Spalte «Stellvertretung» nennt, wer R vertritt.
  Mit ISMS: Übernehmen Sie für Informationssicherheit und Datenschutz die bestehenden Zuständigkeiten.
