keine_selbstfreigabe: "**Keine Selbstfreigabe ab hohem Risiko.** Wer ein KI-System beantragt, betreibt oder als Eigner/in verantwortet, gibt es bei hohem Risiko nicht selbst frei und nimmt sein Restrisiko nicht selbst an. Ist eine Person in beiden Rollen, entscheidet die nächsthöhere Stelle."
# Firmendokument mit organisation.naechsthoehereStelle
keine_selbstfreigabe_stelle: "**Keine Selbstfreigabe ab hohem Risiko.** Wer ein KI-System beantragt, betreibt oder als Eigner/in verantwortet, gibt es bei hohem Risiko nicht selbst frei und nimmt sein Restrisiko nicht selbst an. Ist eine Person in beiden Rollen, entscheidet ihre vorgesetzte Stelle; bei einem Mitglied der Geschäftsleitung die Geschäftsleitung ohne diese Person, bei der Geschäftsleitung als Ganzes oder ihrer einzigen Person die nächsthöhere Stelle ({stelle})."
aufsicht_text: "Menschliche Aufsicht wirkt nur, wenn die prüfende Person tatsächlich eingreifen kann. Für jedes KI-System mit Aufsicht (KI-Inventar, D-10) gelten fünf Prüfpunkte:"
aufsicht_pruefpunkte:
  - "**Versteht die Folgen:** Die Person weiss, was ein falsches Ergebnis für Betroffene und für uns bedeutet."
  - "**Sieht Quelle und Vorschlag:** Sie sieht, worauf das Ergebnis beruht, und kann es mit den Ausgangsdaten vergleichen."
  - "**Hat Zeit:** Menge und Takt lassen eine echte Prüfung zu."
  - "**Darf ablehnen:** Sie kann ein Ergebnis verwerfen oder das System stoppen, ohne Nachteile zu befürchten."
  - "**Bleibt verantwortlich:** Die Entscheidung bleibt bei ihr, nicht beim System."
aufsicht_abnicken: "Wer grosse Mengen von Ergebnissen in kurzer Zeit bestätigt, prüft nicht mehr, sondern nickt ab. Stichproben der Korrekturquote (D-05) zeigen das: Eine Quote nahe null bei vielen Fällen ist ein Warnsignal."
anlage_verweis: "Die Entscheidungsrechte nach Risikostufe und die Anforderungen an wirksame menschliche Aufsicht stehen in Anlage A."
anlage_titel: Entscheidungsrechte und menschliche Aufsicht
