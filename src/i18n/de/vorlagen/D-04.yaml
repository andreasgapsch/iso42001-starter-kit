freigabe_text: "Die Geschäftsleitung hat diese Rollenzuweisung am {datum} freigegeben."
entscheidungsrechte_text: "Wer entscheidet, hängt von der Risikostufe ab: tief bis zur Akzeptanzgrenze, hoch ab der Grenze «unannehmbar» der Risikokriterien (D-06), mittel dazwischen. Massgebend ist das höchste Risiko des betroffenen KI-Systems im Risikoregister (D-07). Für die Annahme eines Restrisikos zählt der Wert nach der Behandlung: Ein Restrisiko ab der Grenze «unannehmbar» lässt sich nicht annehmen, sondern nur befristet als Ausnahme tragen (Zeile «Ausnahme bewilligen», D-06). Unabhängig von der Risikostufe gelten die Vorbehalte der Risikobereitschaft in der KI-Leitlinie (D-03): Was dort der Geschäftsleitung vorbehalten ist, entscheidet sie auch bei tiefem oder mittlerem Risiko."
hinweis_entscheidungsrechte: "Passen Sie die Vorschläge an Ihre Organisation an und nennen Sie Funktionen statt Namen, damit die Tabelle bei Personalwechseln gültig bleibt. Stoppen muss schnell gehen: Wer ein System beaufsichtigt, darf es ohne Rückfrage aussetzen. Die Grenzen dessen, was überhaupt erlaubt ist, legt die Risikobereitschaft in der KI-Leitlinie (D-03) fest."
