# D-05 KI-Ziele, Kennzahlen und Messplan
blaetter:
  ziele: Ziele
  messplan: Messplan
  messwerte: Messwerte
  nicht_gemessen: Nicht gemessen
titel_ziele: "KI-Ziele und Planung"
titel_messplan: "Messplan: was, wie, wann und durch wen"
titel_messwerte: "Messwerte"
hinweise_ziele:
  - "Leiten Sie drei bis sechs Ziele aus der KI-Leitlinie (D-03) ab. Jedes Ziel braucht eine Kennzahl, einen Sollwert, Verantwortliche und einen Termin."
  - "Die Vorschläge in eckigen Klammern sind Platzhalter. Übernehmen und anpassen oder löschen Sie sie."
  - "Mindestens ein Ziel sollte die verantwortungsvolle Nutzung von KI betreffen. Wer KI selbst entwickelt, setzt auch ein Ziel für die Entwicklung."
  - "Bewerten Sie die Ziele mindestens jährlich in der Managementbewertung (D-21) und passen Sie sie bei Bedarf an."
hinweise_messplan:
  - "Legen Sie für jede Kennzahl fest, was wie oft gemessen wird, wer misst, wer auswertet und wer das Ergebnis erhält."
  - "Der Messplan umfasst neben den Zielen auch die Wirksamkeit der Controls, die Ergebnisse interner Audits, die Meldungen zu KI-Systemen und einfache Kennzahlen je System (Korrekturquote, Reaktionszeit). Diese Zeilen sind vorbereitet."
  - "Prüfen Sie einmal im Jahr, ob die Kennzahlen und Tests taugen: Welche Fehler, Vorfälle oder Beschwerden haben sie nicht vorher angezeigt? Das Ergebnis gehört in die Managementbewertung (D-21)."
  - "Die Zeilen PR-xx und PS-xx sind die Kennzahlen der Prozesse aus D-27. Tragen Sie ab der Stufe «eingeführt» einen ersten Messwert im Blatt «Messwerte» ein, mit der Prozess-ID als Kennzahl."
  - "Spalte «KI-Systeme» im Blatt Ziele: Systeme, für die ein Ziel gilt; leer heisst alle. Für jedes KI-System mit sensibler Nutzung sollte mindestens eine eigene Kennzahl bestehen."
  - "Spalte «Methode und Quelle»: Nennen Sie die Vorlage und die Spalte, aus der der Wert kommt (z. B. KI-Inventar D-10, Spalte «Lebenszyklus»), oder die Aufzeichnung, etwa ein Protokoll. Bei einer Stichprobe steht der Umfang in der Methode. Der Nenner im Messwert ist dieser Umfang, und eine Kennzahl über Systeme zählt nur Systeme, die die Stichprobe am Messdatum tatsächlich umfasst."
hinweise_messwerte:
  - "Tragen Sie jede Messung mit Datum ein. Die Messwerte sind der Nachweis, dass Sie überwachen und messen; bewahren Sie sie auf."
  - "Zählen Sie jeden Wert aus den Aufzeichnungen aus und schreiben Sie Zähler und Nenner dazu, z. B. «3 von 4 (75 %)». Vergleichen Sie ihn in der Spalte «Sollwert erreicht» mit dem Sollwert."
  - "Keine Zahl schätzen: Gab es keinen Fall, schreiben Sie «kein Anlass». Ist die Kennzahl noch nicht messbar (im ersten Jahr etwa die Umsetzung der Entscheide bis zur nächsten Bewertung), schreiben Sie «noch keine Messung» und in der Bemerkung den Grund."
