# D-06 Verfahren KI-Risikomanagement
hinweis_umfang: "Das Verfahren beschreibt die Methode; die Risiken stehen in D-07, die Controls in D-11. Beginnen Sie mit Systemen, die Personendaten verarbeiten oder über Menschen mitentscheiden."
einleitung: "Dieses Verfahren legt fest, wie [[Firmenname]] Risiken und Chancen im Zusammenhang mit KI erkennt, bewertet, behandelt und überwacht. Es sorgt dafür, dass wiederholte Beurteilungen vergleichbare Ergebnisse liefern."
einleitung_firma: "Dieses Verfahren legt fest, wie {firma} Risiken und Chancen im Zusammenhang mit KI erkennt, bewertet, behandelt und überwacht. Es sorgt dafür, dass wiederholte Beurteilungen vergleichbare Ergebnisse liefern."
abschnitte:
  zweck: Zweck
  geltung: Geltung
  ablauf: Ablauf
  skalen: Skalen und Akzeptanzkriterien
  folgen: Verbindung zur Folgenabschätzung
  wiederholung: Wiederholung
  chancen: Chancen
