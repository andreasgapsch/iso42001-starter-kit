skalen_vorschlag:
  wahrscheinlichkeit:
    - [1, selten, "weniger als einmal in 5 Jahren"]
    - [2, möglich, "einmal in 2 bis 5 Jahren"]
    - [3, wahrscheinlich, "etwa jährlich"]
    - [4, häufig, "mehrmals pro Jahr"]
  auswirkung:
    - [1, gering, "kaum spürbar, rasch behoben"]
    - [2, spürbar, "Ärger, Aufwand oder kleiner Schaden für Betroffene oder Unternehmen"]
    - [3, erheblich, "deutlicher Schaden, Rechtsverletzung oder Vertrauensverlust"]
    - [4, schwer, "Gefahr für Gesundheit, Grundrechte oder Fortbestand"]
