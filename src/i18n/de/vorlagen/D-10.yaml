titel_inventar: "KI-Inventar: alle KI-Systeme im Geltungsbereich"
titel_ressourcen: "Ressourcen je KI-System"
titel_fragebogen: "Fragebogen: Wo nutzen Sie KI?"
titel_freigabe: "Freigabeliste KI-Werkzeuge"
hinweise_inventar:
  - "Eine Zeile je KI-System. Erfassen Sie auch KI-Funktionen in eingekaufter Software (z. B. Assistenten in Office-, CRM- oder HR-Programmen) und Schatten-KI, also Werkzeuge, die ohne Freigabe genutzt werden."
  - "Typ: eingekauft (Software oder Gerät), SaaS (Cloud-Dienst), Eigenbau (selbst entwickelt oder nachtrainiert), Schatten-KI (ohne Freigabe im Einsatz)."
  - "Sensible Nutzung ergibt sich aus der Kurzprüfung (D-08, D-09). Die nächste Überprüfung planen Sie spätestens nach einem Jahr."
  - "Handelnde KI: «Handlungsbefugnis» zeigt, wie weit das System selbst handelt: informiert (gibt Auskunft, entwirft), empfiehlt, bereitet vor (z. B. Buchung zur Bestätigung), führt begrenzt aus (einzelne Aktionen ohne Bestätigung), handelt mehrstufig (plant und führt mehrere Schritte mit Werkzeugen aus, sogenannte Agenten). Ab «führt begrenzt aus» braucht das System eine Stoppmöglichkeit, Protokolle und eine benannte Aufsicht. Unter «Zugriffe und Werkzeuge» stehen Systeme, Ablagen, Schnittstellen, Konnektoren und Erweiterungen, die es lesen oder bedienen kann."
  - "Modell und Version: Anbieter, Modell und Version, bei Diensten die Angabe des Anbieters mit Datum. Ein Modellwechsel ist ein Auslöser für die Neubeurteilung (D-12). «Liest fremde Inhalte» heisst: E-Mails, Webseiten oder Dokumente Dritter; zusammen mit «öffentlich erreichbar» und «generativ» bestimmt es, ob Missbrauchsfälle getestet werden (D-12)."
  - "Tarif oder Vertragsart: Die Zusagen zu Training, Aufbewahrung und Vertrag hängen am Angebot, nicht am Anbieter. Vertrauliche Daten nur mit Business, Unternehmensvertrag oder eigenem Betrieb. «Abkündigung durch den Anbieter» ist das angekündigte Datum, an dem Modell oder Dienst eingestellt wird; «Quelle der Anbieterangaben» nennt Fundstelle und Abrufdatum beim Hersteller oder Anbieter, nicht aus Sammlungen Dritter."
  - "Kritisch für den Betrieb: wenn ein Ausfall wichtige Abläufe stört; dann den Rückfallweg nennen. «Aufbewahren bis» gilt für Systeme ausser Betrieb oder abgelöst: bis dahin bleiben Unterlagen, Ergebnisse und Einstellungen erhalten (D-12)."
hinweis_aiact: "Die Spalten «Rolle AI Act» und «Risikoklasse AI Act» brauchen Sie nur mit dem AI-Act-Modul (E-01, E-02). Sonst leer lassen oder ausblenden."
hinweise_ressourcen:
  - "Eine Zeile je KI-System aus dem Blatt «Inventar». Stichworte genügen; verweisen Sie auf bestehende Verzeichnisse statt sie abzuschreiben."
  - "Daten: Eingaben, Ausgaben und, falls bekannt, Trainingsdaten. Werkzeuge und Modelle: Modell oder Dienst, Version, Anbieter. Rechenressourcen: Betriebsort (eigenes Rechenzentrum, Cloud mit Region, Endgerät). Personal: Rollen für Betrieb, Aufsicht und Support."
  - "Abhängigkeiten: Systeme und Abläufe, die dem KI-System Daten liefern oder seine Ergebnisse weiterverwenden. Sie zeigen, wer bei Ausfall, Änderung oder Ausserbetriebnahme betroffen ist."
hinweise_fragebogen:
  - "Eine Zeile je Werkzeug oder Funktion, die künstliche Intelligenz nutzt; im Zweifel aufführen. Es geht um einen Überblick, nicht um Kontrolle. Dazu gehören auch Gratis- und Privatkonten, die für die Arbeit genutzt werden."
  - "Beispiele: Chat- und Schreibassistenten (Microsoft 365 Copilot, ChatGPT und ähnliche), KI-Funktionen in CRM (Lead-Bewertung, Textvorschläge), HR-Werkzeuge (Vorselektion von Bewerbungen), Übersetzung, Protokolle und Transkription von Sitzungen, Bild- und Texterzeugung, Belegerkennung, Chatbots auf der Website sowie Browser-Erweiterungen und Apps."
  - "Die Spaltenköpfe bleiben unverändert. So lassen sich die Antworten aller Fachbereiche zusammenführen und in das Inventar übernehmen."
hinweise_freigabe:
  - "Hier steht, welche KI-Werkzeuge Mitarbeitende nutzen dürfen, mit welchen Auflagen und bis zu welcher Klassifikation der Daten. Die Regeln dazu stehen in der Nutzungsrichtlinie (D-15)."
  - "Untersagte Werkzeuge bleiben mit Begründung auf der Liste, damit die Entscheidung nachvollziehbar ist."
  - "Erweiterungen, Konnektoren (auch Werkzeugserver, etwa nach dem Model Context Protocol), eigene Assistenten und Agenten brauchen eine eigene Freigabe: Nennen Sie in der Spalte «Freigegebene Zugriffe», welche freigegeben sind. Alles andere ist nicht erlaubt (D-15)."
  - "Funktionen: je Funktionsschalter des Dienstes die gewählte Einstellung, z. B. «Websuche: ein; Gedächtnis: aus». Nicht genannte Funktionen sind ungeklärt."
  - "«Antrag am» und «Entscheid am»: Datum, an dem der Antrag einging, und Datum der Freigabe oder Ablehnung (PR-07). Daraus rechnet die Kennzahl PR-07 die Tage bis zum Entscheid (D-05)."
hinweis_eb: "Mit ISMS: Führen Sie KI-Systeme entweder im bestehenden Asset-Inventar mit dem Kennzeichen «KI» und den Spalten dieses Blatts, oder führen Sie dieses Inventar und verweisen Sie je System auf die Asset-ID (Blatt «Ressourcen»)."
ausbau_eigenbau: "Für Eigenentwicklungen: Halten Sie im Blatt «Ressourcen» zusätzlich Modellversionen, Trainings- und Testdatensätze sowie Entwicklungswerkzeuge je Version fest (A.4.3, A.4.4, A.6.2.3)."
