# D-11 Erklärung zur Anwendbarkeit
blaetter:
  soa: SoA
  auswertung: Auswertung
titel_soa: "Erklärung zur Anwendbarkeit: Controls aus ISO/IEC 42001 Anhang A"
titel_auswertung: "Auswertung der Erklärung zur Anwendbarkeit"
hinweis_vorhanden: "«Bereits vorhanden» ist kein Grund für einen Ausschluss. Ein Control, das schon umgesetzt ist, tragen Sie als «anwendbar: ja» mit Status «umgesetzt» und dem Verweis auf die Umsetzung ein (z. B. «umgesetzt durch ISMS-Richtlinie Zugriffsschutz»)."
hinweise_soa:
  - "Entscheiden Sie für jedes Control, ob es anwendbar ist, und begründen Sie Aufnahme und Ausschluss. Gründe für die Aufnahme sind z. B. ein Risiko (Spalte «Risiken»), eine gesetzliche oder vertragliche Pflicht oder eine Erwartung interessierter Parteien."
  - "Ein Ausschluss ist zulässig, wenn das Control in Ihrem Geltungsbereich nicht zutrifft, z. B. Controls nur für die Entwicklung (A.6.1.2, A.6.1.3, A.7.2), wenn Sie KI ausschliesslich einkaufen und nicht anpassen. Begründen Sie jeden Ausschluss konkret."
  - "Status: offen, geplant, teilweise, umgesetzt oder wirksam (Wirksamkeit überprüft). Für jedes anwendbare Control braucht es einen Nachweis. Nicht anwendbare Controls erhalten keinen Status."
  - "Spalte «Wirksamkeit geprüft»: wie die Wirkung geprüft wurde (z. B. Stichprobe, Test, Auswertung von Kennzahlen), wann und durch wen, dazu das Ergebnis. Den Massstab legt nicht allein die Person fest, die das Control betreibt. «Wirksam» setzen Sie erst, wenn diese Spalte ausgefüllt ist."
  - "Die Spalte «Gruppe» wird berechnet und dient der Auswertung. Ändern Sie sie nicht."
hinweise_auswertung:
  - "Die Werte werden aus dem Blatt «SoA» berechnet. Spalte «Kennung» nicht ändern."
