  - ["Rechte und Rechtsgrundlage", "[[Text ergänzen]]"]
  - ["Personendaten und Schutzmassnahmen", "[[Text ergänzen]]"]
  - ["Umfang, Zeitraum, Abdeckung", "[[Text ergänzen]]"]
  - ["Bekannte Lücken und Verzerrungen", "[[Text ergänzen]]"]
  - ["Aufbereitung (A.7.6)", "[[Text ergänzen]]"]
  - ["Qualitätsprüfung und Ergebnis (A.7.4)", "[[Text ergänzen]]"]
  - ["Herkunft und Änderungen (A.7.5)", "[[Text ergänzen]]"]
