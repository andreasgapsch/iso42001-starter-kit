  - ["Cyberangriff melden, innert 24 Stunden (nur Betreiber kritischer Infrastrukturen)", "ISG Art. 74a ff.", "BACS", "[[Name, Funktion]]"]
  - ["über automatisierte Einzelentscheide informieren", "DSG Art. 21, DSGVO Art. 22", "betroffene Personen", "[[Name, Funktion]]"]
