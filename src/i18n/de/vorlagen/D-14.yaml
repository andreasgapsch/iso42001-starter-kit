vorfall_bestehend: "KI-Vorfälle laufen über unser bestehendes Verfahren für Vorfälle ({verfahren}). Dieser Abschnitt ergänzt nur, was bei KI anders ist."
vorfall_isms: "Haben wir ein Verfahren für Sicherheitsvorfälle, laufen KI-Vorfälle darüber. Dieser Abschnitt ergänzt nur, was bei KI anders ist."
vorfall_definition: "Ein KI-Vorfall ist ein Ereignis, bei dem ein KI-System Menschen, Daten, Kunden oder das Unternehmen schädigt oder schädigen könnte. Beispiele:"
vorfall_beispiele:
  - "vertrauliche Daten oder Personendaten gelangen über ein KI-System an Unbefugte"
  - "falsche oder erfundene Ergebnisse gelangen an Kunden oder in Entscheide"
  - "ein System benachteiligt Personen oder Gruppen"
  - "ein System wird manipuliert, z. B. durch versteckte Anweisungen in Dokumenten oder Webseiten"
  - "ein System wird ausserhalb seines Zwecks genutzt oder fällt bei einer wichtigen Aufgabe aus"
kommunikation_text: "Bei einem KI-Vorfall informieren wir in dieser Reihenfolge. Die Koordination und, gemeinsam mit der Geschäftsleitung, den Entscheid über die Information nach aussen übernimmt die verantwortliche Person für Vorfälle (D-04): {verantwortlich}."
hinweis_kommunikation: "Passen Sie Fristen und Wege an, in dieser Tabelle, in den Schweregraden und im Ablauf PR-19 (D-27) gleich. Üben Sie den Ablauf einmal im Jahr an einem Beispiel; der Auditor fragt danach."
