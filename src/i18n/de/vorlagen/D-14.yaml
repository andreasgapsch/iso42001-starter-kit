modul_pflichten: "Welche dieser Pflichten für unsere Rollen und Risikoklassen gelten, steht in E-03 und E-05."
kunden_text: "Setzen wir KI in Leistungen für Kunden ein oder liefern wir KI an Kunden, informieren wir sie über:"
kunden_inhalt:
  - "wo und wofür KI in der Leistung eingesetzt wird"
  - "was das System kann und was nicht, einschliesslich bekannter Fehlerquellen"
  - "welche Ergebnisse ein Mensch prüft"
  - "wie Kundendaten verwendet werden, insbesondere ob sie dem Training dienen"
  - "wohin sie Fragen und Meldungen richten (Meldekanal)"
kunden_ort: "Die Information steht in [[Offerte, Vertrag oder Leistungsbeschreibung]]. Anforderungen von Kunden an unseren KI-Einsatz erfassen wir in D-01 und berücksichtigen sie bei Einführung und Änderung (D-12)."
lehren_text: "Nach jedem KI-Vorfall und Beinahe-Vorfall halten wir Ursache, Wirkung und Massnahmen fest (D-22) und prüfen, ob Risiken (D-07), Folgenabschätzung (D-09) und die Information für Nutzende anzupassen sind. Akzeptierte Restrisiken, die Nutzende oder Kunden betreffen, nehmen wir in deren Information auf. Wir überprüfen diese Festlegungen jährlich und nach erheblichen Vorfällen."
ausserhalb_text: "Die folgenden Festlegungen betreffen nicht nur Vorfälle. Sie gehören zu diesem Ergänzungsblatt, damit alle Themen aus A.8 und A.10.4 abgedeckt sind."
ausserhalb_text_firma: "Die folgenden Festlegungen gelten für den Betrieb unserer KI-Systeme, nicht nur bei Vorfällen (A.8.2, A.10.4)."
# Schweregrade für KI-Vorfälle und Einspruch
schwere_text: "Wir stufen jeden KI-Vorfall und Beinahe-Vorfall nach seiner schwersten Folge ein; im Zweifel gilt die höhere Stufe. Die Stufe bestimmt Eskalation und Frist und steht im Register D-22. Meldungen und Register gleichen wir {{fakt:vorfall.abgleich}} ab, damit kein Vorfall fehlt."
schwere_text_eb: "Wir stufen jeden KI-Vorfall und Beinahe-Vorfall nach seiner schwersten Folge ein; im Zweifel gilt die höhere Stufe. Die Stufen ergänzen die Einstufung des bestehenden Vorfallverfahrens und stehen im Register D-22. Meldungen und Register gleichen wir {{fakt:vorfall.abgleich}} ab, damit kein Vorfall fehlt."
schwere_kopf: [Stufe, Beispiele, Eskalation und Frist]
schwere_tabelle:
  - ["1 gering", "einzelnes falsches Ergebnis, vor der Verwendung erkannt; kein Schaden", "Eigner/in des Systems, Eintrag im Register [[{{fakt:vorfall.erfassung}}]]"]
  - ["2 mittel", "falsches Ergebnis erreicht einen internen Entscheid oder einen Kunden und ist rasch korrigierbar; Beinahe-Vorfall mit möglichem erheblichem Schaden", "AIMS-Verantwortliche innert [[{{fakt:vorfall.stufe2}}]]"]
  - ["3 erheblich", "vertrauliche Daten oder Personendaten gelangen an Unbefugte, Personen werden benachteiligt, mehrere Kunden sind betroffen", "Geschäftsleitung innert [[{{fakt:vorfall.stufe3}}]], Meldepflichten nach Abschnitt 4 prüfen"]
  - ["4 schwer", "Gefahr für Gesundheit oder Sicherheit, viele Betroffene, Meldepflicht gegenüber Behörden", "Geschäftsleitung {{fakt:vorfall.stufe4}}, System aussetzen, Information nach Abschnitt 3 beziehungsweise 4"]
einspruch_text: "Wer von einem Ergebnis eines unserer KI-Systeme betroffen ist, kann über den Meldekanal verlangen, dass ein Mensch das Ergebnis prüft. Das gilt für alle KI-Systeme, nicht nur für Hochrisiko-KI. Die Eignerin oder der Eigner des Systems prüft innert [[10 Arbeitstagen]], erläutert das Ergebnis und korrigiert es, wo nötig. Einsprüche erfassen wir im Register D-22 und werten sie bei der Überprüfung des Systems aus."
anlage_titel: "Schweregrade und Einspruch"
anlage_verweis: "Schweregrade für KI-Vorfälle und der Einspruch gegen KI-Ergebnisse stehen in Anlage {nr}."
