pflichten_text: "Diese Informations- und Meldepflichten gelten für uns. Die Liste wird bei neuen Verträgen und Gesetzen nachgeführt."
hinweis_pflichten: "Streichen Sie, was nicht zutrifft, und ergänzen Sie Pflichten aus Kundenverträgen. Lassen Sie die Liste bei Unsicherheit rechtlich prüfen."
