info_ort_im_text: "wie beschrieben"
info_untersagt: "Nutzung untersagt; Hinweis in der Richtlinie KI-Nutzung (D-15)"
modul_info: "Für Chatbots, erzeugte oder veränderte Inhalte, Emotionserkennung und Deepfakes gelten Transparenzpflichten (Art. 50). Checkliste und Textbausteine stehen in E-07."
modul_info_systeme: "Betroffen sind: {systeme}."
meldekanal_text: "Kunden, Betroffene und Partner können uns nachteilige Wirkungen unserer KI-Systeme melden, auch vermutete Schwachstellen und Verzerrungen. Meldungen behandeln wir vertraulich; niemand erleidet Nachteile, weil er in guten Treuen meldet."
hinweis_meldekanal: "Ein bestehender Kanal genügt, z. B. die allgemeine Kontaktadresse oder die Meldestelle für Hinweise, wenn KI-Meldungen dort ausdrücklich erwähnt sind. Der Kanal muss öffentlich auffindbar sein, etwa auf der Website."
