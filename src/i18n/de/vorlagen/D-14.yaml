info_text: "Wer ein KI-System nutzt oder von seinen Ergebnissen betroffen ist, erhält die nötigen Informationen: dass KI beteiligt ist, wofür sie dient, wo ihre Grenzen liegen, wer Ergebnisse prüft und an wen man sich wendet. Wir informieren, wenn mindestens eines zutrifft:"
info_kriterien:
  - "Menschen schreiben oder sprechen direkt mit einem KI-System"
  - "Ergebnisse gehen ohne Prüfung an Kunden oder an die Öffentlichkeit"
  - "das System bereitet Entscheide über Personen vor"
  - "Mitarbeitende arbeiten regelmässig mit dem System"
systeme_fehlen: "Im KI-Inventar ist noch kein KI-System erfasst. Ergänzen Sie zuerst D-10."
