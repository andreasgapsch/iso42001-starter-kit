# D-14 Information, Transparenz und Meldungen
hinweis_umfang: "Halten Sie das Dokument knapp und passen Sie Fristen und Wege an. Mit ISMS verwenden Sie stattdessen das Ergänzungsblatt D-14-EB für Ihr bestehendes Verfahren für Sicherheitsvorfälle."
einleitung: "Dieses Dokument legt fest, wie [[Firmenname]] Nutzende und Kunden über KI informiert, Meldungen von aussen entgegennimmt und bei KI-Vorfällen kommuniziert."
einleitung_firma: "Dieses Dokument legt fest, wie {firma} Nutzende und Kunden über KI informiert, Meldungen von aussen entgegennimmt und bei KI-Vorfällen kommuniziert."
hinweis_eb: "Nehmen Sie die Abschnitte 1 bis 5 in Ihr Verfahren für Sicherheitsvorfälle auf (ISO/IEC 27001, A.5.24 bis A.5.28) und passen Sie die Nummerierung an. Abschnitt 6 gehört nicht ins Vorfallverfahren. Führen Sie ihn als eigenes kurzes Blatt weiter, damit A.8.2 und A.10.4 abgedeckt bleiben."
einleitung_eb: "Dieses Ergänzungsblatt erweitert unser bestehendes Verfahren für Sicherheitsvorfälle um KI-Vorfälle, einen Meldekanal für Externe und Informationspflichten. Wo nichts anderes steht, gilt das bestehende Verfahren."
einleitung_eb_firma: "Dieses Ergänzungsblatt erweitert unser Verfahren für Sicherheitsvorfälle ({dokument}) um KI-Vorfälle, einen Meldekanal für Externe und Informationspflichten. Wo nichts anderes steht, gilt dieses Verfahren."
