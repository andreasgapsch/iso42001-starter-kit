# Ampel: nur Werkzeuge für Mitarbeitende; eigene Systeme und Produktfunktionen regelt D-12
ampel_eigene: "Eigene KI-Systeme und KI-Funktionen unserer Produkte ({systeme}) sind keine Werkzeuge im Sinne dieser Ampel; für sie gelten Freigabe und Auflagen nach D-12 und dem KI-Inventar (D-10)."
modul_kennzeichnung_leer: "**Nur mit Modul EU AI Act:** Für Chatbots, Deepfakes und veröffentlichte KI-Texte gelten besondere Pflichten (Art. 50, E-07)."
modul_kennzeichnung: "Für Chatbots, Deepfakes und veröffentlichte KI-Texte gelten besondere Pflichten nach dem EU AI Act (Art. 50, E-07)."
