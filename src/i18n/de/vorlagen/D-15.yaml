  eingabe: Was nie in ein KI-Werkzeug gehört
  verboten: Wofür wir KI nicht verwenden
  pruefen: Ergebnisse prüfen
  pruefen_eb: Ergebnisse prüfen und kennzeichnen
  kennzeichnung: Kennzeichnung, Urheberrecht und Vertraulichkeit
  assistenten: Sicher mit KI-Assistenten arbeiten
  neu: Neues Werkzeug beantragen
  melden: Probleme melden
  schulung: Schulung und Folgen bei Verstössen
ampel_text: "Mitarbeitende nutzen für die Arbeit nur freigegebene Werkzeuge mit dem Firmenkonto."
ampel_text_ausnahme: "Mitarbeitende nutzen für die Arbeit nur freigegebene Werkzeuge mit dem Firmenkonto. Abweichungen davon gelten nur als befristete Ausnahme nach der KI-Leitlinie (D-03); sie stehen mit ihrer Frist unter der Ampel."
ampel_fachanwendungen: "KI in Anlagen und Fachanwendungen ({systeme}) bedienen nur die dafür eingewiesenen Personen; sie sind keine Werkzeuge im Sinne dieser Ampel, es gelten die Auflagen im KI-Inventar (D-10)."
ampel_auflagen: "Auflagen der Werkzeuge:"
ampel_ausnahmen: "Befristete Ausnahmen nach der KI-Leitlinie (D-03), nur für den genannten Zweck:"
datenklassen_isms: "Die Datenklassen sind die Klassen der Informationsklassifizierung unseres ISMS: **öffentlich** (für alle bestimmt), **intern** (nur für Mitarbeitende), **vertraulich** (nur für einen bestimmten Kreis, z. B. Kunden-, Personal- und Konstruktionsdaten) und **streng vertraulich** (grosser Schaden bei Bekanntwerden). Im Zweifel gilt die höhere Klasse."
datenklassen: "Datenklassen: **öffentlich** (für alle bestimmt), **intern** (nur für Mitarbeitende), **vertraulich** (nur für einen bestimmten Kreis, z. B. Kunden-, Personal- und Konstruktionsdaten) und **streng vertraulich** (grosser Schaden bei Bekanntwerden). Im Zweifel gilt die höhere Klasse."
