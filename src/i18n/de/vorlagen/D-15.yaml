  gruen: "**Grün:** erlaubt"
  gruen_platzhalter: freigegebene Werkzeuge aus D-10
  gruen_daten: "öffentliche und interne Informationen; vertrauliche Daten und Personendaten nur, wo das KI-Inventar es erlaubt"
  gelb: "**Gelb:** mit Auflagen"
  gelb_platzhalter: Werkzeuge mit Auflagen aus D-10
  gelb_daten: "nur für den festgelegten Zweck und mit den Auflagen aus dem KI-Inventar"
  rot: "**Rot:** verboten"
  rot_platzhalter: untersagte Werkzeuge aus D-10
