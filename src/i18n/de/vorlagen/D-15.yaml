# D-15 Richtlinie zur verantwortungsvollen KI-Nutzung
hinweis_umfang: "Höchstens zwei Seiten, verständlich für alle. Tragen Sie die Werkzeuge aus dem KI-Inventar (D-10) ein und verweisen Sie auf Ihre Datenklassen. Lassen Sie den Empfang bestätigen (D-17)."
einleitung: "Diese Richtlinie gilt für alle Mitarbeitenden und alle, die für [[Firmenname]] arbeiten, wenn sie KI-Werkzeuge nutzen, z. B. Chatbots, Assistenten in Office-Programmen, Übersetzer sowie Bild- und Codegeneratoren."
einleitung_firma: "Diese Richtlinie gilt für alle Mitarbeitenden und alle, die für {firma} arbeiten, wenn sie KI-Werkzeuge nutzen, z. B. Chatbots, Assistenten in Office-Programmen, Übersetzer sowie Bild- und Codegeneratoren."
hinweis_eb: "Nehmen Sie die Abschnitte 1 bis 6 in Ihre bestehende Richtlinie zur akzeptablen Nutzung auf. Meldung, Schulung und Folgen bei Verstössen regelt diese bereits; ergänzen Sie dort nur KI als Thema."
einleitung_eb: "Die folgenden Regeln ergänzen unsere Richtlinie zur akzeptablen Nutzung von Informatikmitteln um den Einsatz von KI-Werkzeugen."
# Firmendokument: ergänztes Dokument mit Version (DokumentEintrag.aufgenommenIn)
