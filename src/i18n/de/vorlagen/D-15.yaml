  rot_werkzeuge_ohne: "alle Werkzeuge, die nicht freigegeben sind: private Konten, Gratisdienste und Werkzeuge in Prüfung"
  rot_daten: "keine Firmen-, Kunden- oder Personendaten"
  mit_klasse: "{name} (Daten bis «{klasse}»)"
  rot_ausser_ausnahmen: "; ausgenommen sind nur die befristeten Ausnahmen unter der Ampel"
eingabe_liste:
  - "Passwörter, Zugangsdaten und Schlüssel"
  - "Gesundheitsdaten und andere besonders schützenswerte Personendaten"
  - "Unterlagen von Kunden und Partnern, deren Weitergabe ein Vertrag ausschliesst, z. B. Zeichnungen unter Geheimhaltung"
  - "exportkontrollierte Daten und weitere Daten, die wir als streng vertraulich einstufen"
verboten_liste:
  - "Entscheide über Menschen ohne menschliche Prüfung, z. B. über Bewerbungen, Leistung oder Kredite"
  - "Überwachung oder Bewertung von Leistung oder Verhalten einzelner Mitarbeitender"
  - "Täuschung, z. B. gefälschte Bilder, Stimmen oder Aussagen echter Personen"
  - "Umgehung von Sicherheitsvorgaben oder Zwecke ausserhalb der Freigabe"
pruefen_liste:
  - "Wer ein Ergebnis verwendet oder weitergibt, bleibt dafür verantwortlich."
  - "Fakten, Zahlen, Zitate, Quellen, Übersetzungen und Code werden vor der Verwendung geprüft."
  - "Bei Ergebnissen, die Kunden, Verträge, Sicherheit oder Personen betreffen, prüft immer ein Mensch mit dem nötigen Fachwissen."
kennzeichnung_text: "Inhalte, die weitgehend von KI stammen, kennzeichnen wir, wenn andere sonst einen menschlichen Urheber annehmen würden, z. B. veröffentlichte Texte und Bilder."
urheberrecht_text: "Fremde Werke laden wir nur hoch, wenn wir sie dafür nutzen dürfen. KI-Ergebnisse, die erkennbar fremde Texte, Bilder, Marken oder Code übernehmen, verwenden wir nicht. Geschäftsgeheimnisse bleiben auch in KI-Werkzeugen vertraulich."
neu_text: "Ein neues Werkzeug oder eine neue Nutzung beantragen Mitarbeitende bei der {{fakt:freigabe.einfuehren}} ({verantwortlich}); sie entscheidet bei tiefem Risiko allein über die Freigabe, bei mittlerem Risiko zusammen mit der Eignerin oder dem Eigner des Systems; bei hohem Risiko oder nach voller Folgenabschätzung entscheidet die {{fakt:freigabe.einfuehren-hoch}} (D-12, Abschnitt 5). Freigegeben wird ein Werkzeug nur, wenn es die Freigabekriterien unten erfüllt, auch ohne vertiefte Prüfung. Bis zum Entscheid gilt Rot."
# Firmendokument mit Entscheidungsrechten (D-04 Anlage A): Stellen je Stufe aus dem Projekt (N7)
neu_text_firma: "Ein neues Werkzeug oder eine neue Nutzung beantragen Mitarbeitende bei der {{fakt:freigabe.einfuehren}} ({verantwortlich}). Über die Freigabe entscheidet nach D-12, Abschnitt 5, bei tiefem Risiko: {tief}; bei mittlerem Risiko: {mittel}; bei hohem Risiko oder nach voller Folgenabschätzung: {hoch}. Freigegeben wird ein Werkzeug nur, wenn es die Freigabekriterien unten erfüllt, auch ohne vertiefte Prüfung. Bis zum Entscheid gilt Rot."
neu_schritte:
  - "**Antrag:** Werkzeug, Zweck, Nutzende, Daten und Bezug zu den Grundsätzen der KI-Leitlinie (D-03) nennen, dazu die geprüfte Lösung ohne KI und warum sie nicht genügt."
  - "**Freigabekriterien:** Lieferant und Vertrag geprüft (D-16), erlaubte Datenklassen festgelegt (D-13), Kurzprüfung der Folgen gemacht (D-08), Risiken im Register erfasst (D-07) und Test mit eigenen Fällen bestanden (D-12, Abschnitt 4). Ab der Schwelle nach D-08 folgt eine volle Folgenabschätzung (D-09)."
  - "**Entscheid:** Grün, Gelb mit Auflagen oder Rot; Eintrag im KI-Inventar (D-10)."
  - "**Einführung:** Information und Schulung der Nutzenden (D-12, D-17)."
melden_text: "Falsche, unfaire oder auffällige Ergebnisse, versehentlich eingegebene vertrauliche Daten und vermutete Missbräuche melden Mitarbeitende sofort über den Meldeweg nach D-04 an die Meldestelle: {meldestelle}. Wer in guten Treuen meldet, hat keine Nachteile."
schulung_text: "Vor der ersten Nutzung besuchen Mitarbeitende die Einführung, danach jährlich eine Auffrischung (D-17). Verstösse behandeln wir wie andere Verstösse gegen interne Regeln, bis hin zur Sperrung des Zugangs und arbeitsrechtlichen Massnahmen. Fragen beantwortet {verantwortlich}."
schluss_eb: "Für Meldungen, Schulung und Folgen bei Verstössen gilt die bestehende Richtlinie. KI-Probleme melden Mitarbeitende über den Meldeweg nach D-04 an die Meldestelle: {meldestelle}. Fragen beantwortet {verantwortlich}."
# Merksätze und Regeln für KI-Assistenten, Agenten und Erweiterungen
assistenten_merksaetze: "**Merksätze:** Was heute eingegeben wird, kann morgen Trainingsmaterial sein. Dokumente, Webseiten und E-Mails können versteckte Anweisungen an die KI enthalten. KI handelt nur nach Bestätigung durch eine Person."
assistenten_regeln:
  - "Erweiterungen, Konnektoren, eigene Assistenten, Agenten und Browser-Erweiterungen nur nutzen, wenn sie im KI-Inventar (D-10) freigegeben sind."
  - "KI-Assistenten senden, löschen, bestellen oder ändern nichts, bevor die Person die Aktion geprüft und bestätigt hat."
  - "Fremde Inhalte (Webseiten, E-Mails unbekannter Absender, Anhänge) nicht von einem Assistenten verarbeiten lassen, der zugleich auf vertrauliche Daten zugreift, ausser das Werkzeug ist dafür freigegeben. Auffälliges Verhalten wie unerwartete Links, Fragen nach Zugangsdaten oder plötzliche Themenwechsel melden."
  - "Von KI erzeugte Skripte, Makros, Formeln und erzeugten Code vor der Ausführung prüfen; vorgeschlagene Bibliotheken auf Existenz und Herkunft prüfen. Keine Passwörter oder internen Details in Anweisungen eigener Assistenten."
