# D-16 Lieferanten und eingekaufte KI
modul_praefix_leer: "Nur mit Modul EU AI Act:"
modul_praefix: "EU AI Act:"
modul_hinweis: "Mit Prüffrage PF-10 klären wir, ob der Lieferant Anbieter eines KI-Systems oder eines KI-Modells mit allgemeinem Verwendungszweck ist. Seine Pflichten und unsere Pflichten als Betreiber zeigen E-03 und E-05."
eb_titel: Ergänzungsblatt zum Lieferantenmanagement
eb_einleitung: "Diese Mappe ergänzt unser bestehendes Verfahren für Lieferanten um eingekaufte KI. Die folgenden Punkte gelten zusätzlich im Verfahren und im Lieferantenregister; alles Übrige gilt unverändert."
eb_abschnitte:
  - "**KI-Lieferanten kennzeichnen:** im Lieferantenregister die Spalten «KI-Systeme», «Prüfstatus» und «Nächste Prüfung» aus dem Blatt «Lieferanten» ergänzen."
  - "**Prüfpunkte:** die Prüffragen in die Bewertung vor dem Einkauf aufnehmen."
  - "**Vertragsklauseln:** die Checkliste in die Vertragsprüfung aufnehmen."
  - "**Verantwortung aufteilen:** je KI-System festhalten, was beim Lieferanten, bei uns und beim Kunden liegt (A.10.2)."
  - "**Überwachung:** KI-Lieferanten mindestens jährlich und bei Anlass neu prüfen (Regel im Blatt «Lieferanten»)."
blaetter:
  lieferanten: Lieferanten
  fragen: Prüffragen
  klauseln: Vertragsklauseln
  verantwortung: Verantwortung
  dienste: Dienste
titel_lieferanten: "Lieferanten von KI-Systemen und KI-Leistungen"
titel_lieferanten_eb: "KI-Lieferanten (Ergänzung zum Lieferantenregister)"
titel_fragen: "Prüffragen vor dem Einkauf und bei der Neubeurteilung"
titel_klauseln: "Checkliste Vertragsklauseln"
titel_verantwortung: "Aufteilung der Verantwortung (A.10.2)"
titel_dienste: "Dienste, Tarife und Funktionen"
hinweise_dienste:
  - "Eine Zeile je eingekauftem Dienst oder Werkzeug aus dem KI-Inventar (D-10). Die Zusagen zu Training, Aufbewahrung und Vertrag hängen am Tarif, nicht am Anbieter: Derselbe Anbieter hat Gratis-, Privat-, Business- und Unternehmensangebote mit verschiedenen Bedingungen. Nutzt eine Firma zwei Tarife desselben Anbieters, führt sie zwei Zeilen und beantwortet die Prüffragen für den Tarif, den sie freigibt."
  - "Vertrauliche oder strengere Daten gehören nicht in einen Gratis- oder Privattarif; dafür fehlen Vertrag zur Auftragsbearbeitung und Zusagen zum Training."
  - "Funktionen: Halten Sie je Funktion fest, ob sie ein- oder ausgeschaltet ist, z. B. Websuche, Codeausführung, Datei-Upload, Gedächtnis, Konnektoren, eigene Assistenten und Agenten, Teilen nach aussen. Nicht festgehaltene Funktionen gelten als ungeklärt, nicht als ausgeschaltet."
  - "Quelle der Angaben: Fundstelle beim Hersteller oder Anbieter (Vertragsbedingungen, Systemkarte, Verwaltungskonsole) mit Abrufdatum. Angaben aus Sammlungen Dritter ersetzen die Herstellerquelle nicht."
spalten_dienste: [ID, Dienst oder Werkzeug, Lieferant, Tarif oder Vertragsart, Höchste erlaubte Datenklasse, "Funktionen (ein, aus)", Abkündigung durch den Anbieter, "Quelle der Angaben, abgerufen am"]
hinweise_lieferanten:
  - "«Lieferant» heisst, wer Ihnen das System liefert; «Anbieter» ist die Rolle nach AI Act. Beides kann dieselbe Firma sein."
  - "Eine Zeile je Lieferant, der KI liefert oder in seiner Leistung KI einsetzt, auch eingebettete KI in Software. Die KI-Systeme stehen im KI-Inventar (D-10)."
regel_ueberwachung: "Regel: Wir prüfen KI-Lieferanten vor dem Einkauf, danach mindestens jährlich und zusätzlich nach einem Vorfall, einem Modellwechsel, neuen Unterauftragnehmern oder geänderten Vertragsbedingungen."
hinweise_fragen:
  - "Beantworten Sie die Fragen aus den Unterlagen des Lieferanten oder durch Rückfrage. «ja» bedeutet: erfüllt. Ein «nein» führt zu einer Auflage, einem Risiko in D-07 oder zur Ablehnung."
  - "PF-16 bis PF-21 betreffen vor allem generative KI (Assistenten, Chatbots, Plattformen mit Abrechnung nach Verbrauch). Bei einem öffentlichen Chatbot auf einer Cloud-Plattform sind PF-16, PF-19 und PF-21 am wichtigsten."
  - "PF-22, PF-23, PF-25 und PF-26 betreffen handelnde KI (Agenten, Konnektoren, Gedächtnis); ohne solche Funktionen genügt «ja» mit dem Vermerk «nicht genutzt». PF-24 und PF-27 gelten für jeden Dienst."
  - "Warnsignale bei der Prüfung: dürftige oder veraltete Dokumentation, Änderungen ohne Ankündigung, keine Angaben zur Sicherheit, unklare oder wechselnde Unterauftragnehmer. Halten Sie solche Beobachtungen in der Bemerkung fest und prüfen Sie ein Risiko in D-07."
hinweise_klauseln:
  - "Prüfen Sie je Lieferant, ob der Vertrag die Klausel enthält. Bei Standardverträgen grosser Anbieter genügt die Fundstelle in den Vertragsbedingungen."
hinweise_verantwortung:
  - "Die Vorschläge passen zu einem typischen SaaS-Dienst. Passen Sie die Aufteilung je KI-System an; kopieren Sie das Blatt, wenn sie stark abweicht. Die Spalte «Kunde» betrifft nur KI in Leistungen für Kunden."
