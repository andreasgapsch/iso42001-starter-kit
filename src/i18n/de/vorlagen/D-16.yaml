# Firmendokument: Übernahme als Nachweis statt Anweisung
eb_einleitung_firma: "Diese Mappe ergänzt unser bestehendes Verfahren für Lieferanten um eingekaufte KI. Die folgenden Punkte sind im Verfahren und im Lieferantenregister umgesetzt; alles Übrige gilt unverändert."
eb_abschnitte_firma:
  - "**KI-Lieferanten gekennzeichnet:** Das Lieferantenregister führt die Spalten «KI-Systeme», «Prüfstatus» und «Nächste Prüfung» aus dem Blatt «Lieferanten»."
  - "**Prüfpunkte:** Die Prüffragen sind Teil der Bewertung vor dem Einkauf."
  - "**Vertragsklauseln:** Die Checkliste ist Teil der Vertragsprüfung."
  - "**Verantwortung aufgeteilt:** Je KI-System ist festgehalten, was beim Lieferanten, bei uns und beim Kunden liegt (A.10.2)."
  - "**Überwachung:** KI-Lieferanten prüfen wir mindestens jährlich und bei Anlass neu (Regel im Blatt «Lieferanten»)."
eb_aufgenommen: "Aufgenommen in: {dokument}."
