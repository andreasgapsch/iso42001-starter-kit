# Firmendokument: Übernahme als Nachweis statt Anweisung
eb_einleitung_firma: "Diese Mappe ergänzt unser bestehendes Programm für Kompetenz, Sensibilisierung und Kommunikation aus dem ISMS um KI. Die folgenden Punkte sind umgesetzt; alles Übrige gilt unverändert."
eb_abschnitte_firma:
  - "**KI-Kompetenzen:** Die Rollen aus dem Blatt «Kompetenzbedarf» sind in der bestehenden Kompetenzmatrix geführt."
  - "**Bewusstsein für KI:** Die Themen aus dem Blatt «Bewusstsein» sind Teil des Bewusstseinsprogramms."
  - "**Kommunikation zu KI:** Die Einträge aus dem Blatt «Kommunikationsplan» stehen im bestehenden Kommunikationsplan, intern und extern."
  - "**Nachweise:** KI-Schulungen stehen im bestehenden Schulungsnachweis mit dem Thema «KI»; die Wirksamkeit prüfen wir gleich wie bei anderen Schulungen."
eb_aufgenommen: "Aufgenommen in: {dokument}."
modul_hinweis_eb: "Art. 4 verlangt, dass Anbieter und Betreiber Massnahmen ergreifen, um die KI-Kompetenz ihrer Mitarbeitenden und weiterer Personen zu unterstützen, die in ihrem Auftrag mit KI-Systemen arbeiten; ein garantiertes Niveau verlangt er nicht. Konzept und Nachweise stehen in E-04; das Blatt «Kompetenzbedarf» und der bestehende Schulungsnachweis dienen als Nachweis."
