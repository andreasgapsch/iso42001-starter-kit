# D-17 Kompetenz, Bewusstsein und Kommunikation
modul_praefix_leer: "Nur mit Modul EU AI Act:"
modul_praefix: "EU AI Act:"
modul_hinweis: "Art. 4 verlangt, dass Anbieter und Betreiber Massnahmen ergreifen, um die KI-Kompetenz ihrer Mitarbeitenden und weiterer Personen zu unterstützen, die in ihrem Auftrag mit KI-Systemen arbeiten; ein garantiertes Niveau verlangt er nicht. Konzept und Nachweise stehen in E-04; die Blätter «Kompetenzbedarf» und «Schulungen» dienen als Nachweis."
eb_titel: Ergänzungsblatt zu Kompetenz, Bewusstsein und Kommunikation
eb_einleitung: "Diese Mappe ergänzt unser bestehendes Programm für Kompetenz, Sensibilisierung und Kommunikation aus dem ISMS um KI. Die folgenden Punkte kommen hinzu; alles Übrige gilt unverändert."
eb_abschnitte:
  - "**KI-Kompetenzen:** die Rollen aus dem Blatt «Kompetenzbedarf» in die bestehende Kompetenzmatrix übernehmen."
  - "**Bewusstsein für KI:** die Themen aus dem Blatt «Bewusstsein» in das Bewusstseinsprogramm aufnehmen."
  - "**Kommunikation zu KI:** die Einträge aus dem Blatt «Kommunikationsplan» in den bestehenden Kommunikationsplan aufnehmen, intern und extern."
  - "**Nachweise:** KI-Schulungen im bestehenden Schulungsnachweis mit dem Thema «KI» erfassen und die Wirksamkeit gleich wie bei anderen Schulungen prüfen."
