hinweise_kompetenz:
  - "Eine Zeile je Rolle mit KI-Aufgaben. Die Vorschläge sind ein Ausgangspunkt: streichen, ergänzen, Personen eintragen."
  - "«Ist» zeigt, ob die Personen die Kompetenz heute haben. Wo nicht, planen Sie eine Massnahme und prüfen später, ob sie gewirkt hat, z. B. durch Gespräch, Test oder Stichprobe der Arbeit."
hinweise_schulungen:
  - "Eine Zeile je Schulung, Einweisung oder Information. Als Nachweis genügen Teilnahmeliste, Bestätigung im E-Learning oder Protokoll."
hinweise_bewusstsein:
  - "Alle Mitarbeitenden kennen diese Themen. Halten Sie fest, über welchen Kanal und wann Sie informiert haben."
hinweise_kommunikation:
  - "Was wird wann, durch wen, mit wem und wie kommuniziert, intern und extern. Mindestens ein externer Eintrag gehört dazu, z. B. Kundeninformation oder Meldekanal."
