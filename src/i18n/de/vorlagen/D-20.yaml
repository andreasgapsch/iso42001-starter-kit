titel_programm: "Auditprogramm über den Zertifizierungszyklus"
titel_plan: "Auditplan für ein einzelnes Audit"
titel_checkliste: "Checkliste ISO/IEC 42001: Abschnitte 4 bis 10 und Controls aus Anhang A"
titel_feststellungen: "Feststellungen aus internen Audits"
hinweise_programm:
  - "Planen Sie die Audits so, dass innerhalb von drei Jahren alle Normabschnitte und alle anwendbaren Controls mindestens einmal geprüft werden. Im ersten Jahr auditieren Sie das ganze AIMS, und zwar vor dem Stage-1-Audit, damit Sie Feststellungen noch bearbeiten können. Nennen Sie im Umfang auch die Prozesse aus D-27."
  - "Erstes Jahr: 9.3 und A.2.4 lassen sich erst nach der ersten Managementbewertung prüfen, die Bewertung wiederum braucht das Audit. Planen Sie deshalb vor Stage 1 ein kurzes Ergänzungsaudit nach der Managementbewertung, das diese Punkte und was bis dahin neu dazukam (etwa D-27) nachprüft."
  - "Prüfen Sie Abschnitte 9.2, 9.3 und 10.2 jedes Jahr, ebenso KI-Systeme mit hohem Risiko oder grossen Änderungen. Die Vorschlagszeilen zeigen eine mögliche Verteilung; passen Sie sie an Ihre Risiken an."
  - "Auditoren prüfen nicht ihre eigene Arbeit. Im KMU bewährt sich ein externer Auditor oder ein gegenseitiges Audit mit einer Partnerfirma. Halten Sie in der Spalte «Unabhängigkeit» fest, wie Sie das sichergestellt haben."
  - "Den Auditbericht bilden die Blätter Checkliste, Stichproben und Feststellungen mit der Spalte «Ergebnis und Bericht» im Programm; ein eigenes Berichtsdokument, etwa im Format des ISMS, nennt Ziel, Umfang, Kriterien, Feststellungen und Empfänger und wird im Programm verlinkt."
  - "Mit ISMS: Führen Sie ein gemeinsames Programm. Abschnitte 4 bis 10 prüfen Sie für beide Normen in denselben Gesprächen, die Controls aus Anhang A der ISO/IEC 42001 mit der Checkliste in diesem Dokument."
hinweise_programm_eb:
  - "Ergänzen Sie Ihr bestehendes ISMS-Auditprogramm um die Zeilen oder Spalten für das AIMS. Ein gemeinsames Programm für beide Normen genügt."
  - "Innerhalb des Zyklus von drei Jahren werden alle Abschnitte und anwendbaren Controls der ISO/IEC 42001 mindestens einmal geprüft. Vor der ersten Zertifizierung wird das AIMS einmal vollständig auditiert."
  - "Wer das AIMS auditiert, braucht Grundkenntnisse zu KI und zur ISO/IEC 42001 und prüft nicht die eigene Arbeit."
hinweise_programm_firma:
  - "Interne Audits finden jährlich statt. Innerhalb des Zertifizierungszyklus von drei Jahren werden alle Normabschnitte und alle anwendbaren Controls mindestens einmal geprüft; 9.2, 9.3 und 10.2 jedes Jahr."
hinweise_programm_firma_leer:
  - "Es ist noch kein Audit geplant. Die Zeilen unten sind ein Vorschlag für den Zyklus von drei Jahren."
hinweise_plan:
  - "Ein Plan je Audit. Senden Sie ihn den Beteiligten rechtzeitig, damit sie Nachweise bereitlegen können."
  - "Wählen Sie für den Praxisteil ein bis zwei KI-Systeme als Stichprobe, darunter möglichst eines mit hohem Risiko. Abschnitt 9.2 prüft eine andere Person als die, die das Auditprogramm führt."
hinweise_checkliste:
  - "Die Prüffragen sind Anregungen in eigenen Worten. Den Anforderungstext lesen Sie in Ihrer Normausgabe nach."
  - "Notieren Sie in «Nachweis gesehen» Dokument, Version oder Aufzeichnung und in «Stichprobe» das geprüfte Beispiel (z. B. KI-System, Datum, Person). Ohne gesehenen Nachweis gibt es kein «konform»."
  - "Ergebnis: «NK schwer», wenn eine Anforderung gar nicht umgesetzt ist oder die Wirksamkeit des Systems in Frage steht. «NK leicht» bei einer einzelnen Lücke in einem sonst wirksamen Ablauf. «Beobachtung», wenn noch keine Abweichung vorliegt, aber eine droht."
  - "Jede Nichtkonformität und Beobachtung erhält eine Feststellung-ID und wird im Blatt «Feststellungen» beschrieben."
hinweise_checkliste_firma:
  - "Die Spalte «SoA» zeigt den Stand der Erklärung zur Anwendbarkeit (D-11). Bei nicht anwendbaren Controls wird die Begründung geprüft."
hinweis_checkliste_audit: "Nachweise, Stichproben und Ergebnisse des internen Audits {audit}; die Feststellungen stehen im Blatt «Feststellungen». «Nicht prüfbar, geplant» heisst: zum Auditzeitpunkt noch nicht durchgeführt."
hinweis_soa_stand: "Die Spalte «SoA» zeigt den Stand der Erklärung zur Anwendbarkeit zur Zeit des Audits {audit}, nicht den aktuellen."
# Zusatz-Controls der Erklärung zur Anwendbarkeit (EU AI Act, eigene Controls) in der Checkliste
frage_zusatz: "Ist das Control wie in der Erklärung zur Anwendbarkeit beschrieben umgesetzt und belegt?"
dokumente_zusatz: D-11
spalte_dokumente: Dokumente
ablauf: Ablauf
hinweise_feststellungen:
  - "Beschreiben Sie jede Feststellung so, dass sie ohne Auditor verständlich ist: Was wurde verlangt, was wurde gesehen, wo liegt die Abweichung."
  - "Übertragen Sie jede Feststellung in das Register D-22: Nichtkonformitäten und Beobachtungen in das Blatt «Nichtkonformitäten», Verbesserungen in das Blatt «Verbesserungen». Dort folgen Ursachenanalyse, Korrekturmassnahme und Wirksamkeitsprüfung."
ausbau: "Bei vielen KI-Systemen oder Standorten: Legen Sie die Audithäufigkeit je KI-System nach Risiko fest (z. B. hohes Risiko jährlich, übrige im Zyklus) und führen Sie dafür eine eigene Spalte im Auditprogramm."
