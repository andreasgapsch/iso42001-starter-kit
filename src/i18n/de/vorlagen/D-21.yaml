ausbau: "Bei vielen KI-Systemen: Legen Sie eine Übersicht je System bei (Status, Risiken, Folgenabschätzung, Vorfälle, Kennzahlen). So bleibt die Sitzung kurz, und die Unterlagen belegen die Bewertung."
eb_einleitung: "Dieses Ergänzungsblatt nennt die Punkte, die Sie in die bestehende Managementbewertung des ISMS aufnehmen. Die Pflichteingaben sind in beiden Normen gleich aufgebaut; behandeln Sie sie in einer Sitzung für beide Systeme und ergänzen Sie die KI-Sicht."
eb_einleitung_firma: "Die Managementbewertung von {firma} behandelt ISMS und AIMS in einer gemeinsamen Sitzung. Dieses Blatt nennt die zusätzlichen Punkte für das AIMS."
