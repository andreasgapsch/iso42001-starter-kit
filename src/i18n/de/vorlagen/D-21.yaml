# D-21 Managementbewertung
hinweis_umfang: "Die Geschäftsleitung bewertet das AIMS mindestens jährlich, die erste Bewertung vor dem Stage-1-Audit und nach dem ersten internen Audit. Häufiger ist nicht nötig; ausserordentlich bewerten Sie bei grossen Änderungen, etwa einem neuen KI-System mit hohem Risiko. Bereiten Sie je Traktandum eine kurze Übersicht vor, damit die Sitzung höchstens zwei Stunden dauert."
hinweis_isms: "Mit ISMS: Führen Sie eine gemeinsame Sitzung mit einem Protokoll für beide Normen. Die Punkte mit «ISMS» behandeln Sie nur für das ISMS, alle übrigen für beide Systeme."
hinweis_protokoll: "Halten Sie in der letzten Spalte das Ergebnis fest: kurz, was vorgelegt wurde, wie die Geschäftsleitung es bewertet und ob ein Entscheid nötig ist. Ein Auditor sucht zu jeder Pflichteingabe einen Eintrag."
hinweis_entscheide: "Ohne Entscheide ist eine Managementbewertung nicht vollständig. Halten Sie auch fest, wenn keine Änderung nötig ist, und begründen Sie dies kurz."
einleitung: "Die Geschäftsleitung von [[Firmenname]] bewertet mit diesem Dokument, ob das KI-Managementsystem (AIMS) geeignet, angemessen und wirksam ist, und entscheidet über Verbesserungen und Änderungen."
einleitung_firma: "Die Geschäftsleitung von {firma} bewertet mit diesem Dokument, ob das KI-Managementsystem (AIMS) geeignet, angemessen und wirksam ist, und entscheidet über Verbesserungen und Änderungen."
einleitung_isms: "Die Bewertung findet gemeinsam mit der Managementbewertung des ISMS statt."
