rhythmus_text: "Die Managementbewertung findet jährlich statt, im Zertifizierungszyklus jeweils nach dem internen Audit und vor dem externen Audit. Bei grossen Änderungen beruft die Geschäftsleitung eine ausserordentliche Bewertung ein. Nächste ordentliche Bewertung: {naechste}."
