titel_meldungen: "Meldungen, Rückmeldungen und Einsprüche"
hinweise_meldungen:
  - "Erfassen Sie jede Meldung von Mitarbeitenden (Meldeweg, D-04) und jede Rückmeldung oder jeden Einspruch von Kunden und Betroffenen (Meldekanal, D-14) mit Eingang, Eingangsbestätigung und Abschluss. So lassen sich Anzahl und Reaktionszeit messen (D-05)."
  - "Ergibt eine Meldung eine Abweichung, einen Vorfall oder einen Beinahe-Vorfall, erfassen Sie sie zusätzlich im Blatt «Nichtkonformitäten» und nennen Sie die Feststellung im Ergebnis."
spalten_meldungen: [ID, Eingang, Art, Herkunft, Kanal, KI-System, Beschreibung, Bearbeitung, Bestätigt am, Tage bis Bestätigung, Erledigt am, Ergebnis und Antwort, Status]
hinweise_nk:
  - "Eine Nichtkonformität ist eine nicht erfüllte Anforderung: aus der Norm, aus eigenen Regeln, aus Gesetz oder Vertrag. Quellen sind Audits, die Managementbewertung, Vorfälle, Prüfungen und Meldungen."
  - "Gehen Sie in dieser Reihenfolge vor: sofort korrigieren und Folgen begrenzen, Ursache suchen (z. B. mit fünfmal «Warum?»), prüfen, ob es ähnliche Fälle gibt oder geben könnte, Korrekturmassnahme festlegen und umsetzen, nach einer festgelegten Frist die Wirksamkeit prüfen."
  - "Schliessen Sie einen Eintrag erst, wenn die Wirksamkeit belegt ist. Prüfen Sie bei KI-Bezug, ob Risikobeurteilung (D-07), Folgenabschätzung (D-09) oder Nutzungsregeln (D-15) anzupassen sind."
  - "Eigene «Vorbeugemassnahmen» führen Sie nicht. Mögliche künftige Abweichungen erfassen Sie als Risiko im Register D-07; dort werden sie bewertet und behandelt."
  - "Vorfälle und Beinahe-Vorfälle (Ereignisse ohne Schaden, die nur dank Glück oder rechtzeitigem Eingreifen glimpflich ausgingen) gehören ebenfalls hierher, damit Fehler, Vorfälle und Beinahe-Vorfälle an einem Ort gezählt werden. Die Spalte «Schwere» nutzt die vier Stufen aus D-14."
  - "Bei Vorfällen und Beinahe-Vorfällen halten Sie in «Entdeckt» und «Eingedämmt» Datum und Uhrzeit fest. Daraus rechnet die Kennzahl PR-19 die Stunden bis zur Eindämmung (D-05)."
  - "Spalte «Bereich»: ohne ISMS «AIMS». Kommt später ein ISMS dazu, führen Sie dasselbe Register für beide weiter."
hinweise_verbesserungen:
  - "Erfassen Sie hier Vorschläge, die das AIMS besser machen, ohne dass eine Anforderung verletzt ist: aus Audits (Beobachtungen), Meldungen, Kennzahlen, Lieferantenprüfungen oder von Mitarbeitenden."
  - "Geplante Änderungen am AIMS (ISO/IEC 42001, 6.3) führen Sie ebenfalls hier, mit Zweck, Folgen und Verantwortlichen (Regeln in D-26). Die Managementbewertung (D-21) priorisiert die Liste."
hinweise_zusatz:
  - "Mit ISMS führen Sie ein gemeinsames Register. Ergänzen Sie Ihr bestehendes Register um die folgenden Felder, damit KI-Themen auswertbar sind."
  - "Führt Ihr ISMS noch kein Verbesserungsregister, nutzen Sie das Blatt «Verbesserungen» für beide Systeme."
ausbau: "Werten Sie das Register jährlich für die Managementbewertung aus: Anzahl nach Einstufung, Schwere und Bereich, Beinahe-Vorfälle, Durchlaufzeit bis zur Schliessung, wiederkehrende Ursachen."
