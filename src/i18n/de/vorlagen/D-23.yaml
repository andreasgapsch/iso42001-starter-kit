# D-23 Integrationsmatrix ISO/IEC 27001 und 42001
hinweis_einschaetzung: "Die Zuordnungen in diesem Dokument sind eine fachliche Einschätzung, keine Aussage der Normen. Sie zeigen, wo Nachweise aus dem ISMS wiederverwendet werden können, und ersetzen keine Prüfung im Einzelfall."
normverweis_27001: "Anforderungstext siehe ISO/IEC 27001:2022, Abschnitte 4 bis 10 und Anhang A. Die Norm ist bei SNV, DIN oder ISO zu beziehen."
normverweis_27001_firma: "Bezug: ISO/IEC 27001:2022, Abschnitte 4 bis 10 und Anhang A."
blaetter:
  dokumente: Dokumente
  kapitel: Abschnitte 4 bis 10
  mapping: Control-Mapping
  katalog: Katalog 27001
titel_dokumente: "AIMS-Dokumente und ihr Gegenstück im ISMS"
titel_kapitel: "Abschnitte 4 bis 10: gemeinsam führen"
titel_mapping: "Zuordnung ISO/IEC 42001 Anhang A zu ISO/IEC 27001:2022 Anhang A"
titel_katalog: "ISO/IEC 27001:2022 Anhang A mit zugeordneten 42001-Controls"
hinweise_dokumente:
  - "«wiederverwendet»: Das ISMS-Dokument gilt auch für das AIMS, ergänzt durch ein Ergänzungsblatt. «erweitert»: Das ISMS-Dokument wird um KI-Inhalte ergänzt. «neu»: Für das AIMS ist ein eigenes Dokument nötig."
  - "Mit ISMS gilt für Dokumente mit «Ergänzungsblatt ja» das Blatt D-xx-EB statt eines eigenen Dokuments."
hinweise_kapitel:
  - "Die Abschnitte 4 bis 10 sind in beiden Normen gleich gegliedert. «ja» heisst: ein Prozess und ein Nachweis für beide Systeme. «teilweise» heisst: gemeinsamer Rahmen, KI-Inhalte ergänzen. «nein» heisst: nur im AIMS, ohne Gegenstück im ISMS."
hinweise_mapping:
  - "Stärke «hoch»: Der ISMS-Nachweis deckt das KI-Control weitgehend ab. «mittel»: Ablauf und Form lassen sich übernehmen, KI-Inhalte fehlen. «tief»: nur ein Anknüpfungspunkt."
  - "Für Sicherheitsbedrohungen gegen KI-Systeme selbst ist ISO/IEC 27090:2026 eine zusätzliche Quelle für Controls; das Kit ordnet sie hier nicht zu."
hinweise_mapping_firma:
  - "Die Spalte «In der SoA verknüpft» zeigt, ob die Erklärung zur Anwendbarkeit (D-11) das 27001-Control als wiederverwendeten Nachweis nennt."
hinweise_katalog:
  - "Kurzbezeichnungen in eigenen Worten, nicht die Titel der Norm. Der Anforderungstext steht in der Normausgabe."
