# Modul NIST AI RMF
nist_praefix_leer: "Nur mit Modul NIST AI RMF:"
nist_praefix: "NIST AI RMF:"
nist_verhaeltnis: "Das US-Rahmenwerk ist kein Recht und ändert weder die Rolle noch die Pflichten nach dem AI Act. Profil und Abdeckungsmatrix (N-01, N-02) sind ein freiwilliger Nachweis, vor allem gegenüber Kunden mit US-Bezug."
