# D-25 Zertifizierungsfahrplan
hinweis_umfang: "Dieser Leitfaden zeigt den Weg vom eingeführten AIMS bis zum Zertifikat. Er ersetzt nicht die Regeln Ihrer Zertifizierungsstelle; fragen Sie dort nach Ablauf, Fristen und Unterlagen."
einleitung: "Eine Zertifizierung nach ISO/IEC 42001 bestätigt durch eine unabhängige Stelle, dass das KI-Managementsystem die Norm erfüllt und wirkt. Geprüft wird nicht, ob ein einzelnes KI-System rechtskonform ist."
einleitung_firma: "Dieser Fahrplan zeigt, wie {firma} das KI-Managementsystem zertifizieren lässt: Stand der Voraussetzungen, gewählte Stelle, Ablauf, Umgang mit Feststellungen, Zyklus, Nachweise und Zeitplan. Die Zertifizierung bestätigt das Managementsystem, nicht die Rechtskonformität einzelner KI-Systeme."
