# Modul NIST AI RMF
nist_praefix_leer: "Nur mit Modul NIST AI RMF."
nist_aims: "das AIMS"
nist_aims_zertifiziert: "das zertifizierte AIMS"
nist_liste:
  - "**Keine Zertifizierung:** NIST zertifiziert nicht, und es gibt kein akkreditiertes Zertifikat nach dem AI RMF. Zutreffend ist «am NIST AI RMF ausgerichtet», nicht «NIST-zertifiziert»."
  - "**Nachweis gegenüber Kunden:** Fragen Kunden nach dem AI RMF, legen wir das Profil (N-01) und die Abdeckungsmatrix (N-02) vor: welche Subkategorien {aims} abdeckt und wie die Zusatz-Controls die übrigen schliessen."
  - "**Audit:** Die Zusatz-Controls RMF-xx stehen in der Erklärung zur Anwendbarkeit (D-11). Die Zertifizierungsstelle prüft sie wie andere zusätzliche Controls auf ihre Umsetzung, nicht auf Übereinstimmung mit dem AI RMF."
