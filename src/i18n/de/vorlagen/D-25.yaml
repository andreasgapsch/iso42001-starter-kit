stelle_liste:
  - "**Akkreditierung:** Wir wählen eine Stelle, die für ISO/IEC 42001 akkreditiert ist. Zertifizierungsstellen werden nach ISO/IEC 17021-1 akkreditiert und erfüllen für ISO/IEC 42001 zusätzlich die Anforderungen von ISO/IEC 42006. In der Schweiz akkreditiert die Schweizerische Akkreditierungsstelle (SAS), in Deutschland die DAkkS, in Österreich Akkreditierung Austria. Den Geltungsbereich der Akkreditierung prüfen wir im öffentlichen Verzeichnis."
  - "**Kompetenz:** ISO/IEC 42006 legt fest, welche Kompetenz Stellen und Auditteams für KI-Managementsysteme brauchen. Wir fragen nach der KI-Erfahrung des vorgesehenen Teams und nach Kenntnissen unserer Branche."
  - "**Offerten vergleichen:** Wir holen zwei bis drei Offerten ein und vergleichen Audittage für Stage 1, Stage 2 und Überwachung, Reisekosten, Anteil remote, Sprache, Termine und die Kosten über den ganzen Zyklus."
  - "**Mit ISMS:** Ein kombiniertes Audit mit ISO/IEC 27001 bei derselben Stelle spart Audittage, weil Abschnitte 4 bis 10 gemeinsam geprüft werden."
# Firmendokument mit gewählter Stelle (statt Offerten und «Mit ISMS»)
stelle_titel_gewaehlt: Zertifizierungsstelle
stelle_gewaehlt: "**Gewählte Stelle:** {stelle}."
stelle_akkreditiert: "**Akkreditierung:** Die Stelle ist für ISO/IEC 42001 akkreditiert. Zertifizierungsstellen werden nach ISO/IEC 17021-1 akkreditiert und erfüllen für ISO/IEC 42001 zusätzlich die Anforderungen von ISO/IEC 42006; in der Schweiz akkreditiert die Schweizerische Akkreditierungsstelle (SAS). Den Geltungsbereich der Akkreditierung haben wir im öffentlichen Verzeichnis geprüft."
stelle_kombiniert: "**Kombiniertes Audit:** Die Stelle auditiert ISO/IEC 27001 und ISO/IEC 42001 gemeinsam; Abschnitte 4 bis 10 werden zusammen geprüft."
stelle_isms_firma: "**Kombiniertes Audit:** Ein kombiniertes Audit mit ISO/IEC 27001 bei derselben Stelle spart Audittage, weil Abschnitte 4 bis 10 gemeinsam geprüft werden."
stage1_titel: "Stage 1: Dokumentprüfung und Bereitschaft"
stage1_liste:
  - "Die Stelle prüft Geltungsbereich, Leitlinie, Risiko- und Folgenabschätzungsverfahren, Erklärung zur Anwendbarkeit, internes Audit und Managementbewertung."
  - "Sie klärt, ob das AIMS bereit ist, und plant Stage 2. Offene Punkte aus dem Bericht beheben wir vor Stage 2; den Abstand legt die Stelle fest."
stage2_titel: "Stage 2: Wirksamkeit in der Praxis"
stage2_liste:
  - "Die Stelle prüft, ob das AIMS so gelebt wird, wie es beschrieben ist: Interviews mit Geschäftsleitung, AIMS-Verantwortung, Eigner/innen der Systeme und Nutzenden."
  - "Sie zieht Stichproben von KI-Systemen und verfolgt sie durch: Eintrag im Inventar, Risikobeurteilung, Folgenabschätzung, Freigabe, Überwachung, Lieferant, Aufzeichnungen."
feststellungen_liste:
  - "**Schwere Nichtkonformität:** Eine Anforderung ist nicht umgesetzt oder das System wirkt in einem Bereich nicht. Das Zertifikat wird erst erteilt, wenn die Behebung nachgewiesen ist."
  - "**Leichte Nichtkonformität:** Eine einzelne Lücke in einem sonst wirksamen Ablauf. Meist genügt ein Massnahmenplan; die Umsetzung prüft die Stelle im nächsten Audit."
  - "**Fristen und Form** des Massnahmenplans legt die Stelle fest. Jede Feststellung erfassen wir in D-22 mit Ursache, Korrekturmassnahme und Wirksamkeitsprüfung."
zyklus_text: "Das Zertifikat gilt drei Jahre. In den beiden Folgejahren findet je ein Überwachungsaudit statt, das einen Teil des AIMS prüft. Vor Ablauf folgt die Rezertifizierung. Bewährt hat sich jedes Jahr dieselbe Reihenfolge: internes Audit, Managementbewertung, externes Audit."
nachweise_text: "Je Abschnitt und für wichtige Controls: welcher Nachweis erwartet wird und in welchem Dokument er entsteht."
nachweise_kopf: [Nr., Thema, Nachweis im AIMS]
controls_kopf: [Control, Thema, Was der Auditor sucht]
wichtige_controls: [A.2.2, A.3.3, A.4.2, A.5.3, A.6.2.6, A.6.2.8, A.8.4, A.9.2, A.10.3]
haeufig_hinweis: "Praxisbeobachtung aus veröffentlichten Erfahrungsberichten von Beratungs- und Zertifizierungsunternehmen. Die Reihenfolge ist keine Statistik."
haeufig_kopf: [Feststellung, So vermeiden wir sie]
haeufig:
  - ["KI-Inventar und Geltungsbereich unvollständig, besonders bei KI in eingekaufter Software und Cloud-Diensten", "Inventar mit Fragebogen an alle Teams erheben, Schatten-KI suchen, eingebettete KI-Funktionen aufnehmen (D-10)"]
  - ["Risikobeurteilung allgemein statt je System, ohne Annahme der Restrisiken und ohne Auslöser für eine Neubeurteilung", "Risiken je KI-System bewerten, Restrisiken mit Name und Datum annehmen, Auslöser in D-06 festlegen (D-07)"]
  - ["Folgenabschätzung fehlt oder ist lückenhaft; Ausschlüsse in der Erklärung zur Anwendbarkeit ohne Begründung", "Kurzprüfung für jedes System, volle Folgenabschätzung ab Schwelle (D-09); jeden Ausschluss begründen (D-11)"]
  - ["Lücke zwischen Richtlinie und Praxis: keine Nachweise zu Tests, Protokollen, Freigaben oder menschlicher Aufsicht", "Je Control einen Nachweis mit Ablageort benennen und vor dem Audit Stichproben selbst ziehen (D-11, D-12)"]
  - ["Schwaches internes Audit, Managementbewertung ohne alle Pflichteingaben, Korrekturen ohne Ursachenanalyse", "Unabhängigen Auditor beiziehen (D-20), Agenda mit allen Pflichteingaben verwenden (D-21), Ursache und Wirksamkeit dokumentieren (D-22)"]
