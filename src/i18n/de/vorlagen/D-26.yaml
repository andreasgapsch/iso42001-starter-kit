# D-26 Lenkung dokumentierter Information
hinweis_umfang: "Diese Regeln sind die schlanke Basis für Unternehmen ohne ISMS. Sie sind so gebaut, dass ein späteres ISMS nach ISO/IEC 27001 sie unverändert übernehmen kann: Das Feld «gilt für» im Register ist schon vorgesehen. Halten Sie die Regeln auf zwei Seiten; Einzelheiten stehen im Register (Excel-Datei D-26)."
einleitung: "Diese Regeln legen fest, wie [[Firmenname]] die Dokumente und Aufzeichnungen des KI-Managementsystems (AIMS) erstellt, freigibt, ablegt, schützt und aufbewahrt, und wie Änderungen am AIMS geplant werden."
einleitung_firma: "Diese Regeln legen fest, wie {firma} die Dokumente und Aufzeichnungen des KI-Managementsystems (AIMS) erstellt, freigibt, ablegt, schützt und aufbewahrt, und wie Änderungen am AIMS geplant werden."
abschnitte:
  arten: Was gelenkt wird
  kennzeichnung: Kennzeichnung
  freigabe: Prüfung und Freigabe
  ablage: Ablage, Zugriff und Schutz
  versionen: Versionen und Überprüfung
  aufbewahrung: Aufbewahrung und Vernichtung
  extern: Externe Dokumente
  ki: Mit KI erstellte Dokumente
