ablage_text: "Gültige Dokumente liegen an einem einzigen, allen Berechtigten bekannten Ort: {ort}. Dort ist immer nur die gültige Fassung als solche erkennbar. Ausdrucke und lokale Kopien sind nicht gelenkt; im Zweifel gilt die Fassung am Ablageort. Zugriffsrechte richten sich nach der Klassifikation. Freigegebene Dokumente und alle Aufzeichnungen sind gegen unbeabsichtigte Änderung geschützt, etwa durch Schreibschutz oder Versionsverlauf. Die Ablage wird gesichert."
protokolle_je_system: "je System festgelegt (Register, Blatt Aufzeichnungen)"
dateiname_firma: "Dateinamen folgen dem Muster **{regel}**. Enthält der Dateiname eine Version oder ein Datum, sind bei Abweichungen die Angaben im Dokument und im Register massgebend."
aufbewahrung_firma: "Wo nichts anderes festgelegt ist, gilt eine Aufbewahrung von {wert} Jahren."
extern_firma: "Bei uns: {wert}"
ablage_bibliothek: "Dokumente und Nachweise können zusätzlich in der Bibliothek liegen, einem Ordner mit Versionen, Prüfsummen und Status. Für die Lenkung gilt das Register: Es nennt jede Datei der Bibliothek mit Version und Pfad. Ein Eintrag der Bibliothek ersetzt weder Prüfung noch Freigabe; Verknüpfungen mit Controls stimmen mit der Erklärung zur Anwendbarkeit überein. Eigene Dateien der Bibliothek gehören nicht zum erzeugten Dokumentensatz und werden dort direkt geöffnet."
ablage_platzhalter: "Ablageort, z. B. SharePoint-Bibliothek AIMS"
versionen_text: "Eine Änderung erhöht die Nebennummer (1.0 auf 1.1), auch eine Ergänzung des Inhalts. Die Hauptnummer steigt (1.1 auf 2.0), wenn das Dokument neu gefasst wird oder sich seine Aussage grundlegend ändert. Jede neue Version wird freigegeben; was sich je Version geändert hat, steht in der Änderungshistorie im Register (Blatt «Änderungen») und als letzte Änderung im Dokumentkopf. Ein freigegebenes Dokument wird nur über eine neue Version geändert. Veraltete Fassungen werden gekennzeichnet und archiviert, nicht gelöscht. Die Eigner/innen überprüfen ihre Dokumente mindestens jährlich; das Register zeigt das nächste Prüfdatum. Angaben zum Stand wie Reife, letzte Durchführung und Messwerte der Prozesse (D-27) sind Aufzeichnungen; sie ändern keine Version."
aufbewahrung_text: "Die folgenden Fristen sind Vorschläge. Gesetzliche und vertragliche Fristen gehen vor; Personendaten werden gelöscht, wenn sie nicht mehr nötig sind. Nach Ablauf werden Unterlagen sicher vernichtet und die Vernichtung im Register vermerkt."
aufbewahrung_text_firma: "Es gelten die folgenden Fristen. Gesetzliche und vertragliche Fristen gehen vor; Personendaten werden gelöscht, wenn sie nicht mehr nötig sind. Nach Ablauf werden Unterlagen sicher vernichtet und die Vernichtung im Register vermerkt."
aufbewahrung_protokolle_grund: "Zweck und Datenschutz"
aufbewahrung_kopf: [Art, Aufbewahrung, Begründung]
aufbewahrung_zeilen:
  - ["Leitlinie, Verfahren, Erklärung zur Anwendbarkeit", "Gültigkeit plus 3 Jahre", "Nachweis über einen Zertifizierungszyklus"]
  - ["Auditberichte, Managementbewertungen, Nichtkonformitäten", "mindestens 3 Jahre", "Zertifizierungszyklus"]
  - ["Risikobeurteilungen, Folgenabschätzungen", "Lebensdauer des KI-Systems plus 3 Jahre", "Nachvollziehbarkeit von Entscheiden"]
  - ["Schulungs- und Kompetenznachweise", "Dauer der Anstellung plus 3 Jahre", "Kompetenznachweis"]
  - ["Ereignisprotokolle von KI-Systemen", "[[nach Festlegung je System]]", "Zweck und Datenschutz; Hochrisiko-Betreiber nach AI Act mindestens 6 Monate"]
  - ["Technische Dokumentation als Anbieter von Hochrisiko-KI", "10 Jahre nach Inverkehrbringen", "AI Act Art. 18"]
extern_text: "Externe Dokumente werden im Register mit Herkunft, Ausgabe oder Stand-Datum und Ablageort geführt. Die Eigner/innen prüfen jährlich, ob eine neuere Fassung vorliegt, besonders beim EU AI Act und bei der Dokumentation der Anbieter. Normen werden nur im erworbenen Umfang genutzt und nicht weitergegeben."
ki_text: "Dokumente dürfen mit KI-Unterstützung entworfen werden. Vertrauliche Inhalte werden nur in freigegebene Werkzeuge eingegeben (D-15). Vor der Freigabe prüft die verantwortliche Person den Inhalt vollständig; sie trägt die Verantwortung für die Richtigkeit."
aenderungen_text: "Änderungen am AIMS, etwa ein neuer Prozess, ein erweiterter Geltungsbereich oder neue Rollen, werden geplant umgesetzt. Für jede Änderung wird festgehalten:"
aenderungen_liste:
  - "Zweck der Änderung und mögliche Folgen"
  - "betroffene Dokumente, Rollen, Risiken und KI-Systeme"
  - "nötige Mittel, verantwortliche Person und Termin"
  - "Freigabe vor der Umsetzung und Information der Betroffenen"
aenderungen_ablage: "Geplante Änderungen und die Massnahmen dazu werden im {{fakt:register.massnahmen}} geführt. Grosse Änderungen werden in der Managementbewertung (D-21) behandelt."
ausbau: "Bei vielen Dokumenten: Ein Dokumentenmanagement mit Freigabe-Workflow, automatischer Versionierung und Erinnerung an Prüftermine ersetzt die manuelle Pflege des Registers."
freigabe_regeln_text: "Diese Regeln hat am {datum} freigegeben: {person}."
eb_einleitung: "Dieses Ergänzungsblatt nennt, was Ihre bestehenden Regeln zur Lenkung dokumentierter Information für das AIMS zusätzlich brauchen. Die übrigen Regeln des ISMS gelten unverändert auch für das AIMS."
eb_einleitung_firma: "Bei {firma} gelten die Regeln des ISMS zur Lenkung dokumentierter Information auch für das AIMS. Dieses Blatt nennt die Ergänzungen."
eb_einleitung_firma_dokument: "Bei {firma} gelten die Regeln des ISMS zur Lenkung dokumentierter Information ({dokument}) auch für das AIMS. Dieses Blatt nennt die Ergänzungen."
eb_aufbewahrung: Aufbewahrung der neuen Dokumentarten
eb_freigabe: Prüfung, Freigabe und Versionen von AIMS-Dokumenten
