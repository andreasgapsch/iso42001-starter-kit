arten_liste:
  - "**Dokumente** geben vor, was zu tun ist: Leitlinie, Verfahren, Richtlinien, Pläne. Sie werden freigegeben und bei Bedarf geändert."
  - "**Aufzeichnungen** belegen, was getan wurde: Protokolle, Auditberichte, Folgenabschätzungen, Schulungsnachweise, Ereignisprotokolle von KI-Systemen. Sie werden nach dem Erstellen nicht mehr verändert."
  - "**Externe Dokumente** stammen von Dritten und sind für das AIMS nötig: Normen, Gesetze, Verträge, Dokumentation der Anbieter von KI-Systemen."
kennzeichnung_text: "Jedes Dokument trägt auf der ersten Seite oder im Blatt «Dokument»: Dokument-ID (z. B. D-03) und Titel, Version (1.0, 1.1, 2.0), Datum der Freigabe (TT.MM.JJJJ), Eigner/in (verantwortlich für Inhalt und Aktualität), Freigabe durch und Klassifikation (öffentlich, intern, vertraulich)."
dateiname: "Dateinamen folgen dem Muster **ID_Titel**, z. B. D-03_KI-Leitlinie. Version und Datum stehen im Dokument und im Register; ältere Fassungen tragen im Archiv zusätzlich die Version, z. B. D-03_KI-Leitlinie_v1.0."
freigabe_text: "Vor der Freigabe prüft eine zweite Person den Inhalt auf Richtigkeit und Eignung; Dokumentkopf und Register nennen, wer geprüft und wer freigegeben hat. Wer freigibt, richtet sich nach der Art des Dokuments:"
freigabe_text_firma: "Vor der Freigabe prüft eine zweite Person den Inhalt auf Richtigkeit und Eignung; Dokumentkopf und Register nennen, wer geprüft und wer freigegeben hat. Wer ein Dokument als Eigner/in verantwortet, gibt es nicht selbst frei, ausser die Tabelle sieht das vor. Es gilt:"
freigabe_kopf: [Art, Prüft, Gibt frei]
