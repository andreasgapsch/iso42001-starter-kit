# D-27 Prozessbeschreibungen (Prozesshandbuch oder einzelner Prozess). Prozesstexte: src/i18n/de/prozesse.yaml
hinweis: "Das Handbuch enthält je anwendbarem Prozess ein Kapitel. Passen Sie Rollen, Schritte und Nachweise an Ihre Firma an und benennen Sie je Prozess einen Eigner. Der Ablauf lässt sich im AIMS-Manager bearbeiten oder als Datei für draw.io austauschen; die Grafik folgt dem Ablauf. Die Kapitel PS-02, PS-04 und PS-06 sind Mustertexte für Basisprozesse, die das Kit ohne ISMS empfiehlt: Ohne ISMS passen Sie sie an und streichen die Angaben zu ISO/IEC 27001 und ISMS; mit ISMS ersetzen Sie sie durch einen Verweis auf die Stelle im ISMS."
einleitung: "Dieses Handbuch beschreibt die Prozesse des KI-Managementsystems von [[Firmenname]]: wer was in welcher Reihenfolge tut, welche Nachweise entstehen und wie der Prozess gemessen wird."
einleitung_firma: "Dieses Handbuch beschreibt die Prozesse des KI-Managementsystems von {firma}: wer was in welcher Reihenfolge tut, welche Nachweise entstehen und wie der Prozess gemessen wird."
einleitung_einzeln: "Diese Beschreibung legt einen Prozess des KI-Managementsystems von {firma} fest: wer was in welcher Reihenfolge tut, welche Nachweise entstehen und wie der Prozess gemessen wird."
lesehilfe: "Im Ablauf steht jede Rolle in einer eigenen Spalte (Bahn). Die Bahn führt den Schritt aus oder verantwortet ihn; verantwortet oder führt eine andere Rolle den Schritt, nennt die Tabelle sie in der Spalte «Rolle», dazu wer mitwirkt und wer informiert wird. Gelb hinterlegte Formen sind Entscheidungen. Die Reifestufen und ihre Kriterien nennt die folgende Tabelle."
reife_kopf: [Reife, Kriterium]
