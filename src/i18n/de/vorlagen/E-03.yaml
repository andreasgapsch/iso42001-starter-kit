# E-03 Pflichtenmatrix EU AI Act
blaetter:
  pflichten: Pflichten
  abdeckung: Abdeckung
titel_pflichten: "Pflichten nach EU AI Act je Rolle und Risikoklasse"
titel_abdeckung: "Abdeckung durch das AIMS: was ISO/IEC 42001 leistet und was nicht"
hinweise_pflichten:
  - "Die Liste enthält alle Pflichten aus dem Katalog des Kits. Streichen Sie Zeilen nicht, sondern setzen Sie den Status «nicht anwendbar» mit kurzer Begründung, wenn eine Pflicht für keines Ihrer Systeme gilt."
  - "Voraussetzung: Rolle (E-01) und Risikoklasse (E-02) je KI-System. Tragen Sie in Spalte M die betroffenen Systeme ein."
  - "Spalten H und I zeigen, welche Controls und Abschnitte von ISO/IEC 42001 die Pflicht stützen und wie weit (ganz, teilweise, nicht). Bei «teilweise» oder «nicht» nehmen Sie das Zusatz-Control aus Spalte J in die Erklärung zur Anwendbarkeit (D-11) auf oder begründen den Verzicht."
  - "Spalte L nennt einen typischen Nachweis. Halten Sie in Spalte O fest, wo Ihr Nachweis liegt."
hinweis_gefiltert: "Pflichten nach den Rollen und Risikoklassen unserer KI-Systeme (D-10, E-02); Spalte M zeigt die betroffenen Systeme. Ist eine Einstufung noch offen, gelten bis zum Entscheid alle Pflichten der Rolle. Status, Nachweis und Verantwortung wie in der Erklärung zur Anwendbarkeit (D-11)."
hinweis_alle: "Im Projekt sind noch keine KI-Systeme erfasst; die Liste enthält deshalb alle Pflichten des Katalogs."
hinweis_formell: "Spalte F nennt den Geltungsbeginn nach Art. 113 und 111, Spalte G den praktischen Beginn. Einige Pflichten gelten formell ab 02.08.2026, greifen aber erst mit den Hochrisiko-Pflichten. Das ist eine gekennzeichnete Auslegung, kein Gesetzestext (E-09)."
alle_klassen: alle Klassen
fria_nicht_erforderlich: "E-06 und {ia}: Grundrechte-Folgenabschätzung nicht erforderlich (geprüft am {datum})"
nicht_anwendbar: nicht anwendbar
