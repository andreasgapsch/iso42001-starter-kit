hinweis_abdeckung: "Zusammenfassung über die Pflichten im Blatt «Pflichten». Rollen im Katalog: {rollen}. Die Zuordnung zu ISO/IEC 42001 ist eine fachliche Einschätzung."
spalten_abdeckung: [Thema, Anzahl, Erläuterung]
abdeckung:
  anzahl: Pflichten in dieser Matrix
  gefiltert: "gefiltert nach den Rollen und Risikoklassen der KI-Systeme im KI-Inventar (D-10)"
  alle: "alle Pflichten des Katalogs"
  grad_ganz: "Das AIMS deckt die Pflicht vollständig ab, wenn die genannten Controls umgesetzt sind."
  grad_teilweise: "Das AIMS liefert Struktur und Nachweise, die Pflicht verlangt aber mehr. Zusatz-Control umsetzen."
  grad_nicht: "Das AIMS deckt die Pflicht nicht ab. Zusatz-Control und eigenes Verfahren nötig."
  zusatz: Zusatz-Controls EUAIA
  ohne: "Pflichten ohne Abdeckung durch 42001"
  leistet: "Was das AIMS leistet"
  leistet_liste:
    - "Ein Managementsystem mit Leitlinie, Rollen, Zielen, Audits und Managementbewertung, in das sich die AI-Act-Pflichten einfügen lassen (Abschnitte 4 bis 10)."
    - "Ein KI-Inventar mit Rolle und Risikoklasse je System als Grundlage für jede Pflichtprüfung (A.4, D-10, E-01, E-02)."
    - "Risikobeurteilung, Risikobehandlung und Folgenabschätzung, auf denen Art. 9 und Art. 27 aufbauen können (6.1, 8.2 bis 8.4, A.5)."
    - "Regeln für Daten, Protokollierung, Lebenszyklus und menschliche Aufsicht, die die Anforderungen nach Art. 10 bis 15 und Art. 26 teilweise erfüllen (A.6, A.7, A.9)."
    - "Information von Nutzenden und Betroffenen, Meldewege und Zusammenarbeit mit Lieferanten (A.8, A.10)."
    - "Massnahmen zur Kompetenz und zum Bewusstsein, die Art. 4 stützen (7.2, 7.3, E-04)."
  leistet_nicht: "Was das AIMS nicht leistet"
  leistet_nicht_liste:
    - "Keine Konformitätsbewertung, keine EU-Konformitätserklärung, keine CE-Kennzeichnung und keine Registrierung in der EU-Datenbank (Art. 43, 47 bis 49)."
    - "Keine Konformitätsvermutung: ISO/IEC 42001 ist keine harmonisierte Norm im Sinne von Art. 40(1). Das ist eine Auslegung, kein Gesetzestext."
    - "Keine rechtliche Einstufung eines Systems und keine Rollenbestimmung mit Rechtswirkung; beides bleibt eine juristische Beurteilung."
    - "Keine maschinenlesbare Kennzeichnung synthetischer Inhalte (Art. 50(2)) und keine Information von Arbeitnehmenden nach Art. 26(7)."
    - "Keine Benennung eines Bevollmächtigten in der EU für Anbieter aus der Schweiz (Art. 22) und keine Barrierefreiheit nach Art. 16 Bst. l."
    - "Keine Pflichten für KI-Modelle mit allgemeinem Verwendungszweck (Art. 53 bis 55)."
