# E-09 Fristen und Stand EU AI Act
hinweis_umfang: "Dieses Dokument hält fest, auf welchem Stand des AI Act Ihre Einstufungen beruhen und welche Pflichten ab wann gelten. Überprüfen Sie es mindestens halbjährlich und vor jeder Managementbewertung (D-21)."
hinweis_normung: "Normung und Vermutungswirkung (Art. 40, 41): Die Konformitätsvermutung einer harmonisierten Norm reicht so weit, wie die Norm die Anforderungen abdeckt; die Zuordnung zeigt ihr Anhang ZA. EN 18286:2026 zum Qualitätsmanagement ist gelistet (Durchführungsbeschluss (EU) 2026/2274, ABl. L 2026/2274 vom 14.10.2026, CELEX 32026D2274). Ob die Vermutung Art. 17 erfasst, ist offen: Art. 40(1) nennt ihn nicht ausdrücklich, Art. 40(2), letzter Unterabsatz, nennt für Normungsaufträge auch Abschnitt 3 von Kapitel III; lassen Sie das juristisch prüfen. Gemeinsame Spezifikationen nach Art. 41 sind am 07.11.2026 nicht bekannt (AI Act Service Desk der Kommission; EUR-Lex-Suche ohne Durchführungsrechtsakt nach Art. 41). Halten Sie im Abschnitt «Weitere Hinweise zum Stand» fest, ob Sie die Norm nutzen. Zu Art. 50 gibt es Leitlinien der Kommission (angenommen am 20.07.2026) und einen freiwilligen Praxisleitfaden (Code of Practice) zur Transparenz KI-erzeugter Inhalte nach Art. 50(7), endgültig seit 10.06.2026; die Kommission (Stellungnahme vom 08.07.2026) und das KI-Gremium (09.07.2026) halten ihn für angemessen für Art. 50(2), (4) und (5) (digital-strategy.ec.europa.eu, abgerufen am 07.11.2026); den Stand an der Seite der Kommission prüfen, auch bei Fragen an Lieferanten."
