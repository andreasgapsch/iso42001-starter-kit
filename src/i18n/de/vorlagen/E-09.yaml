fristen_text: "Die Fristen stammen aus Art. 113 und Art. 111 in der geänderten Fassung sowie aus Aufträgen an die Kommission. Art. 113 hat unnummerierte Absätze; sie werden hier wie in Art. 111 gezählt («Art. 113(3)(c)» ist Absatz 3 Buchstabe c)."
