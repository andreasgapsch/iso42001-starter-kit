systeme_text: "Ab wann die wesentlichen Pflichten der jeweiligen Risikoklasse gelten. Art. 4 (KI-Kompetenz) und Art. 5 (Verbote) gelten für alle Systeme bereits; Einzelheiten je Pflicht in E-03."
