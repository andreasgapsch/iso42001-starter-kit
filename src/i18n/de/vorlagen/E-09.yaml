schweiz_text: "Stand der Schweizer Angaben: {stand}. Die Schweiz übernimmt den AI Act nicht; er erfasst Schweizer Unternehmen nur bei EU-Bezug (E-01). Vor einer internen Mitteilung prüfen wir den Stand beim Bundesamt für Justiz."
