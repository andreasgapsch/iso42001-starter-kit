pruefen: "**Vor jeder Aktualisierung dieses Dokuments auf EUR-Lex prüfen**, ob eine neuere konsolidierte Fassung, eine Berichtigung oder eine Änderungsverordnung vorliegt (Dokument 02024R1689). Letzte Prüfung: {geprueft}."
