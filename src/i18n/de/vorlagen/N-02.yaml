  stand: Stand
titel_abdeckung: "Abdeckung der 72 Subkategorien des NIST AI RMF durch ISO/IEC 42001 und das AIMS"
titel_controls: "Zusatz-Controls RMF-xx für die Erklärung zur Anwendbarkeit"
spalte_nist_firma: "Dokumente NIST AI RMF (N-01 bis N-04)"
titel_stand: "Bilanz und Stand der NIST-Grundlage"
hinweise_abdeckung:
  - "Spalte E zeigt, wie weit ISO/IEC 42001 das Ergebnis der Subkategorie abdeckt (fachliche Einschätzung des Kits). Spalte F zeigt, wie weit es die Vorlagen des Kits ohne dieses Modul abdecken; sie gehen an mehreren Stellen über die Norm hinaus."
  - "Bei «teilweise» oder «nicht» nennt Spalte I das Zusatz-Control, das die Lücke schliesst, oder eine Präzisierung bestehender Dokumente (Spalte J). Halten Sie in Spalte K den Entscheid fest: Zusatz-Control in die Erklärung zur Anwendbarkeit aufgenommen (D-11), Präzisierung umgesetzt oder begründet nicht aufgenommen."
  - "Spalte M nennt die Zahl der Massnahmen, die NIST AI 600-1 für generative KI vorschlägt (0 = nicht im Profil). Die Zuordnung zu ISO/IEC 42001 ist eine eigene Einschätzung, keine Übernahme des Crosswalks."
hinweise_abdeckung_firma:
  - "Abdeckung je Subkategorie durch ISO/IEC 42001 (Spalte E) und durch unser AIMS (Spalte F). Bei «teilweise» oder «nicht» zeigt Spalte K unseren Entscheid zum Zusatz-Control aus der Erklärung zur Anwendbarkeit (D-11) oder zur Präzisierung."
hinweise_controls:
  - "Die Zusatz-Controls schliessen die Lücken zwischen ISO/IEC 42001 und dem AI RMF. Sie gehören wie die Zusatz-Controls zum EU AI Act in den Abschnitt «Zusätzliche Controls» der Erklärung zur Anwendbarkeit (D-11)."
  - "RMF-Gxx gelten nur für Systeme mit generativer KI (Kennzeichen «Generativ» im KI-Inventar D-10). Spalte H: Für Betreiber eingekaufter KI gibt es eine verkürzte Form; die volle Form gilt bei Eigenentwicklung oder eigenem Training."
  - "Das Werkzeug schlägt die Controls je KI-System vor, z. B. RMF-13 nur bei KI mit Wirkung auf Rechtsposition oder Chancen von Personen (Kurzprüfung D-09). Spalte K nennt nur die IDs der Massnahmen in NIST AI 600-1 als Herkunft."
hinweis_controls_firma: "Vorschlag je KI-System nach Typ, Rolle, Kurzprüfung und Kennzeichen «Generativ»; Entscheid aus der Erklärung zur Anwendbarkeit (D-11)."
