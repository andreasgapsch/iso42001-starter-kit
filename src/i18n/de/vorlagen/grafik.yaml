# Entscheidungsbaum D-24 (Fragen kurz; die vollständige Fassung steht als Liste im Dokument)
d24:
  titel: Entscheidungsbaum Rolle nach EU AI Act
  start: KI-System aus dem Inventar (D-10)
  f1: "1 KI-System nach\nArt. 3 Nr. 1?"
  f2: "2 Bezug zur EU?"
  f3: "3 Selbst entwickelt und unter\neigenem Namen angeboten?"
  f4: "4 Fremdes System beruflich\nin eigener Verantwortung?"
  f5: "5 Rollenwechsel nach\nArt. 25(1)?"
  gilt_nicht: AI Act gilt nicht
  nicht_erfasst: "Nicht erfasst\n(Schweizer Blick)"
  anbieter: "Anbieter\n(Art. 3 Nr. 3)"
  betreiber: "Betreiber\n(Art. 3 Nr. 4)"
  uebrige: "Übrige Rollen prüfen\n(Art. 22 bis 25)"
  bleibt: "Rolle aus Frage\n3 oder 4 bleibt"
  wechsel: Anbieterpflichten übernehmen
  ende: Rolle mit Begründung im Inventar festhalten (D-10)
  ja: Ja
  nein: Nein
  alt: "Ablauf in fünf Fragen: 1 KI-System nach Art. 3 Nr. 1? Nein: AI Act gilt nicht. 2 Bezug zur EU? Nein: nicht erfasst. 3 Selbst entwickelt und unter eigenem Namen angeboten? Ja: Anbieter. 4 Fremdes System beruflich in eigener Verantwortung? Ja: Betreiber; Nein: übrige Rollen prüfen (Art. 22 bis 25). 5 Rollenwechsel nach Art. 25(1)? Ja: Anbieterpflichten übernehmen; Nein: Rolle bleibt. Zum Schluss die Rolle mit Begründung im Inventar festhalten."
# Ablauf der Folgenabschätzung D-08
d08:
  titel: Ablauf der Folgenabschätzung
  ausloeser: "Auslöser: neues System oder neue Verwendung,\nÄnderung, Vorfall, Meldung, Wiederholung"
  kurzpruefung: Kurzprüfung mit sechs Fragen (D-09)
  schwelle: "Schwelle erreicht\noder Hochrisiko?"
  doku: "Kurzprüfung festhalten,\nMassnahmen in D-07"
  rueckpruefung: "Rückprüfung: Schwelle\naus D-06 erreicht?"
  freigabe_aims: "Freigabe durch\nAIMS-Verantwortung"
  voll: Vollständige Abschätzung (D-09)
  entscheid: "Entscheid: einsetzen, mit Auflagen\noder nicht einsetzen; Schäden in D-07"
  freigabe_gl: Freigabe durch Geschäftsleitung
  betrieb: "Betrieb und Überwachung,\nWiederholung nach Abschnitt 3"
  ja: Ja
  nein: Nein
  alt: "Auslöser, dann Kurzprüfung mit sechs Fragen. Ist eine Schwelle erreicht oder das System hochriskant, folgt die vollständige Abschätzung mit Entscheid (einsetzen, mit Auflagen, nicht einsetzen) und Freigabe durch die Geschäftsleitung. Sonst wird die Kurzprüfung mit den Massnahmen festgehalten und nach der Risikobeurteilung zurückgeprüft: Erreicht die Auswirkung die Schwelle aus D-06, folgt doch die vollständige Abschätzung; sonst gibt die AIMS-Verantwortung die Kurzprüfung frei. Danach Betrieb und Überwachung mit Wiederholung."
