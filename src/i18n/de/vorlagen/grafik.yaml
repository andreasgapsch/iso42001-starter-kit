  einleitung_leer: "Der Fahrplan zeigt den üblichen Zyklus. Vor dem Stage-1-Audit liegen internes Audit, Managementbewertung und danach ein kurzes Ergänzungsaudit zu 9.3 und A.2.4 (D-20, Abschnitt 1 oben). Ersetzen Sie die Richtwerte durch Ihre Termine."
