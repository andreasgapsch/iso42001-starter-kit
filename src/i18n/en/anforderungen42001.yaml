# ISO/IEC 42001 clauses 4 to 10: our own short titles and explanations.
# No text from the standard. Read the requirement text in your own copy of the standard.
kapitel:
  K-4: Context of the organization
  K-5: Leadership
  K-6: Planning
  K-7: Support
  K-8: Operation
  K-9: Performance evaluation
  K-10: Improvement

abschnitte:
  K-4.1:
    titel: Understanding the setting and the role
    was: Work out which internal and external issues affect your AI management system, whether climate change is one of them, what your AI systems are meant for and which role you take on (e.g. provider, user, partner).
    nachweis: List of issues and role determination in D-01.
  K-4.2:
    titel: Interested parties and their requirements
    was: Identify who is affected by or influences your use of AI, what these parties expect and which of these requirements your management system takes on.
    nachweis: Register of interested parties with a decision per requirement (D-01).
  K-4.3:
    titel: Defining the scope
    was: Set out which organizational units, sites, processes and AI systems the management system covers. Give reasons for any exclusions; we recommend this for the audit, clause 4.3 does not expressly require it.
    nachweis: Approved scope (D-02).
  K-4.4:
    titel: Building and describing the management system
    was: Set up the processes you need, describe how they work together and keep improving them.
    nachweis: AIMS overview with process map (D-02), process descriptions with process diagrams (D-27).
  K-5.1:
    titel: Leadership and commitment
    was: "Top management visibly backs the management system: it sets the policy and objectives, provides resources and asks for results."
    nachweis: Approvals, management review minutes (D-21), communication from top management.
  K-5.2:
    titel: AI policy
    was: Top management issues an AI policy that fits the company, frames the objectives and contains commitments on requirements and improvement. The policy is made known.
    nachweis: Approved and distributed AI policy (D-03).
  K-5.3:
    titel: Roles and authorities
    was: Responsibilities are assigned and known, in particular who ensures conformity with the standard and who reports on performance to top management.
    nachweis: Role matrix (D-04).
  K-6.1.1:
    titel: Planning for risks and opportunities
    was: Derive from your context and requirements which risks and opportunities you need to address, set criteria for acceptable risks and plan actions, including how you will check that they work.
    nachweis: Risk criteria (D-06), risks and opportunities with actions (D-07).
  K-6.1.2:
    titel: Assessing AI risks
    was: Assess AI risks with a fixed method that gives comparable results when repeated. Consider the consequences for the company, for individuals and for society, and set priorities.
    nachweis: Procedure (D-06), risk register (D-07).
  K-6.1.3:
    titel: Treating AI risks
    was: Choose a treatment for every risk, determine the controls you need, compare them with Annex A, and prepare the statement of applicability and a treatment plan. The responsible management approves the plan and the residual risks.
    nachweis: Treatment plan and acceptance of residual risk (D-07), statement of applicability (D-11).
  K-6.1.4:
    titel: AI system impact assessment
    was: Define a procedure for estimating how an AI system can affect people, groups and society, including in cases of reasonably foreseeable misuse. The results feed into the risk assessment.
    nachweis: Procedure (D-08), impact assessments (D-09).
  K-6.2:
    titel: AI objectives and planning
    was: Set measurable AI objectives that fit the policy, and plan what will be done, with which resources, by whom, by when and how success will be measured.
    nachweis: Objectives and metrics (D-05).
  K-6.3:
    titel: Planning changes
    was: Changes to the management system are planned and carried out in a controlled way.
    nachweis: Rules for changes in D-26, planned changes in register D-22 (sheet Improvements).
  K-7.1:
    titel: Resources
    was: Provide people, time, budget and tools for the management system.
    nachweis: Resource planning in D-05 and D-10, during set-up also D-00 (project mandate).
  K-7.2:
    titel: Competence
    was: Determine which competences AI-related tasks require, make sure the people involved have them and check whether training is effective.
    nachweis: Competence matrix and training records (D-17).
  K-7.3:
    titel: Awareness
    was: All employees know the AI policy, their own contribution and the consequences of not following the rules.
    nachweis: Training and information records (D-17), AI use policy (D-15).
  K-7.4:
    titel: Communication
    was: Decide what is communicated about the AI management system, when, to whom and through which channel, both internally and externally.
    nachweis: Communication plan (D-17).
  K-7.5:
    titel: Controlling documented information
    was: Documents and records are identified, reviewed, approved, protected, versioned and easy to find. External documents are controlled as well.
    nachweis: Rules and document register (D-26).
  K-8.1:
    titel: Planning and controlling operations
    was: Put the planned actions and controls into practice in daily work, control changes and outsourced services, and monitor effectiveness.
    nachweis: Life cycle and operation (D-12), suppliers (D-16), evidence per control.
  K-8.2:
    titel: Risk assessment in operation
    was: Repeat the risk assessment at fixed intervals and whenever there are significant changes.
    nachweis: Dated entries in the risk register (D-07).
  K-8.3:
    titel: Risk treatment in operation
    was: Implement the treatment plan, check its effect and adjust the plan if actions do not work.
    nachweis: Status of actions and notes on effectiveness (D-07).
  K-8.4:
    titel: Impact assessment in operation
    was: Repeat impact assessments at fixed intervals and whenever the system or its use changes significantly.
    nachweis: Dated impact assessments (D-09).
  K-9.1:
    titel: Monitoring and measuring
    was: Decide what is measured and evaluated, how and when, and evaluate the performance of the management system.
    nachweis: Measurement plan and results (D-05).
  K-9.2:
    titel: Internal audit
    was: At planned intervals, use an audit programme to check whether the management system meets your own requirements and those of the standard, and whether it is effective. Auditors do not audit their own work.
    nachweis: Audit programme, audit reports (D-20).
  K-9.3:
    titel: Management review
    was: At planned intervals, top management reviews the management system against defined inputs and decides on improvements and changes.
    nachweis: Management review minutes (D-21).
  K-10.1:
    titel: Continual improvement
    was: Keep improving the suitability, adequacy and effectiveness of the management system.
    nachweis: Improvement register (D-22), management review decisions.
  K-10.2:
    titel: Nonconformities and corrective actions
    was: React to nonconformities, look for the cause, remove it for good and check whether the correction works.
    nachweis: Register of nonconformities and corrective actions (D-22).
