speicher_hinweis:
  titel: "Interim copies are stored unencrypted in this browser."
  # V-19: one-line notice bar; the full text with the retention period is in the settings (zwischenspeicher_datenschutz)
  kurz: "More in the settings."
  text: "The AIMS Manager keeps your project as an interim copy in the storage of this browser ({art}). It is not encrypted and can be read by other people using the same browser profile. Saved interim copies are deleted after {tage} days. On shared computers, switch interim copies off in the settings or clear the interim storage when you finish."
  ok: "Understood"
  einstellungen: "Go to settings"

warnung:
  tabs_text: "Both tabs write to the same interim copy and the last one wins. Work in one tab only and close the other."
  tabs_titel: "This project is also open in another tab."
  zwischenspeicher_text: "The browser is no longer keeping interim copies, for instance because storage is full or blocked. Save the project file now and regularly from now on."
  zwischenspeicher_titel: "Interim storage unavailable."
sprung:
  schliessen: "Close bar"
  leiste: "Items from the check"
  naechste: "Next item ({nr} of {anzahl})"
  zurueck: "Back to the check"
# Notice in the frame when the legal status is old or an open item has not been reviewed recently (AF-117, W10)
rechtsstand_hinweis:
  titel: "Check the legal status."
  alt: "The legal information in this kit was last checked on {datum}, more than six months ago."
  alt_ohne_datum: "No review date is recorded for the legal information in this kit."
  zu_pruefen: "Not reviewed in the last six months: {liste}."
  tun: "Download the latest version of the kit (kmu-cio.ch/42001) and check classifications and deadlines at the source before you rely on them. Not legal advice."
# Deleting with dependencies (AF-009, ui/Loeschen.tsx)
loeschen:
  titel: "Delete {eintrag}?"
  titel_name: "Delete {eintrag} ‘{name}’?"
  abhaengig: "{anzahl} other entries refer to this entry. Deleting it removes these references; the entries themselves remain unless stated."
  abhaengig_eins: "One other entry refers to this entry. Deleting it removes the reference; the entry itself remains unless stated."
  verweise: "{anzahl} references"
  verweise_eins: "1 reference"
  weitere: "and {anzahl} more entries"
  weitere_eins: "and 1 more entry"
  mitgeloescht: "is deleted as well because it belongs to the deleted entry"
  endstatus: "already completed (approved, done or effective), please check after deleting"
  verweise_entfernen: Remove references and delete
  bereich_organisation: Organization
  bereich_nistProfil: NIST AI RMF profile
  bereich_kennzahlMessungen: Indicator measurements
eingang:
  zwischenstand-gross: "This saved version is {wert}, larger than a project file (at most {grenze}), and therefore cannot be opened. It stays in the browser and is not deleted."
  schritt_zwischenstand: "Open the project file you saved last. If the project is still open in another tab, save it there as a file and shorten large content (logo, pasted text) before you discard the saved version."
  zu-gross: "The file is too large for {art} (at most {grenze}) and was not read."
  zu-viele: "The file contains too many entries for {art} (at most {grenze}) and was not imported."
  zu-tief: "The data are nested too deeply for {art} (at most {grenze} levels) and were not imported."
  zeit: "Reading the file ({art}) took longer than {grenze} and was stopped."
  zu-viele-seiten: "The PDF has {wert} pages, more than {art} may have (at most {grenze}), and was not read."
  herzschlag: "Reading the file ({art}) made no progress for {grenze} and was stopped."
  art:
    projektdatei: a project file
    ki-ergebnis: an AI result
    sicherung: a library backup
    gestaltungspaket: a design package
    svg-logo: an SVG logo
    word-vorlage: a Word template
    drawio: a draw.io file
    normpaket: a standards package
    norm-pdf: a standard PDF
    bild: a logo or a Word template
    fragebogen: a questionnaire
    bibliotheksdatei: a library file

# Names of symbols for screen readers (A-24)
symbol:
  pfeil_links: Left arrow
  pfeil_rechts: Right arrow
  pfeil_hoch: Up arrow
  pfeil_runter: Down arrow
  nach: to
  weiter_zu: to
