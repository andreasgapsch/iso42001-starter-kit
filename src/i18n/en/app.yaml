start:
  wechsel_frage: "‘{name}’ has unsaved changes. They remain available as an interim copy on the start page. Switch anyway?"
  titel: AIMS Manager
  datenschutz: "Your data does not leave this computer. Save the project file in a secure location. Other HTML files opened locally could read interim storage in the same browser. On shared computers clear it afterwards (Settings, Storage)."
  einleitung: The AIMS Manager guides you step by step to an AI management system under ISO/IEC 42001 and generates the documents for certification. Your entries are kept in a project file (extension .aims.json) that you store yourself.
  zurueck_projekt: "Back to ‘{name}’"
  neu: New project
  neu_text: Start with a short interview. The Guide then takes you through all phases.
  neu_titel: Create a new project
  pfad_frage: Does your company already have an information security management system (ISMS)?
  pfad_hilfe: With an ISMS you extend existing documents with supplementary sheets instead of writing new ones. You can change this later in the settings.
  isms_zertifiziert: Yes, certified to ISO/IEC 27001
  isms_vorhanden: Yes, but not certified
  isms_nein: "No"
  modul_frage: Should the EU AI Act module be included?
  modul_hilfe: Useful if you supply the EU, AI outputs are used there or you offer AI products. When switched off, all entries are kept.
  modul_ja: Yes, include the EU AI Act module
  modul_nein: No, without the module for now
  dokumentsprache: Language of the generated documents
  anlegen: Create project
  oeffnen: Open project file
  oeffnen_text: Open a saved project file (.aims.json) to continue working.
  geoeffnet: "Project ‘{name}’ opened."
  neuerer_zwischenstand: "The browser holds a newer, unsaved version of this project from {datum}. Do you want to use that version?"
  beispiele: Open examples
  beispiele_text: Look at a fully completed example of a fictitious company. Changes only affect your copy.
  beispiele_fehlen: The example projects are not yet included in this version.
  wiederherstellen_titel: Unsaved work found
  wiederherstellen_text: The browser has kept these versions. Save the project file afterwards so that nothing is lost.
  stand: "Version of {datum}"
  weitermachen: Continue
  verwerfen: Discard
  verwerfen_frage: Discard this saved version permanently?

