hinweis_titel: Good to know
hinweise:
  - "The file stays on your computer. The viewer sends nothing and loads nothing from the internet."
  - "The viewer does not display images, fonts and shape libraries from the internet, nor formulas. Diagrams from the kit need none of these."
  - "Links to other pages of the diagram work; the viewer does not open links to the internet."
  - "Compressed and uncompressed .drawio files are displayed. You can edit diagrams in the AIMS Manager or in a diagram application that opens .drawio files."
