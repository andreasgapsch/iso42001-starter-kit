# Guide: phases, participants, checklists, options, calendar and general texts.
# Page texts: src/i18n/en/gefuehrt/<phase>.yaml. Format: src/gefuehrt/FORMAT.md
etappen:
  E0:
    titel: Start interview
    kurz: Start
    ziel: In a few minutes we record the key facts about your company. They determine your route through the kit and a first roadmap.
    warum: A company with a certified ISMS needs fewer new documents than one without. If you supply customers in the EU or sell AI, you also need the AI Act module. We set these switches first.
    ergebnis: Route (with or without ISMS), decision on the AI Act module, roadmap with hours per phase.
  E1:
    titel: Mandate and starting point
    kurz: Mandate
    ziel: You know where your company stands today and who is on the project team, and management has approved the mandate.
    warum: Without a clear mandate and resources from management, a management system stays on paper. The standard expects top management to back it visibly and provide resources.
    ergebnis: Quick gap check and project mandate with approval (D-00).
  E2:
    titel: Context, interested parties and scope
    kurz: Context
    ziel: You record what influences your use of AI, who has expectations, and which parts of the company the management system covers.
    warum: Everything else builds on this. Risks, objectives and controls only make sense once it is clear what is at stake and where the boundaries lie.
    ergebnis: Context and register of interested parties (D-01), approved scope with AIMS overview (D-02).
  E3:
    titel: Policy, roles and reporting channels
    kurz: Policy
    ziel: Management approves an AI policy, responsibilities are assigned, and employees know where to report concerns.
    warum: The policy is the binding framework for all other rules. Clear roles prevent important tasks from being dropped because nobody feels responsible.
    ergebnis: AI policy (D-03), roles, RACI and reporting channel (D-04).
  E4:
    titel: AI inventory
    kurz: Inventory
    ziel: You know every AI system in the company, including AI in purchased software and shadow AI, with its purpose, system owners and resources.
    warum: Anything missing from the inventory is neither assessed nor managed. An incomplete inventory is the most common finding in certification audits.
    ergebnis: AI inventory with survey questionnaire (D-10).
  E5:
    titel: Role first
    kurz: Role
    ziel: For each AI system you determine whether you provide it or only use it. With the AI Act module you also assign each system to a risk class.
    warum: Your role decides which obligations you have. Anyone who offers a system under their own name carries far more responsibility than someone who buys and uses it.
    ergebnis: Role determination (D-24); with the module, roles and risk classes under the AI Act (E-01, E-02).
  E6:
    titel: Risks and opportunities
    kurz: Risks
    ziel: You define how you rate risks and record the main risks and opportunities for each AI system.
    warum: At the heart of every management system is a risk assessment that gives comparable results when repeated. The controls follow from it later.
    ergebnis: AI risk management procedure (D-06), risk register with opportunities (D-07).
  E7:
    titel: Impact assessments
    kurz: Impact
    ziel: You run a quick screening for each AI system to see whether it can noticeably affect people, and carry out a full impact assessment where needed.
    warum: A risk to the company is not the same as an impact on people. The standard requires both views; the results feed into the risk assessment.
    ergebnis: Procedure (D-08), screening and impact assessment per system (D-09); with the module, fundamental rights check (E-06).
  E8:
    titel: Controls and statement of applicability
    kurz: Controls
    ziel: You decide how to treat each risk, choose the controls and give reasons for all 38 controls on whether they apply.
    warum: The statement of applicability is the key document auditors check. It shows that you chose each control deliberately or excluded it with good reason.
    ergebnis: Statement of applicability (D-11), treatment plan with acceptance of residual risk (D-07); with the module, obligations matrix (E-03).
  E9:
    titel: Putting it into practice
    kurz: Practice
    ziel: You describe how AI systems are introduced, monitored and supplied with data, how you make them transparent and how you manage suppliers.
    warum: Auditors do not just check paperwork; they check whether the rules are followed in everyday work. This is where the evidence for that comes from.
    ergebnis: Life cycle (D-12), data (D-13), information and reporting (D-14), acceptable use policy (D-15), suppliers (D-16); with the module, E-05, E-07, E-08.
  E10:
    titel: Competence and communication
    kurz: Skills
    ziel: You determine who needs which knowledge, how all employees are informed, and what you communicate to whom and when.
    warum: People make a management system work. Those who oversee AI must understand it; those who use it must know the rules.
    ergebnis: Competence, awareness and communication plan (D-17); with the module, AI literacy (E-04).
  E11:
    titel: Objectives, measurement and document control
    kurz: Goals
    ziel: You set measurable AI objectives, decide what you measure and keep your documents in a register.
    warum: Without objectives and measurement you cannot show that the management system works. Without document control nobody knows which version of a document applies.
    ergebnis: Objectives, metrics and measurement plan (D-05), document control and document register (D-26).
  E12:
    titel: Internal audit and management review
    kurz: Audit
    ziel: You check your management system once in full, management reviews it, and deviations are corrected.
    warum: Before the certification audit, every certification body expects an internal audit and a management review. Both show that the system checks and improves itself.
    ergebnis: Audit programme and report (D-20), minutes of the management review (D-21), nonconformity register (D-22).
  E13:
    titel: Preparing for certification
    kurz: Certify
    ziel: You choose a certification body, schedule the audit dates and use the tool to check whether everything is ready for stage 1.
    warum: Good preparation saves follow-up audits. The tool shows what is still missing as a traffic light and generates all documents.
    ergebnis: Certification roadmap (D-25), stage 1 report with traffic light, generated documents.
  J:
    titel: Annual calendar
    kurz: Calendar
    ziel: After certification, the calendar shows which recurring tasks are due and when.
    warum: A management system thrives on repetition. Each year the surveillance audit checks whether reviews, measurements, the internal audit and the management review have taken place.
    ergebnis: Updated registers, completed annual tasks with evidence.

