checklisten:
  E1-c1: Management has approved the project mandate.
  E1-c2: The quick gap check has been discussed with the core team.
  E1-c3: Time and budget for the project have been committed.
  E1-c4: Shared processes with the ISMS have been decided using D-23.
  E1-c5: The short version of document control applies (D-26 with storage, labelling and approval route).
  E1-c6: The dates for requesting quotes from certification bodies and for choosing the body are in the project plan.
  E2-c1: Management has approved the scope.
  E2-c2: Interested parties and requirements have been agreed with the business units.
  E2-c3: Every exclusion from the scope is justified.
  E3-c1: Management has signed the AI policy.
  E3-c2: The policy has been made known to all employees.
  E3-c3: All roles and deputies have been communicated to the people concerned.
  E3-c4: The channel for reporting concerns has been published.
  E4-c1: All business units have confirmed the inventory.
  E4-c2: AI in purchased software (e.g. ERP, CRM, office applications) has been checked.
  E4-c3: For every case of shadow AI, a decision has been made to approve, replace or prohibit it.
  E4-c4: Every AI system has a system owner who has confirmed this.
  E5-c1: The role has been determined for each AI system.
  E5-c2: All AI systems have been checked against the prohibited practices in Art. 5.
  E5-c3: Borderline classification cases have been reviewed by a legal expert.
  E6-c1: Management has confirmed the risk criteria.
  E6-c2: Every AI system has at least one risk assessment.
  E6-c3: The risks have been discussed with the system owners.
  E7-c1: A screening is available for every AI system.
  E7-c2: Full impact assessments have been approved by the responsible person.
  E7-c3: The results of the impact assessments have been transferred to the risk register.
  E8-c1: The statement of applicability gives reasons for all controls.
  E8-c2: Management has approved the treatment plan and residual risks.
  E8-c3: Every applicable control has a responsible person.
  E9-c1: The acceptable use policy has been published and acknowledged by employees.
  E9-c2: Every AI supplier has a review status.
  E9-c3: The reporting channel for external parties can be found on the website.
  E9-c4: AI incidents have been added to the incident procedure.
  E9-c5: Requirements, design and test report exist for every in-house development.
  E9-c6: The AI Act obligations have been ticked off for every system concerned.
  E10-c1: Training records exist for all oversight roles.
  E10-c2: The communication plan covering internal and external communication has been approved.
  E10-c3: The effectiveness of the training has been checked.
  E11-c1: Every objective has a metric, an owner and a deadline.
  E11-c2: The document register is complete and up to date.
  E11-c3: A first measurement has been recorded for every objective.
  E12-c1: The internal audit has covered all clauses and controls.
  E12-c2: The management review has been minuted with all required inputs.
  E12-c3: Every nonconformity has a cause and an action.
  E12-c4: The audit report has been presented to management.
  E13-c1: All errors found by the check have been fixed.
  E13-c2: The stage 1 documents have been sent to the certification body.
  E13-c3: The certification body is accredited for ISO/IEC 42001.
  J-c1: The annual review of the AI policy is documented.
  J-c2: The surveillance audit is prepared and scheduled.
  J-c3: The status of the AI Act has been checked and the classifications are up to date.

kalender:
  inventar: Review the AI inventory, record new systems, update review dates.
  schatten-ki: Decide on open cases of shadow AI (approve, replace or prohibit).
  ziele: Record measured values for the AI objectives.
  risiken: Reassess risks and check the progress of actions.
  aiact-stand: Check the status of the AI Act and of the classifications.
  nist-stand: Check the status of the NIST AI RMF and update the profile.
  folgen: Check that impact assessments are still up to date.
  lieferanten: Review AI suppliers again.
  schulung: Run training sessions and check their effectiveness.
  kommunikation: Review the communication plan and send out messages.
  leitlinie: Review the AI policy and record the review.
  dokumente: Review the document register and revise documents that are due.
  internes-audit: Carry out the internal audit and file the report.
  managementbewertung: Carry out the management review and take minutes.
  ueberwachungsaudit: Prepare for the surveillance audit by the certification body.

