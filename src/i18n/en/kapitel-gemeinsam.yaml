hinweis: "Professional judgement by KMU-CIO on what to consider when running an ISMS and an AIMS together. For the requirement text, see ISO/IEC 42001 and ISO/IEC 27001, clauses 4 to 10. The standards are available from SNV, DIN or ISO."
gemeinsam:
  ja: "Shared: one process and one set of evidence for both systems."
  teilweise: "Partly shared: common framework, AI content must be added."
