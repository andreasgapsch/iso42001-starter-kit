hinweis: "This mapping is a professional judgement by KMU-CIO. It shows where evidence from the ISMS can be reused and does not replace a case-by-case review."
staerke:
  hoch: "High: the ISMS evidence largely covers the AI control; AI content only needs to be added."
  mittel: "Medium: process and format can be reused, but essential AI content is missing."
  tief: "Low: only a point of contact; the AI control needs its own implementation."
begruendung:
  leitlinie-rahmen: "The information security policy provides the structure, top management approval and communication route that the AI policy can reuse. The AI policy still needs its own principles on accountability, transparency and effects on affected people."
  leitlinie-fuehrung: "Management's duty to enforce rules applies equally to the AI policy. Line managers make sure their teams know and follow the AI rules."
  leitlinie-abgleich: "Where a security policy already exists, the AI policy must be aligned with it. The simplest approach is to cross-reference both and review them together."
  leitlinie-recht: "The register of legal and contractual requirements shows which other rule sets the AI policy must respect, such as data protection or sector rules."
  leitlinie-einhaltung: "Compliance checks reveal conflicts between policies only indirectly. They do not replace a deliberate alignment when drafting."
  leitlinie-zyklus: "The review cycle of the security policy can be adopted as it is. Additional triggers are new AI systems and changes in AI legislation."
  leitlinie-unabhaengig: "An independent review can cover the AI policy in the same exercise, so that its suitability is also judged from outside."
  rollen-zuweisung: "The existing role model is extended with AI roles, such as a system owner per AI system and an AIMS lead. Format and approval stay the same."
  rollen-trennung: "Segregation of duties also helps with AI, for example between building and approving a model. In small teams, a second pair of eyes on critical steps is often enough."
  rollen-fuehrung: "Management's responsibility for applying rules also covers AI roles. Line managers ensure that the people named have the time and authority required."
  meldeweg-ereignisse: "The channel for security events can also take AI concerns. It must, however, accept topics without a security angle, such as unfair outputs, and allow confidential reports; an existing whistleblowing system is often a better fit."
  meldeweg-vorfallorganisation: "The incident organization can receive and triage reports. Concerns, however, are often not incidents and need separate handling by the AIMS lead."
  inventar-ressourcen: "The asset inventory is the natural basis for resources per AI system. It additionally needs an AI flag and links between each system and its resources."
  inventar-cloud: "Many AI systems are cloud services. The overview of cloud services in use already provides provider, data location and owner."
  inventar-daten: "Data sets are often already recorded as information assets. For AI, details on purpose, origin and suitability for training or operation are usually missing."
  daten-klassifizierung: "Classification by sensitivity shows which data may enter an AI system at all. It is a key attribute in the description of data resources."
  daten-aufzeichnungen: "Protection of records keeps the data descriptions safe from loss. It adds little to their content."
  inventar-werkzeuge: "Software and licences in the inventory cover part of the AI tooling. Models, model versions and machine learning libraries need to be added."
  werkzeuge-cloud: "Models are often consumed as a cloud service. Details from the cloud overview, such as contract and region, belong in the tool description."
  werkzeuge-konfiguration: "Configuration management records versions and settings. For models, parameters and system prompts must also be documented."
  inventar-infrastruktur: "Servers, cloud accounts and network components are usually already in the inventory. It is enough to link them to the AI systems that use them."
  kapazitaet: "Capacity management covers compute and storage for AI as well. For AI, costs and quotas of external model services are an additional factor."
  infrastruktur-cloud: "Rented compute and AI platforms in the cloud are captured through the cloud rules, including who is responsible for which layer."
  redundanz: "Redundancy matters only where an AI system is business-critical. In that case, it belongs in the description of system resources."
  kompetenz-schulung: "The training programme shows which skills already exist. For AI, specialist skills such as data analysis or model evaluation must also be recorded."
  kompetenz-rollen: "Role descriptions show who does what, not which competence is required. The description of human resources closes this gap."
  folgen-dsfa: "An existing procedure for data protection impact assessments provides triggers, workflow and approval as a model. The AI system impact assessment goes further and also covers effects that involve no personal data."
  folgen-projekte: "Security checks in projects show where an impact assessment can be anchored in the project flow. There is little overlap in content."
  folgen-aufbewahrung: "Rules on protecting and retaining records also apply to impact assessments. The retention period must be defined."
  folgen-dsfa-ablage: "Where data protection impact assessments are already filed, the same repository can be used. Both results should refer to each other."
  folgen-personen: "Data protection covers effects on individuals where personal data is processed. Discrimination, wrong decisions and reduced freedom of choice go beyond that and need their own criteria."
  folgen-gesellschaft: "Societal effects such as environmental impact or influence on public opinion have no counterpart in information security. Data protection offers methodological ideas at most."
  entwicklung-ziele: "Secure development rules contain security objectives. Objectives on fairness, explainability or robustness must be added."
  entwicklung-projektziele: "Where security is already part of project objectives, responsible development objectives can be added in the same template. This is no more than an anchor point."
  entwicklung-prozess: "A defined secure development lifecycle is the framework for the AI development process. It needs extra phases for data, training, evaluation and monitoring after deployment."
  entwicklung-projekt: "The project method with security checkpoints defines milestones and approvals. AI-specific checkpoints can be added there."
  entwicklung-architektur: "Secure architecture principles also apply to AI systems. Principles such as human oversight and traceability of decisions are added."
  anforderungen-anwendung: "The template for application security requirements can be extended. Requirements on purpose, performance, data quality and human oversight are added."
  anforderungen-projekt: "Requirements are gathered in projects anyway. AI requirements belong in the same document and go through the same approval."
  entwurf-architektur: "Architecture documentation based on security principles covers part of the design. For AI, model choice, training approach and assumptions made are added."
  entwurf-code: "Secure coding rules also apply to AI software. They add little to the design documentation."
  entwurf-auslagerung: "Where an AI system is developed externally, the rules for outsourced development define what documentation the partner must deliver. That list is extended with AI details."
  entwurf-quellcode: "Protection of source code can be extended to models, weights and training scripts. It secures development outputs but does not document them."
  pruefung-tests: "Security testing before acceptance provides the framework. AI additionally needs tests for accuracy, robustness, bias and behaviour with unexpected inputs."
  pruefung-testdaten: "The rules on test data protect confidential data used in testing. For AI, test data must also be representative and kept apart from training data."
  pruefung-umgebungen: "Separate environments prevent unverified models from reaching production. They contribute to validation only indirectly."
  einfuehrung-aenderung: "The change process with approval and fallback plan fits the deployment of AI systems and new model versions directly. A check whether the impact assessment still holds is added."
  einfuehrung-umgebungen: "Separation of test and production ensures an orderly transition. It is a prerequisite for a traceable approval."
  einfuehrung-installation: "Rules for installing software on production systems also apply to AI components. They have little effect for cloud services."
  betrieb-ueberwachung: "Existing monitoring detects technical faults and attacks. For AI, it must also track functional performance, drift and unusual outputs."
  betrieb-ablaeufe: "Documented operating procedures can be extended with AI tasks, such as model changes or responses to falling performance. Format and storage stay the same."
  betrieb-schwachstellen: "Vulnerability management also covers libraries and platforms used by AI systems. AI-specific weaknesses such as prompt injection must be added to the checks."
  betrieb-aenderungen: "Operational changes such as new model versions at the provider go through the change process. It is important to also capture changes that the provider makes without notice."
  betrieb-kapazitaet: "Capacity monitoring shows bottlenecks that affect the performance of an AI system. It complements functional monitoring."
  doku-betrieb: "Operating documentation is one of several audience-specific documents. Users, affected people and authorities need their own versions in plain language."
  logs-protokollierung: "Existing logging provides the technology, retention and protection of logs. What needs defining is which AI events, such as inputs, outputs and model version, are recorded."
  logs-zeit: "Consistent system time makes AI logs comparable with other logs. This is essential when investigating incidents."
  logs-auswertung: "Monitoring analyses the logs. AI events can feed into the same analysis if the formats are compatible."
  daten-einstufung: "Classification defines how data must be protected, including in AI development. Rules on suitability, volume and representativeness are not part of it."
  daten-datenschutz: "Data protection rules determine whether personal data may be used for training. They are a mandatory part of data management for AI."
  daten-loeschung: "Deletion rules also apply to training and test data. It must be clarified what happens to models trained on data that has since been deleted."
  daten-aufbewahrung: "Records about data management must be protected like other records. This says nothing about what data management must contain."
  beschaffung-recht: "The register of legal and contractual requirements helps check whether data may be used. Licence terms of data sets are part of this."
  beschaffung-ip: "Intellectual property is a central issue for purchased or collected data. Existing licence rules can be extended to data sets."
  beschaffung-datenschutz: "For personal data, the legal basis for acquisition must be clear. The existing record of processing activities often already provides this."
  beschaffung-uebertragung: "Rules for secure transfer protect data received from third parties. They add little to documenting the acquisition."
  qualitaet-testdaten: "Information security has no direct counterpart for data quality. The rules on test data only touch on the point that data must be fit for its purpose."
  herkunft-aufzeichnungen: "Provenance records are records and must stay unaltered and retrievable. The existing rules for protecting records can be applied."
  herkunft-inventar: "The inventory can name the source of a data set. It does not show the processing steps up to training."
  herkunft-logs: "Logs from data pipelines can evidence origin and processing, but only if they are designed for that purpose."
  aufbereitung-maskierung: "Masking and pseudonymization are common data preparation steps. The existing rules on them can be adopted directly."
  aufbereitung-datenschutz: "Data protection requires data minimization, which shapes preparation. Criteria on cleansing, labelling and correcting bias are added."
  info-pflichten: "The register of legal obligations shows which information users must receive, for example under the AI Act or consumer law. The organization decides what is useful beyond that."
  info-datenschutz: "Privacy notices are a model for clear information. They do not cover the capabilities and limits of an AI system."
  extern-meldung: "The reporting route for security events can be opened to external parties, for example through a form or a dedicated address. External reports about AI often concern errors or unfair treatment and need specialist handling."
  extern-vorfallorganisation: "The incident organization defines who receives and assesses reports. External AI reports are classified there and passed on where needed."
  vorfall-planung: "Incident planning with roles, contact lists and escalation can be used directly. AI incidents without a security angle and communication to users and affected people must be added."
  vorfall-bewertung: "Event classification needs extra criteria for AI, such as harm to individuals or the extent of wrong outputs. The process itself stays the same."
  vorfall-reaktion: "Incident response already includes internal and external communication. For AI, measures such as switching off a feature or reverting to manual processing are added."
  vorfall-lernen: "Lessons from AI incidents feed into the risk register and the impact assessment. The existing post-incident review can be used for this."
  vorfall-beweise: "Evidence collection is rarely central to communicating AI incidents. It matters when liability questions or regulatory proceedings are likely."
  vorfall-behoerden: "Existing contacts with authorities shorten the path when an AI incident must be reported. The contact list is extended with the bodies responsible for AI."
  pflichten-recht: "The register of legal and contractual requirements is the right place for AI reporting and information duties. These include duties under the AI Act and from customer contracts."
  pflichten-behoerden: "Contacts with authorities and their reporting routes are already recorded. For AI, market surveillance and, where relevant, sector supervisors are added."
  pflichten-datenschutz: "Data breach notification duties are a familiar pattern for deadlines and responsibilities. They concern AI only where personal data is involved."
  nutzung-regeln: "The acceptable use rules are the natural place for AI use. They are extended with approved tools, permitted data and checking of outputs."
  nutzung-schulung: "Awareness and training convey the usage rules. A short learning unit on AI within the existing programme is often sufficient."
  nutzung-datenabfluss: "Data leakage prevention stops confidential data from reaching public AI services. It enforces the usage rules technically."
  nutzung-webfilter: "Web filtering can block or reveal unapproved AI services. This helps against shadow AI but does not replace rules."
  nutzung-ziele: "Usage rules set limits, not objectives. Objectives such as the share of reviewed outputs or training coverage are added to the list of objectives."
  zweck-nutzung: "The usage rules can state what an AI system may and may not be used for. The intended purpose per system comes from the inventory."
  zweck-ablaeufe: "Operating instructions describe how a system is meant to be used. For AI, they also include the provider's instructions on intended use."
  zweck-schulung: "Training makes the limits of a system known. It does not show whether use actually stays within its purpose."
  dritte-vertraege: "Security clauses in supplier contracts are the template for dividing AI responsibilities. Duties on model changes, documentation and use of customer data are added."
  dritte-anforderungen: "Security requirements for suppliers show what is expected of third parties. Sharing AI responsibilities goes further because partners and customers can also be involved."
  dritte-cloud: "The shared responsibility model for cloud services can be applied to AI services. It clarifies who is accountable for model, data and configuration."
  lieferant-auswahl: "The existing supplier selection and risk assessment process is reused for AI providers. Questions on training with customer data, model origin and role under the AI Act are added."
  lieferant-vertrag: "Security clauses in contracts are extended with AI clauses. Notice of model changes, support with obligations and exit terms are the key points."
  lieferant-kette: "AI services often build on models from other providers. Managing the ICT supply chain makes these dependencies visible."
  lieferant-ueberwachung: "The regular review of supplier services also covers AI providers. Model changes and changes to terms of use must also be watched."
  lieferant-cloud: "Most AI suppliers are cloud providers, so the cloud rules on selection, use and exit apply directly."
  lieferant-entwicklung: "Where an AI system is developed by a partner, the rules for outsourced development apply. Acceptance criteria on performance and data quality are added."
  kunden-anforderungen: "Customers' contractual requirements are already in the register of obligations. Expectations on AI, such as transparency or excluding certain uses, are added there."
  kunden-datenschutz: "Customers often expect assurances on how their data is handled in AI systems. Existing data protection commitments are a basis for this."
