    allgemein: general
    genai: generative AI
stand:
  modul: NIST AI RMF
  kurz: The NIST AI RMF is a voluntary framework from the US agency NIST that sets out outcomes for managing AI risk. It is neither law nor a standard; NIST does not certify.
  botschaft: ISO/IEC 42001 is the certifiable management system, the AI RMF a voluntary catalogue of outcomes. NIST does not certify.
  fassungen:
    ai-100-1: NIST AI 100-1, Artificial Intelligence Risk Management Framework (AI RMF 1.0), 26/01/2023
    ai-600-1: NIST AI 600-1, Generative Artificial Intelligence Profile, July 2024
    playbook: NIST AI RMF Playbook (PDF of 02/08/2024, no version stated)
  revision: NIST has announced a revision of AI RMF 1.0 (US ‘AI Action Plan’, July 2025). On 21/10/2026 there was no draft, no version number and no date. AI RMF 1.0 remains authoritative. The revision is likely to affect GOVERN 3 and MEASURE 2.12 in particular; the kit keeps these items on its own grounds.
  veraltet: The status of the NIST AI RMF was last checked on {datum}. Check nist.gov for a new version.
  weitere:
    ir-8596: 'NIST IR 8596, Cyber AI Profile: initial preliminary draft of 16/12/2025 only (comments until 30/01/2026). Not part of the module; worth noting for companies with an ISMS once the final version appears.'
    profil-kritische-infrastruktur: 'Profile ‘Trustworthy AI in Critical Infrastructure’: concept note of 07/04/2026 only. Not part of the module.'
  abgleich:
    crosswalk-42001: The mapping to ISO/IEC 42001 is the kit's own assessment. It was cross-checked against the crosswalk ‘NIST AI RMF to ISO/IEC FDIS 42001’ (provided by Microsoft, listed on airc.nist.gov, not a NIST work). Its tables are not reproduced; 7 errors in it are corrected in the kit's own mapping.
  lizenz: The NIST documents are works of the US government and in the public domain in the United States under 17 U.S.C. § 105. Outside the United States, NIST reserves its rights but grants a worldwide, royalty-free licence to reprint them and to create derivative works (nist.gov/oism/copyrights). The kit quotes the functions, categories and subcategories, the trustworthiness characteristics, the twelve GenAI risks and the referenced actions of NIST AI 600-1 verbatim with page references, uses its own short titles and texts, and ships the PDFs unchanged, with the notice "Republished courtesy of the National Institute of Standards and Technology". Their mention does not imply endorsement by NIST.
  quellenangabe: 'Source: National Institute of Standards and Technology (NIST), NIST AI 100-1, AI RMF 1.0, January 2023, https://doi.org/10.6028/NIST.AI.100-1'
  pdf_pruefung: The PDFs supplied are bit-identical to the files on nvlpubs.nist.gov and airc.nist.gov (SHA-256 checked on 21/10/2026).
original:
  uebersetzung: Translation by KMU-CIO, not official
  fundstelle: '{dokument}, p. {seite}'
  fundstelle_bis: '{dokument}, pp. {seite} to {bis}'
  aufklappen: Original text
  massnahmen_600: Actions from NIST AI 600-1 on which the control is based
  subkategorien_control: Subcategories whose gap the control closes
  merkmale: Trustworthiness characteristics according to NIST AI 100-1 section 3
  messen: Subcategories MEASURE 2 (evaluation of the trustworthiness characteristics)
  risiken: The twelve risks according to NIST AI 600-1 section 2
  nachlesen_100: 'NIST AI 100-1, p. {seite}: {was}'
  nachlesen_600: 'NIST AI 600-1, p. {seite}: {was}'
