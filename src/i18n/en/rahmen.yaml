hilfe:
  kurzanleitung: Quick guide
  tasten: Keyboard shortcuts
  starten:
    titel: Getting started
    text: Open the AIMS Manager with a double click. Under Start, choose a new project, a project file or an example. Everything runs offline in the browser.
  navigation:
    titel: Navigation
    text: On the left you choose the area, next to it the page in the sub-menu. The sub-menu can be collapsed; on narrow screens you open it with the menu button before the page title. On a phone the areas are at the bottom, the others under ‘More’.
  arbeiten:
    titel: Guide and registers
    text: The Guide leads you phase by phase through the AIMS, one question per page, with help on the right. The registers show all information as lists and forms, from the organization to the reports.
  speichern:
    titel: Saving
    text: Save with Ctrl+S (Mac Cmd+S), with the save status next to the search or in the project menu at the bottom of the tool bar. Edge and Chrome write directly to the open file; Firefox and Safari download a new file. The temporary storage does not replace the project file.
  pruefen:
    titel: Check and documents
    text: The check shows a traffic light (‘Ready for stage 1’, ‘Ready with notes’ or ‘Not ready yet’) with a jump to each item. You generate documents in the library under ‘Generate’ as Word and Excel files.
  bibliothek:
    titel: Library
    text: The library manages documents with status, version and review date. In Edge and Chrome it works with a folder of your choice.
  wissen:
    titel: Knowledge
    text: Guide book, frameworks with our own short titles and original texts, glossary and notes on the AI assistant, without internet.
  assistent:
    titel: AI assistant
    text: ‘Deepen with AI’ creates a request to copy. You import the assistant's project file under Start, Projects and examples.

