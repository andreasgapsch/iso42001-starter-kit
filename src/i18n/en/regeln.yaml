# Texts of the check rules: titel ({name} = object concerned), erklaerung (what to do)
F01: { titel: "AI system ‘{name}’ has no system owner", erklaerung: "Every AI system needs a system owner who decides on its use and on changes." }
F02: { titel: "AI system ‘{name}’ has no risk assessment", erklaerung: "Assess at least one risk per AI system, or explain in the register why there is no relevant risk." }
F03: { titel: "AI system ‘{name}’ reaches a threshold, but the full impact assessment is not complete. Missing: {fehlt}", erklaerung: "The screening shows a sensitive use. Complete the parts named in the impact assessment (D-09); the jump leads to the first gap." }
F04: { titel: "Impact assessment {name} is not approved", erklaerung: "Have the responsible person approve the impact assessment and enter the name and date." }
F05: { titel: "Control {name}: decision on applicability is missing", erklaerung: "Decide for every control whether it applies." }
F06: { titel: "Control {name}: justification is missing", erklaerung: "The statement of applicability needs a justification for both inclusion and exclusion." }
F07: { titel: "Control {name} applies. Missing: {fehlt}", erklaerung: "Record the implementation status and at least one piece of evidence. The status is on the page ‘Implementation and evidence’." }
F08: { titel: "Risk {name} exceeds the acceptance criterion and is not treated", erklaerung: "Choose a treatment option and link controls or actions." }
F09: { titel: "Residual risk of {name} has not been accepted", erklaerung: "The responsible person must accept the residual risk and record the date." }
F10: { titel: "The treatment plan is not approved", erklaerung: "Have the responsible manager approve the treatment plan (D-07, with an ISMS D-07-EB)." }
F11: { titel: "The scope is missing or not approved", erklaerung: "Describe the boundaries of the management system with reference to the context and requirements, and have the scope approved." }
F12: { titel: "The AI policy is incomplete or not approved", erklaerung: "The policy needs principles, a framework for objectives, the commitments and approval by top management." }
F13: { titel: "Objective {name} is not fully planned", erklaerung: "Every objective needs a metric or target value, an owner, a deadline and a way to measure success." }
F14: { titel: "The required roles under 5.3 are not assigned", erklaerung: "Decide who ensures conformity with the standard and who reports to top management on performance." }
F15: { titel: "No internal audit has been carried out", erklaerung: "A complete internal audit should have taken place before stage 1. An audit counts as carried out with the date it was carried out and a result or checklist. A planned audit counts as open, not as an error, until its date; the project is ready for stage 1 only after the audit." }
F16: { titel: "No management review has been carried out", erklaerung: "Top management should have reviewed the management system once before stage 1." }
F17: { titel: "Nonconformity {name} has no cause or effectiveness check", erklaerung: "Record the cause and check after the correction whether it works." }
F18: { titel: "Action {name} has no owner or deadline", erklaerung: "Every action needs a responsible person and a deadline." }
F19: { titel: "The risk criteria are incomplete", erklaerung: "Define scales for likelihood and impact with a reference period, and set acceptance thresholds." }
F20: { titel: "Party {name}: decision on a requirement is missing", erklaerung: "Record for each requirement whether the management system addresses it." }
F21: { titel: "Risk {name} is being reduced but is not linked to any control", erklaerung: "Link the risk to at least one control from the statement of applicability." }
F22: { titel: "AI system ‘{name}’ has no role under the AI Act", erklaerung: "Determine your role (e.g. provider or deployer) for this system (E-01)." }
F23: { titel: "AI system ‘{name}’ has no risk class under the AI Act", erklaerung: "Assign the system to a risk class (E-02)." }
F24: { titel: "AI system ‘{name}’ is classified as a prohibited practice", erklaerung: "Prohibited practices must not be used. Stop using the system and have the classification reviewed by a lawyer." }
F25: { titel: "AI Act obligation {name} has no decision on the additional control", erklaerung: "For obligations the AIMS does not fully cover, add the proposed additional control to the SoA or give reasons for rejecting it." }
H01: { titel: "Review date passed: {name}", erklaerung: "Review the entry and set a new date." }
H02: { titel: "Shadow AI ‘{name}’ has been under review for more than 30 days", erklaerung: "Decide whether the tool is approved, replaced or prohibited." }
H03: { titel: "Risk scales differ from the ISMS", erklaerung: "With an ISMS, one shared method with the same scales is recommended." }
H04: { titel: "Control {name} is excluded although a high risk refers to it", erklaerung: "Review the exclusion." }
H05: { titel: "Evidence of competence is missing for {name}", erklaerung: "Record how competence is demonstrated." }
H06: { titel: "The communication plan contains no external communication", erklaerung: "Check whether customers, authorities or affected persons must be informed." }
H07: { titel: "AI system ‘{name}’ was changed after the last impact assessment", erklaerung: "Check whether the impact assessment must be updated." }
H08: { titel: "In-house development ‘{name}’ has no life cycle evidence", erklaerung: "For AI you develop yourself, the controls on requirements, design and testing apply (A.6.2)." }
H09: { titel: "Event logging has not been defined", erklaerung: "Define what is logged and how long it is retained." }
H10: { titel: "There is no reporting channel for external parties", erklaerung: "Affected persons and customers should be able to report adverse impacts." }
H11: { titel: "Audit {name}: independence not demonstrated", erklaerung: "Auditors must not audit their own work. Record how independence is ensured." }
H12: { titel: "Control {name} excluded as ‘already in place’", erklaerung: "If an existing measure meets the control, the control applies and is implemented; it is not excluded." }
H13: { titel: "The AI policy names products", erklaerung: "The policy sets principles. Tools belong in the AI inventory and the AI use policy." }
H14: { titel: "AI system ‘{name}’ in the workplace: information for employees is missing", erklaerung: "Deployers of high-risk AI inform employees and their representatives before use." }
H15: { titel: "The AI Act information is more than 6 months old", erklaerung: "Check whether a newer kit version or legal text is available." }
H16: { titel: "Provider outside the EU without an authorised representative", erklaerung: "Providers of high-risk AI without an establishment in the EU need an authorised representative in the EU." }
F26: { titel: "Quick check reaches the threshold but no full impact assessment", erklaerung: "Under procedure D-08 the system needs a full impact assessment: question 1 or 2 is answered ‘yes’, or at least two of questions 3 to 6." }
H17: { titel: "Borderline quick check without justification", erklaerung: "Exactly one of questions 3 to 6 is answered ‘yes’. Record why the quick check is sufficient or a full assessment follows." }
H18: { titel: "Impact assessment performed and approved by the same person", erklaerung: "The person who performs the assessment should not approve it. Under D-08, top management approves full assessments." }
H19: { titel: "AI system ‘{name}’ approved before its impact assessment was approved", erklaerung: "Under D-08 a system goes into operation only after its impact assessment is approved. An earlier system approval stands out in stage 1. Keep the order or record the approval again after the assessment." }
H20: { titel: "Treatment plan older than its most recent entry: {name}", erklaerung: "The most recent entry is shown in brackets. The plan contains a residual risk acceptance or an action from an audit or management review that arose after its approval. Approve the plan again with a new version and date." }
H21: { titel: "Statement of applicability older than the treatment plan: {name}", erklaerung: "The most recent change is shown in brackets. Risks, actions or the approval of the treatment plan are more recent than the approval of the SoA. Review and update the SoA and approve it again." }
H22: { titel: "Impact assessment {name} approved before procedure D-08", erklaerung: "An assessment approved before its procedure does not follow a controlled procedure. Review it against D-08 and approve it again, or record that it complies with the procedure." }
H23: { titel: "Role and classification recorded only after the risk assessment", erklaerung: "Risks and impact assessments depend on the role for each AI system (4.1). Record role and classification before the risk assessment or review the assessment again afterwards." }
H24: { titel: "Control {name} recorded as implemented while an action is still open", erklaerung: "The implementation refers to an action that is not yet completed. The statement of applicability (D-11) therefore shows ‘partly’. Adjust the status or complete the action." }
H25: { titel: "Document {name} without an entry in the change history", erklaerung: "For every version above 1.0, the change history records what changed and who approved the version (7.5.3). Otherwise it cannot be traced which state was approved when." }
H26: { titel: "Internal auditor {name} in the project team", erklaerung: "Anyone who works on setting up the AIMS does not audit their own work (9.2). Remove the person from the project team or specify which parts another person audits." }
H27: { titel: "Document {name} approved by its own owner", erklaerung: "The document control rule does not provide for approval by the owner (D-26). Have the document approved by the responsible party or adjust the rule." }
H28: { titel: "Acting AI ‘{name}’ without a way to stop it, logs or oversight", erklaerung: "The system carries out actions itself. Record in the inventory how and by whom it is stopped, what is logged and who oversees it (D-10, D-12)." }
H29: { titel: "Critical AI system ‘{name}’ without a fallback", erklaerung: "An outage disrupts important processes. Decide how work continues without the system and record the fallback in the inventory (D-10, D-12)." }
H30: { titel: "AI system ‘{name}’ retired without a retention date or completed retirement", erklaerung: "Record until when records, outputs and settings are retained, and complete the retirement steps (D-12)." }
H31: { titel: "Approved AI system ‘{name}’ without a deployment decision", erklaerung: "Record the expected benefit and why a solution without AI is not sufficient, with a date for the follow-up review (D-09, D-15)." }
H32: { titel: "Generative AI system ‘{name}’ without misuse cases in testing", erklaerung: "The system reads third-party content or is publicly accessible. Test misuse cases such as hidden instructions or requests for confidential data before deployment and after every model change (D-12)." }
H33: { titel: "Purchased AI system ‘{name}’ without model or version", erklaerung: "Without model and version, a model change by the provider goes unnoticed. Record the provider's statement with its date in the inventory (D-10, D-16)." }
H34: { titel: "AI system ‘{name}’ with sensitive use has no metric of its own", erklaerung: "Measure in operation whether the system works as tested, e.g. with a spot check or the correction rate, and assign the metric to the system (D-05, D-12)." }
H35: { titel: "{name} implemented controls without an effectiveness check", erklaerung: "Record in the statement of applicability how, when and by whom effectiveness was or will be checked (D-11). Start with the most important controls." }
# Further entries
H42: { titel: "Exception for {name} valid for longer than the AI policy allows", erklaerung: "The AI policy limits the validity of exceptions (D-03). Shorten the exception or renew it before it expires with a new decision by the responsible body (D-04)." }
H43: { titel: "Residual risk of {name} above the acceptance threshold without a reason", erklaerung: "A residual risk above the acceptance threshold needs a written reason from whoever accepts it (D-06, D-07); from the threshold ‘unacceptable’ onwards, a temporary exception as well." }
H44: { titel: "{name}: decision by a body below the decision rights", erklaerung: "The approval, acceptance of the residual risk or exception was made by a person who is not responsible for this risk level under the decision rights (D-04). After a full impact assessment, the approval counts as a decision at high risk. Obtain the decision of the responsible body or record the deviation." }
H45: { titel: "Supplier ‘{name}’ recorded as reviewed, but with open points", erklaerung: "Review questions or contract clauses are open or not met. Set the review status to ‘with conditions’ and record the conditions or actions, or resolve the points (D-16)." }
H46: { titel: "Document {name} reviewed after its approval", erklaerung: "The review by a second person takes place before the approval (D-26). Correct the date of the review or approve the document again after the review." }
H47: { titel: "{name} controls with the same text on effectiveness", erklaerung: "Many controls name the same check with the same result. Record for each control what was checked (sample, evidence) and what it showed (D-11); auditors compare the text with the audit checklist." }
H48: { titel: "Effectiveness of {name} evidenced by an audit that did not check the control", erklaerung: "The checklist of the audit named does not list the control, or lists it as ‘not auditable yet’ or ‘not audited’ (D-20). Name another check or record the effectiveness as still open." }
H49: { titel: "Risk {name} not reassessed after a change to the AI system", erklaerung: "The AI system was changed after the last assessment of this risk, e.g. retrained or given a new model or version. Reassess the risk and enter the date (D-06, D-07), even if the rating stays the same." }
# Further entries
F30: { titel: "AI system ‘{name}’: confidential data in a free or personal plan", erklaerung: "Free and personal accounts have no data processing agreement and no reliable commitments on training and retention. Lower the highest permitted data class to ‘internal’ or below, or move to a business or enterprise contract (D-10, D-16)." }
H50: { titel: "AI system ‘{name}’: dangerous combination for AI that acts", erklaerung: "The system reads third-party content, may process confidential data and acts without confirmation. Hidden instructions in an email or document can then carry data outside or trigger actions. Separate one of the three properties, e.g. confirmation for actions with external effect or no confidential data, and test misuse cases (D-12, D-15)." }
H51: { titel: "AI that acts ‘{name}’: impact of all risks at the lowest level", erklaerung: "The system carries out actions without confirmation. Rate the impact as if a wrong action went unnoticed; this usually raises it by one level (D-06). Reassess the risks or justify the low rating." }
H52: { titel: "Outdated or incomplete identifier ‘{name}’ in a free text", erklaerung: "Cite OWASP identifiers with the year, e.g. ‘LLM01:2026’; the numbers of the 2023, 2025 and 2026 lists denote different risks. AI Act articles from the draft (Art. 29 for deployer obligations, Art. 52 for transparency) are Art. 26 and Art. 50 in Regulation (EU) 2024/1689. Correct the text." }
H53: { titel: "AI system ‘{name}’: retirement by the provider passed or within 90 days", erklaerung: "Plan the replacement or the model change: review the successor, repeat the tests, reassess the risks (D-12). If the date has moved, enter the new date with its source in the inventory." }
H54: { titel: "Risk {name} without a treatment decision", erklaerung: "A low risk also needs a decision: retain deliberately, reduce, avoid or share. Record the decision; for ‘retain deliberately’, with person and date (D-07)." }
# Processes (from Processes)
F31: { titel: "Mandatory process {name} has no owner", erklaerung: "Every applicable mandatory process needs a responsible person who steers and improves it. Name the owner in the Processes area or the person for the suggested role in D-04." }
F32: { titel: "Process {name}: ‘not applicable’ without a sound justification", erklaerung: "Mandatory processes from clauses 4 to 10 cannot be excluded. Other processes need a justification for ‘not applicable’ that matches the statement of applicability (D-11)." }
H55: { titel: "Process {name}: run overdue", erklaerung: "According to the cycle or date, the process should already have run again. Carry it out or adjust cycle and date with a reason." }
H56: { titel: "Process {name}: maturity ‘implemented’ without run or record", erklaerung: "Implemented means the process has run at least once as described and a record of it exists. Enter the run and the record or lower the maturity." }
H57: { titel: "Process {name}: maturity ‘effective’ without a current value", erklaerung: "Effectiveness shows in the indicator. Choose an indicator (objective or measurement plan D-05) and record a value from the last twelve months." }
H58: { titel: "Process {name}: maturity ‘reviewed’ without audit and management review", erklaerung: "Reviewed means checked in the internal audit of the last twelve months and covered in the management review. Plan the check in the audit programme (D-20) or lower the maturity." }
H59: { titel: "Process {name}: open actions overdue", erklaerung: "Actions for the process have passed their due date. Carry them out or agree a new date with the responsible person (D-22)." }
H60: { titel: "Process {name}: run entered manually but not in the project data", erklaerung: "The project data show no run, although a date has been entered manually and the maturity is at least ‘implemented’. Record the evidence where it belongs (e.g. audit, risk assessment, approval) so that record and maturity match." }
H61: { titel: "Process {name}: lanes without role or shapes without assignment after draw.io", erklaerung: "When taking over from draw.io, not all lanes could be assigned to a role or not all shapes to a step. Assign the roles in the flow or adjust the file and take it over again." }
H62: { titel: "Process {name}: reference to the ISMS missing", erklaerung: "On the path with an ISMS, this process is run jointly with the ISMS. Record where it is described in the ISMS, e.g. manual and chapter." }
H63: { titel: "Mandatory process {name} in no internal audit of the cycle", erklaerung: "The internal audits of the last three years and the planned audits limit their scope to processes, but this mandatory process is not included in any of them. Add it to the scope of a planned audit (field ‘Processes in scope’, D-20) so that the audit programme covers everything within the cycle." }
H64: { titel: "Logo for a dark background", erklaerung: "The logo ({name}) is mostly light and hardly visible on the white pages of the documents. Under Settings › Document design, upload the version for a light background." }
H65: { titel: "Primary colour adjusted: {name}", erklaerung: "The primary colour has too little contrast on white for text or graphics. The documents therefore use the corrected colour in brackets. Check under Settings › Document design whether this suits your corporate design, or choose a darker colour from the design manual." }
# Further rules
H66: { titel: "Document {name} approved without review", erklaerung: "Before every approval, a second person reviews the document (D-26). Record in the document register who reviewed it and when; the header and the register then show the review." }
H67: { titel: "Process {name}: overdue without an action", erklaerung: "The process is overdue, but no open action sets who will catch up by when. Create an action for the process (origin ‘process’, referring to the process ID) or carry out the process." }
H68: { titel: "Process {name}: owner contradicts the responsibilities", erklaerung: "D-04 assigns the role area of the process to another person, or the owner is an external person. Name the responsible person as owner or adjust the responsibilities in D-04; external parties carry out, the company remains the owner." }
H69: { titel: "AI system ‘{name}’: full impact assessment needed", erklaerung: "A risk of the system has the highest impact on people or society. Under the procedure (D-06), this triggers a full impact assessment, but only a short check exists. Carry out the full assessment (D-09) or give new reasons for the rating of the risk." }
H70: { titel: "Introduction of the processes not planned as a change", erklaerung: "New processes and the process descriptions (D-27) change the management system. Plan the introduction as a change (action with origin ‘change’ referring to D-27 or the processes): purpose, consequences, resources, responsibility and deadline." }
H71: { titel: "Process {name}: external performance without control", erklaerung: "An external party carries out the process but is not recorded as a reviewed supplier, or the way it is controlled is missing. Record the provider in the supplier register (D-16) and state how the company controls it, e.g. contract, order, report and check." }
H72: { titel: "Own process {name} incomplete", erklaerung: "Like the catalogue processes, an own process needs triggers, inputs, outputs and records, documents, an indicator with a target value, an owner and a flow. Add the missing details to the description of the process." }
H73: { titel: "Process {name}: approval contradicts the decision rights", erklaerung: "An approval step in the flow lies with a lower level than the decision rights (D-04) require for the risks in the project, full impact assessments are not approved by top management, or the person who carries out an assessment approves it (D-08). Adjust the flow or the responsibilities." }
H74: { titel: "Process {name}: indicator does not fit the process", erklaerung: "The chosen indicator actions a different quantity than the indicator of the process, e.g. a count instead of a share or days instead of hours. Choose a fitting indicator in the measurement plan (D-05) or create a new one." }
H75: { titel: "Process {name}: never performed and no date", erklaerung: "The process has a frequency but has never run and has no next date. Carry it out and record performance and record, or set the first date." }
H76: { titel: "Library: review of {name} overdue", erklaerung: "The next review date has passed. Check whether the document is still valid: confirm it with a new review date, check in a new version or archive it (D-26)." }
H77: { titel: "Library: {name} approved without approval details", erklaerung: "An approved version does not state who approved it and when. Record the review and approval; the register and the document header then show them (D-26, 7.5.2)." }
H78: { titel: "Library: file of {name} changed outside", erklaerung: "The folder check found a file that was changed after check-in. Accept the change as a new version or restore the file; an approved document only changes through a new version (D-26)." }
H79: { titel: "Library: file of {name} missing", erklaerung: "The folder check no longer finds the file of a version in the library folder. File it again (for example from the data backup) or check the version in again; controlled documents must remain available (7.5.3)." }
H80: { titel: "Library in browser storage not backed up for more than 30 days", erklaerung: "The files are kept only in this browser and are lost when it is cleaned up. Back up the library as a ZIP file and keep the backup in a safe place, or connect a folder in Edge or Chrome." }
H81: { titel: "Use of ‘{name}’ affects rights but is not marked as sensitive", erklaerung: "The short check says the system affects people's rights or opportunities. Check in the impact assessment result whether the use is sensitive and justify the rating." }
H83: { titel: "Completed action ‘{name}’ has no sound evidence", erklaerung: "The chain from risk via control and action to evidence breaks here: evidence is missing or all of it is older than the action. Record which evidence shows implementation and effectiveness." }
H84: { titel: "Process {name} is implemented but has no reliable measured value", erklaerung: "A process from the level ‘implemented’ upwards is measured. Record the value of the indicator in the measurement plan (D-05) with a comparison against the target. If no measurement is possible, record ‘no occasion’ or ‘first measurement open’ with the reason, or lower the maturity." }
H85: { titel: "Risk counts as treated or accepted although actions are open", erklaerung: "Risk {name} still has open actions. Set the status to ‘in treatment’ until they are completed, or justify the acceptance without them." }
H86: { titel: "Effectiveness of {name} checked before the action was completed", erklaerung: "The check predates the completion of a related action, or the action is still open. Repeat the check afterwards." }
H87: { titel: "Library: {name} does not match the statement of applicability", erklaerung: "The entry is linked to a control that does not list it as evidence in D-11. Align the link and the statement of applicability." }
H88: { titel: "Approval not by top management: {name}", erklaerung: "Top management approves the policy, scope and project charter, and a person other than the owner. Choose the approving person again." }
H89: { titel: "Date in the future does not count as done yet: {name}", erklaerung: "The date of an approval, an audit or a management review is later than today. Enter it once it has taken place, or record it as an appointment." }
H91: { titel: "Fewer entries than recommended", erklaerung: "The help recommends three external and three internal topics and at least three sources for the inventory search. Few entries often miss something important; add to them or leave the note deliberately." }
H82: { titel: "Risk threshold can never be reached", erklaerung: "The ‘not tolerable from’ threshold is above the highest risk value of your scale. No risk would ever count as not tolerable. Adjust the scale or the threshold." }
# NIST AI RMF module
F27: { titel: "NIST AI RMF: gap {name} without a decision", erklaerung: "For subcategories the AIMS covers only partly, include the additional control in the statement of applicability or give reasons for not doing so (D-11). For a refinement, record in the profile where it is implemented (N-01, N-02)." }
F28: { titel: "Generative AI system ‘{name}’ without a complete assessment of the GenAI risks", erklaerung: "Decide for all twelve risks under NIST AI 600-1 whether they are relevant to the system and give a short reason (N-04)." }
F29: { titel: "Approved AI system ‘{name}’ without a test in the measurement and test plan", erklaerung: "Record at least one test with metric and threshold, or give reasons why the most important characteristic cannot be measured (N-03, RMF-09). H31 checks the deployment decision." }
H36: { titel: "The NIST AI RMF information is more than 6 months old", erklaerung: "Check on nist.gov whether a new version of the AI RMF or the GenAI profile has been published, and update the profile (N-01)." }
H37: { titel: "{name} subcategories with a target above the current level without an action", erklaerung: "Define an action in the treatment plan for every gap in the profile (M-xxx, D-07), or lower the target with reasons (N-01)." }
H38: { titel: "No target set in the NIST AI RMF profile", erklaerung: "Without a target, the profile shows no gaps. Decide which subcategories are to reach which level (N-01)." }
H39: { titel: "AI system ‘{name}’: relevant GenAI risk without an action", erklaerung: "Name an action for every relevant risk, e.g. an entry in the risk register, a rule in the acceptable use policy or an additional control RMF-Gxx (N-04, D-07, D-15)." }
H40: { titel: "AI system ‘{name}’ without an independent review of the measurements", erklaerung: "For in-house development, product AI or a link to health and safety, someone outside the team checks at least once a year whether metrics and tests detect errors (N-03, RMF-10). The internal audit can do this." }
H41: { titel: "Generative in-house development ‘{name}’ without base model or version", erklaerung: "Record the underlying model with its version in the inventory so that a change triggers a short review (D-10, RMF-16). H33 reports purchased systems." }
# Reference register: identifier without an entry
F33: { titel: "Reference without target: {name} (looking for: {fehlt})", erklaerung: "The identifier given belongs to no entry any more, for example because the entry was deleted. Select the correct entry or remove the reference. The jump leads to the entry that holds the reference." }
# Round 2b: status, validity in time, consistency (F35 replaces H90)
F34: { titel: "Control {name} is marked effective although a nonconformity on it is open", erklaerung: "While a nonconformity on this control is open, the records do not show effectiveness. Set the status to ‘implemented’ and refer to the finding; mark it ‘effective’ only after the effectiveness check of the correction." }
F35: { titel: "Process {name} is implemented but has no execution", erklaerung: "The level ‘implemented’ requires at least one execution with a record by the date of the rating. Record the last execution or lower the maturity." }
F36: { titel: "Document {name}: entries with an open placeholder", erklaerung: "The entries the document is built from still contain placeholders such as ‘not yet assigned’, ‘Add text’ or TODO. An approved document must not have open gaps: complete the entries listed or set the document back to draft." }
F37: { titel: "Roles in process flows without an assigned person: {name}", erklaerung: "These roles work in the lanes of processes but are neither an area of responsibility nor assigned to a person. D-04 then shows them as ‘not yet assigned’. Record the role as a row of the responsibilities (roles and people, ‘Add role’: area and responsible person) or select the role of the same name under ‘Role in the project’ for a person. Otherwise change the lane in the flow." }
F38: { titel: "AI system ‘{name}’: ‘legally reviewed’ without record or next to an open interpretation", erklaerung: "The entry ‘legally reviewed’ needs a record (who, when) and a settled interpretation. If the system is affected by an interpretation marked as open or to be checked in the legal status (E-09), remove ‘legally reviewed’ while the interpretation is open. Otherwise record who carried out the legal review and when." }
F39: { titel: "Evidence later than the statement: {name}", erklaerung: "The statement names an entry created only after its date, or an audit not carried out by then. Evidence can only support what came before it: correct the date or the evidence, or record the statement again with the later date." }
F40: { titel: "Reference to a version not yet approved: {name}", erklaerung: "The evidence refers to a document or version that was not yet approved on the date of the evidence, or an event is said to follow a document that did not exist then. Name the version valid at the time or correct the evidence." }
F41: { titel: "Status of {datum} later than the version: {name}", erklaerung: "The kit reviewed the legal status again on {datum}, after this version was approved; the document prints this date. Generate the document again, check the changes and approve it as a new version; if nothing changes, a confirmation of the version from that day is enough. If another entry states this status in its text, correct the date or record the statement with the later date." }
F42: { titel: "Process {name}: sample does not cover all systems counted", erklaerung: "The indicator counts systems as measured that the sample of the objectives did not cover at that time (for example because of ‘from 2027’ in the method) or that no objective lists. Correct numerator and target comparison or include the systems in the measurement." }
F43: { titel: "Process {name}: indicator without data source", erklaerung: "The records do not provide the data the indicator is calculated from, for example date and time in ‘Discovered’ and ‘Contained’ for every incident (D-22) or ‘Requested on’ and ‘Decided on’ in the approval list (D-10). Record the data, choose a measurable indicator or record ‘first measurement pending’ with a reason." }
F44: { titel: "Impact assessment {name}: same text for several objectives", erklaerung: "At least two cells repeat the benefit or harm of another objective word for word. An assessment that answers the objectives in the same way does not show that the impact was assessed for each objective. Describe for each objective what the system actually does for those affected. At most one repetition per assessment is allowed, namely when the effect really is the same; state that briefly in the text." }
F45: { titel: "Impact assessment {name}: extent differs from the risk register", erklaerung: "An objective names a risk from the register (D-07) but rates the extent differently from its impact before treatment. Both rate the harm before actions on the same scale from D-06. Align the extent, or give reasons and change the rating in the register." }
F46: { titel: "Impact assessment {name}: decision does not follow the threshold from D-08", erklaerung: "Under the procedure D-08, a threshold reached in the short review requires a full assessment and classification as sensitive use; harm with a high extent before actions allows the system only with restrictions, with conditions in the approval list (D-10), or not at all. Adjust the decision, the conditions or the status of the system." }
F47: { titel: "AI system ‘{name}’: sensitive use in the inventory differs from the impact assessment", erklaerung: "The AI inventory (D-10) records sensitive use differently from the latest impact assessment (D-09). The result of the assessment applies: take it over in the guide on the page ‘Result’ of the impact assessment with ‘Apply to the inventory’, or assess the system again." }
