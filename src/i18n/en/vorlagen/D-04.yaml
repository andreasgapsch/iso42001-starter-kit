freigabe_text: "Top management approved this assignment of roles on {datum}."
entscheidungsrechte_text: "Who decides depends on the risk level: low up to the acceptance threshold, high from the ‘unacceptable’ threshold of the risk criteria (D-06), medium in between. The highest risk of the AI system concerned in the risk register (D-07) applies. For accepting a residual risk, the value after treatment counts: a residual risk at or above the ‘unacceptable’ threshold cannot be accepted, only carried for a limited time as an exception (row ‘Grant an exception’, D-06). Regardless of the risk level, the reservations of the risk appetite in the AI policy (D-03) apply: what is reserved there for top management is decided by top management even at low or medium risk."
hinweis_entscheidungsrechte: "Adapt the suggestions to your organization and name roles rather than people, so that the table stays valid when staff change. Stopping must be quick: whoever oversees a system may suspend it without asking first. The limits of what is allowed at all are set by the risk appetite in the AI policy (D-03)."
entscheidungsrechte_kopf: [Decision, Low risk, Medium risk, High risk]
entscheide:
  einfuehren: Introduce an AI system
  restrisiko: Accept a residual risk
  ausnahme: Grant an exception
  stoppen: Stop or suspend a system
  ausserbetrieb: Retire a system
entscheidungsrechte_vorschlag:
  einfuehren: ["{{fakt:freigabe.einfuehren|gross}}", "{{fakt:freigabe.einfuehren|gross}} with the system owner", "{{fakt:freigabe.einfuehren-hoch|gross}}"]
  restrisiko: ["Risk owner", "{{fakt:freigabe.restrisiko|gross}}", "{{fakt:freigabe.restrisiko|gross}}"]
  ausnahme: ["AIMS lead", "AIMS lead with a member of top management", "Top management"]
  stoppen: ["Person overseeing the system, or system owner", "Person overseeing the system, or system owner", "Person overseeing the system, system owner or AIMS lead; top management informed"]
  ausserbetrieb: ["System owner", "AIMS lead", "Top management"]
keine_selbstfreigabe: "**No self-approval at high risk.** Whoever requests, operates or owns an AI system does not approve it at high risk and does not accept its residual risk. If one person holds both roles, the next higher level decides."
# Company document with organisation.naechsthoehereStelle
keine_selbstfreigabe_stelle: "**No self-approval at high risk.** Whoever requests, operates or owns an AI system does not approve it at high risk and does not accept its residual risk. If one person holds both roles, their superior decides; for a member of top management, top management without this person; for top management as a whole or its only member, the next higher body ({stelle})."
aufsicht_text: "Human oversight only works if the reviewer can actually intervene. Five checkpoints apply to every AI system with oversight (AI inventory, D-10):"
aufsicht_pruefpunkte:
  - "**Understands the consequences:** The person knows what a wrong output means for those affected and for us."
  - "**Sees source and proposal:** They see what the output is based on and can compare it with the input data."
  - "**Has time:** Volume and pace allow a genuine review."
  - "**May reject:** They can discard an output or stop the system without fear of disadvantage."
  - "**Remains accountable:** The decision stays with them, not with the system."
aufsicht_abnicken: "Anyone who confirms large numbers of outputs in a short time is no longer reviewing but rubber-stamping. Samples of the correction rate (D-05) show this: a rate close to zero across many cases is a warning sign."
anlage_verweis: "Decision rights by risk level and the requirements for effective human oversight are set out in Appendix A."
anlage_titel: Decision rights and human oversight
