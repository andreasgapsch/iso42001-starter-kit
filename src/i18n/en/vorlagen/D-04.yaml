# D-04 Roles, responsibilities and reporting channels
einleitung: "This document sets out who at [[Company name]] is responsible for which tasks in the AI management system and how employees report concerns about AI systems."
einleitung_firma: "This document sets out who at {firma} is responsible for which tasks in the AI management system and how employees report concerns about AI systems."
eb_einleitung_firma: "These sections extend the ISMS roles and organization document of {firma} with the tasks of the AI management system. Existing roles and committees remain in use; new roles are added only where the ISMS has no suitable one."
eb_einleitung: "Add these sections to your existing document. They extend your ISMS roles or organization document with the tasks of the AI management system. Use existing roles and committees instead of creating new ones."
eb_felder:
  dokument: Added to document
  version: Version and date
eb_platzhalter:
  dokument: Title of the existing document
  version: Version, DD/MM/YYYY
abschnitte:
  grundsaetze: Principles
  pflichtrollen: Required roles
  raci: Responsibilities by area
  bahnrollen: Roles in the process flows
  gremien: Committees
  meldeweg: Reporting of concerns
  entscheidungsrechte: Decision rights by risk level
  aufsicht: Effective human oversight
  freigabe: Approval
grundsaetze:
  - "Top management has overall responsibility for the AI management system and assigns the roles."
  - "A few people hold several roles. This is acceptable as long as nobody reviews their own work, especially in internal audits."
  - "Every role has a deputy. The people concerned know the roles and deputies."
  - "Changes to roles are updated in this document and communicated to employees."
hinweis_pflichtrollen: "Two tasks must be assigned explicitly: making sure the management system meets the standard, and reporting on its performance to top management. In an SME the same person often does both."
pflichtrollen_fehlen: "At least one of the two required roles has not yet been assigned; the assignment is made before approval."
pflichtrollen:
  aims: Responsible for the AI management system
  konformitaet: "Ensures that the management system meets ISO/IEC 42001 (5.3 a)"
  berichterstattung: "Reports on the performance of the management system to top management (5.3 b)"
  stellvertretung: Deputy
hinweis_raci: |
  Enter people or roles for each area:
  • R (responsible): does the task,
  • A (accountable): decides and answers for it, exactly one person,
  • C (consulted): is asked beforehand,
  • I (informed): is informed afterwards.
  The ‘Deputy’ column names who stands in for R.
  With an ISMS: use the existing responsibilities for information security and data protection.
raci_kopf: [Area, Tasks, R, A, Deputy, C, I]
prozessrollen: "Further roles in the process flows (lanes) and who performs them:"
prozessrollen_ki_eigner: "the system owner named for the AI system concerned in the AI inventory (D-10)"
prozessrollen_alle: "all employees in scope"
prozessrollen_offen: "not yet assigned"
