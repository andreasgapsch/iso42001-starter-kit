  - [Security or ISMS meeting, "AI risks, incidents, suppliers, status of actions", "[[e.g. quarterly]]", "[[Name, role]]"]
  - [IT or digitalization meeting, "Approval of new AI tools, AI inventory, changes to AI systems", "[[e.g. monthly]]", "[[Name, role]]"]
ausbau_gremien: "If you develop AI yourself or use many AI systems that affect people, you can set up a dedicated AI committee, e.g. to approve impact assessments. In that case, record its members, decision-making powers and how minutes are kept."
hinweis_meldeweg: "Employees and people working for you should be able to report concerns about AI systems without negative consequences. Use an existing channel, e.g. a whistleblowing office or the line manager with an alternative contact. The reporting channel for external parties is covered in D-14."
