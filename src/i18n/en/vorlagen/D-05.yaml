# D-05 AI objectives, metrics and measurement plan
blaetter:
  ziele: Objectives
  messplan: Measurement plan
  messwerte: Measurements
  nicht_gemessen: Not measured
titel_ziele: "AI objectives and planning"
titel_messplan: "Measurement plan: what, how, when and by whom"
titel_messwerte: "Measurements"
hinweise_ziele:
  - "Derive three to six objectives from the AI policy (D-03). Every objective needs a metric, a target value, an owner and a deadline."
  - "The suggestions in square brackets are placeholders. Adopt and adapt them, or delete them."
  - "At least one objective should concern the responsible use of AI. If you develop AI yourself, also set an objective for development."
  - "Evaluate the objectives at least once a year in the management review (D-21) and adjust them where needed."
hinweise_messplan:
  - "For each metric, define what is measured and how often, who measures, who evaluates and who receives the result."
  - "Besides the objectives, the measurement plan also covers the effectiveness of the controls, the results of internal audits, reports about AI systems and simple metrics per system (correction rate, response time). These rows are already prepared."
  - "Once a year, check whether the metrics and tests are fit for purpose: which errors, incidents or complaints did they fail to reveal in advance? The result belongs in the management review (D-21)."
  - "Rows PR-xx and PS-xx are the process indicators from D-27. From the level ‘implemented’ upwards, enter a first value on the sheet ‘Measured values’, with the process ID as the indicator."
  - "Column ‘AI systems’ in the Objectives sheet: systems to which an objective applies; empty means all. Every AI system with sensitive use should have at least one metric of its own."
  - "Column ‘Method and source’: name the template and the column the value comes from (for example AI inventory D-10, column ‘Life cycle’), or the record, such as minutes. For a sample, the method states its size. The denominator of the measured value is this size, and a metric across systems counts only the systems that the sample actually covers on the measurement date."
hinweise_messwerte:
  - "Enter every measurement with its date. The measurements are the evidence that you monitor and measure; keep them on file."
  - "Count every value from the records and state the numerator and denominator, for example ‘3 of 4 (75%)’. Compare it with the target in the column ‘Target met’."
  - "Do not estimate a figure: if there was no case, write ‘no occasion’. If the indicator cannot be measured yet (in the first year, for example, the implementation of decisions up to the next review), write ‘no measurement yet’ and give the reason in the remark."
spalten_ziele:
  - ID
  - Objective
  - Link to policy
  - Metric
  - Target value
  - What will be done
  - Resources
  - Responsible
  - Deadline
  - Evaluation of results
  - Status
  - AI systems
spalten_messplan:
  - ID
  - What is measured
  - Method and source
  - Frequency
  - Who actions
  - When evaluated
  - Who evaluates
  - Recipient
spalten_messwerte: [Objective or metric, Date, Value, Target met, Remarks]
listen:
