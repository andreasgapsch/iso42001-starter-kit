ausbau_leistung: "If you develop or operate AI yourself, also measure the performance of the AI systems themselves, e.g. error rate, change in the data over time (drift) or the share of outputs that people correct."
titel_nicht_gemessen: "Deliberately not measured"
hinweise_nicht_gemessen:
  - "Record what you deliberately do not measure and why, e.g. because a value is not available or the effort outweighs the benefit. Review the list annually together with the measurement plan."
spalten_nicht_gemessen: [What is deliberately not measured, Reason]
nicht_gemessen_vorschlag:
  - ["[[e.g. energy consumption of the AI services]]", "[[Providers give no figures per customer; low usage; review again if operated in-house]]"]
