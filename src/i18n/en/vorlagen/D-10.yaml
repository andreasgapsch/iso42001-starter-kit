# D-10 AI inventory and survey questionnaire
blaetter:
  inventar: Inventory
  ressourcen: Resources
  fragebogen: Business unit questionnaire
  freigabe: Approval list
titel_inventar: "AI inventory: all AI systems within the scope"
titel_ressourcen: "Resources per AI system"
titel_fragebogen: "Questionnaire: where do you use AI?"
titel_freigabe: "Approval list of AI tools"
hinweise_inventar:
  - "One row per AI system. Also record AI features in purchased software (e.g. assistants in office, CRM or HR applications) and shadow AI, that is, tools used without approval."
  - "Type: purchased (software or device), SaaS (cloud service), in-house (developed or retrained by you), shadow AI (in use without approval)."
  - "Sensitive use follows from the screening (D-08, D-09). Plan the next review no later than one year ahead."
  - "Acting AI: ‘Level of autonomy’ shows how far the system acts on its own: informs (gives information, drafts), recommends, prepares (e.g. a booking for confirmation), executes within limits (single actions without confirmation), acts in several steps (plans and carries out several steps with tools, so-called agents). From ‘executes within limits’ upwards the system needs a way to stop it, logs and named oversight. ‘Access and tools’ lists the systems, file stores, interfaces, connectors and extensions it can read or operate."
  - "Model and version: provider, model and version; for services the provider's statement with date. A model change triggers a reassessment (D-12). ‘Reads third-party content’ means emails, web pages or documents from others; together with ‘publicly accessible’ and ‘generative’ it determines whether misuse cases are tested (D-12)."
  - "Plan or type of contract: commitments on training, retention and contract depend on the offering, not on the provider. Confidential data only with business, enterprise contract or own operation. ‘Retirement by the provider’ is the announced date on which the model or service is discontinued; ‘Source of provider information’ names the reference and date retrieved at the manufacturer or provider, not from third-party collections."
  - "Critical for operations: if an outage disrupts important processes; then state the fallback. ‘Retain until’ applies to systems retired or replaced: until then records, outputs and settings are kept (D-12)."
hinweis_aiact: "You only need the ‘AI Act role’ and ‘AI Act risk class’ columns with the AI Act module (E-01, E-02). Otherwise leave them blank or hide them."
hinweise_ressourcen:
  - "One row per AI system from the ‘Inventory’ sheet. Key words are enough; refer to existing registers instead of copying them."
  - "Data: inputs, outputs and, if known, training data. Tools and models: model or service, version, provider. Computing resources: place of operation (own data centre, cloud with region, end device). People: roles for operation, oversight and support."
  - "Dependencies: systems and processes that feed data to the AI system or use its outputs. They show who is affected by an outage, a change or retirement."
hinweise_fragebogen:
  - "One row for each tool or feature that uses artificial intelligence; if in doubt, list it. The aim is an overview, not control. This includes free and private accounts used for work."
  - "Examples: chat and writing assistants (Microsoft 365 Copilot, ChatGPT and similar), AI features in CRM (lead scoring, text suggestions), HR tools (pre-selection of applications), translation, minutes and transcription of meetings, image and text generation, receipt recognition, chatbots on the website, and browser extensions and apps."
  - "The column headings stay unchanged. This allows the answers from all business units to be merged and transferred to the inventory."
hinweise_freigabe:
  - "This list shows which AI tools employees may use, under which conditions and up to which data classification. The rules are set out in the AI use policy (D-15)."
  - "Prohibited tools stay on the list with the reason, so that the decision can be traced."
  - "Extensions, connectors (including tool servers, for example under the Model Context Protocol), custom assistants and agents need their own approval: name the approved ones in the column ‘Approved access’. Anything else is not permitted (D-15)."
  - "Functions: the chosen setting for each function switch of the service, e.g. ‘Web search: on; Memory: off’. Functions not named are unclarified."
  - "‘Requested on’ and ‘Decided on’: date on which the request came in and date of approval or rejection (PR-07). The PR-07 metric calculates the days to the decision from these (D-05)."
hinweis_eb: "With an ISMS: either keep AI systems in the existing asset inventory with the tag ‘AI’ and the columns of this sheet, or keep this inventory and refer to the asset ID for each system (‘Resources’ sheet)."
ausbau_eigenbau: "For in-house developments: in the ‘Resources’ sheet, also record model versions, training and test data sets and development tools for each version (A.4.3, A.4.4, A.6.2.3)."
