  lebenszyklus: [idea, development, test, operation, retired]
  aiact_rolle: [provider, deployer, importer, distributor, product manufacturer, authorised representative]
  risikoklasse: [open, prohibited, high-risk Annex III, high-risk Annex I, transparency, minimal]
  herkunft: [provided by the company, AI feature in existing software, obtained myself or free version, developed myself]
  haeufigkeit: [daily, weekly, rarely]
  ja_nein_unklar: ["yes", "no", "don't know"]
  pruefung: [always, mostly, rarely or never]
  datenklasse: [public, internal, confidential, strictly confidential]
