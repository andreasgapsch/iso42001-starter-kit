  - ["Source and acquisition (A.7.3)", "[[Add text]]"]
  - ["Rights and legal basis", "[[Add text]]"]
  - ["Personal data and safeguards", "[[Add text]]"]
  - ["Volume, period, coverage", "[[Add text]]"]
  - ["Known gaps and biases", "[[Add text]]"]
  - ["Preparation (A.7.6)", "[[Add text]]"]
  - ["Quality check and result (A.7.4)", "[[Add text]]"]
  - ["Provenance and changes (A.7.5)", "[[Add text]]"]
  - ["Owner, storage, deletion", "[[Add text]]"]
