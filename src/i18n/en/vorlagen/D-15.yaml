# Traffic light: only tools for employees; own systems and product functions are covered by D-12
ampel_eigene: "Our own AI systems and the AI functions of our products ({systeme}) are not tools in the sense of this traffic light; approval and conditions under D-12 and the AI inventory (D-10) apply to them."
modul_kennzeichnung_leer: "**Only with the EU AI Act module:** Special obligations apply to chatbots, deep fakes and published AI-generated text (Art. 50, E-07)."
modul_kennzeichnung: "Special obligations under the EU AI Act apply to chatbots, deep fakes and published AI-generated text (Art. 50, E-07)."
