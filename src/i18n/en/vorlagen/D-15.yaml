# D-15 Policy on responsible use of AI
hinweis_umfang: "Two pages at most, clear to everyone. Enter the tools from the AI inventory (D-10) and refer to your data classes. Have staff confirm receipt (D-17)."
einleitung: "This policy applies to all staff and everyone working for [[Company name]] when they use AI tools, for example chatbots, assistants in office software, translation tools, and image and code generators."
einleitung_firma: "This policy applies to all staff and everyone working for {firma} when they use AI tools, for example chatbots, assistants in office software, translation tools, and image and code generators."
hinweis_eb: "Add sections 1 to 6 to your existing acceptable use policy. That policy already covers reporting, training and consequences of breaches; just add AI as a topic there."
einleitung_eb: "The following rules extend our acceptable use policy for IT resources to cover the use of AI tools."
