ampel_text: "For work, employees use only approved tools with the company account."
ampel_text_ausnahme: "For work, employees use only approved tools with the company account. Deviations apply only as a temporary exception under the AI policy (D-03); they are listed with their deadline below the traffic light."
ampel_fachanwendungen: "AI in equipment and business applications ({systeme}) is operated only by the people instructed for it; it is not a tool in the sense of this traffic light, and the conditions in the AI inventory (D-10) apply."
ampel_auflagen: "Conditions for the tools:"
ampel_ausnahmen: "Temporary exceptions under the AI policy (D-03), only for the stated purpose:"
datenklassen_isms: "The data classes are those of the information classification of our ISMS: **public** (intended for everyone), **internal** (for employees only), **confidential** (for a defined group only, for example customer, personnel and design data) and **strictly confidential** (serious harm if disclosed). If in doubt, the higher class applies."
datenklassen: "Data classes: **public** (intended for everyone), **internal** (for employees only), **confidential** (for a defined group only, for example customer, personnel and design data) and **strictly confidential** (serious harm if disclosed). If in doubt, the higher class applies."
