# D-16 Suppliers and purchased AI
modul_praefix_leer: "Only with the EU AI Act module:"
modul_praefix: "EU AI Act:"
modul_hinweis: "With review question PF-10 we clarify whether the supplier is the provider of an AI system or of a general-purpose AI model. E-03 and E-05 show the supplier's obligations and our obligations as deployer."
eb_titel: Supplementary sheet to supplier management
eb_einleitung: "This workbook extends our existing supplier procedure to cover purchased AI. The following points apply in addition in the procedure and in the supplier register; everything else remains unchanged."
eb_abschnitte:
  - "**Flag AI suppliers:** add the columns ‘AI systems’, ‘Review status’ and ‘Next review’ from the ‘Suppliers’ sheet to the supplier register."
  - "**Review items:** add the review questions to the pre-purchase assessment."
  - "**Contract clauses:** add the checklist to the contract review."
  - "**Allocate responsibilities:** for each AI system, record what lies with the supplier, with us and with the customer (A.10.2)."
  - "**Monitoring:** review AI suppliers at least once a year and whenever there is cause (rule in the ‘Suppliers’ sheet)."
