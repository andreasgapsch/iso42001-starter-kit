fragen:
  PF-01:
    thema: Training on our data
    frage: "Is it ruled out that the provider uses our inputs, files and outputs to train or improve its models, or can this be switched off?"
    warum: "Otherwise confidential content can turn up in outputs for others."
  PF-02:
    thema: Storage location and region
    frage: "Do we know in which countries data is stored and processed, and can we choose a region, for example Switzerland or the EU?"
    warum: "Data protection, customer contracts and confidentiality depend on the location."
  PF-03:
    thema: Retention and deletion
    frage: "Are retention periods defined for inputs, outputs and logs, and does the provider delete data on request with proof?"
    warum: "Data should not be kept longer than necessary."
  PF-04:
    thema: Subcontractors
    frage: "Is there a list of subcontractors, including the providers of the models used, and are changes announced in advance?"
    warum: "Many services pass data on to the developer of the model."
  PF-05:
    thema: Documentation
    frage: "Does the provider describe the purpose, capabilities, limits and known risks of the system well enough for us to inform our users? For AI that contributes to decisions about people: does the provider disclose the results of its tests for quality and bias?"
    warum: "Basis for tests, risks and information for users (D-12, D-14)."
  PF-06:
    thema: Notice of changes
    frage: "Does the provider announce model changes and significant changes in functionality at least [[30]] days in advance, and can we keep a tested model version for a transition period?"
    frage_firma: "Does the provider announce model changes and significant changes in functionality with reasonable notice, and can we keep a tested model version for a transition period?"
    warum: "After changes, we have to test again (D-12)."
  PF-07:
    thema: Incident reporting
    frage: "Does the provider report security and AI incidents that affect us to a named contact within a defined deadline?"
    warum: "We ourselves have to meet deadlines towards customers and authorities (D-14)."
  PF-08:
    thema: Security evidence
    frage: "Are current certificates or audit reports available, for example ISO/IEC 27001, ISO/IEC 42001 or SOC 2, and do they cover the service we use?"
    warum: "Saves our own audits if the scope fits."
  PF-09:
    thema: Data protection
    frage: "Is there a data processing agreement, and are transfers to other countries legally safeguarded?"
    warum: "Mandatory as soon as personal data enters the service."
  PF-10:
    thema: Role under the EU AI Act
    frage: "Has the provider clarified its role under the EU AI Act, and does it supply the documents we need as deployer?"
    warum: "Determines which obligations lie with the provider and which with us."
  PF-11:
    thema: Logs
    frage: "Do we receive usage and event logs to the extent and for the period needed (D-12)?"
    warum: "Without logs, incidents and misuse cannot be investigated."
  PF-12:
    thema: Central administration
    frage: "Can we control features, users and data access centrally, for example through an admin console and single sign-on?"
    warum: "This is the only way to enforce the rules from D-15 technically."
  PF-13:
    thema: Rights to outputs
    frage: "Is it settled who owns the outputs and who is liable if outputs infringe third-party rights?"
    warum: "Protects against claims under copyright or trademark law."
  PF-14:
    thema: Test before purchase
    frage: "Can we test the system with our own typical cases before purchase?"
    warum: "Testing before use (D-12) requires test access."
  PF-15:
    thema: Exit and emergencies
    frage: "Can we export our data in a common format and end the service without great effort, with deletion after the contract ends? For critical services, are there commitments on availability and support in an emergency?"
    warum: "Prevents lock-in and leftover data at the provider; critical services need a fallback (D-12)."
  PF-16:
    thema: Protection against manipulated inputs
    frage: "Does the provider describe how the service deals with manipulated inputs in chats, documents and emails, does it test this regularly (for example penetration tests) and does it accept reports on this in its vulnerability programme?"
    warum: "Hidden instructions cannot be prevented entirely; what matters is how the provider limits the damage."
  PF-17:
    thema: Permissions in search
    frage: "Does the system only see content that the person concerned has access to, and is this checked during the search, not only when results are displayed?"
    warum: "Otherwise, other people's or confidential data appears in answers."
  PF-18:
    thema: Extensions and actions
    frage: "Can we block or approve extensions, connectors, agents and actions individually, make actions with external effect subject to confirmation, and do we receive logs of the actions carried out?"
    warum: "Limits the scope of AI that acts; supplements PF-11 and PF-12."
  PF-19:
    thema: Costs and usage
    frage: "Can usage and costs be limited per account or application, with a hard cost cap rather than just a warning?"
    warum: "Protects against cost explosions through abuse, especially with usage-based billing."
  PF-20:
    thema: Display of answers
    frage: "Are external images, links and previews in answers loaded automatically, and can this be restricted?"
    warum: "Automatically loaded content is a known path for data leakage."
  PF-21:
    thema: Model, version and components
    frage: "Does the provider name the model, version and main components, does it fix known vulnerabilities within a set period, and are the licence and origin of open models and datasets clarified?"
    warum: "Basis for reassessment when the model changes (D-12) and for the rights to use it."
  PF-22:
    thema: Tool servers and connectors
    frage: "Are the origin, review and version of third-party tool servers, connectors and extensions used by the service known, can we restrict them to approved entries with a fixed version, and are the permissions of assistants in the browser or on the desktop defined?"
    warum: "Descriptions and updates of third-party tools can contain instructions that an agent follows."
  PF-23:
    thema: Identity of agents
    frage: "Do agents act with their own identity or with the permissions of the triggering person, with short-lived access instead of a service account with full permissions, and can we trace which agent did what?"
    warum: "Otherwise an agent reaches further than the person using it, and actions cannot be attributed to anyone."
  PF-24:
    thema: Provider access to content
    frage: "Is it disclosed who at the provider or its service providers can view inputs, files and results (e.g. for abuse review, labelling or troubleshooting), under which conditions and how this is logged?"
    warum: "Human access is a separate way for confidential data to leave the company."
  PF-25:
    thema: Caches and memory
    frage: "Are caches, memory and shared workspaces separated between customers and between people, and can stored entries be viewed and deleted?"
    warum: "Otherwise content of one person or another customer appears in someone else's answers."
  PF-26:
    thema: Emergency stop and withdrawal of permissions
    frage: "Can we pause agents and automations centrally and withdraw their access and permissions immediately, also outside office hours?"
    warum: "After a wrong action, what counts is how quickly further actions can be stopped (D-12)."
  PF-27:
    thema: Terms of use and licence restrictions
    frage: "Do the provider's terms of use allow our use, e.g. without a ban on automated decisions about people or for our industry, and do open models have no restrictions by territory, business or number of users that exclude us?"
    warum: "Use against the terms or the licence can cost access and give rise to claims."
klauseln:
  VK-01: { klausel: "No use of our data to train or improve models without written consent", bezug: PF-01 }
  VK-02: { klausel: "Location and region of storage and processing defined; changes only after notice", bezug: PF-02 }
  VK-03: { klausel: "Retention periods, deletion on request, and return or deletion at the end of the contract with confirmation", bezug: "PF-03, PF-15" }
  VK-04: { klausel: "List of subcontractors, notice of changes and right to object", bezug: PF-04 }
  VK-05: { klausel: "Notice of model changes and significant changes with reasonable lead time", bezug: PF-06 }
  VK-06: { klausel: "Reporting of security and AI incidents within an agreed deadline to a named contact", bezug: PF-07 }
  VK-07: { klausel: "Data processing agreement under the DSG (Swiss Federal Act on Data Protection) and, if applicable, the GDPR; safeguards for transfers abroad", bezug: PF-09 }
  VK-08: { klausel: "Confidentiality, including for the provider's staff and subcontractors", bezug: PF-01 }
  VK-09: { klausel: "Provision of documentation, logs and support with requests from authorities or customers", bezug: "PF-05, PF-10, PF-11" }
  VK-10: { klausel: "Right to current audit reports or certificates, or alternatively a right to information or audit", bezug: PF-08 }
  VK-11: { klausel: "Rights to outputs and indemnity against third-party claims", bezug: PF-13 }
  VK-12: { klausel: "Availability, support and emergency support, data export and exit without disproportionate costs", bezug: PF-15 }
  VK-13: { klausel: "Appropriate security actions against abusive and manipulated inputs, evidenced by regular security tests; known vulnerabilities fixed within an agreed period", bezug: "PF-16, PF-21" }
  VK-14: { klausel: "Enforcement of our users' access rights in search and answers", bezug: PF-17 }
  VK-15: { klausel: "Usage limits or a cost cap and notification when they are exceeded", bezug: PF-19 }
  VK-16: { klausel: "Access by the provider and its service providers to our content only for a defined purpose, logged and under confidentiality", bezug: PF-24 }
  VK-17: { klausel: "Separation of our data from other customers also in caches, memory and shared workspaces", bezug: PF-25 }
  VK-18: { klausel: "Pausing of agents and immediate withdrawal of their access and permissions at our request", bezug: "PF-23, PF-26" }
  VK-19: { klausel: "Notice of changes to the terms of use that restrict our use, with a reasonable period", bezug: PF-27 }
