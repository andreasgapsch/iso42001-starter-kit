titel_dienste: "Services, plans and functions"
hinweise_dienste:
  - "One row per purchased service or tool from the AI inventory (D-10). Commitments on training, retention and contract depend on the plan, not on the provider: the same provider has free, personal, business and enterprise offerings with different terms. If a company uses two plans of the same provider, it keeps two rows and answers the review questions for the plan it approves."
  - "Confidential or stricter data do not belong in a free or personal plan; it lacks a data processing agreement and commitments on training."
  - "Functions: record for each function whether it is switched on or off, e.g. web search, code execution, file upload, memory, connectors, own assistants and agents, sharing outside. Functions not recorded count as unclarified, not as switched off."
  - "Source of the information: reference at the manufacturer or provider (terms of contract, system card, admin console) with the date retrieved. Information from third-party collections does not replace the manufacturer's source."
spalten_dienste: [ID, Service or tool, Supplier, Plan or type of contract, Highest permitted data class, "Functions (on, off)", Retirement by the provider, "Source of information, retrieved on"]
hinweise_lieferanten:
  - "‘Supplier’ means whoever supplies the system to you; ‘provider’ is the role under the AI Act. Both can be the same company."
  - "One row per supplier that supplies AI or uses AI in its service, including AI embedded in software. The AI systems are listed in the AI inventory (D-10)."
regel_ueberwachung: "Rule: we review AI suppliers before purchase, then at least once a year, and also after an incident, a model change, new subcontractors or changed contract terms."
hinweise_fragen:
  - "Answer the questions from the supplier's documentation or by asking the supplier. ‘yes’ means: met. A ‘no’ leads to a condition, a risk in D-07 or rejection."
  - "PF-16 to PF-21 mainly concern generative AI (assistants, chatbots, platforms billed by usage). For a public chatbot on a cloud platform, PF-16, PF-19 and PF-21 are the most important."
  - "PF-22, PF-23, PF-25 and PF-26 concern AI that acts (agents, connectors, memory); without such functions, ‘yes’ with the remark ‘not used’ is enough. PF-24 and PF-27 apply to every service."
  - "Warning signs during the review: thin or outdated documentation, changes without notice, no information on security, unclear or changing subcontractors. Record such observations in the remarks and consider a risk in D-07."
hinweise_klauseln:
  - "For each supplier, check whether the contract contains the clause. For standard contracts of large providers, the reference in the terms and conditions is sufficient."
hinweise_verantwortung:
  - "The suggestions fit a typical SaaS service. Adapt the allocation for each AI system; copy the sheet if it differs a lot. The ‘Customer’ column applies only to AI in services for customers."
