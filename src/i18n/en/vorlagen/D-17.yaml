# D-17 Competence, awareness and communication
modul_praefix_leer: "Only with the EU AI Act module:"
modul_praefix: "EU AI Act:"
modul_hinweis: "Art. 4 requires providers and deployers to take actions to support the AI literacy of their staff and of other persons dealing with AI systems on their behalf; it does not require a guaranteed level. The concept and evidence are in E-04; the ‘Competence needs’ and ‘Training’ sheets serve as evidence."
eb_titel: Supplementary sheet to competence, awareness and communication
eb_einleitung: "This workbook extends our existing ISMS programme for competence, awareness and communication to cover AI. The following points are added; everything else remains unchanged."
eb_abschnitte:
  - "**AI competences:** transfer the roles from the ‘Competence needs’ sheet to the existing competence matrix."
  - "**AI awareness:** add the topics from the ‘Awareness’ sheet to the awareness programme."
  - "**Communication on AI:** add the entries from the ‘Communication plan’ sheet to the existing communication plan, internal and external."
  - "**Evidence:** record AI training in the existing training records under the topic ‘AI’ and check its effectiveness in the same way as for other training."
