titel_kompetenz: "Competence needs by role (7.2, A.4.6)"
titel_schulungen: "Training and briefings (evidence)"
titel_bewusstsein: "Awareness of all staff (7.3)"
titel_kommunikation: "Communication plan (7.4)"
hinweise_kompetenz:
  - "One row per role with AI tasks. The suggestions are a starting point: delete, add, enter names."
  - "‘Current’ shows whether the people have the competence today. Where they do not, plan an action and check later whether it worked, for example through a conversation, a test or a sample of their work."
hinweise_schulungen:
  - "One row per training session, briefing or information event. An attendance list, an e-learning confirmation or minutes are sufficient as evidence."
hinweise_bewusstsein:
  - "All staff know these topics. Record through which channel and when you informed them."
hinweise_kommunikation:
  - "What is communicated, when, by whom, to whom and how, internally and externally. Include at least one external entry, for example customer information or the reporting channel."
