titel_programm: "Audit programme across the certification cycle"
titel_plan: "Audit plan for a single audit"
titel_checkliste: "ISO/IEC 42001 checklist: clauses 4 to 10 and Annex A controls"
titel_feststellungen: "Findings from internal audits"
hinweise_programm:
  - "Plan the audits so that every clause of the standard and every applicable control is covered at least once within three years. In the first year, audit the whole AIMS, and do so before the stage 1 audit so that you still have time to deal with findings. Also name the processes from D-27 in the scope."
  - "First year: 9.3 and A.2.4 can only be checked after the first management review, and the review in turn needs the audit. So plan a short supplementary audit before stage 1, after the management review, to check these points and anything new since then (such as D-27)."
  - "Audit clauses 9.2, 9.3 and 10.2 every year, as well as AI systems with high risk or major changes. The suggested rows show one possible distribution; adapt them to your risks."
  - "Auditors do not audit their own work. In SMEs, an external auditor or a reciprocal audit with a partner company works well. Record in the ‘Independence’ column how you ensured this."
  - "The audit report consists of the checklist, samples and findings sheets together with the ‘Result and report’ column in the programme; a separate report document, for example in the ISMS format, names objective, scope, criteria, findings and recipients and is linked in the programme."
  - "With an ISMS: run one joint programme. Cover clauses 4 to 10 for both standards in the same interviews, and the Annex A controls of ISO/IEC 42001 with the checklist in this document."
hinweise_programm_eb:
  - "Extend your existing ISMS audit programme with rows or columns for the AIMS. One joint programme for both standards is sufficient."
  - "Within the three-year cycle, every clause and applicable control of ISO/IEC 42001 is audited at least once. Before the first certification, the AIMS is audited in full once."
  - "Anyone auditing the AIMS needs basic knowledge of AI and of ISO/IEC 42001 and does not audit their own work."
hinweise_programm_firma:
  - "Internal audits take place every year. Within the three-year certification cycle, all clauses and all applicable controls are audited at least once; 9.2, 9.3 and 10.2 every year."
hinweise_programm_firma_leer:
  - "No audit has been planned yet. The rows below are a suggestion for the three-year cycle."
hinweise_plan:
  - "One plan per audit. Send it to those involved in good time so that they can have their evidence ready."
  - "For the practical part, choose one or two AI systems as a sample, ideally including one with high risk. Clause 9.2 is audited by someone other than the person who runs the audit programme."
hinweise_checkliste:
  - "The review questions are prompts in our own words. Read the requirement text in your copy of the standard."
  - "Under ‘Evidence seen’, note the document, version or record, and under ‘Sample’, the example checked (for example AI system, date, person). Without evidence seen, there is no ‘conforming’."
  - "Result: ‘NC major’ if a requirement is not implemented at all or the effectiveness of the system is in doubt. ‘NC minor’ for a single gap in an otherwise effective process. ‘Observation’ if there is no deviation yet, but one is likely."
  - "Every nonconformity and observation receives a finding ID and is described in the ‘Findings’ sheet."
hinweise_checkliste_firma:
  - "The ‘SoA’ column shows the status of the statement of applicability (D-11). For controls that are not applicable, the justification is reviewed."
hinweis_checkliste_audit: "Evidence, samples and results of internal audit {audit}; the findings are in the sheet ‘Findings’. ‘Not auditable yet, planned’ means: not yet carried out at the time of the audit."
hinweis_soa_stand: "The column ‘SoA’ shows the status in the statement of applicability at the time of audit {audit}, not the current one."
# Additional controls of the statement of applicability (EU AI Act, own controls) in the checklist
frage_zusatz: "Is the control implemented and evidenced as described in the statement of applicability?"
dokumente_zusatz: D-11
spalte_dokumente: Documents
ablauf: Agenda
hinweise_feststellungen:
  - "Describe each finding so that it can be understood without the auditor: what was required, what was seen, where the deviation lies."
  - "Transfer every finding to the register D-22: nonconformities and observations to the sheet ‘Nonconformities’, improvements to the sheet ‘Improvements’. Root cause analysis, corrective action and the effectiveness check follow there."
ausbau: "With many AI systems or sites: set the audit frequency for each AI system according to risk (for example high risk every year, the rest within the cycle) and add a separate column for it in the audit programme."
