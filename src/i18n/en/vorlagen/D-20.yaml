fragen:
  K-4.1: "Which internal and external topics affect the AIMS, and has climate change been considered? Has the role of the organization been determined and justified for each AI system?"
  K-4.2: "Have the interested parties and their requirements been recorded? Has a decision been made for each requirement on whether the AIMS takes it up?"
  K-4.3: "Is the scope approved and available? Do boundaries, interfaces and exclusions fit the context, the interested parties and the AI inventory?"
  K-4.4: "Are the AIMS processes and how they interact described, and do they run that way in practice? Sample: one process from trigger to result."
  K-5.1: "What shows that top management stands behind the AIMS? Look for approvals, resource decisions, participation in the management review and its own communication."
  K-5.2: "Is the AI policy approved, suited to the organization, with a framework for objectives and the necessary commitments? Has it been communicated and is it available?"
  K-5.3: "Who makes sure the AIMS conforms to the standard, and who reports to top management on performance? Do the people interviewed know their role?"
  K-6.1.1: "Were risks and opportunities derived from the context and the requirements? Are there criteria for acceptable risks, and planned actions with an effectiveness check?"
  K-6.1.2: "Is there a fixed method that gives comparable results when repeated? Were consequences for the organization, for individuals and for society considered?"
  K-6.1.3: "Does every risk above the acceptance threshold have a treatment with controls? Is the statement of applicability fully justified, and are the plan and the residual risks approved?"
  K-6.1.4: "Is it defined when and how impact assessments are carried out? Do they exist for the AI systems concerned, and have the results fed into the risk assessment?"
  K-6.2: "Are the AI objectives measurable and aligned with the policy? Is it planned what will be done, with which resources, by whom and by when, and how success is measured?"
  K-6.3: "How were changes to the AIMS planned and carried out since the last audit? Sample: one change with purpose, consequences and approval."
  K-7.1: "Have staff, time, budget and tools for the AIMS been determined and provided? Were there bottlenecks, and how were they resolved?"
  K-7.2: "Have competence needs been determined for each role? Is there evidence, and has the effect of training been evaluated?"
  K-7.3: "Do the staff interviewed know the AI policy, their own contribution and the consequences if rules are not followed?"
  K-7.4: "Is it defined what is communicated about the AIMS internally and externally, when, to whom and how? Is there evidence that communication took place?"
  K-7.5: "Are documents and records identified, reviewed, approved, protected and retrievable in their valid version? Are external documents controlled?"
  K-8.1: "Are planned processes and controls applied in daily work? How are changes and outsourced services managed?"
  K-8.2: "Were risk assessments repeated at the defined intervals and after significant changes? Are the results filed with a date?"
  K-8.3: "Has the treatment plan been implemented, and is there evidence that the actions work?"
  K-8.4: "Were impact assessments repeated after changes and at the defined intervals? Are the results retained?"
  K-9.1: "Is it defined what is measured and evaluated, how and when? Are there results, and has the performance of the AIMS been evaluated?"
  K-9.2: "Is there an audit programme with scope, criteria and frequency? Are the auditors objective, and were the results reported to management?"
  K-9.3: "Has top management reviewed the AIMS at planned intervals? Were all required inputs covered, and were decisions on improvements and changes recorded?"
  K-10.1: "How is the AIMS improved on an ongoing basis? Look for an improvement register and suggestions that have been implemented."
  K-10.2: "Are nonconformities corrected promptly, investigated for their cause and resolved for good? Was the effectiveness of the correction checked?"
  A.2.2: "Is there an approved AI policy, and do the staff interviewed know it?"
  A.2.3: "Is it recorded which other policies touch on AI and how conflicts were resolved?"
  A.2.4: "Who reviews the AI policy, and how often? Is there a record of the last review?"
  A.3.2: "Have AI roles and responsibilities been assigned and made known? Sample: interview one role holder."
  A.3.3: "Is there a known channel that can be used confidentially to raise concerns about AI? How were the reports received handled?"
  A.4.2: "Are the resources of each AI system recorded, including for purchased and embedded AI?"
  A.4.3: "Is the data for each system described with its origin, type and protection needs?"
  A.4.4: "Are the models, services, versions and important tools known for each system?"
  A.4.5: "Are the operating location, infrastructure and dependencies described for each system?"
  A.4.6: "Are the roles involved in each system described with the knowledge they need?"
  A.5.2: "Is there a procedure with triggers, responsibilities, approval and repetition of impact assessments?"
  A.5.3: "Are the results of impact assessments documented, approved and retained?"
  A.5.4: "Were impacts on individuals and groups assessed, including vulnerable groups?"
  A.5.5: "Were impacts on society, such as on the environment or public opinion, assessed or excluded with a justification?"
  A.6.1.2: "Development only: have objectives for responsible development been set and built into the development process?"
  A.6.1.3: "Development only: is the development process defined with phases, checkpoints and approvals?"
  A.6.2.2: "Are the requirements for every new or changed AI system recorded, including for purchased systems?"
  A.6.2.3: "Are design and development documented so that decisions can be traced?"
  A.6.2.4: "Are there test and acceptance criteria, and are test results available before deployment?"
  A.6.2.5: "Was deployment planned and approved before production use? Sample: the most recent deployment."
  A.6.2.6: "How are the operation and performance of AI systems monitored, and who responds to deviations?"
  A.6.2.7: "Is the technical documentation needed by each audience available, for example for users, operations or customers?"
  A.6.2.8: "Is it defined which events are logged and how long logs are kept? Do the logs actually exist?"
  A.7.2: "Are there rules for handling data for the development and improvement of AI systems?"
  A.7.3: "Is it recorded where data comes from, how it was obtained and whether the rights to use it exist?"
  A.7.4: "Are data quality requirements defined and checked?"
  A.7.5: "Can the provenance of the data be traced along its entire path?"
  A.7.6: "Are the criteria and steps for data preparation defined and documented?"
  A.8.2: "Do users receive the information they need on the purpose, limits and correct use of the AI system?"
  A.8.3: "Can external parties report problems or concerns about an AI system, and are the reports handled?"
  A.8.4: "Is it defined who informs whom through which channel in an AI incident?"
  A.8.5: "Are information obligations towards customers, authorities and other third parties known and met?"
  A.9.2: "Are there rules for the responsible use of AI systems, and are they followed? Sample: approval of a tool."
  A.9.3: "Have objectives for responsible use been set and are they monitored?"
  A.9.4: "Are AI systems used only for their intended use and in line with the provider's instructions?"
  A.10.2: "Has it been agreed for each AI system what the organization, suppliers, partners and customers are responsible for?"
  A.10.3: "Are AI suppliers assessed before selection and monitored during operation?"
  A.10.4: "How are customer expectations and needs taken into account when AI is used?"
titel_stichproben: "Samples: one AI system through every step and audit tests"
hinweise_stichproben:
  - "Choose one AI system, preferably with high risk or many users, and trace it through steps 1 to 7. External auditors often work exactly like this: they ask to be shown a system that has passed every stage."
  - "Tests 8 to 13 uncover typical weaknesses that a document review misses. The column ‘Warning sign’ shows what to look out for. Ask for the last concrete case (‘Show me the last time that …’), not for the procedure."
spalten_stichproben: [No., Step, Audit question, Warning sign, Evidence seen, Result]
stichproben:
  - ["Inventory (D-10)", "Is the selected system recorded with system owner, purpose, scope of action, model and version?", "System missing from the inventory, or details do not match the demonstration"]
  - ["Risk (D-07)", "Are there dated risks for this system, with treatment and accepted residual risk?", "Only low risks; assessment older than the last significant change"]
  - ["Impact assessment (D-09)", "Is the screening or the assessment available, and is it dated before the approval?", "Assessment dated after introduction; fairness section empty"]
  - ["Statement of applicability (D-11)", "Are the controls referred to by the system's risks applicable, implemented and checked for effectiveness?", "Control excluded although a risk refers to it"]
  - ["Approval (D-10, D-12)", "Who approved the system, when and with which conditions? Does this match the decision rights (D-04)?", "Self-approval at high risk; conditions not implemented"]
  - ["Operation (D-12, D-05)", "Are samples, correction rate, logs and the review at the defined interval available?", "No measurement since introduction; review overdue"]
  - ["Incidents and reports (D-14, D-22)", "Were reports on this system handled and lessons carried over into risks, rules or training?", "Report not closed; same cause several times"]
  - ["Inventory complete", "Ask two departments which AI tools they use and compare with the inventory.", "Tool mentioned is missing from the inventory (shadow AI)"]
  - ["Correction rate plausible", "Look at the correction or override rate of a system with human review.", "0% across many decisions (rubber-stamping) or a very high rate (system not fit for purpose)"]
  - ["Training effect", "Ask a person a test question, e.g. ‘May customer data be entered into a freely available chatbot?’.", "Training rate 100%, but wrong answer"]
  - ["Reporting channel in practice", "Trace one report or alert from receipt to closure.", "No documented response; deadline missed"]
  - ["Earlier findings", "Sample closed findings: is effectiveness evidenced and has the problem not recurred?", "Closed without effectiveness check; deviation repeated"]
  - ["Management review", "Do the minutes contain decisions with owners and deadlines?", "Only noted, no decisions"]
