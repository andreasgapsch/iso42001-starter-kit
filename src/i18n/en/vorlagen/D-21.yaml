  modul: "(only with AI Act module)"
pflicht:
  - { punkt: "Status of actions from previous management reviews", unterlagen: "Actions from the last review, {{fakt:register.massnahmen}}" }
  - { punkt: "Changes in internal and external topics relevant to the AIMS", unterlagen: "D-01 (topics, role, climate change)" }
  - { punkt: "Changes in the needs and expectations of interested parties", unterlagen: "D-01 (register of interested parties)" }
  - { punkt: "Performance: nonconformities and corrective actions, with trends over time", unterlagen: "D-22" }
  - { punkt: "Performance: monitoring and measurement results, achievement of AI objectives", unterlagen: "D-05" }
  - { punkt: "Performance: results of internal and external audits", unterlagen: "D-20, audit reports" }
  - { punkt: "Opportunities for continual improvement", unterlagen: "{{fakt:register.massnahmen|gross}}" }
empfohlen:
  - { id: inventar, punkt: "AI inventory: new, changed and replaced systems, shadow AI; systems that missed their expected benefit: continue, change or replace?", unterlagen: "D-10, D-09" }
  - { id: risiken, punkt: "AI risks, residual risks and impact assessments", unterlagen: "D-07, D-09" }
  - { id: meldungen, punkt: "Reports, concerns and AI incidents", unterlagen: "D-04, D-14" }
  - { id: lieferanten, punkt: "AI suppliers: results of reviews", unterlagen: "D-16" }
  - { id: ziele, punkt: "AI objectives for the next period; are metrics and tests fit for purpose, which errors did they miss?", unterlagen: "D-05" }
  - { id: ressourcen, punkt: "Resources for the AIMS: staff, time, budget", unterlagen: "D-00, D-05" }
  - { id: aiact, punkt: "EU AI Act status: roles, classifications, deadlines", unterlagen: "E-01 to E-03, E-09", modul: true }
  - { id: leitlinie, punkt: "Review of the AI policy (A.2.4)", unterlagen: "D-03" }
isms:
  - { punkt: "ISMS: feedback from interested parties on information security", unterlagen: "ISMS documents" }
  - { punkt: "ISMS: results of the risk assessment and status of the treatment plan", unterlagen: "ISMS risk register" }
  - { punkt: "ISMS: achievement of information security objectives", unterlagen: "ISMS objectives" }
beurteilung_felder:
  geeignet: "Does the AIMS fit the organization and its AI systems?"
  angemessen: "Are scope and resources sufficient?"
  wirksam: "Does the AIMS achieve its objectives?"
beurteilung_platzhalter: "yes/no, short reason"
# Answer per question of the overall assessment (gesamtbeurteilung.<frage>.urteil)
beurteilung_urteil:
  ja: "yes"
  nein: "no"
  offen: "not yet fully assessed"
