  aenderung: Change to the AIMS
  ressourcen: Resources
  ziele: Objectives
  restrisiko: Residual risk
entscheide_kopf: [No., Decision, Type, "Owner, deadline, action"]
entscheide_arten: "Improvement, change to the AIMS, resources, objectives, acceptance of residual risks"
entscheide_leer: "[[Improvement / change to the AIMS / resources / objectives / residual risk]]"
massnahmen_kopf: [ID, Action, Owner, Due date, Status]
massnahmen_hinweis: "Transfer each action with its ID to the {{fakt:register.massnahmen}}; the planned changes are kept there too (D-26). Every action needs an owner and a due date."
massnahme_status:
  offen: open
  in-arbeit: in progress
  erledigt: completed
  verworfen: rejected
rhythmus_text: "The management review takes place once a year; in the certification cycle, after the internal audit and before the external audit. After major changes, top management calls an extraordinary review. Next regular review: {naechste}."
freigabe_text: "Top management approved the minutes on {datum}."
ausbau: "With many AI systems: attach an overview for each system (status, risks, impact assessment, incidents, metrics). This keeps the meeting short, and the documents provide evidence for the review."
eb_einleitung: "This supplementary sheet lists the items to add to the existing ISMS management review. The required inputs are structured the same way in both standards; cover them in one meeting for both systems and add the AI perspective."
eb_einleitung_firma: "The management review at {firma} covers the ISMS and the AIMS in one joint meeting. This sheet lists the additional items for the AIMS."
eb_traktanden: Additional agenda items for the AIMS
eb_pflicht_titel: AI perspective on the shared required inputs
eb_pflicht_kopf: [No., Required input, What the AIMS adds, Outcome and assessment]
eb_pflicht:
  - ["Status of previous actions", "Actions from AI risks, impact assessments and AIMS audits"]
  - ["Changes in topics", "Role for each AI system, new technology, AI law, climate change"]
  - ["Changes in interested parties", "People affected by AI decisions, customers with AI requirements, supervisory authorities"]
  - ["Performance: nonconformities", "Nonconformities and corrective actions related to AI"]
  - ["Performance: monitoring, measurement, objectives", "Metrics of the AI systems, achievement of AI objectives (D-05)"]
  - ["Performance: audits", "Audit results on ISO/IEC 42001, including Annex A"]
  - ["Improvements", "Suggestions from reports, monitoring and supplier reviews; actions and planned changes in the {{fakt:register.massnahmen}}"]
eb_traktanden_kopf: [No., Agenda item, Documents, Outcome and assessment]
# First review: instead of ‘Status of actions from previous management reviews’ (there are none) the status of actions from the implementation
erste_massnahmen: { punkt: "Status of actions from implementation and risk treatment (first review)", unterlagen: "D-07 (treatment plan), D-22" }
eb_erste_massnahmen: ["Status of actions (first review)", "Actions from implementation, AI risks and impact assessments"]
