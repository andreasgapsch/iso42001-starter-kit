# D-21 Management review
hinweis_umfang: "Top management reviews the AIMS at least once a year, with the first review before the stage 1 audit and after the first internal audit. More often is not necessary; hold an extraordinary review after major changes, such as a new high-risk AI system. Prepare a short overview for each agenda item so that the meeting takes no more than two hours."
hinweis_isms: "With an ISMS: hold one joint meeting with one set of minutes for both standards. Cover the items marked ‘ISMS’ for the ISMS only and all other items for both systems."
hinweis_protokoll: "Record the outcome in the last column: briefly, what was presented, how top management assesses it and whether a decision is needed. An auditor looks for an entry for each required input."
hinweis_entscheide: "A management review is not complete without decisions. Also record when no change is needed, with a short reason."
einleitung: "With this document, the top management of [[Company name]] reviews whether the AI management system (AIMS) is suitable, adequate and effective, and decides on improvements and changes."
einleitung_firma: "With this document, the top management of {firma} reviews whether the AI management system (AIMS) is suitable, adequate and effective, and decides on improvements and changes."
einleitung_isms: "The review takes place together with the ISMS management review."
abschnitte:
  rahmen: Meeting details
  agenda: Agenda and minutes
  pflicht: Required inputs
  empfohlen: Recommended items
  isms: Additional items for the ISMS
  beurteilung: Overall assessment
  entscheide: Decisions on improvements and changes
  massnahmen: Actions
  rhythmus: Frequency and next review
  freigabe: Approval of the minutes
felder:
