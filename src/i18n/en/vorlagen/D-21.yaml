  ort: Place or format
  leitung: Chair
  teilnehmende: Participants
  protokoll: Minutes taken by
  zeitraum: Review period
  isms: Joint with ISMS
  vorher: Last review
  kennung: Reference
platzhalter:
  ort: "Meeting room or online"
  teilnehmende: "Top management, AIMS lead, others"
  zeitraum: "DD/MM/YYYY to DD/MM/YYYY"
  vorher: "DD/MM/YYYY or first review"
