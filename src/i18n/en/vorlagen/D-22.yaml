# D-22 Nonconformities and improvements
blaetter:
  nk: Nonconformities
  verbesserungen: Improvements
  zusatz: Additional AI fields
  meldungen: Reports
titel_nk: "Nonconformities and corrective actions"
titel_verbesserungen: "Improvements"
titel_zusatz: "Additional fields for the existing ISMS register"
titel_meldungen: "Reports, feedback and objections"
hinweise_meldungen:
  - "Record every report from employees (reporting channel, D-04) and all feedback or objections from customers and affected persons (contact channel, D-14) with receipt, acknowledgement and closure. This makes it possible to measure the number of reports and the response time (D-05)."
  - "If a report reveals a deviation, an incident or a near miss, also record it in the sheet ‘Nonconformities’ and name the finding in the result."
spalten_meldungen: [ID, Received, Type, Origin, Channel, AI system, Description, Handled by, Acknowledged on, Days to acknowledgement, Closed on, Result and response, Status]
hinweise_nk:
  - "A nonconformity is a requirement that has not been met: from the standard, from our own rules, from law or from a contract. Sources are audits, the management review, incidents, checks and reports."
  - "Proceed in this order: correct immediately and limit the consequences, look for the cause (for example by asking ‘Why?’ five times), check whether similar cases exist or could occur, define and implement the corrective action, and check its effectiveness after a set period."
  - "Close an entry only once its effectiveness is proven. Where AI is involved, check whether the risk assessment (D-07), the impact assessment (D-09) or the use rules (D-15) need to be updated."
  - "Do not keep separate ‘preventive actions’. Record possible future deviations as risks in the register D-07, where they are assessed and treated."
  - "Incidents and near misses (events without harm that only ended well through luck or timely intervention) also belong here, so that errors, incidents and near misses are counted in one place. The ‘Severity’ column uses the four levels from D-14."
  - "For incidents and near misses, record date and time in ‘Discovered’ and ‘Contained’. The PR-19 metric calculates the hours until containment from these (D-05)."
  - "‘Area’ column: without an ISMS, ‘AIMS’. If an ISMS is added later, keep using the same register for both."
hinweise_verbesserungen:
  - "Record suggestions here that make the AIMS better without any requirement having been breached: from audits (observations), reports, metrics, supplier reviews or from staff."
  - "Also keep planned changes to the AIMS (ISO/IEC 42001, 6.3) here, with purpose, consequences and owners (rules in D-26). The management review (D-21) sets the priorities in the list."
hinweise_zusatz:
  - "With an ISMS, you keep one joint register. Add the following fields to your existing register so that AI topics can be analysed."
  - "If your ISMS does not yet have an improvement register, use the ‘Improvements’ sheet for both systems."
ausbau: "Analyse the register once a year for the management review: number by grading, severity and area, near misses, time to closure, recurring causes."
