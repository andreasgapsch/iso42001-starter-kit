# Data source of the PR-19 metric (AF-104), placed after ‘Severity (incident)’ on the sheet
spalten_vorfall: ["Discovered (date, time)", "Contained (date, time)"]
spalten_verbesserungen:
  - No.
  - Date
  - Description
  - Source
  - Area
  - Priority
  - Owner
  - Start
  - Completion
  - Status
  - Result
spalten_zusatz: [Field, Purpose, Values or example, Clause reference]
zusatz_zeilen:
  - [Area, "Shows whether the ISMS, the AIMS or both are affected; allows analysis by system.", "ISMS, AIMS, both", "10.2"]
  - [AI system, "Links the deviation to the AI inventory.", "ID from D-10, for example KI-003", "10.2, A.4.2"]
  - [Clause reference 42001, "Clause or control of ISO/IEC 42001 that was not met.", "for example 6.1.4 or A.6.2.6", "10.2"]
  - [AI cause category, "Helps to identify causes typical of AI.", "Data, model, use outside the purpose, competence, supplier, process", "10.2"]
  - [Similar cases, "Records whether the cause also affects other AI systems or processes.", "yes (which) or no", "10.2"]
  - [Risk or impact assessment updated, "Makes sure that findings feed into D-07 and D-09.", "yes, no, not needed", "10.2, 8.2, 8.4"]
  - [Severity (incident), "Makes incidents and near misses comparable and drives escalation.", "1 minor, 2 moderate, 3 significant, 4 severe (levels from D-14)", "10.2, A.8.4"]
  - [Reporting obligation checked, "Checks whether the deviation must be reported to third parties or authorities.", "yes, no, not needed", "A.8.4, A.8.5"]
  - ["Discovered (date, time)", "Time at which an incident or near miss was noticed; start of the PR-19 measurement.", "DD/MM/YYYY hh:mm", "10.2, A.8.4"]
  - ["Contained (date, time)", "Time from which the incident can cause no further harm; end of the PR-19 measurement.", "DD/MM/YYYY hh:mm", "10.2, A.8.4"]
