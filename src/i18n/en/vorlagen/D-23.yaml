# D-23 Integration matrix ISO/IEC 27001 and 42001
hinweis_einschaetzung: "The mappings in this document are a professional judgement, not a statement made by the standards. They show where ISMS evidence can be reused and do not replace a case-by-case review."
normverweis_27001: "For the requirement text, see ISO/IEC 27001:2022, clauses 4 to 10 and Annex A. The standard is available from SNV, DIN or ISO."
normverweis_27001_firma: "Reference: ISO/IEC 27001:2022, clauses 4 to 10 and Annex A."
blaetter:
  dokumente: Documents
  kapitel: Clauses 4 to 10
  mapping: Control mapping
  katalog: Catalogue 27001
titel_dokumente: "AIMS documents and their ISMS counterparts"
titel_kapitel: "Clauses 4 to 10: running them jointly"
titel_mapping: "Mapping of ISO/IEC 42001 Annex A to ISO/IEC 27001:2022 Annex A"
titel_katalog: "ISO/IEC 27001:2022 Annex A with mapped 42001 controls"
hinweise_dokumente:
  - "‘reused’: the ISMS document also applies to the AIMS, extended by a supplementary sheet. ‘extended’: AI content is added to the ISMS document. ‘new’: the AIMS needs a document of its own."
  - "With an ISMS, the sheet D-xx-EB applies instead of a separate document for documents marked ‘Supplementary sheet yes’."
hinweise_kapitel:
  - "Clauses 4 to 10 have the same structure in both standards. ‘yes’ means: one process and one set of evidence for both systems. ‘partly’ means: common framework, AI content must be added. ‘no’ means: AIMS only, with no ISMS counterpart."
hinweise_mapping:
  - "Strength ‘high’: the ISMS evidence largely covers the AI control. ‘medium’: process and format can be reused, AI content is missing. ‘low’: only a starting point."
  - "For security threats against AI systems themselves, ISO/IEC 27090:2026 is an additional source of controls; the kit does not map it here."
hinweise_mapping_firma:
  - "The ‘Linked in the SoA’ column shows whether the statement of applicability (D-11) lists the 27001 control as reused evidence."
hinweise_katalog:
  - "Short names in our own words, not the titles used in the standard. The requirement text is in the edition of the standard."
