weiter_liste:
  - "With the AI Act module: record the roles in E-01, determine the risk class in E-02, derive the obligations in E-03. Deadlines and status are in E-09."
  - "Without the module: record the role for each system in the inventory (D-10) and check once a year whether a link to the EU has arisen."
  - "We have classifications involving high risk, changes of role under Art. 25 and borderline cases reviewed by a lawyer."
