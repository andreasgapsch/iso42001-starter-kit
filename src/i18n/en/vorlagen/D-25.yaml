stelle_liste:
  - "**Accreditation:** we choose a body accredited for ISO/IEC 42001. Certification bodies are accredited to ISO/IEC 17021-1 and, for ISO/IEC 42001, also meet the requirements of ISO/IEC 42006. In Switzerland, accreditation is granted by the Swiss Accreditation Service (SAS), in Germany by DAkkS and in Austria by Akkreditierung Austria. We check the scope of the accreditation in the public register."
  - "**Competence:** ISO/IEC 42006 sets out the competence that bodies and audit teams need for AI management systems. We ask about the AI experience of the proposed team and its knowledge of our industry."
  - "**Compare quotations:** we obtain two or three quotations and compare audit days for stage 1, stage 2 and surveillance, travel costs, the share of remote work, language, dates and the costs over the whole cycle."
  - "**With an ISMS:** a combined audit with ISO/IEC 27001 at the same body saves audit days, because clauses 4 to 10 are audited together."
# Company document with a chosen body (instead of quotations and ‘With an ISMS’)
stelle_titel_gewaehlt: Certification body
stelle_gewaehlt: "**Chosen body:** {stelle}."
stelle_akkreditiert: "**Accreditation:** the body is accredited for ISO/IEC 42001. Certification bodies are accredited to ISO/IEC 17021-1 and, for ISO/IEC 42001, also meet the requirements of ISO/IEC 42006; in Switzerland, accreditation is granted by the Swiss Accreditation Service (SAS). We have checked the scope of the accreditation in the public register."
stelle_kombiniert: "**Combined audit:** the body audits ISO/IEC 27001 and ISO/IEC 42001 together; clauses 4 to 10 are audited jointly."
stelle_isms_firma: "**Combined audit:** a combined audit with ISO/IEC 27001 at the same body saves audit days, because clauses 4 to 10 are audited together."
stage1_titel: "Stage 1: document review and readiness"
stage1_liste:
  - "The body reviews the scope, policy, risk and impact assessment procedures, statement of applicability, internal audit and management review."
  - "It establishes whether the AIMS is ready and plans stage 2. We resolve open points from the report before stage 2; the body sets the interval."
stage2_titel: "Stage 2: effectiveness in practice"
stage2_liste:
  - "The body checks whether the AIMS is applied as described: interviews with top management, the AIMS lead, system owners and users."
  - "It takes samples of AI systems and follows them through: inventory entry, AI risk assessment, impact assessment, approval, monitoring, supplier, records."
feststellungen_liste:
  - "**Major nonconformity:** a requirement has not been implemented, or the system does not work in one area. The certificate is issued only once the correction has been demonstrated."
  - "**Minor nonconformity:** a single gap in an otherwise effective process. An action plan is usually sufficient; the body checks implementation at the next audit."
  - "**Deadlines and format** of the action plan are set by the body. We record every finding in D-22 with cause, corrective action and effectiveness check."
zyklus_text: "The certificate is valid for three years. In each of the two following years, a surveillance audit checks part of the AIMS. Recertification follows before expiry. The same order every year works well: internal audit, management review, external audit."
nachweise_text: "For each clause and for important controls: which evidence is expected and in which document it is produced."
