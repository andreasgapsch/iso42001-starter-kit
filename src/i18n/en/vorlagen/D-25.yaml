controls_kopf: [Control, Topic, What the auditor looks for]
wichtige_controls: [A.2.2, A.3.3, A.4.2, A.5.3, A.6.2.6, A.6.2.8, A.8.4, A.9.2, A.10.3]
haeufig_hinweis: "Practical observation based on published experience reports from consulting and certification firms. The order is not a statistic."
haeufig_kopf: [Finding, How to avoid it]
haeufig:
  - ["AI inventory and scope incomplete, especially for AI in purchased software and cloud services", "Compile the inventory with a questionnaire to all teams, look for shadow AI, include embedded AI features (D-10)"]
  - ["Risk assessment in general terms rather than per system, without acceptance of residual risks and without triggers for reassessment", "Assess risks for each AI system, accept residual risks with name and date, define triggers in D-06 (D-07)"]
  - ["Impact assessment missing or incomplete; exclusions in the statement of applicability without justification", "Screening for every system, full impact assessment above the threshold (D-09); justify every exclusion (D-11)"]
  - ["Gap between policy and practice: no evidence of tests, logs, approvals or human oversight", "Name evidence with its storage location for each control and take our own samples before the audit (D-11, D-12)"]
  - ["Weak internal audit, management review without all required inputs, corrections without root cause analysis", "Bring in an independent auditor (D-20), use an agenda with all required inputs (D-21), document cause and effectiveness (D-22)"]
