# D-25 Certification roadmap
hinweis_umfang: "This guide shows the path from an established AIMS to the certificate. It does not replace the rules of your certification body; ask them about the process, deadlines and documents."
einleitung: "Certification to ISO/IEC 42001 is confirmation by an independent body that the AI management system meets the standard and works. It does not check whether an individual AI system complies with the law."
einleitung_firma: "This roadmap shows how {firma} has its AI management system certified: status of the prerequisites, chosen body, procedure, handling of findings, cycle, evidence and schedule. Certification confirms the management system, not the legal compliance of individual AI systems."
nachweise_titel_firma: Evidence for each clause
nachweise_text_firma: "For each clause: where the evidence is kept in our AIMS."
zeit_titel_firma: Schedule
