# Modul NIST AI RMF
nist_praefix_leer: "Only with the NIST AI RMF module."
nist_aims: "the AIMS"
nist_aims_zertifiziert: "the certified AIMS"
nist_liste:
  - "**No certification:** NIST does not certify, and there is no accredited certificate under the AI RMF. The correct statement is ‘aligned with the NIST AI RMF’, not ‘NIST certified’."
  - "**Evidence for customers:** When customers ask about the AI RMF, we present the profile (N-01) and the coverage matrix (N-02): which subcategories {aims} covers and how the additional controls close the rest."
  - "**Audit:** The additional controls RMF-xx are in the statement of applicability (D-11). The certification body checks them like other additional controls for implementation, not for conformity with the AI RMF."
