# D-27 Process descriptions (process manual or a single process). Process texts: src/i18n/en/prozesse.yaml
hinweis: "The manual contains one chapter for each applicable process. Adapt roles, steps and records to your company and name an owner for each process. The flow can be edited in the AIMS Manager or exchanged as a file for draw.io; the diagram follows the flow. Chapters PS-02, PS-04 and PS-06 are sample texts for base processes that the kit recommends without an ISMS: without an ISMS, adapt them and delete the references to ISO/IEC 27001 and the ISMS; with an ISMS, replace them with a reference to the relevant place in the ISMS."
einleitung: "This manual describes the processes of the AI management system of [[Company name]]: who does what in which order, which records are produced and how the process is measured."
einleitung_firma: "This manual describes the processes of the AI management system of {firma}: who does what in which order, which records are produced and how the process is measured."
einleitung_einzeln: "This description sets out one process of the AI management system of {firma}: who does what in which order, which records are produced and how the process is measured."
lesehilfe: "In the flow, each role has its own column (lane). The lane carries out the step or is accountable for it; if another role is accountable for the step or carries it out, the table names it in the column ‘Role’, together with who contributes and who is informed. Shapes highlighted in yellow are decisions. The following table names the maturity levels and their criteria."
