fristen_text: "The deadlines come from Art. 113 and Art. 111 as amended and from mandates given to the Commission. Art. 113 has unnumbered paragraphs; they are numbered here as in Art. 111 (‘Art. 113(3)(c)’ is paragraph 3, point (c))."
fristen_kopf: [Date, Type and reference, What applies]
arten: [Application, Transition, Commission]
systeme_text: "When the main obligations of each risk class apply. Art. 4 (AI literacy) and Art. 5 (prohibitions) already apply to all systems; details per obligation in E-03."
systeme_kopf: [Risk class, Main obligations from, AI systems]
einstufung_offen: "Classification open (E-02)"
