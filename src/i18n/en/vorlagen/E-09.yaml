weitere_verweis: "The notes on legacy high-risk systems, AI in machinery, corrigendum C2, ISO/IEC 42001, EN 18286, Art. 111(4) and the Commission guidelines are in Appendix A at the end of this document."
schweiz_text: "Status of the Swiss information: {stand}. Switzerland does not adopt the AI Act; it covers Swiss companies only where there is a link to the EU (E-01). Before communicating it internally, we check the status with the Federal Office of Justice."
