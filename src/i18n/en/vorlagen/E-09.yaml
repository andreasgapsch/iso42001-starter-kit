# E-09 EU AI Act deadlines and status
hinweis_umfang: "This document records which status of the AI Act your classifications are based on and which obligations apply from when. Review it at least every six months and before every management review (D-21)."
hinweis_normung: "Standardization and presumption of conformity (Art. 40, 41): the presumption of conformity of a harmonised standard extends as far as the standard covers the requirements; its Annex ZA shows the mapping. EN 18286:2026 on quality management is listed (Implementing Decision (EU) 2026/2274, OJ L 2026/2274 of 14/10/2026, CELEX 32026D2274). Whether the presumption covers Art. 17 is open: Art. 40(1) does not expressly name it, while the last subparagraph of Art. 40(2) also names Section 3 of Chapter III for standardization requests; have this legally reviewed. No common specifications under Art. 41 are known as of 07/11/2026 (Commission AI Act Service Desk; EUR-Lex search found no implementing act under Art. 41). Record in the section ‘Further notes on the status’ whether you use the standard. For Art. 50 there are Commission guidelines (adopted on 20/07/2026) and a voluntary code of practice on transparency of AI-generated content under Art. 50(7), final since 10/06/2026; the Commission (opinion of 08/07/2026) and the AI Board (09/07/2026) consider it adequate for Art. 50(2), (4) and (5) (digital-strategy.ec.europa.eu, retrieved on 07/11/2026); check the status on the Commission page, also for questions to suppliers."
pruefen_titel: Check the status
pruefen: "**Before every update of this document, check on EUR-Lex** whether a newer consolidated version, a corrigendum or an amending regulation exists (document 02024R1689). Last check: {geprueft}."
massgebend: "Status on which our classifications are based: {rechtsstand}."
