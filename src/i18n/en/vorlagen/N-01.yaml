  - ID
  - NIST designation
  - Function
  - Short title
  - "Scope (lite or extended)"
  - Coverage by the AIMS
  - Documents in the AIMS
  - Additional control or refinement
  - "Current (0 to 3)"
  - Basis for current level
  - "Target (0 to 3)"
  - Gap
  - Priority
  - "Action, note"
  - Evidence
  - NIST reference
spalten_uebersicht: [Function, Key, Subcategories, "Current on average", "Target on average", "Subcategories with a gap", "Fully covered by the AIMS"]
listen:
  prioritaet: [high, medium, low]
herleitung:
  profil: recorded in the profile
  dokumente: "Documents {liste}"
  controls: "Controls {liste}"
  angaben: Entries per AI system incomplete
  luecke: "Additional control {control} not implemented"
  luecke_praez: Refinement not recorded
  keine: no basis in the project
  dok_status: [missing, in progress, approved]
  ctrl_status: [open, partly, implemented, effective]
