titel_abdeckung: "Coverage of the 72 subcategories of the NIST AI RMF by ISO/IEC 42001 and the AIMS"
titel_controls: "Additional controls RMF-xx for the statement of applicability"
spalte_nist_firma: "NIST AI RMF documents (N-01 to N-04)"
titel_stand: "Balance and status of the NIST basis"
hinweise_abdeckung:
  - "Column E shows how far ISO/IEC 42001 covers the outcome of the subcategory (the kit's professional assessment). Column F shows how far the kit templates cover it without this module; in several places they go beyond the standard."
  - "Where coverage is ‘partly’ or ‘not’, column I names the additional control that closes the gap, or a refinement of existing documents (column J). Record the decision in column K: additional control included in the statement of applicability (D-11), refinement implemented, or not included with reasons."
  - "Column M gives the number of actions NIST AI 600-1 suggests for generative AI (0 = not in the profile). The mapping to ISO/IEC 42001 is our own assessment, not taken from the crosswalk."
hinweise_abdeckung_firma:
  - "Coverage per subcategory by ISO/IEC 42001 (column E) and by our AIMS (column F). Where coverage is ‘partly’ or ‘not’, column K shows our decision on the additional control from the statement of applicability (D-11) or on the refinement."
hinweise_controls:
  - "The additional controls close the gaps between ISO/IEC 42001 and the AI RMF. Like the additional controls for the EU AI Act, they belong in the section ‘Additional controls’ of the statement of applicability (D-11)."
  - "RMF-Gxx apply only to systems with generative AI (flag ‘Generative’ in the AI inventory D-10). Column H: deployers of purchased AI can use a shorter form; the full form applies to in-house development or own training."
  - "The tool proposes the controls per AI system, e.g. RMF-13 only for AI affecting the legal position or opportunities of people (quick check D-09). Column K gives only the IDs of the actions in NIST AI 600-1 as origin."
hinweis_controls_firma: "Proposal per AI system by type, role, quick check and the flag ‘Generative’; decision from the statement of applicability (D-11)."
