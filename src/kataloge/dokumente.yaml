# Register aller Kit-Vorlagen. Titel und Kurzbeschreibung: src/i18n/<sprache>/dokumente.yaml
# isms: neu | erweitert | wiederverwendet | leitfaden  (Bezug zu einem bestehenden ISMS nach ISO/IEC 27001)
# eb: true = im Pfad «mit ISMS» als Ergänzungsblatt D-xx-EB statt als eigenes Dokument
# art: pflicht | leitfaden | modul (EU AI Act, meta.modulAiAct) | modul_nist (NIST AI RMF, meta.modulNistRmf)
# ordner: kit-ordner (DE/EN-Namen in i18n: ordner.<schluessel>)
# datei: Dateistamm ohne Endung, je Sprache, ohne Umlaute und Sonderzeichen
dokumente:
  - { id: D-00, format: xlsx, normbezug: "alle", isms: neu, eb: false, art: pflicht, ordner: vorlagen, datei: { de: D-00_Gap-Analyse, en: D-00_Gap-Analysis } }
