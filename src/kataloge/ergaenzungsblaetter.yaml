# Ergänzungsblätter für den Pfad «mit ISMS» (Ordner 03).
# Jedes Blatt nennt die Abschnitte, die in ein bestehendes ISMS-Dokument
# aufzunehmen sind. Reihenfolge der Abschnitte = Reihenfolge im Blatt.
# vorlage: zugehörige Kernvorlage des Kits
# ismsDokument: Schlüssel des betroffenen ISMS-Dokuments
# normbezug: Abschnitte (K-x) und Controls (A.x) der ISO/IEC 42001
# iso27001: verwandte Controls aus ISO/IEC 27001:2022 Anhang A
# iso27001Kapitel: verwandte Abschnitte der Kapitel 4 bis 10 der ISO/IEC 27001 (gleiche Struktur wie 42001)
# datei: eigener Dateistamm je Sprache (sonst D-xx-EB_ mit dem Stamm der Vorlage), wenn der Name der Vorlage irreführt
# Texte: src/i18n/{de,en}/ergaenzungsblaetter.yaml
blaetter:
  - id: D-03-EB
    vorlage: D-03
    ismsDokument: isms-leitlinie
    datei: { de: D-03-EB_Sicherheitsleitlinie, en: D-03-EB_Security-Policy }
    normbezug: [K-5.2, A.2.2, A.2.3, A.2.4]
    iso27001: [27001-5.1]
    iso27001Kapitel: [5.2]
    abschnitte:
