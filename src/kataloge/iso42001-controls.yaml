# ISO/IEC 42001:2023 Anhang A: 38 Controls in 9 Gruppen.
# Nur Nummern und Beziehungen. Kurzbezeichnungen und Erklärungen in eigenen Worten: src/i18n/<sprache>/controls42001.yaml
# dokumentpflicht: das Control verlangt dokumentierte Information (Kit-Prüfung G15)
# vorlagen: wo das Control im Kit umgesetzt wird
# betreiber_lite: für reine Betreiber (eingekaufte KI) meist in schlanker Form anwendbar
gruppen:
  - id: A.2
    controls:
      - { id: A.2.2, dokumentpflicht: true, vorlagen: [D-03], betreiber_lite: true }
      - { id: A.2.3, dokumentpflicht: false, vorlagen: [D-03], betreiber_lite: true }
      - { id: A.2.4, dokumentpflicht: false, vorlagen: [D-03, D-21], betreiber_lite: true }
