# Lesepfad für den ersten Tag (AF-136): Kapitel 1 nennt die drei Schritte und die Kapitel, die am ersten Tag entfallen.
# tests/unit/erstkontakt.test.ts prüft, dass Kapitel 1 diese Zahlen in beiden Sprachen enthält.
erster_tag:
  minuten: 60
  schritte: 3
  entfallen: [4, 5, 6, 7, 8, 9, 10, 11]

schritte:
  1: Auftrag und Ausgangslage
  2: Kontext, Rollen, Geltungsbereich
  3: Leitlinie, Rollen, Meldewege
  4: KI-Inventar
  5: Rolle zuerst und Einstufung
  6: Risiken und Folgenabschätzungen
  7: Controls, Erklärung zur Anwendbarkeit, Freigabe
  8: Umsetzen
  9: Messen, auditieren, bewerten, verbessern
  10: Zertifizierung

modi:
  1: Schnellcheck
  2: Scoping-Interview
  3: KI-Inventar
  4: Rolle zuerst
  5: Risiko und Folgenabschätzung
  6: SoA-Vorschlag
  7: Dokumente zuschneiden
  8: Auditvorbereitung
  9: Betrieb
  10: ISMS-Integration
  11: EU AI Act (nur mit Modul)
  12: NIST AI RMF (nur mit Modul)

# Kurzinhalt je Abschnitte 4 bis 10 im Kreislauf des Posters (eigene Worte)
poster_kapitel:
  K-4: "Umfeld, Parteien, Rollen, Geltungsbereich"
  K-5: "Leitlinie, Verantwortung der Geschäftsleitung, Rollen"
  K-6: "Risiken, Folgenabschätzungen, Controls, Ziele"
  K-7: "Ressourcen, Kompetenz, Kommunikation, Dokumente"
  K-8: "Betrieb steuern, Risiken und Folgen laufend neu beurteilen"
  K-9: "messen, internes Audit, Managementbewertung"
  K-10: "Abweichungen beheben, laufend verbessern"
poster_mitte: "KI-Systeme im Inventar (D-10)"
poster_mitte_klein: "Jedes System mit Eigner/in, Rolle, Risiken, Folgenabschätzung und Controls"

# Kapitel, die im Druck auf einer neuen Seite beginnen (nur Kapitel 1 nach dem Inhaltsverzeichnis; weitere erzwungene
# Umbrüche liessen Seiten zur Hälfte leer, Prüfung: keine Lücke über einem Drittel der Seite)
neue_seite: [01-minimal-viable-aims.md]

