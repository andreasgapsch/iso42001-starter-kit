# suggested scales and decision tree from src/i18n/en/vorlagen); only words are kept here.
abbildung: Figure
quelle: Source
abbildungen:
  fahrplan:
    titel: "Roadmap in weeks to stage 1 readiness: 90 days with an ISMS and about 150 days without"
    quelle: "Schedules and approval calendar of the kit (schritte.yaml); own illustration."
    mit: "with ISMS (week {von} to {bis})"
    ohne: "without ISMS (week {von} to {bis})"
    mit_kurz: "Week with ISMS"
    ohne_kurz: "Week without ISMS"
    freigaben_mit: "Approvals with ISMS"
    freigaben_ohne: "Approvals without ISMS"
    freigabe: "Approval by top management"
    legende_mit: "Step with ISMS"
    legende_ohne: "Step without ISMS"
    legende_freigabe_mit: "Approval with ISMS"
    legende_freigabe_ohne: "Approval without ISMS"
    schritt: "Step {nr} {titel}: with ISMS {mit}, without ISMS {ohne}"
    woche: "week {von}"
    wochen: "weeks {von} to {bis}"
    beschreibung: "Bars per step on an axis in weeks. {schritte}. Approvals by top management with an ISMS in weeks {freigaben_mit}, without an ISMS in weeks {freigaben_ohne}. Stage 1 readiness with an ISMS after week {ende_mit}, without an ISMS after week {ende_ohne}."
  risikomatrix:
    titel: "Risk matrix: level from likelihood times impact, with an example before and after treatment"
    quelle: "Suggested 4×4 scales from D-07, thresholds and consequences from D-06; own illustration."
    achse_w: "Likelihood (per year)"
    achse_a: "Impact"
    kurz_w: L
    kurz_a: I
    vor: before
    nach: after
    zonen: "How to read the zones"
    beispiel: "Example: a risk with L {w1} × I {a1} = {v1} ({s1}) drops through controls to L {w2} × I {a2} = {v2} ({s2}). The residual risk is acceptable."
    beschreibung: "Matrix of 4 likelihood levels (columns) and 4 impact levels (rows), each cell with the risk score L×I. {zonen}. {beispiel}"
    zone: "{stufe} (risk score {werte}): {text}"
  rollenbaum:
    quelle: "Questions from D-24 Role first; Art. 3, 22 to 25 of Regulation (EU) 2024/1689. Not legal advice."
  landkarte:
    titel: "Map of the frameworks: side by side by bindingness and topic"
    quelle: "Classification by the kit (landkarte.yaml), as of October 2026; own illustration."
    achse: "binding (law)  →  voluntary"
    spalten: ["Law", "Standard, certifiable", "Guidance and framework, voluntary"]
    zeilen: ["Obligations and fundamental rights", "Management of AI", "Security of information and AI"]
    markiert: "covered in the kit"
    offen: "not covered or only monitored"
    feld: "{zeile}, {spalte}: {eintraege}"
    leer: none
    beschreibung: "Three columns by bindingness (law, certifiable standard, voluntary guidance or framework) and three rows by topic; no ranking. {felder}. Covered in the kit: {markiert}."
    eintraege:
      ai-act: EU AI Act
      datenschutz: "FADP, GDPR"
      ki-konvention: "Council of Europe AI Convention"
      iso42001: ISO/IEC 42001
      iso27001: ISO/IEC 27001
      iso27090: ISO/IEC 27090
      nist-ai-rmf: NIST AI RMF
      owasp: "OWASP Top 10 (LLM, agents)"
      mitre-atlas: MITRE ATLAS
      enisa: "ENISA, good practice for AI"
      csa: "CSA AI Controls Matrix, MAESTRO"
  nist:
    titel: "NIST AI RMF: coverage of the 72 subcategories per function by ISO/IEC 42001 and by the kit without the module"
    quelle: "NIST AI 100-1 (AI RMF 1.0); mapping by the kit (subkategorien.yaml, N-02); own illustration."
    norm: "Standard"
    kit: "Kit"
    zeile: "{funktion} ({anzahl}), {quelle}"
    wert: "{funktion} {quelle}: full {ganz}, partial {teilweise}, none {nicht}"
    beschreibung: "Stacked bars per function GOVERN, MAP, MEASURE and MANAGE, one bar for the standard and one for the kit without the module; on the right the share of fully covered subcategories. {werte}."
  fristen:
    titel: "EU AI Act: what applies from when"
    quelle: "Regulation (EU) 2024/1689, consolidated version of {fassung}, Art. 111 and 113; status checked on {geprueft}."
    heute: "As of {datum}"
    ab: From
    was: What applies
    beschreibung: "Timeline from {von} to {bis}: {eintraege}. Status checked on {geprueft}."
    # Short title for the timeline and text for the table per deadline from src/ai-act/stand.yaml; {FRIST-xx} becomes the date
    eintraege:
      FRIST-02: { kurz: "Prohibitions, AI literacy", text: "prohibited practices (Art. 5) and the duty to take AI literacy actions (Art. 4)" }
      FRIST-03: { kurz: "General-purpose AI models", text: "obligations for providers of general-purpose AI models, governance, penalties" }
      FRIST-07: { kurz: "Application, transparency", text: "general date of application, including the transparency obligations (Art. 50)" }
      FRIST-08: { kurz: "Additional prohibitions", text: "additional prohibitions under Art. 5 (amending regulation 2026)" }
      FRIST-09: { kurz: "", text: "marking of synthetic content also for systems placed on the market before {FRIST-07}" }
      FRIST-13: { kurz: "High-risk under Annex III", text: "obligations for high-risk AI under Annex III (for example recruitment, creditworthiness)" }
      FRIST-15: { kurz: "High-risk under Annex I", text: "obligations for high-risk AI under Annex I (AI in products covered by EU product legislation)" }
