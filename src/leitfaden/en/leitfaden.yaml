# First-day reading path (AF-136): chapter 1 names the three steps and the chapters that fall away on the first day.
# tests/unit/erstkontakt.test.ts checks that chapter 1 contains these numbers in both languages.
erster_tag:
  minuten: 60
  schritte: 3
  entfallen: [4, 5, 6, 7, 8, 9, 10, 11]

schritte:
  1: Mandate and starting point
  2: Context, roles, scope
  3: Policy, roles, reporting channels
  4: AI inventory
  5: Role first and classification
  6: Risks and impact assessments
  7: Controls, statement of applicability, approval
  8: Implementation
  9: Measure, audit, review, improve
  10: Certification

modi:
  1: Quick check
  2: Scoping interview
  3: AI inventory
  4: Role first
  5: Risk and impact assessment
  6: SoA proposal
  7: Tailor documents
  8: Audit preparation
  9: Operation
  10: ISMS integration
  11: EU AI Act (module only)
  12: NIST AI RMF (module only)

# Short content per clause 4 to 10 in the cycle on the poster (own words)
poster_kapitel:
  K-4: "Setting, parties, roles, scope"
  K-5: "Policy, top management accountability, roles"
  K-6: "Risks, impact assessments, controls, objectives"
  K-7: "Resources, competence, communication, documents"
  K-8: "Running operations, reassessing risks and impacts"
  K-9: "Measuring, internal audit, management review"
  K-10: "Fixing deviations, improving continually"
poster_mitte: "AI systems in the inventory (D-10)"
poster_mitte_klein: "Each system with owner, role, risks, impact assessment and controls"

# Chapters that start on a new page in print (only chapter 1 after the contents; further forced breaks left pages
# half empty, check: no gap larger than a third of the page)
neue_seite: [01-minimal-viable-aims.md]

# Chapter 10 NIST AI RMF: labels of the blocks <!-- nistbilanz -->, <!-- niststand -->, <!-- nistgenai -->
nist:
  bilanz:
    funktion: Function
    anzahl: Subcategories
    norm: "Coverage by ISO/IEC 42001"
    kit: "Coverage by the kit without the module"
    ganz: full
    teilweise: partial
    nicht: none
    summe: Total
    satz: "Without the module, {teilweise} subcategories remain partly open: {liste}. With the module, every subcategory is either fully covered or assigned to an additional control: {allgemein} general ones ({allgemein_von} to {allgemein_bis}) and {genai} for generative AI ({genai_von} to {genai_bis}). For {praezisierungen} subcategories a note in existing templates is enough."
  stand:
    dokument: Document
    datum: Date
    seiten: Pages
    quelle: DOI or address
    version: version
    pdf_vom: PDF of
    satz: "Status checked on {geprueft}. The US ‘AI Action Plan’ of {angekuendigt} announced a revision of the AI RMF; on the date of the check there was no draft, no version number and no date. AI RMF 1.0 remains authoritative. The kit checks the status before every release; the AIMS Manager reminds you when the last check is more than {monate} months old."
  genai:
    nr: "No."
    risiko: "Risk (kit's short title)"
    relevanz: Relevance for SMEs
    controls: Additional controls
    hinweis: "none, a note is enough"


# Figures (blocks <!-- abb:name --> and <!-- aiactfristen -->): titles, source lines, labels.
