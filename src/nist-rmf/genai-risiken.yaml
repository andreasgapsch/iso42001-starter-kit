#   controls             Zusatz-Controls, die das Risiko behandeln (src/nist-rmf/rmf-controls.yaml);
#                        jedes Control mit diesem Risiko in «risiken» steht hier
#   subkategorien        betroffene Subkategorien (Vereinigung der Controls, ergänzt um eigene Zuordnung)
#   praezisierung        true: kein Control, Hinweis in bestehender Vorlage genügt (Text in nist.yaml)

