# Zitat-Quelle in src/nist-rmf/original-600-1.yaml.
# Geprüft gegen den PDF-Text (pdftotext, 21.10.2026): Abschnittsnummern und zugeordnete Vertrauensmerkmale.
#
# Felder
#   nr, abschnitt_600_1  Reihenfolge und Abschnitt in NIST AI 600-1
