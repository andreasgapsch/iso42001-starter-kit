# Zusatz-Controls für das Modul NIST AI RMF (RMF-nn allgemein, RMF-Gnn nur bei generativer KI)
#
# Struktur sprachneutral; Texte (Titel, Zweck, Umsetzung, Nachweis) in src/i18n/de/nist.yaml und
# src/i18n/en/nist.yaml unter controls.<id>.
# ID-Präfix RMF statt NIST, weil NIST viele Rahmenwerke führt (CSF, Privacy Framework, Cyber AI Profile).
# In der Erklärung zur Anwendbarkeit (D-11) wie EUAIA-Controls, Rahmenwerk NISTRMF.
#
# Felder
#   art               allgemein | genai
#   subkategorien     Subkategorien (src/nist-rmf/subkategorien.yaml), deren Lücke das Control schliesst
#   risiken           nur genai: GenAI-Risiken (src/nist-rmf/genai-risiken.yaml)
#   verwandt_42001    verwandte Controls (A.x.y) und Abschnitte (K-x.y) aus ISO/IEC 42001
#   verwandt_27001    verwandte Controls aus ISO/IEC 27001:2022 Anhang A (27001-x.y), fachliche Einschätzung
#   kit               Kit-Vorlagen (D-xx), in denen das Control umgesetzt wird
#   nist_vorlagen     geplante Modulvorlagen N-01 bis N-04
#   betreiber_lite    true: auch für reine Betreiber eingekaufter KI sinnvoll (verkürzte Form)
#   bezug_600_1       Massnahmen-IDs aus NIST AI 600-1 als Herkunftsnachweis; Wortlaut mit eigener Übersetzung in
#                     src/nist-rmf/original-600-1.yaml (massnahmen, Test katalog-nist.test.ts)
#   vorschlag_wenn    Bedingung für den automatischen Vorschlag je KI-System (UND über alle Schlüssel,
#                     any_of = ODER). Auswertung: src/nist-rmf/logik.ts (rmfVorschlaege).
#     immer: true                       jedes aktive KI-System im Inventar
#     typ_any: [...]                    kiSysteme[].typ (eingekauft | saas | eigenbau | schatten)
#     eigenes_training: true            kiSysteme[].eigenesTraining
#     rollen_any: [...]                 kiSysteme[].aiAct.rollen (Werte wie AiActRolle)
#     transparenz_any: [...]            kiSysteme[].aiAct.transparenz ('50-1' bis '50-4')
#     triage_rechtsposition: true       Kurzprüfung D-09: Rechtsposition oder Chancen von Personen betroffen
#     triage_gesundheit_sicherheit: true  Kurzprüfung D-09: Gesundheit oder Sicherheit betroffen
#     generativ: true                   kiSysteme[].generativ (Kennzeichen generative KI, mit dem Modul)
#     any_of: [ {...}, {...} ]          Alternativen
#   voll_wenn         nur bei betreiber_lite: Bedingung für die volle Form (sonst Form für Betreiber)

