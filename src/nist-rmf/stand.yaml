# Rechtslage (geprüft 21.10.2026): Werke von NIST-Angestellten sind nach 17 U.S.C. § 105 in den USA nicht
# urheberrechtlich geschützt (gemeinfrei). Ausserhalb der USA behält sich NIST Rechte vor, gewährt aber weltweit
# ein nicht ausschliessliches, unbefristetes, unentgeltliches Recht zum Nachdruck, auch für Bearbeitungen
# (Technical Series, gilt für NIST AI 100-1 und 600-1; für das Playbook als Webressource die allgemeine Erklärung
# auf nist.gov/oism/copyrights). Erbeten ist der Vermerk unten; Werke Dritter können geschützt sein;
# keine Billigung durch NIST.
lizenz:
  status: gemeinfrei-us-regierungswerk
  grundlage: 17 U.S.C. § 105
  ausserhalb_usa: rechte-vorbehalten-weltweites-unentgeltliches-nachdruck-und-bearbeitungsrecht
  vermerk: Republished courtesy of the National Institute of Standards and Technology
  geprueft_am: "2026-10-21"
  quellen:
    - https://www.nist.gov/oism/copyrights
    - https://www.nist.gov/open/copyright-fair-use-and-licensing-statements-srd-data-software-and-technical-series-publications
  abbildungen_uebernehmen: false
  pdf_im_kit: true

