  quellen:
    - https://www.nist.gov/itl/ai-risk-management-framework
    - https://airc.nist.gov/airmf-resources/airmf/
  # Teile, die die Revision voraussichtlich betrifft; das Kit führt sie aus eigener Begründung weiter
  betroffen_vermutet: [GV-3, GV-3.1, MS-2.12]

