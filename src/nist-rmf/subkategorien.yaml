# NIST AI RMF 1.0 (NIST AI 100-1, Januar 2023): Kern mit 4 Funktionen, 19 Kategorien, 72 Subkategorien
#
# Struktur sprachneutral; eigene Kurztitel, Lite-Massnahmen, Nachweise und Präzisierungen in
# src/i18n/de/nist.yaml und src/i18n/en/nist.yaml. Keine NIST-Formulierungen in diesen Feldern; die wörtlichen Texte
# von NIST (mit eigener Übersetzung) stehen getrennt als Zitat-Quelle in src/nist-rmf/original-100-1.yaml.
# IDs und Kategorien geprüft gegen AI 100-1 Tabellen 1 bis 4 (PDF-Seiten 27 bis 38, pdftotext, 21.10.2026). Seiten je Subkategorie: src/nist-rmf/seiten.json.
#
# Felder je Subkategorie
#   id              Kit-ID in der Kurzform des GenAI-Profils NIST AI 600-1 (GV, MP, MS, MG), z. B. GV-1.1
#   nist_id         Bezeichnung in AI 100-1, z. B. «GOVERN 1.1»
#   funktion        govern | map | measure | manage
#   kategorie       Kit-ID der Kategorie (GV-1 usw.)
#   iso42001        Bezüge zu ISO/IEC 42001:2023: Abschnitte (K-x.y wie src/kataloge/iso42001-anforderungen.yaml)
#                   und Controls Anhang A (A.x.y). Eigene Zuordnung des Kits; abgeglichen mit dem Crosswalk
#                   «NIST AI RMF to ISO/IEC FDIS 42001» (Anbieter Microsoft, gelistet auf airc.nist.gov), dessen
#                   Fehler korrigiert sind. Unterabschnitte wie 9.3.2 sind auf
#                   die Granularität des Kit-Katalogs gekürzt (K-9.3).
#   abdeckung       ganz | teilweise | nicht: Abdeckung des Ergebnisses durch ISO/IEC 42001 (nach Norm,
#                   fachliche Einschätzung des Kits; der Crosswalk bewertet nicht)
#   abdeckung_kit   ganz | teilweise | nicht: Abdeckung durch die Vorlagen des Kits ohne Modul, Grundlage: Abgleich
#                   mit den Massnahmen des AI RMF Playbook und was die Vorlagen enthalten (Einsatzentscheid mit Lösung ohne KI, Mitwirkende,
#                   Aufsicht, Einspruch, Missbrauchsfälle, Modell und Version, Aussetzen, Ausserbetriebnahme, Kennzahlen
#                   je System, Eignung der Kennzahlen). Kann über abdeckung liegen, weil die Vorlagen mehr verlangen als
#                   die Norm. Bilanz 60 ganz, 12 teilweise, 0 nicht (Test katalog-nist.test.ts, N-02 Blatt «Stand»).
#   kit             Kit-Vorlagen (D-xx, E-xx aus src/kataloge/dokumente.yaml), die das Ergebnis heute tragen
#   nist_vorlagen   Modulvorlagen N-01 bis N-04 (src/vorlagen/N-0x.ts), die das Ergebnis tragen
#   pruefregeln     Prüfregeln (src/regeln/pruefregeln.yaml), die das Ergebnis heute stützen
#   zusatz_control  RMF-xx (src/nist-rmf/rmf-controls.yaml); Pflicht bei abdeckung teilweise oder nicht,
#                   ausser praezisierung ist gesetzt
#   praezisierung   true: kein eigenes Control, bestehende Vorlagen genügen mit einem Hinweis
#                   (Text unter subkategorien.<id>.praezisierung in nist.yaml)
#   stufe           lite (für jedes KMU sinnvoll) | ausbau (nur bei Eigenentwicklung, Anbieterrolle,
#                   sicherheitsrelevanter oder personenbezogener Entscheidungs-KI)
#   etappe          Haupt-Etappe im Geführten Modus (src/gefuehrt/etappen.yaml)
#   genai_600_1     Anzahl vorgeschlagener Massnahmen im GenAI-Profil NIST AI 600-1 (0 = nicht im Profil)
#   revision_hinweis true: Inhalt könnte bei der angekündigten US-Revision entfallen oder sich ändern
#                   (stand.yaml, revision); das Kit führt den Punkt aus eigener Begründung weiter

