# Prozesskatalog des Kits: 27 AIMS-Prozesse (PR-01 bis PR-27) und 11 ISMS-Basisprozesse (PS-01 bis PS-11).
# Sprachneutral: nur IDs, Schlüssel und Nummern. Titel, Zweck, Auslöser, Eingaben, Schritttexte, Ausgaben, Kennzahl
# und Hilfe stehen in src/i18n/<sprache>/prozesse.yaml. Eigene Prozesse von KMU-CIO; Bezug zur Norm nur über
# Abschnitts- und Control-Nummern (geprüft gegen src/kataloge/iso42001-*.yaml, kapitel-gemeinsam.yaml und
# iso27001-controls.yaml in tests/unit/prozesse-katalog.test.ts).
#
# gruppe: fuehrung | kern | unterstuetzung | bewertung (Bewertung und Verbesserung)
# art: gemeinsam (ein Prozess für ISMS und AIMS) | gemeinsam-ki (gemeinsamer Rahmen, KI-Inhalt ergänzt)
#      | nur-aims | nur-isms (Basisprozess aus ISO/IEC 27001, im Pfad mit ISMS nur Verweis)
# pflicht: pflicht (Kapitel 4 bis 10, nicht abwählbar) | control (aus Anhang A, abwählbar mit Begründung in D-11)
#          | bedingt (nur wenn eine der Bedingungen zutrifft; Pfade im Projekt, [feld=wert] filtert Listen)
# minimal_ohne_isms: nur bei nur-isms; true = Empfehlung des Kits (keine Normpflicht): auch ohne ISMS führen, weil KI-Controls darauf bauen
#                    (Begründung je Prozess in i18n prozesse.<id>.ohne_isms)
# eigner_rolle: Vorschlag für den Prozesseigner (Rollenbereich aus D-04)
# rhythmus: Optionsgruppe rhythmus; null = ereignisgesteuert
# normbezug_42001: Abschnitte (4.1) und Controls (A.6.2.6) von ISO/IEC 42001
# normbezug_27001: Abschnitte (6.1.2) und Controls aus Anhang A (A.5.24) von ISO/IEC 27001
# kit_dokumente: Vorlagen des Kits (src/kataloge/dokumente.yaml), in denen der Prozess umgesetzt und belegt wird
# verbunden: Prozesse auf der anderen Seite (AIMS-Prozess zu ISMS-Basisprozess und umgekehrt)
# gefuehrt_option: Wert der Optionsgruppe aimsProzesse (Geführter Modus E2), der diesem Prozess entspricht
# kennzahl_vorschlag: einheit (prozent | anzahl | monate | tage | stunden), richtung (mindestens | hoechstens), soll
# datenquelle: woher der Messwert der Kennzahl kommt (AF-098, Tor G44 scripts/pruefen/messplan.mts): vorlage (Kit-Vorlage) und
#              spalte (Schlüssel des Spaltenkopfs in i18n vorlagen.<vorlage>, Listenindex als Zahl); die Methode in
#              i18n prozesse.<id>.kennzahl_methode nennt Vorlage und Spaltenkopf. aufzeichnung: true = Aufzeichnung
#              ausserhalb der Kit-Vorlagen (z. B. Protokolle), die Methode nennt sie
#              feld: Pfad im Datenmodell (src/generiert/projekt.schema.json), aus dem der AIMS-Manager die Spalte füllt
# ableitung: Felder im Projekt, aus denen die App die letzte Durchführung ableiten kann (jüngstes Datum gewinnt);
#            leer = nur von Hand; [feld] ohne Wert filtert Einträge mit nicht leerem Feld; bei Dokumenten zählt auch die
#            Bestätigung ohne Änderung (bestaetigt.am)
# faellig_aus: Felder mit dem nächsten Termin (z. B. nächste Überprüfung der Leitlinie); sonst letzte Durchführung + Rhythmus
# schritte: id, art (start | aufgabe | entscheidung | ende), bahn (Rolle), naechste (Nachfolger; bei Entscheidung
#           zwei oder mehr, beschriftet in i18n prozesse.<id>.zweige), raci (R führt aus, A verantwortet, genau eine
#           A je Aufgabe und Entscheidung, C wirkt mit, I wird informiert), verweis (anderer Prozess), entscheid (Freigabe
#           nach Entscheidungsrechten D-04: einfuehren, restrisiko, ausnahme, ausserbetrieb; nach D-08: kurzpruefung durch
#           die AIMS-Verantwortung, abschaetzung durch die Geschäftsleitung; Prüfregel H73)
#
# Rollen (Bahnen und RACI): Schlüssel der Optionsgruppe rollenBereich (D-04, Rolle.bereich); dazu Funktionen aus der
# Optionsgruppe aimsRolle, die kein Rollenbereich abdeckt, und zwei Zusatzrollen mit Texten in i18n prozesse.rollen.
rollen:
  aus_aims_rolle: [gl, aims, it, hr, fachbereich, einkauf, kommunikation]
  zusatz: [ki-eigner, mitarbeitende]
gruppen: [fuehrung, kern, unterstuetzung, bewertung]
arten: [gemeinsam, gemeinsam-ki, nur-aims, nur-isms]
pflichtarten: [pflicht, control, bedingt]
einheiten: [prozent, anzahl, monate, tage, stunden]

prozesse:
  # ---------------------------------------------------------------- Führung
  - id: PR-01
    gruppe: fuehrung
    art: gemeinsam-ki
    pflicht: pflicht
    eigner_rolle: aims
    rhythmus: jaehrlich
    normbezug_42001: ["4.1", "4.2", "4.3", "4.4"]
    normbezug_27001: ["4.1", "4.2", "4.3", "4.4"]
    kit_dokumente: [D-01, D-02, D-24, E-01]
    verbunden: []
    kennzahl_vorschlag: { einheit: monate, richtung: hoechstens, soll: 12 }
    datenquelle: [{ vorlage: D-26, spalte: register.spalten_dokumente.8, feld: dokumente.freigabe.am }]
    ableitung: [organisation.geltungsbereich.freigabe.am, "dokumente[id=D-01].freigabe.am", "dokumente[id=D-02].freigabe.am"]
    schritte:
      - { id: PR-01.00, art: start, bahn: aims, naechste: [PR-01.01] }
      - { id: PR-01.01, art: aufgabe, bahn: aims, naechste: [PR-01.02], raci: { aims: A, fachbereich: C, informationssicherheit: C } }
      - { id: PR-01.02, art: aufgabe, bahn: aims, naechste: [PR-01.03], raci: { aims: A, recht: C } }
      - { id: PR-01.03, art: aufgabe, bahn: aims, naechste: [PR-01.04], raci: { aims: A, fachbereich: C, recht: C } }
      - { id: PR-01.04, art: aufgabe, bahn: aims, naechste: [PR-01.05], raci: { aims: A, gl: C } }
      - { id: PR-01.05, art: aufgabe, bahn: aims, naechste: [PR-01.06], raci: { aims: A, it: C, informationssicherheit: C } }
      - { id: PR-01.06, art: entscheidung, bahn: gl, naechste: [PR-01.07, PR-01.05], raci: { gl: A, aims: R } }
      - { id: PR-01.07, art: aufgabe, bahn: aims, naechste: [PR-01.90], raci: { aims: A, mitarbeitende: I } }
      - { id: PR-01.90, art: ende, bahn: aims }

  - id: PR-02
    gruppe: fuehrung
    art: gemeinsam-ki
    pflicht: pflicht
    eigner_rolle: aims
    rhythmus: jaehrlich
    normbezug_42001: ["5.1", "5.2", A.2.2, A.2.3, A.2.4]
    normbezug_27001: ["5.1", "5.2", A.5.1]
    kit_dokumente: [D-03, D-17, D-21]
    verbunden: []
    kennzahl_vorschlag: { einheit: prozent, richtung: mindestens, soll: 95 }
    datenquelle: [{ vorlage: D-17, spalte: spalten_schulungen.3 }, { vorlage: D-17, spalte: spalten_schulungen.4 }, { aufzeichnung: true }]
    ableitung: [organisation.leitlinie.freigabe.am, organisation.leitlinie.kommuniziertAm, "dokumente[id=D-03].freigabe.am"]
    faellig_aus: [organisation.leitlinie.naechsteUeberpruefung, "dokumente[id=D-03].naechsteUeberpruefung"]
    schritte:
      - { id: PR-02.00, art: start, bahn: aims, naechste: [PR-02.01] }
      - { id: PR-02.01, art: aufgabe, bahn: aims, naechste: [PR-02.02], raci: { aims: A, gl: C } }
      - { id: PR-02.02, art: aufgabe, bahn: aims, naechste: [PR-02.03], raci: { aims: A, informationssicherheit: C, datenschutz: C, recht: C } }
      - { id: PR-02.03, art: entscheidung, bahn: gl, naechste: [PR-02.04, PR-02.01], raci: { gl: A, aims: R } }
      - { id: PR-02.04, art: aufgabe, bahn: aims, naechste: [PR-02.05], raci: { aims: A, kommunikation: R, mitarbeitende: I } }
      - { id: PR-02.05, art: aufgabe, bahn: mitarbeitende, naechste: [PR-02.06], raci: { aims: A, mitarbeitende: R } }
      - { id: PR-02.06, art: aufgabe, bahn: aims, naechste: [PR-02.90], raci: { aims: A, gl: I } }
      - { id: PR-02.90, art: ende, bahn: aims }

  - id: PR-03
    gruppe: fuehrung
    art: gemeinsam
    pflicht: pflicht
    eigner_rolle: aims
    rhythmus: jaehrlich
    normbezug_42001: ["5.3", A.3.2, A.3.3]
    normbezug_27001: ["5.3", A.5.2, A.5.3, A.5.4, A.6.8]
    kit_dokumente: [D-04]
    verbunden: []
    kennzahl_vorschlag: { einheit: prozent, richtung: mindestens, soll: 100 }
    # Spalte «Stellvertretung» in D-04 seit P14 (AF-102)
    datenquelle: [{ vorlage: D-04, spalte: raci_kopf.0 }, { vorlage: D-04, spalte: raci_kopf.3 }, { vorlage: D-04, spalte: raci_kopf.4, feld: rollen.stellvertretung }]
    ableitung: ["dokumente[id=D-04].freigabe.am"]
    schritte:
      - { id: PR-03.00, art: start, bahn: aims, naechste: [PR-03.01] }
      - { id: PR-03.01, art: aufgabe, bahn: aims, naechste: [PR-03.02], raci: { aims: A, gl: C } }
      - { id: PR-03.02, art: aufgabe, bahn: aims, naechste: [PR-03.03], raci: { aims: R, gl: A, hr: C } }
      - { id: PR-03.03, art: aufgabe, bahn: aims, naechste: [PR-03.04], raci: { aims: A, risikomanagement: C, gl: C } }
      - { id: PR-03.04, art: aufgabe, bahn: vorfall, naechste: [PR-03.05], raci: { vorfall: R, aims: A, hr: C } }
      - { id: PR-03.05, art: entscheidung, bahn: gl, naechste: [PR-03.06, PR-03.02], raci: { gl: A, aims: R } }
      - { id: PR-03.06, art: aufgabe, bahn: aims, naechste: [PR-03.07], raci: { aims: A, mitarbeitende: I } }
      - { id: PR-03.07, art: aufgabe, bahn: hr, naechste: [PR-03.90], raci: { hr: R, aims: A } }
      - { id: PR-03.90, art: ende, bahn: aims }

  - id: PR-04
    gruppe: fuehrung
    art: gemeinsam-ki
    pflicht: pflicht
    eigner_rolle: berichterstattung
    rhythmus: quartalsweise
    normbezug_42001: ["6.2", "9.1"]
    normbezug_27001: ["6.2", "9.1"]
    kit_dokumente: [D-05]
    verbunden: []
    kennzahl_vorschlag: { einheit: prozent, richtung: mindestens, soll: 90 }
    datenquelle: [{ vorlage: D-05, spalte: spalten_messwerte.0 }, { vorlage: D-05, spalte: spalten_messwerte.1, feld: ziele.messungen.datum }, { vorlage: D-05, spalte: spalten_messplan.3, feld: ziele.haeufigkeit }]
    ableitung: [ziele.messungen.datum, kennzahlMessungen.datum]
    schritte:
      - { id: PR-04.00, art: start, bahn: aims, naechste: [PR-04.01] }
      - { id: PR-04.01, art: aufgabe, bahn: aims, naechste: [PR-04.02], raci: { aims: A, gl: C, risikomanagement: C } }
      - { id: PR-04.02, art: aufgabe, bahn: aims, naechste: [PR-04.03], raci: { aims: A, berichterstattung: C } }
      - { id: PR-04.03, art: aufgabe, bahn: fachbereich, naechste: [PR-04.04], raci: { fachbereich: R, berichterstattung: A } }
      - { id: PR-04.04, art: aufgabe, bahn: berichterstattung, naechste: [PR-04.05], raci: { berichterstattung: A, aims: C } }
      - { id: PR-04.05, art: entscheidung, bahn: berichterstattung, naechste: [PR-04.07, PR-04.06], raci: { berichterstattung: A } }
      - { id: PR-04.06, art: aufgabe, bahn: aims, naechste: [PR-04.07], raci: { aims: A, berichterstattung: R } }
      - { id: PR-04.07, art: aufgabe, bahn: berichterstattung, naechste: [PR-04.90], raci: { berichterstattung: A, gl: I } }
      - { id: PR-04.90, art: ende, bahn: berichterstattung }

  - id: PR-05
    gruppe: fuehrung
    art: gemeinsam
    pflicht: pflicht
    eigner_rolle: aims
    rhythmus: null
    normbezug_42001: ["6.3"]
    normbezug_27001: ["6.3"]
    kit_dokumente: [D-26, D-02]
    verbunden: []
    kennzahl_vorschlag: { einheit: prozent, richtung: mindestens, soll: 100 }
    datenquelle: [{ vorlage: D-22, spalte: spalten_verbesserungen.3, feld: massnahmen.herkunft }, { vorlage: D-22, spalte: spalten_verbesserungen.9, feld: massnahmen.status }, { vorlage: D-26, spalte: register.spalten_aenderungen.5 }]
    ableitung: [dokumente.aenderungen.datum, "massnahmen[herkunft.art=aenderung].erledigtAm"]
    schritte:
      - { id: PR-05.00, art: start, bahn: aims, naechste: [PR-05.01] }
      - { id: PR-05.01, art: aufgabe, bahn: aims, naechste: [PR-05.02], raci: { aims: A } }
      - { id: PR-05.02, art: aufgabe, bahn: aims, naechste: [PR-05.03], raci: { aims: A, risikomanagement: C, informationssicherheit: C } }
      - { id: PR-05.03, art: aufgabe, bahn: aims, naechste: [PR-05.04], raci: { aims: A, gl: C } }
      - { id: PR-05.04, art: entscheidung, bahn: gl, naechste: [PR-05.05, PR-05.91], raci: { gl: A, aims: R } }
      - { id: PR-05.05, art: aufgabe, bahn: dokumentenlenkung, naechste: [PR-05.06], raci: { dokumentenlenkung: R, aims: A } }
      - { id: PR-05.06, art: aufgabe, bahn: aims, naechste: [PR-05.07], raci: { aims: A, mitarbeitende: I } }
      - { id: PR-05.07, art: aufgabe, bahn: aims, naechste: [PR-05.90], raci: { aims: A, gl: I } }
      - { id: PR-05.90, art: ende, bahn: aims }
      - { id: PR-05.91, art: ende, bahn: gl }

  # ---------------------------------------------------------------- Kern
  - id: PR-06
    gruppe: kern
    art: nur-aims
    pflicht: control
    eigner_rolle: inventar
    rhythmus: halbjaehrlich
    normbezug_42001: ["7.1", A.4.2, A.4.3, A.4.4, A.4.5, A.4.6]
    normbezug_27001: [A.5.9]
    kit_dokumente: [D-10]
    verbunden: [PS-01]
    gefuehrt_option: inventar
    kennzahl_vorschlag: { einheit: prozent, richtung: mindestens, soll: 95 }
    datenquelle: [{ vorlage: D-10, spalte: spalten_inventar.6, feld: kiSysteme.eigner }, { vorlage: D-10, spalte: spalten_ressourcen.2, feld: kiSysteme.ressourcen }, { vorlage: D-10, spalte: spalten_ressourcen.5 }]
    ableitung: [kiSysteme.geaendertAm, kiSysteme.erfasstAm]
    schritte:
      - { id: PR-06.00, art: start, bahn: inventar, naechste: [PR-06.01] }
      - { id: PR-06.01, art: aufgabe, bahn: inventar, naechste: [PR-06.02], raci: { inventar: A, it: C, einkauf: C } }
      - { id: PR-06.02, art: aufgabe, bahn: fachbereich, naechste: [PR-06.03], raci: { inventar: A, fachbereich: R } }
      - { id: PR-06.03, art: aufgabe, bahn: inventar, naechste: [PR-06.04], raci: { inventar: A } }
      - { id: PR-06.04, art: aufgabe, bahn: inventar, naechste: [PR-06.05], raci: { inventar: A, fachbereich: C, ki-eigner: I } }
      - { id: PR-06.05, art: aufgabe, bahn: ki-eigner, naechste: [PR-06.06], raci: { ki-eigner: R, inventar: A, it: C } }
      - { id: PR-06.06, art: aufgabe, bahn: inventar, naechste: [PR-06.07], raci: { inventar: A, informationssicherheit: C } }
      - { id: PR-06.07, art: aufgabe, bahn: inventar, naechste: [PR-06.90], raci: { inventar: A, fachbereich: C } }
      - { id: PR-06.90, art: ende, bahn: inventar }

  - id: PR-07
    gruppe: kern
    art: nur-aims
    pflicht: control
    eigner_rolle: aims
    rhythmus: null
    normbezug_42001: ["8.1", A.9.2, A.9.3, A.9.4]
    normbezug_27001: [A.5.10, A.5.23]
    kit_dokumente: [D-15, D-12, D-10]
    verbunden: [PS-02]
    gefuehrt_option: freigabe-werkzeuge
    kennzahl_vorschlag: { einheit: tage, richtung: hoechstens, soll: 10 }
    # Antrag und Entscheid in der Freigabeliste D-10 (Schemaversion 3, AF-104)
    datenquelle: [{ vorlage: D-10, spalte: spalten_antrag.0, feld: kiSysteme.antragAm }, { vorlage: D-10, spalte: spalten_antrag.1, feld: kiSysteme.entscheidAm }]
    ableitung: [kiSysteme.entscheidAm, kiSysteme.freigabe.am]
    # Jeder Antrag durchläuft die Freigabekriterien aus D-15 Abschnitt 7, auch im Zweig ohne vertiefte Prüfung (Graphregel
    # GR-06, M4-33): Lieferant und Daten, Kurzprüfung der Folgen nach D-08 und Eintrag der Risiken im Register D-07 (PR-07.02),
    # Test mit eigenen Fällen nach D-12 (PR-07.11). Ohne vertiefte Prüfung entscheidet die AIMS-Verantwortung, bei tiefem
    # Risiko allein, bei mittlerem mit der Eignerin oder dem Eigner des Systems (PR-07.05, Fakt freigabe.einfuehren, N7); der Zweig zur Geschäftsleitung (PR-07.09, PR-07.10) liegt
    # nur hinter der vertieften Beurteilung PR-07.04 (Graphregel GR-05, gleiche Klasse wie A3-11).
    schritte:
      - { id: PR-07.00, art: start, bahn: fachbereich, naechste: [PR-07.01] }
      - { id: PR-07.01, art: aufgabe, bahn: fachbereich, naechste: [PR-07.02], raci: { fachbereich: R, aims: A } }
      - { id: PR-07.02, art: aufgabe, bahn: aims, naechste: [PR-07.11], raci: { aims: A, risikomanagement: R, folgenabschaetzung: R, informationssicherheit: C, datenschutz: C, einkauf: C }, verweis: [PR-08, PR-09] }
      - { id: PR-07.11, art: aufgabe, bahn: fachbereich, naechste: [PR-07.03], raci: { fachbereich: R, aims: A } }
      - { id: PR-07.03, art: entscheidung, bahn: aims, naechste: [PR-07.04, PR-07.05], raci: { aims: A } }
      - { id: PR-07.04, art: aufgabe, bahn: risikomanagement, naechste: [PR-07.09], raci: { risikomanagement: R, aims: A, folgenabschaetzung: C }, verweis: [PR-08, PR-09] }
      - { id: PR-07.09, art: entscheidung, bahn: aims, naechste: [PR-07.10, PR-07.05], raci: { aims: A, risikomanagement: C } }
      - { id: PR-07.05, art: entscheidung, bahn: aims, naechste: [PR-07.06, PR-07.91], raci: { aims: A, ki-eigner: R }, entscheid: einfuehren }
      - { id: PR-07.10, art: entscheidung, bahn: gl, naechste: [PR-07.06, PR-07.91], raci: { gl: A, aims: R, ki-eigner: C }, entscheid: einfuehren }
      - { id: PR-07.06, art: aufgabe, bahn: inventar, naechste: [PR-07.07], raci: { inventar: R, aims: A } }
      - { id: PR-07.07, art: aufgabe, bahn: aims, naechste: [PR-07.90], raci: { aims: A, fachbereich: I, mitarbeitende: I } }
      - { id: PR-07.90, art: ende, bahn: inventar }
      - { id: PR-07.91, art: ende, bahn: aims }

  - id: PR-08
    gruppe: kern
    art: gemeinsam-ki
    pflicht: pflicht
    eigner_rolle: risikomanagement
    rhythmus: jaehrlich
    normbezug_42001: ["6.1.1", "6.1.2", "6.1.3", "8.2", "8.3"]
    normbezug_27001: ["6.1.1", "6.1.2", "6.1.3", "8.2", "8.3"]
    kit_dokumente: [D-06, D-07, D-11]
    verbunden: []
    gefuehrt_option: risiko
    kennzahl_vorschlag: { einheit: anzahl, richtung: hoechstens, soll: 0 }
    datenquelle: [{ vorlage: D-07, spalte: spalten_register.12 }, { vorlage: D-07, spalte: spalten_register.13, feld: risiken.behandlung }]
    ableitung: [risiken.beurteiltAm]
    schritte:
      - { id: PR-08.00, art: start, bahn: risikomanagement, naechste: [PR-08.01] }
      - { id: PR-08.01, art: aufgabe, bahn: aims, naechste: [PR-08.02], raci: { aims: A, risikomanagement: R, gl: C } }
      - { id: PR-08.02, art: aufgabe, bahn: risikomanagement, naechste: [PR-08.03], raci: { risikomanagement: A, ki-eigner: C, informationssicherheit: C, datenschutz: C } }
      - { id: PR-08.03, art: aufgabe, bahn: risikomanagement, naechste: [PR-08.04], raci: { risikomanagement: A, ki-eigner: C } }
      - { id: PR-08.04, art: aufgabe, bahn: risikomanagement, naechste: [PR-08.05], raci: { risikomanagement: A, aims: C } }
