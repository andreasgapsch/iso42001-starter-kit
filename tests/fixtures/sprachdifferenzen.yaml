# Bekannte Sprachfassungsdifferenzen DE gegen EN (AF-075). Jeder Eintrag braucht einen Grund.
# gruppe: beispiele | vorlagen | leitfaden
# datei: Beispielname, Vorlagendatei (z. B. D-05.yaml) oder Leitfadendatei (DE-Name, z. B. 04-zeitplaene.md)
# stelle: Pfad im Dokument (Beispiele, Vorlagen) oder Token (Leitfaden); ohne Stelle gilt die ganze Datei.
# Ein Eintrag, der nichts mehr ausnimmt, bricht den Test: nach einer Korrektur den Eintrag löschen.
differenzen:
  - gruppe: beispiele
    datei: muster-maschinenbau
    stelle: audits[0].umfang
    grund: "Zeitraum in DE als «18.01. bis 20.01.2027», in EN als «18 to 20/01/2027»; gleiches Datum, nur andere Kurzschreibung des Zeitraums."
  - gruppe: beispiele
    datei: muster-maschinenbau
    stelle: managementbewertungen[0].eingaben.messung
    grund: "DE «Mitte oder Ende 2027» nennt die Jahreszahl einmal, EN «mid-2027 or the end of 2027» zweimal; gleiche Aussage, andere Wortstellung."
  - gruppe: vorlagen
    datei: E-07.yaml
    stelle: checkliste[4][0]
    grund: "Fundstelle «Art. 50(4) UAbs. 2» steht in EN als «50(4), second subparagraph»; die Ziffer 2 wird ausgeschrieben."
  - gruppe: vorlagen
    datei: E-07.yaml
    stelle: bausteine.text.titel
    grund: "Wie bei checkliste[4][0]: «UAbs. 2» in DE gegen «second subparagraph» in EN."
  - gruppe: leitfaden
    datei: 04-zeitplaene.md
    stelle: '14'
    grund: "DE «alle 14 Tage», EN «every two weeks»; gleiche Aussage, Zahl in EN ausgeschrieben."
