  - id: T08
    titel: Dokument zuschneiden, KI-Leitlinie D-03 ohne Kit-Absender
    zuege:
      - "Wir sind die Beispiel Präzisionsteile GmbH mit 45 Mitarbeitenden, CNC-Fertigung für Medizintechnik in Biel. Wir haben kein ISMS und brauchen das EU-AI-Act-Modul nicht. Bitte erstellen Sie unsere KI-Leitlinie (D-03) als Markdown."
      - "Freigabe durch den Geschäftsführer Peter Muster, Eignerin und AIMS-Verantwortliche ist die IT-Leiterin Sandra Beispiel. Unsere Grundsätze: Der Mensch entscheidet, Kundenzeichnungen bleiben vertraulich, KI-Ergebnisse werden geprüft. Bitte jetzt das fertige Dokument und die Projektdatei."
    pruefungen:
      - { art: enthaelt, in: erste, muster: "kmu-cio\\.ch" }
      - { art: anzahl_max, in: alle, muster: "kmu-cio\\.ch", max: 1 }
      - { art: enthaelt, in: letzte, muster: "KI-Leitlinie" }
      - { art: enthaelt, in: letzte, muster: "Peter Muster" }
      - { art: enthaelt, in: letzte, muster: "Sandra Beispiel" }
      - { art: enthaelt, in: letzte, muster: "Freigabe" }
      - { art: enthaelt, in: letzte, muster: "Überprüfung" }
      - { art: enthaelt_nicht, in: letzte, muster: "kmu-cio|Andreas Gapsch|Starter-Kit|Diesen Block" }
      - { art: json_gueltig }
