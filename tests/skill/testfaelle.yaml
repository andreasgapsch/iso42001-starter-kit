      - { art: json_anzahl, pfad: "organisation.leitlinie.grundsaetze[*]", min: 3 }

  - id: T09
    titel: Modus 12 NIST AI RMF, US-Kunde mit Fragebogen, Chatbot und Copilot (mit ISMS, DE)
    zuege:
      - "Wir sind ein Hersteller von Messgeräten mit 140 Mitarbeitenden in Aarau, ISMS nach ISO 27001 ist zertifiziert. Ein grosser US-Kunde schickt uns einen Fragebogen, ob wir uns am NIST AI RMF ausrichten. Wir nutzen Microsoft 365 Copilot und einen Chatbot auf unserer Website, der Kundenfragen zu unseren Geräten beantwortet. Wie gehen wir vor?"
      - "Ja, schalten Sie das Modul NIST AI RMF ein, das Modul EU AI Act brauchen wir nicht. Der Kunde fragt vor allem nach Inventar, Tests vor dem Einsatz und Lieferanten. Copilot liest Mails und Dokumente, der Chatbot ist öffentlich und läuft auf einem Modell eines US-Anbieters, Version unbekannt. Getestet haben wir beide nie systematisch. Eigner beider Systeme ist der IT-Leiter Urs Beispiel. Bitte führen Sie Modus 12 durch: Ziel-Profil vorschlagen, Lücken, Zusatz-Controls und den GenAI-Check, und geben Sie die Projektdatei aus."
    pruefungen:
      - { art: enthaelt, in: erste, muster: "Andreas Gapsch, KMU-CIO, kmu-cio\\.ch" }
      - { art: fragen_max, in: erste, max: 3 }
      - { art: anzahl_max, in: alle, muster: "kmu-cio\\.ch", max: 1 }
      - { art: enthaelt, in: alle, muster: "freiwillig" }
      - { art: enthaelt, in: alle, muster: "(NIST|es) zertifiziert nicht|keine Zertifizierung durch NIST|kein (NIST-)?Zertifikat" }
      - { art: enthaelt_nicht, in: alle, muster: "\\b(Sie|wir|Ihr Unternehmen|Ihre Firma) (sind|ist|wären|werden) (damit |nun |jetzt |dann )?NIST-(zertifiziert|konform)" }
      - { art: enthaelt, in: letzte, muster: "Republished courtesy of the National Institute of Standards and Technology" }
      - { art: enthaelt, in: letzte, muster: "RMF-G0[1-7]" }
      - { art: enthaelt, in: letzte, muster: "Prompt-Injection|versteckte Anweisungen" }
      - { art: enthaelt, in: letzte, muster: "Konfabulation|erfundene" }
      - { art: enthaelt, in: letzte, muster: "Ziel" }
      - { art: enthaelt, in: letzte, muster: "\"nistProfil\"" }
      - { art: enthaelt_nicht, in: letzte, muster: "kmu-cio|Andreas Gapsch" }
      - { art: json_gueltig }
      - { art: json_gleich, pfad: "meta.modulNistRmf", wert: true }
      - { art: json_gleich, pfad: "meta.modulAiAct", wert: false }
      - { art: json_gleich, pfad: "meta.mitIsms", wert: true }
      - { art: json_enthaelt, pfad: "controls[*].rahmenwerk", muster: "^NISTRMF$" }
      - { art: json_enthaelt, pfad: "controls[*].vorschlag", muster: "^nistrmf$" }
      - { art: json_enthaelt, pfad: "kiSysteme[*].generativ", muster: "^true$" }
