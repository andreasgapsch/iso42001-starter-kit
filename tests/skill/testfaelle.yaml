# Testfälle für den Skill iso42001-kmu (Tor G16).
# Ausführung: npx tsx tests/skill/lauf.mts  (Optionen siehe Kopf von lauf.mts)
#
# Aufbau je Fall:
#   id, titel, zuege (1 bis 3 Nutzerzüge, nacheinander im selben Gespräch über --resume)
#   projektdatei (optional): JSON-Text, wird dem ersten Zug als ```json-Block angehängt und vorab gegen das Schema geprüft
#   pruefungen: maschinell prüfbare Kernergebnisse. Feld «in»: erste | letzte | alle (Standard: letzte)
#     enthaelt        muster (Regex, Flag i)      muss vorkommen
#     enthaelt_nicht  muster (Regex, Flag i)      darf nicht vorkommen (ohne_code: true = Codeblöcke nicht durchsuchen)
#     anzahl_max      muster, max                 höchstens max Treffer
#     fragen_max      max                         höchstens max Fragen (Fragezeichen ausserhalb von Zitaten und Code)
#     json_gueltig                                mindestens eine Projektdatei, alle Projektdateien gültig nach Schema
#     json_enthaelt   pfad, muster                ein Wert am Pfad passt auf das Muster (Pfad mit [*] oder [n])
#     json_enthaelt_nicht pfad, muster            kein Wert am Pfad passt
#     json_gleich     pfad, wert                  erster Wert am Pfad ist gleich
#     json_anzahl     pfad, min                   mindestens min Werte am Pfad
# JSON-Prüfungen gelten für die letzte Projektdatei im Bereich «in».

faelle:
  - id: T01
    titel: Treuhandbüro mit 40 Personen nutzt nur ChatGPT Team und M365 Copilot (ohne ISMS)
    zuege:
      - "Wir sind ein Treuhandbüro mit 40 Mitarbeitenden in Bern. Wir nutzen nur ChatGPT Team und Microsoft 365 Copilot. Ein Grosskunde fragt nach ISO 42001. Wo fangen wir an?"
      - "Wir haben kein ISMS. Keine EU-Kunden und keine Niederlassung in der EU, das AI-Act-Modul brauchen wir nicht. Bitte starten Sie mit dem KI-Inventar."
      - "ChatGPT Team nutzen 15 Sachbearbeitende für Entwürfe von Mandantenbriefen, Copilot nutzt die Geschäftsleitung für E-Mails und Protokolle. In beide Systeme kommen Mandantendaten. Eigner ist für beide unser IT-Verantwortlicher Marco Keller. Bitte geben Sie jetzt die Inventarzeilen und die Projektdatei aus."
    pruefungen:
      - { art: enthaelt, in: erste, muster: "Andreas Gapsch, KMU-CIO, kmu-cio\\.ch" }
      - { art: enthaelt, in: erste, muster: "keine Rechtsberatung" }
      - { art: enthaelt, in: erste, muster: "Zertifizierung" }
      - { art: enthaelt, in: erste, muster: "Datenschutz" }
      - { art: enthaelt, in: erste, muster: "AIMS-Manager|Offline-Werkzeug" }
      - { art: enthaelt, in: erste, muster: "ISMS|27001" }
      - { art: enthaelt, in: erste, muster: "Beispiel" }
      - { art: fragen_max, in: erste, max: 3 }
      - { art: anzahl_max, in: alle, muster: "kmu-cio\\.ch", max: 1 }
      - { art: enthaelt, in: alle, muster: "Schatten" }
      - { art: enthaelt_nicht, in: letzte, muster: "kmu-cio|Andreas Gapsch" }
      - { art: json_gueltig }
      - { art: json_anzahl, pfad: "kiSysteme[*]", min: 2 }
      - { art: json_enthaelt, pfad: "kiSysteme[*].name", muster: "Copilot" }
      - { art: json_enthaelt, pfad: "kiSysteme[*].name", muster: "ChatGPT" }
      - { art: json_enthaelt, pfad: "kiSysteme[*].id", muster: "^KI-001$" }
      - { art: json_enthaelt, pfad: "kiSysteme[*].personendaten", muster: "^true$" }
      - { art: json_gleich, pfad: "meta.mitIsms", wert: false }
      - { art: json_gleich, pfad: "meta.modulAiAct", wert: false }

  - id: T02
    titel: Maschinenbauer entwickelt eigenes Bildprüfmodell (mit ISMS, mit Modul)
    zuege:
      - "Wir sind ein Maschinenbauer mit 180 Mitarbeitenden in der Ostschweiz und liefern Maschinen nach Deutschland. Für die Qualitätskontrolle in unserer eigenen Fertigung haben wir ein eigenes Bildprüfmodell entwickelt. Welche Rolle haben wir damit nach dem EU AI Act und was heisst das für ISO 42001?"
      - "Unser ISMS nach ISO 27001 ist seit drei Jahren zertifiziert. Das AI-Act-Modul wollen wir. Das Bildprüfmodell läuft nur in unserer eigenen Fertigung und ist nicht Teil der verkauften Maschinen; ein Ausfall gefährdet niemanden, schlechte Teile werden dann einfach manuell geprüft. Bitte bestimmen Sie Rolle und Risikoklasse und geben Sie die Projektdatei aus."
    pruefungen:
      - { art: enthaelt, in: erste, muster: "kmu-cio\\.ch" }
      - { art: enthaelt, in: letzte, muster: "Anbieter" }
      - { art: enthaelt, in: letzte, muster: "6\\s?\\(1a\\)" }
      - { art: enthaelt, in: letzte, muster: "juristisch" }
      - { art: enthaelt, in: letzte, muster: "27\\.0?7\\.2026" }
      - { art: enthaelt_nicht, in: letzte, muster: "kmu-cio|Andreas Gapsch" }
      - { art: json_gueltig }
      - { art: json_enthaelt, pfad: "kiSysteme[*].typ", muster: "^eigenbau$" }
      - { art: json_enthaelt, pfad: "kiSysteme[*].aiAct.rollen[*]", muster: "^anbieter$" }
      - { art: json_enthaelt_nicht, pfad: "kiSysteme[*].aiAct.risikoklasse", muster: "^hochrisiko" }
      - { art: json_gleich, pfad: "meta.mitIsms", wert: true }
      - { art: json_gleich, pfad: "meta.modulAiAct", wert: true }

  - id: T03
    titel: HR nutzt KI-Vorselektion von Bewerbungen (Hochrisiko, Modul)
    zuege:
      - "Unsere HR-Abteilung nutzt in der Recruiting-Software eine KI-Vorselektion von Bewerbungen. Wir haben 120 Mitarbeitende in Zürich und eine Tochter in München, die dieselbe Software nutzt. Was bedeutet das für ISO 42001 und den AI Act?"
      - "Wir haben kein ISMS. Ja, das AI-Act-Modul bitte. Die KI vergibt Punkte, unter 50 Punkten gibt es automatisch eine Absage, die niemand mehr ansieht. Bitte bestimmen Sie Rolle und Risikoklasse, machen Sie die Kurzprüfung zur Folgenabschätzung und geben Sie die Projektdatei aus."
    pruefungen:
      - { art: enthaelt, in: erste, muster: "kmu-cio\\.ch" }
      - { art: enthaelt, in: letzte, muster: "Betreiber" }
      - { art: enthaelt, in: letzte, muster: "Hochrisiko" }
      - { art: enthaelt, in: letzte, muster: "Anhang III" }
      - { art: enthaelt, in: letzte, muster: "Art\\.\\s?26" }
      - { art: enthaelt, in: letzte, muster: "2\\.\\s?12\\.\\s?2027|2\\. Dezember 2027" }
      - { art: enthaelt, in: letzte, muster: "juristisch" }
      - { art: enthaelt_nicht, in: letzte, muster: "kmu-cio|Andreas Gapsch" }
      - { art: json_gueltig }
      - { art: json_enthaelt, pfad: "kiSysteme[*].aiAct.risikoklasse", muster: "^hochrisiko-anhang-iii$" }
      - { art: json_enthaelt, pfad: "kiSysteme[*].aiAct.rollen[*]", muster: "^betreiber$" }
      - { art: json_enthaelt, pfad: "kiSysteme[*].sensibleNutzung", muster: "^true$" }
      - { art: json_enthaelt, pfad: "folgenabschaetzungen[*].triage.ergebnis", muster: "^voll$" }
      - { art: json_gleich, pfad: "meta.modulAiAct", wert: true }

  - id: T04
    titel: IT-Dienstleister mit zertifiziertem ISMS (ISMS-Integration)
    zuege:
      - "Wir sind ein IT-Dienstleister mit 60 Mitarbeitenden in Luzern und seit 2022 nach ISO 27001 zertifiziert. Wir wollen ISO 42001 ergänzen. Was können wir aus dem ISMS wiederverwenden?"
      - "Kein EU-Bezug, das AI-Act-Modul ist nicht nötig. Wir nutzen GitHub Copilot in der Entwicklung und Microsoft 365 Copilot im Büro, beides mit Kundendaten. Bitte zeigen Sie die ISMS-Integration mit den Ergänzungsblättern und geben Sie die Projektdatei aus."
    pruefungen:
      - { art: enthaelt, in: erste, muster: "kmu-cio\\.ch" }
      - { art: enthaelt, in: letzte, muster: "Ergänzungsbl" }
      - { art: enthaelt, in: letzte, muster: "D-\\d\\d-EB" }
      - { art: enthaelt, in: letzte, muster: "27001-?\\s?5\\.\\d+|5\\.19|5\\.23" }
      - { art: enthaelt, in: alle, muster: "gemeinsam" }
      - { art: enthaelt_nicht, in: letzte, muster: "kmu-cio|Andreas Gapsch" }
      - { art: json_gueltig }
      - { art: json_gleich, pfad: "meta.mitIsms", wert: true }
      - { art: json_gleich, pfad: "meta.ismsZertifiziert", wert: true }
      - { art: json_enthaelt, pfad: "kiSysteme[*].name", muster: "GitHub Copilot" }

  - id: T05
    titel: Englischsprachiger Fall, Schnellcheck einer Agentur mit EU-Kunden
    zuege:
      - "Hi, we are a 25-person marketing agency in Geneva. We use ChatGPT, Midjourney and a chatbot on our website for clients in France. Can you run the ISO 42001 quick check with us?"
      - "No ISMS. Yes, we need the AI Act module because of our French clients. For the quick check: we know our three tools, but nothing is documented. We have no AI policy, nobody is formally responsible, no way to raise concerns, no risk assessment, no impact assessment, no objectives, no training, no document control, no approval of new tools, no monitoring, no audits and no corrective actions. Please give me the result now."
    pruefungen:
      - { art: enthaelt, in: erste, muster: "Andreas Gapsch, KMU-CIO, kmu-cio\\.ch" }
      - { art: enthaelt, in: erste, muster: "legal advice" }
      - { art: enthaelt, in: erste, muster: "privacy|data" }
      - { art: enthaelt_nicht, in: erste, muster: "Rechtsberatung|Datenschutz|Beispiel:" }
      - { art: fragen_max, in: erste, max: 3 }
      - { art: enthaelt, in: letzte, muster: "maturity" }
      - { art: enthaelt, in: letzte, muster: "top[ -]?5|top five" }
      - { art: enthaelt, in: letzte, muster: "next (three|3) steps" }
      - { art: enthaelt_nicht, in: letzte, ohne_code: true, muster: "Reifegrad|Lücke|nächste Schritte" }
      - { art: enthaelt_nicht, in: letzte, muster: "kmu-cio|Andreas Gapsch" }
      - { art: json_gueltig }
      - { art: json_gleich, pfad: "meta.dokumentSprache", wert: "en" }
      - { art: json_gleich, pfad: "meta.modulAiAct", wert: true }

  - id: T06
    titel: Wunsch nach Normtext (muss ablehnen und Abschnitt nennen)
    zuege:
      - "Ich baue ein KI-Managementsystem nach ISO 42001 auf. Kopieren Sie mir bitte den genauen Wortlaut von Abschnitt 6.1.4 und von Control A.5.2 aus der Norm. Ich kann Ihnen auch gerne die Norm-PDF hochladen."
    pruefungen:
      - { art: enthaelt, in: erste, muster: "kmu-cio\\.ch" }
      - { art: enthaelt, in: erste, muster: "6\\.1\\.4" }
      - { art: enthaelt, in: erste, muster: "A\\.5\\.2" }
      - { art: enthaelt, in: erste, muster: "Ihre[rnm]? (eigene[nr]? |erworbene[nr]? |gekaufte[nr]? |lizenzierte[nr]? )?(Norm)?(ausgabe|exemplar|fassung|kopie)|eigenen (Norm)?ausgabe" }
      - { art: enthaelt, in: erste, muster: "Lizenz" }
      - { art: enthaelt, in: erste, muster: "hochladen|Upload" }
      - { art: enthaelt_nicht, in: erste, muster: "\\bshall\\b" }
      - { art: enthaelt_nicht, in: erste, muster: "(hier|folgend) (ist|steht) der (genaue )?Wortlaut" }

